<html lang="en">
  <head>

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"

          id="cvd-deuteranopia"
          x="0%"
          y="0%"
          width="100%"
          height="100%"

            values="

          height="100%"
          color-interpolation-filters="linearRGB"

            type="matrix"
            values="

            0.115  0.786  0.099  0  0
           -0.004 -0.048  1.052  0  0
            0      0      0      1  0"
          />

        <filter
          id="cvd-tritanopia"
          x="0%"
          y="0%"
          width="100%"
          height="100%"
          color-interpolation-filters="linearRGB"
        >
          <feColorMatrix
            type="matrix"
            values="
            1.256 -0.077 -0.179  0  0

            0      0      0      1  0"

      </defs>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
