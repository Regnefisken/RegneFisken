  <body>
    <svg
      xmlns="http://www.w3.org/2000/svg"
      style="position: absolute; width: 0; height: 0; overflow: hidden"
      aria-hidden="true"
    >
      <defs>
        <filter
          id="cvd-deuteranopia"
          x="0%"
          y="0%"
          width="100%"
          height="100%"
          color-interpolation-filters="linearRGB"
        >
          <feColorMatrix
            type="matrix"
            values="
            0.367  0.861 -0.228  0  0
            0.280  0.673  0.047  0  0
           -0.012  0.043  0.969  0  0
            0      0      0      1  0"
          />
        </filter>
        <filter
          id="cvd-protanopia"
          x="0%"
          y="0%"
          width="100%"
          height="100%"
          color-interpolation-filters="linearRGB"
        >
          <feColorMatrix
            type="matrix"
            values="
            0.152  1.053 -0.205  0  0
            0.115  0.786  0.099  0  0
           -0.004 -0.048  1.052  0  0
            0      0      0      1  0"
          />
        </filter>
        <filter
          id="cvd-tritanopia"
          x="0%"
          y="0%"
          width="100%"
          height="100%"
          color-interpolation-filters="linearRGB"
        >
          <feColorMatrix
            type="matrix"
            values="
            1.256 -0.077 -0.179  0  0
           -0.078  0.931  0.148  0  0
            0.005  0.691  0.304  0  0
            0      0      0      1  0"
          />
        </filter>
      </defs>
    </svg>
