<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Regnefisken — Klædeskab & Spejl</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600&display=swap');
:root{--ocean-deep:#0b1628;--sand:#e8d5a3;--sand-light:#f5eedc;--foam:#d4eef7;--coral:#ff6b6b;--gold:#ffd700;--gold-soft:#ffe066;--seaweed:#2ecc71;--legendary-glow:#ffd700;--rare-glow:#a855f7;--common-glow:#94a3b8;--panel-bg:rgba(19,39,68,0.85);--panel-border:rgba(212,238,247,0.15)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Quicksand',sans-serif;background:var(--ocean-deep);color:var(--foam);min-height:100vh;overflow-x:hidden}
.ocean-bg{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at 30% 80%,rgba(46,204,113,.06) 0%,transparent 50%),radial-gradient(ellipse at 70% 20%,rgba(168,85,247,.05) 0%,transparent 50%),linear-gradient(180deg,#0b1628 0%,#132744 40%,#1a3a5c 100%)}
.ocean-bg::before{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 30 Q15 25 30 30 Q45 35 60 30' fill='none' stroke='rgba(212,238,247,0.03)' stroke-width='1'/%3E%3C/svg%3E");animation:drift 20s linear infinite}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-60px)}}
.bubbles{position:fixed;inset:0;z-index:0;pointer-events:none}
.bubble{position:absolute;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(212,238,247,.12),rgba(212,238,247,.03));border:1px solid rgba(212,238,247,.06);animation:rise linear infinite}
@keyframes rise{from{transform:translateY(100vh) scale(1);opacity:0}10%{opacity:1}90%{opacity:1}to{transform:translateY(-10vh) scale(.5);opacity:0}}
.app{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:24px 20px}
.header{text-align:center;margin-bottom:28px}
.header h1{font-family:'Fredoka',sans-serif;font-weight:700;font-size:2.2rem;color:var(--sand);text-shadow:0 2px 20px rgba(255,215,0,.15)}
.header p{font-size:.95rem;color:var(--foam);opacity:.6;margin-top:4px}
.main-layout{display:grid;grid-template-columns:1fr 340px;gap:24px;align-items:start}
@media(max-width:800px){.main-layout{grid-template-columns:1fr}}
.panel{background:var(--panel-bg);border:1px solid var(--panel-border);border-radius:16px;backdrop-filter:blur(12px);overflow:hidden}
.panel-header{padding:16px 20px 12px;border-bottom:1px solid var(--panel-border);display:flex;align-items:center;justify-content:space-between}
.panel-header h2{font-family:'Fredoka',sans-serif;font-weight:600;font-size:1.15rem;color:var(--sand-light)}
.panel-body{padding:16px 20px 20px}
.top-tabs{display:flex;border-bottom:1px solid var(--panel-border)}
.top-tab{flex:1;padding:12px 8px;font-family:'Fredoka',sans-serif;font-weight:600;font-size:.88rem;text-align:center;color:var(--foam);opacity:.5;cursor:pointer;border:none;background:none;border-bottom:3px solid transparent;transition:all .2s}
.top-tab:hover{opacity:.8;background:rgba(255,255,255,.03)}
.top-tab.active{opacity:1;color:var(--sand);border-bottom-color:var(--sand);background:rgba(232,213,163,.06)}
.tab-content{display:none}.tab-content.active{display:block}
.creator-section{margin-bottom:20px}
.creator-label{font-family:'Fredoka',sans-serif;font-weight:500;font-size:.85rem;color:var(--sand);opacity:.8;margin-bottom:8px}
.swatch-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.swatch{width:32px;height:32px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:all .2s;position:relative}
.swatch:hover{transform:scale(1.15);border-color:rgba(255,255,255,.3)}
.swatch.active{border-color:var(--gold);box-shadow:0 0 10px rgba(255,215,0,.3);transform:scale(1.1)}
.swatch.active::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.7rem;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.hair-options{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.hair-option{padding:8px 4px;border-radius:10px;border:2px solid transparent;background:rgba(255,255,255,.04);cursor:pointer;transition:all .2s;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.hair-option:hover{background:rgba(255,255,255,.1);transform:translateY(-1px)}
.hair-option.active{border-color:var(--gold);background:rgba(255,215,0,.08)}
.hair-option svg{width:40px;height:40px}
.hair-option span{font-size:.6rem;font-weight:600;opacity:.7}
.category-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.cat-tab{font-family:'Quicksand',sans-serif;font-weight:600;font-size:.75rem;padding:6px 12px;border-radius:20px;border:1px solid var(--panel-border);background:rgba(255,255,255,.04);color:var(--foam);cursor:pointer;transition:all .2s;white-space:nowrap}
.cat-tab:hover{background:rgba(255,255,255,.1);border-color:rgba(212,238,247,.3)}
.cat-tab.active{background:rgba(232,213,163,.15);border-color:var(--sand);color:var(--sand)}
.item-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.item-card{border-radius:12px;border:2px solid transparent;background:rgba(255,255,255,.04);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .25s;position:relative;padding:8px 6px 6px}
.item-card:hover{background:rgba(255,255,255,.1);transform:translateY(-2px)}
.item-card.selected{border-color:var(--gold);background:rgba(255,215,0,.08);box-shadow:0 0 16px rgba(255,215,0,.15)}
.item-card.equipped{border-color:var(--seaweed);background:rgba(46,204,113,.08)}
.item-card .rarity-dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%}

.rarity-common .rarity-dot{background:var(--common-glow)}.rarity-rare .rarity-dot{background:var(--rare-glow);box-shadow:0 0 6px var(--rare-glow)}.rarity-legendary .rarity-dot{background:var(--legendary-glow);box-shadow:0 0 8px var(--legendary-glow);animation:pg 2s ease-in-out infinite}
@keyframes pg{0%,100%{box-shadow:0 0 6px var(--legendary-glow)}50%{box-shadow:0 0 14px var(--legendary-glow)}}
.item-card svg{width:44px;height:44px}
.item-card .item-name{font-size:.6rem;font-weight:600;text-align:center;margin-top:3px;line-height:1.2;color:var(--foam);opacity:.9}

.item-detail{margin-top:16px;padding:14px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--panel-border);min-height:90px}
.item-detail .detail-header{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.item-detail .detail-header svg{width:36px;height:36px}
.item-detail .detail-name{font-family:'Fredoka',sans-serif;font-weight:600;font-size:1rem;color:var(--sand-light)}
.item-detail .detail-rarity{font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:1px;margin-top:2px}
.item-detail .detail-desc{font-size:.82rem;line-height:1.5;opacity:.7}
.item-detail .detail-meta{font-size:.72rem;opacity:.5;margin-top:6px;font-style:italic}
.equip-btn{font-family:'Fredoka',sans-serif;font-weight:600;font-size:.82rem;margin-top:10px;padding:8px 20px;border-radius:20px;border:none;cursor:pointer;transition:all .2s}
.equip-btn.equip{background:linear-gradient(135deg,var(--gold),var(--gold-soft));color:var(--ocean-deep)}
.equip-btn.equip:hover{transform:scale(1.03);box-shadow:0 4px 16px rgba(255,215,0,.3)}
.equip-btn.unequip{background:rgba(255,255,255,.15);color:var(--foam)}
.equip-btn.unequip:hover{background:rgba(255,107,107,.3);color:var(--coral)}
.mirror-frame{background:linear-gradient(135deg,rgba(232,213,163,.12),rgba(255,215,0,.05));border:2px solid rgba(232,213,163,.2);border-radius:50% 50% 0 0 / 40% 40% 0 0;padding:14px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;max-width:240px;max-height:320px;aspect-ratio:3/4;margin:0 auto}
.mirror-frame::before{content:'';position:absolute;inset:3px;border-radius:50% 50% 0 0 / 40% 40% 0 0;background:linear-gradient(180deg,rgba(212,238,247,.06) 0%,rgba(11,22,40,.4) 100%);pointer-events:none}
.mirror-frame::after{content:'';position:absolute;top:8%;left:15%;width:25%;height:8%;background:rgba(255,255,255,.06);border-radius:50%;transform:rotate(-20deg);pointer-events:none}
.avatar-container{position:relative;width:208px;height:321px;z-index:1}
.avatar-container svg{position:absolute;top:0;left:0;width:100%;height:100%}
.equipped-list{margin-top:14px}
.equipped-list h3{font-family:'Fredoka',sans-serif;font-size:.85rem;font-weight:500;color:var(--sand);opacity:.7;margin-bottom:8px}
.equipped-tags{display:flex;flex-wrap:wrap;gap:6px}
.equipped-tag{font-size:.7rem;font-weight:600;padding:4px 10px;border-radius:12px;background:rgba(46,204,113,.12);border:1px solid rgba(46,204,113,.25);color:var(--seaweed);cursor:pointer;transition:all .2s}
.equipped-tag:hover{background:rgba(255,107,107,.15);border-color:rgba(255,107,107,.3);color:var(--coral)}
.empty-state{text-align:center;padding:20px;opacity:.4;font-size:.85rem}
.slot-label{font-size:.65rem;text-transform:uppercase;letter-spacing:.8px;opacity:.4;font-weight:600}
/* === DEV TOOL CSS START === */
.dev-btn{font-family:'Fredoka',sans-serif;font-size:.7rem;font-weight:600;padding:3px 8px;border-radius:6px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);color:var(--foam);cursor:pointer;transition:all .15s}
.dev-btn:hover{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.3)}
.dev-btn:active{background:rgba(255,215,0,.2);color:var(--gold)}
/* === DEV TOOL CSS END === */
.set-info{color:#60c8a0!important;border-left:2px solid rgba(46,204,113,.4);padding-left:6px;margin-top:4px}
.stats-box{margin-top:16px;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--panel-border)}
.stat-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid rgba(212,238,247,.06)}
.stat-row:last-child{border-bottom:none}
.stat-icon{font-size:.9rem;width:20px;text-align:center}
.stat-label{font-family:'Fredoka',sans-serif;font-weight:500;font-size:.8rem;color:var(--foam);opacity:.6;flex:1}
.stat-value{font-family:'Fredoka',sans-serif;font-weight:600;font-size:.9rem;color:var(--sand)}
</style>
</head>
<body>
<div class="ocean-bg"></div>
<div class="bubbles" id="bubbles"></div>
<div class="app">
  <header class="header"><h1>🐟 Klædeskabet</h1></header>
  <div class="main-layout">
    <div class="panel">
      <div class="top-tabs"><button class="top-tab active" data-tab="creator">🧍 Grundlæggende</button><button class="top-tab" data-tab="wardrobe">👕 Klædeskab</button></div>
      <div class="tab-content active" id="tab-creator"><div class="panel-body">
        <div class="creator-section"><div class="creator-label">Hudtone</div><div class="swatch-row" id="skinSwatches"></div></div>
        <div class="creator-section"><div class="creator-label">Hårfarve</div><div class="swatch-row" id="hairColorSwatches"></div></div>
        <div class="creator-section"><div class="creator-label">Hårstil</div><div class="hair-options" id="hairStyleOptions"></div></div>
        <div class="creator-section"><div class="creator-label">Øjne</div><div class="hair-options" id="eyeStyleOptions"></div></div>
      </div></div>
      <div class="tab-content" id="tab-wardrobe">
        <div class="panel-header" style="border:none;padding-top:12px"><h2>👕 Klædeskab</h2><span class="slot-label" id="countLabel">0</span></div>
        <div class="panel-body" style="padding-top:0"><div class="category-tabs" id="categoryTabs"></div><div class="item-grid" id="itemGrid"></div><div class="item-detail" id="itemDetail"><div class="empty-state">Vælg en genstand</div></div></div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-header"><h2>🪞 Spejl</h2><button id="devToggleBtn" onclick="toggleDevTool()" title="Dev tools" style="margin-left:auto;display:flex;align-items:center;justify-content:center;width:26px;height:26px;background:rgba(255,60,60,.0);border:1px solid rgba(255,60,60,.0);border-radius:8px;cursor:pointer;font-size:.75rem;color:rgba(255,107,107,.3);transition:all .2s;flex-shrink:0" onmouseover="this.style.background='rgba(255,60,60,.12)';this.style.borderColor='rgba(255,107,107,.35)';this.style.color='rgba(255,107,107,.8)'" onmouseout="if(!devOpen){this.style.background='rgba(255,60,60,.0)';this.style.borderColor='rgba(255,60,60,.0)';this.style.color='rgba(255,107,107,.3)'}">🔧</button><button onclick="randomiseAll()" style="margin-left:6px;display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:20px;cursor:pointer;font-family:'Fredoka',sans-serif;font-weight:600;font-size:.8rem;color:var(--foam);padding:5px 13px;transition:background .12s,border-color .12s,transform .1s;white-space:nowrap" onmouseover="this.style.background='rgba(255,255,255,.22)';this.style.borderColor='rgba(255,255,255,.45)'" onmouseout="this.style.background='rgba(255,255,255,.12)';this.style.borderColor='rgba(255,255,255,.25)';this.style.transform=''" onmousedown="this.style.transform='scale(.92)'" onmouseup="this.style.transform='scale(1.06)';setTimeout(()=>{this.style.transform=''},120)">⚄ Tilfældig</button></div>
      <div class="panel-body">
        <!-- === DEV TOOL START === -->
        <div id="devToolWrap" style="overflow:hidden;max-height:0;transition:max-height .3s ease,margin-bottom .3s ease;margin-bottom:0">
        <div id="devTool" style="margin-bottom:12px;padding:10px 12px;border-radius:10px;background:rgba(255,60,60,.08);border:1px solid rgba(255,60,60,.25);font-family:'Fredoka',sans-serif;font-size:.75rem">
          <div style="color:#ff6b6b;font-weight:600;margin-bottom:6px">🔧 DEV: Juster seneste udstyr</div>
          <div id="devTarget" style="color:var(--foam);opacity:.5;margin-bottom:8px;font-size:.7rem">Intet udstyr valgt</div>
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px">
            <span style="width:20px;color:var(--sand)">X:</span>
            <button class="dev-btn" onclick="devNudge('x',-5)">◀◀</button>
            <button class="dev-btn" onclick="devNudge('x',-1)">◀</button>
            <span id="devX" style="min-width:36px;text-align:center;color:var(--gold);font-weight:600">0</span>
            <button class="dev-btn" onclick="devNudge('x',1)">▶</button>
            <button class="dev-btn" onclick="devNudge('x',5)">▶▶</button>
            <span style="opacity:.3;font-size:.6rem">px</span>
          </div>
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px">
            <span style="width:20px;color:var(--sand)">Y:</span>
            <button class="dev-btn" onclick="devNudge('y',-5)">▲▲</button>
            <button class="dev-btn" onclick="devNudge('y',-1)">▲</button>
            <span id="devY" style="min-width:36px;text-align:center;color:var(--gold);font-weight:600">0</span>
            <button class="dev-btn" onclick="devNudge('y',1)">▼</button>
            <button class="dev-btn" onclick="devNudge('y',5)">▼▼</button>
            <span style="opacity:.3;font-size:.6rem">px</span>
          </div>
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px">
            <span style="width:20px;color:var(--sand)">S:</span>
            <button class="dev-btn" onclick="devScaleStep(-0.1)">−−</button>
            <button class="dev-btn" onclick="devScaleStep(-0.05)">−</button>
            <span id="devScale" style="min-width:36px;text-align:center;color:var(--gold);font-weight:600">1.00</span>
            <button class="dev-btn" onclick="devScaleStep(0.05)">+</button>
            <button class="dev-btn" onclick="devScaleStep(0.1)">++</button>
            <span style="opacity:.3;font-size:.6rem">×</span>
          </div>
          <div id="devFootGapRow" style="display:none;align-items:center;gap:6px;margin-bottom:8px;padding-top:6px;border-top:1px dashed rgba(255,107,107,.2)">
            <span style="width:20px;color:var(--sand);font-size:.65rem" title="Sko-afstand">👟</span>
            <button class="dev-btn" onclick="devGapStep(-5)">◁◁</button>
            <button class="dev-btn" onclick="devGapStep(-1)">◁</button>
            <span id="devGap" style="min-width:36px;text-align:center;color:var(--gold);font-weight:600">0</span>
            <button class="dev-btn" onclick="devGapStep(1)">▷</button>
            <button class="dev-btn" onclick="devGapStep(5)">▷▷</button>
            <span style="opacity:.3;font-size:.6rem">gap</span>
          </div>
          <div id="devOutput" style="padding:6px 8px;border-radius:6px;background:rgba(0,0,0,.3);color:#00e5ff;font-family:monospace;font-size:.65rem;word-break:break-all;cursor:pointer" title="Klik for at kopiere" onclick="navigator.clipboard.writeText(this.textContent)">—</div>
          <button class="dev-btn" style="margin-top:6px;width:100%" onclick="devReset()">↺ Nulstil</button>
        </div>
        </div><!-- === DEV TOOL END === -->
        </div><!-- devToolWrap -->
        <div class="mirror-frame"><div class="avatar-container" id="avatarContainer"></div></div>
        <div class="equipped-list">
          <div onclick="toggleEquippedList()" style="display:flex;align-items:center;gap:6px;cursor:pointer;padding:4px 0;user-select:none" id="equippedToggle">
            <span id="equippedToggleIcon" style="font-size:.9rem">🙈</span>
            <h3 style="margin:0;font-family:'Fredoka',sans-serif;font-size:.85rem;font-weight:500;color:var(--sand);opacity:.7" id="equippedToggleLabel">Vis dine valg</h3>
          </div>
          <div id="equippedContent" style="display:none">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;margin-top:6px"><button onclick="removeAll()" style="background:none;border:none;cursor:pointer;font-family:'Quicksand',sans-serif;font-size:.65rem;font-weight:600;color:var(--foam);opacity:.35;padding:2px 6px;border-radius:6px;transition:all .15s;margin-left:auto" onmouseover="this.style.opacity='1';this.style.color='var(--coral)'" onmouseout="this.style.opacity='.35';this.style.color='var(--foam)'">✕ Fjern alt</button></div>
            <div class="equipped-tags" id="equippedTags"><div class="empty-state" style="width:100%">Intet udstyr endnu</div></div>
          </div>
        </div>
        <div class="stats-box">
          <div class="stat-row"><span class="stat-icon">⭐</span><span class="stat-label">Level</span><span class="stat-value" id="statLevel">12</span></div>
          <div class="stat-row"><span class="stat-icon">✨</span><span class="stat-label">XP</span><span class="stat-value" id="statXP">4.280</span></div>
          <div class="stat-row"><span class="stat-icon">🐟</span><span class="stat-label">Fangster</span><span class="stat-value" id="statCatches">347</span></div>
          <div class="stat-row"><span class="stat-icon">💰</span><span class="stat-label">Penge</span><span class="stat-value" id="statMoney">8.650 kr</span></div>
        </div>
        <button id="saveBtn" onclick="handleSave()" style="width:100%;margin-top:12px;padding:12px;border-radius:14px;border:none;cursor:pointer;font-family:'Fredoka',sans-serif;font-weight:700;font-size:1rem;background:linear-gradient(135deg,#2ecc71,#27ae60);color:#fff;letter-spacing:.5px;box-shadow:0 4px 16px rgba(46,204,113,.25);transition:all .2s" onmouseover="this.style.transform='scale(1.02)';this.style.boxShadow='0 6px 20px rgba(46,204,113,.4)'" onmouseout="this.style.transform='';this.style.boxShadow='0 4px 16px rgba(46,204,113,.25)'">💾 Gem</button>
      </div>
    </div>
  </div>
</div>
<script>
/* ===== Avatar geometry constants ===== */
const AX=100;                           // center X
const HEAD_Y=52;                        // head center Y
const NECK_Y=80, NECK_H=18, NECK_W=14; // neck
const BODY_Y=94, BODY_H=72, BODY_W=48; // torso top, height, width
const BODY_BOTTOM=BODY_Y+BODY_H;       // 166
const SHORTS_Y=BODY_BOTTOM-4;          // 162 — standard nøgne boksershorts
const WAIST_Y=BODY_BOTTOM-14;          // 152 — bæltelinje til beklædning
const SHORTS_H=26;
const LEG_Y=SHORTS_Y+SHORTS_H-4;       // 184
const LEG_H=68;                         // ~same as torso = proportional
const LEG_BOTTOM=LEG_Y+LEG_H;          // 252
const FOOT_Y=LEG_BOTTOM;               // 252
const FOOT_RX=12, FOOT_RY=6;           // foot ellipse: wide, short
const SHOULDER_Y=BODY_Y+8;             // 102
const HAND_L_X=52, HAND_L_Y=172, HAND_R_X=148, HAND_R_Y=172;
const SHADOW_Y=FOOT_Y+FOOT_RY+22;      // skygge rykket ned under sko

const SK='regnefisken_wardrobe';
let state={skinTone:'light',hairColor:'brown',hairStyle:'short',eyeStyle:'round',equipped:{},heldItems:[],pet:null,selectedCategory:'Alle',selectedItemId:null,activeTab:'creator'};
function save(){try{localStorage.setItem(SK,JSON.stringify({skinTone:state.skinTone,hairColor:state.hairColor,hairStyle:state.hairStyle,eyeStyle:state.eyeStyle,equipped:state.equipped,heldItems:state.heldItems,pet:state.pet}))}catch(e){}}
function load(){try{const r=localStorage.getItem(SK);if(r){const s=JSON.parse(r);Object.assign(state,s)}}catch(e){}}
function getSkin(){return SKIN_TONES.find(s=>s.id===state.skinTone)||SKIN_TONES[1]}
function getHC(){return(HAIR_COLORS.find(h=>h.id===state.hairColor)||HAIR_COLORS[0]).color}
function getHS(){return HAIR_STYLES.find(h=>h.id===state.hairStyle)||HAIR_STYLES[0]}
function getEyes(){return EYE_STYLES.find(e=>e.id===state.eyeStyle)||EYE_STYLES[0]}
function equipHeld(id){state.heldItems=state.heldItems.filter(i=>i!==id);state.heldItems.push(id);if(state.heldItems.length>2)state.heldItems.shift()}
function unequipHeld(id){state.heldItems=state.heldItems.filter(i=>i!==id)}
function isHeld(id){return state.heldItems.includes(id)}
function isEquipped(item){if(item.slot==='held')return isHeld(item.id);if(item.slot==='pet')return state.pet===item.id;return state.equipped[item.slot]===item.id}
function toggleEquip(item){
  const wasEquipped=isEquipped(item);
  if(item.slot==='held'){isHeld(item.id)?unequipHeld(item.id):equipHeld(item.id)}
  else if(item.slot==='pet'){state.pet=state.pet===item.id?null:item.id}
  else{state.equipped[item.slot]===item.id?delete state.equipped[item.slot]:state.equipped[item.slot]=item.id}
  /* DEV */ if(!wasEquipped){devTargetId=item.id;devOffset={x:0,y:0};devScale=1.0;devUpdateOutput()}
  save();render();
}

/* ===== AVATAR ===== */
function renderAvatar(){
  const skin=getSkin(),sc=skin.color,hc=getHC(),hs=getHS(),eyes=getEyes();
  const mc=skin.shadow;

  // Equipment positions: [cx, cy, defaultScale]
  const positions={head:[AX,HEAD_Y-14-15,1.10],face:[AX,HEAD_Y+8,1],neck:[AX,NECK_Y+4,1],body:[AX,BODY_Y+10,1.25],belt:[AX,BODY_BOTTOM+2,1],legs:[AX,BODY_BOTTOM+10,1.10],back:[AX,BODY_Y,1],hands:[AX,HAND_L_Y,1],feet:[AX,FOOT_Y,1]};
  function drawSlot(slot){const it=state.equipped[slot]&&ITEMS.find(i=>i.id===state.equipped[slot]);if(!it?.svgAvatar)return'';let[cx,cy,ds]=positions[slot];const isTarget=it.id===devTargetId;const adj=itemAdj[it.id];if(isTarget){cx+=devOffset.x;cy+=devOffset.y;}else if(adj){cx+=adj.offset.x;cy+=adj.offset.y;}const sc=isTarget?devScale:(adj?adj.scale:ds);const isFeet=slot==='feet';const gap=isFeet?(isTarget?devFootGap:(adj?adj.gap:0)):0;if(sc!==1&&isFeet){const lx=cx-18,rx=cx+18;const raw=it.svgAvatar(cx,cy);const clipId='fc_'+it.id;return`<defs><clipPath id="${clipId}L"><rect x="-200" y="-200" width="${cx+200}" height="800"/></clipPath><clipPath id="${clipId}R"><rect x="${cx}" y="-200" width="400" height="800"/></clipPath></defs><g transform="translate(${-gap},0)"><g transform="translate(${lx},${cy}) scale(${sc}) translate(${-lx},${-cy})" clip-path="url(#${clipId}L)">${raw}</g></g><g transform="translate(${gap},0)"><g transform="translate(${rx},${cy}) scale(${sc}) translate(${-rx},${-cy})" clip-path="url(#${clipId}R)">${raw}</g></g>`;}if(isFeet&&gap!==0){const raw=it.svgAvatar(cx,cy);const clipId='fc_'+it.id;return`<defs><clipPath id="${clipId}L"><rect x="-200" y="-200" width="${cx+200}" height="800"/></clipPath><clipPath id="${clipId}R"><rect x="${cx}" y="-200" width="400" height="800"/></clipPath></defs><g transform="translate(${-gap},0)" clip-path="url(#${clipId}L)">${raw}</g><g transform="translate(${gap},0)" clip-path="url(#${clipId}R)">${raw}</g>`;}if(sc!==1)return`<g transform="translate(${cx},${cy}) scale(${sc}) translate(${-cx},${-cy})">${it.svgAvatar(cx,cy)}</g>`;return it.svgAvatar(cx,cy);}

  // Back drawn FIRST — behind everything
  const backSvg=drawSlot('back');

  let svg=`<svg viewBox="0 -40 200 360" xmlns="http://www.w3.org/2000/svg">
  <defs><filter id="glowA"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>

  <!-- Ground (no shadow) -->

  <!-- BACK EQUIPMENT (behind everything) -->
  ${backSvg}

  <!-- LEGS (same skin color, behind shorts) -->
  <rect x="${AX-20}" y="${LEG_Y}" width="12" height="${LEG_H}" rx="6" fill="${sc}"/>
  <rect x="${AX+8}" y="${LEG_Y}" width="12" height="${LEG_H}" rx="6" fill="${sc}"/>

  <!-- FEET — flat white socks, easily covered by footwear -->
  <ellipse cx="${AX-18}" cy="${FOOT_Y}" rx="9" ry="5" fill="#e8e4e0"/>
  <ellipse cx="${AX+18}" cy="${FOOT_Y}" rx="9" ry="5" fill="#e8e4e0"/>

  <!-- SHORTS -->
  <path d="M${AX-BODY_W/2} ${SHORTS_Y} Q${AX-BODY_W/2} ${SHORTS_Y-3} ${AX} ${SHORTS_Y-5} Q${AX+BODY_W/2} ${SHORTS_Y-3} ${AX+BODY_W/2} ${SHORTS_Y}
    L${AX+BODY_W/2} ${SHORTS_Y+SHORTS_H-4} Q${AX+BODY_W/2} ${SHORTS_Y+SHORTS_H} ${AX+16} ${SHORTS_Y+SHORTS_H}
    L${AX+2} ${SHORTS_Y+SHORTS_H} L${AX} ${SHORTS_Y+SHORTS_H-4} L${AX-2} ${SHORTS_Y+SHORTS_H}
    L${AX-16} ${SHORTS_Y+SHORTS_H} Q${AX-BODY_W/2} ${SHORTS_Y+SHORTS_H} ${AX-BODY_W/2} ${SHORTS_Y+SHORTS_H-4} Z" fill="#5a6a7a"/>

  <!-- TORSO (skin behind tank top) -->
  <rect x="${AX-BODY_W/2}" y="${BODY_Y}" width="${BODY_W}" height="${BODY_H}" rx="8" fill="${sc}"/>

  <!-- TANK TOP -->
  <path d="M${AX-BODY_W/2} ${BODY_Y+6} Q${AX-BODY_W/2} ${BODY_Y-6} ${AX} ${BODY_Y-10} Q${AX+BODY_W/2} ${BODY_Y-6} ${AX+BODY_W/2} ${BODY_Y+6}
    L${AX+BODY_W/2} ${BODY_BOTTOM-4} Q${AX+BODY_W/2} ${BODY_BOTTOM} ${AX} ${BODY_BOTTOM+2} Q${AX-BODY_W/2} ${BODY_BOTTOM} ${AX-BODY_W/2} ${BODY_BOTTOM-4} Z" fill="#e8e4dc"/>
  <path d="M${AX-BODY_W/2} ${BODY_Y+6} Q${AX-BODY_W/2} ${BODY_Y-6} ${AX} ${BODY_Y-10} Q${AX+BODY_W/2} ${BODY_Y-6} ${AX+BODY_W/2} ${BODY_Y+6}" fill="#d8d4cc"/>

  <!-- NECK (behind head, overlaps body top) -->
  <rect x="${AX-NECK_W/2}" y="${NECK_Y}" width="${NECK_W}" height="${NECK_H}" rx="5" fill="${sc}"/>

  <!-- HEAD -->
  <ellipse cx="${AX}" cy="${HEAD_Y}" rx="28" ry="30" fill="${sc}"/>

  <!-- CHEEKS (before hair so hair renders on top) -->
  <ellipse cx="${AX-18}" cy="${HEAD_Y+13}" rx="5" ry="3" fill="#e8a090" opacity=".2"/>

  // ARMS — extended toward shoulder so joints hide under body clothing
  svg+=`<line x1="${AX-BODY_W/2+8}" y1="${SHOULDER_Y-6}" x2="${HAND_L_X}" y2="${HAND_L_Y}" stroke="${sc}" stroke-width="12" stroke-linecap="round"/>`;

  svg+=`<circle cx="${HAND_R_X}" cy="${HAND_R_Y}" r="9" fill="${sc}"/>`;

  // All equipment slots (except back which is already drawn)

  const slotOrderRest=['legs','body','belt','feet','neck','hands','head','face'];
  for(const slot of slotOrderRest){svg+=drawSlot(slot);}


  state.heldItems.forEach((id,idx)=>{

    if(id===devTargetId&&heldSvg){svg+=`<g transform="translate(${hx},${hy}) scale(${devScale}) translate(${-hx},${-hy})">${heldSvg}</g>`;}else{svg+=heldSvg;}
  });

  if(state.pet){const pet=ITEMS.find(i=>i.id===state.pet);if(pet?.petSvg){let px=PET_X+PET_OX,py=PET_Y+PET_OY;const s=pet.id===devTargetId?devScale:PET_S;if(pet.id===devTargetId){px+=devOffset.x;py+=devOffset.y;}svg+=`<g transform="translate(${px},${py}) scale(${s})">${pet.petSvg}</g>`;}}

  svg+='</svg>';

}

function renderTags(){

  state.heldItems.forEach((id,idx)=>{const it=ITEMS.find(i=>i.id===id);if(it)tags.push({slot:`held_${idx}`,id,label:it.name})});
  if(state.pet){const it=ITEMS.find(i=>i.id===state.pet);if(it)tags.push({slot:'pet',id:state.pet,label:it.name})}
  if(!tags.length){el.innerHTML='<div class="empty-state" style="width:100%">Intet udstyr endnu</div>';return}
  el.innerHTML=tags.map(t=>`<span class="equipped-tag" data-slot="${t.slot}" data-id="${t.id}">${t.label}</span>`).join('');
  el.querySelectorAll('.equipped-tag').forEach(t=>t.addEventListener('click',()=>{const s=t.dataset.slot,id=t.dataset.id;if(s.startsWith('held_'))unequipHeld(id);else if(s==='pet')state.pet=null;else delete state.equipped[s];save();render()}));
}

function randomiseAll(){
  const pick=arr=>arr[Math.floor(Math.random()*arr.length)];
  // Creator
  state.skinTone=pick(SKIN_TONES).id;
  state.hairColor=pick(HAIR_COLORS).id;
  const hairChoices=HAIR_STYLES.filter(h=>h.id!=='bald');
  state.hairStyle=pick(hairChoices.length?hairChoices:HAIR_STYLES).id;
  state.eyeStyle=pick(EYE_STYLES).id;
  // Clear all equipped
  state.equipped={};
  state.heldItems=[];
  state.pet=null;
  // Group items by type, pick one per type
  const byType={};
  ITEMS.forEach(it=>{if(!byType[it.type])byType[it.type]=[];byType[it.type].push(it);});
  Object.values(byType).forEach(group=>{
    const it=pick(group);
    if(it.slot==='pet'){state.pet=it.id;}
    else if(it.slot==='held'){equipHeld(it.id);}
    else if(it.slot&&it.slot!=='pet'&&it.slot!=='held'){state.equipped[it.slot]=it.id;}
  });
  // No animation needed — button has its own press feedback
  save();render();
}

let devOffset={x:0,y:0};
let devScale=1.0;
let devFootGap=0;
let devTargetId=null;

function devNudge(axis,amount){
  devOffset[axis]+=amount;
  document.getElementById('devX').textContent=devOffset.x;
  document.getElementById('devY').textContent=devOffset.y;
  devUpdateOutput();
  render();
}
function devScaleStep(amount){
  devScale=Math.round((devScale+amount)*100)/100;
  if(devScale<0.1) devScale=0.1;
  document.getElementById('devScale').textContent=devScale.toFixed(2);
  devUpdateOutput();
  render();
}
function devGapStep(amount){
  devFootGap+=amount;
  document.getElementById('devGap').textContent=devFootGap;
  devUpdateOutput();
  render();
}
function devReset(){
  devOffset={x:0,y:0};
  devScale=1.0;
  devFootGap=0;
  document.getElementById('devX').textContent=0;
  document.getElementById('devY').textContent=0;
  document.getElementById('devScale').textContent='1.00';
  document.getElementById('devGap').textContent=0;
  devUpdateOutput();
  render();
}
function devUpdateOutput(){
  const el=document.getElementById('devOutput');
  const tgt=document.getElementById('devTarget');
  const gapRow=document.getElementById('devFootGapRow');
  if(!devTargetId){el.textContent='—';tgt.textContent='Intet udstyr valgt';gapRow.style.display='none';return}
  const item=ITEMS.find(i=>i.id===devTargetId);
  const name=item?item.name:devTargetId;
  const slot=item?item.slot:'?';
  tgt.textContent=`→ ${name} (${slot})`;
  const isFeet=slot==='feet';
  gapRow.style.display=isFeet?'flex':'none';
  let out=`"${devTargetId}" [${slot}]: offset(${devOffset.x}, ${devOffset.y}), scale(${devScale.toFixed(2)})`;
  if(isFeet) out+=`, gap(${devFootGap})`;
  el.textContent=out;
}
