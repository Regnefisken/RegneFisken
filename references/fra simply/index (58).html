<!-- ===== REGNEFISKEN UNDERVANDS-LOADER v5 (Freestyle Pro Edition) ===== -->
<canvas id="loaderCanvas" style="position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:99999;"></canvas>
<script>
(function(){
'use strict';
var cv=document.getElementById('loaderCanvas'),ctx=cv.getContext('2d'),W,H,dpr;
function resize(){dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);}
resize(); addEventListener('resize',resize);

// --- Tekst-rotation ---
var msgs=[
  "Kaptajnen gør båden klar ⛵",
  "Vi regner stærkt med dig! 🧮",
  "Første gang tager det lidt længere tid ⏳",
  "Skildpadden holder udkig 🐢",
  "Havets dybder venter på dig 🌊",
  "Ankeret er lettet – vi sejler! 🛥️",
  "Blæksprutten tæller sine arme... 1, 2, 3, 4, 5, 6, 7, 8! 🐙",
  "En stime af tal svømmer forbi 🐟",
  "Dykker ned i matematikken 🤿",
  "Den kloge klovnefisk regner den ud 🐠"
];
var msgIdx=0,msgAlpha=1,msgTimer=0;

// --- Partikler (Plankton) ---
var planktons = [];
for(var i=0;i<60;i++){
  planktons.push({x:Math.random()*W, y:Math.random()*H, s:Math.random()*1.5, p:Math.random()*6.28});
}

// --- Bobler ---
var bubbles=[];
for(var i=0;i<22;i++){
  var isBig = Math.random() < 0.1;
  var baseR = 2 + Math.random() * 6;
  var r = isBig ? baseR * 2.5 : baseR;
  bubbles.push({x:Math.random()*W, y:H+Math.random()*H, r:r, sp:.3+Math.random()*.7, w:Math.random()*6.28});
}

// --- Fisk ---
var fc=['#38bdf8','#f472b6','#facc15','#4ade80','#fb923c', '#a855f7'];
var fish=fc.map(function(c,i){return{x:Math.random()*W,y:100+Math.random()*(H-260),sp:.4+Math.random()*.8,d:i%2?-1:1,s:12+Math.random()*12,c:c,wy:Math.random()*6.28};});

// --- Vandmand (Jellyfish) ---
var jelly = {x: W*0.7, y: H + 100, p: 0, s: 15 + Math.random()*10};

// --- Tang (Grønne og Blege Røde) ---
var weeds=[];
for(var i=0;i<8;i++) weeds.push({x:W/8*(i+.5)+(Math.random()-.5)*50, h:40+Math.random()*60, p:Math.random()*6.28, w:6+Math.random()*4, c:'rgba(34,197,94,0.35)'});
for(var i=0;i<6;i++) weeds.push({x:W/7*(i+.5)+(Math.random()-.5)*60, h:70+Math.random()*80, p:Math.random()*6.28, w:5+Math.random()*4, c:'rgba(248,113,113,0.35)'});

// --- Skildpadde ---
var turtle = {x: -150, y: 0, active: false, d: 1, timer: 2000, f: 0};

var barW=Math.min(320,W*.75),barH=20,loadP=0,targetP=0;
var fading=false,fadeA=1;

// --- Hjælpefunktion: afrundet rektangel ---
function rr(x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);
  ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.fill();
}

// --- Hovedloop ---
function frame(ts){
  if(!cv.parentNode)return;
  ctx.clearRect(0,0,W,H);
  if(fading){fadeA-=.03;if(fadeA<=0){cv.remove();return;}ctx.globalAlpha=fadeA;}

  // Baggrund gradient (Lidt dybere blå for bedre kontrast til neon)
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0b1b36'); 
  g.addColorStop(1,'#040914');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  // Svævende Plankton
  ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
  planktons.forEach(function(p){
    p.y -= 0.15;
    var px = p.x + Math.sin(ts*0.001 + p.p)*10;
    if(p.y < -10) { p.y = H+10; p.x = Math.random()*W; }
    ctx.beginPath(); ctx.arc(px, p.y, p.s, 0, 6.28); ctx.fill();
  });

  // Tang i bunden
  ctx.lineCap='round';
  weeds.forEach(function(wd){
    var sw=Math.sin(ts*.0008+wd.p)*15;
    ctx.strokeStyle=wd.c; ctx.lineWidth=wd.w;
    ctx.beginPath();ctx.moveTo(wd.x,H);ctx.quadraticCurveTo(wd.x+sw,H-wd.h*.6,wd.x+sw*.6,H-wd.h);ctx.stroke();
  });

  // Pulserende Vandmand
  jelly.y -= 0.4;
  jelly.p += 0.03;
  if(jelly.y < -100) { jelly.y = H+100; jelly.x = Math.random()*W; }
  ctx.save();
  ctx.translate(jelly.x + Math.sin(jelly.p)*25, jelly.y);
  ctx.fillStyle = 'rgba(236, 72, 153, 0.15)'; // Blød pink
  ctx.strokeStyle = 'rgba(236, 72, 153, 0.4)';
  ctx.lineWidth = 1.5;
  // Vandmandens hat
  ctx.beginPath(); ctx.arc(0, 0, jelly.s, Math.PI, 0); 
  ctx.quadraticCurveTo(0, 5, -jelly.s, 0); ctx.fill(); ctx.stroke();
  // Fangarme
  ctx.beginPath();
  for(var i = -jelly.s*0.7; i <= jelly.s*0.7; i += jelly.s*0.4) {
    ctx.moveTo(i, 0);
    ctx.quadraticCurveTo(i + Math.sin(jelly.p*1.5)*8, jelly.s, i + Math.sin(jelly.p*1.5 + 1)*12, jelly.s*2.5);
  }
  ctx.stroke();
  ctx.restore();

  // Fisk (Med animerede haler!)
  fish.forEach(function(f){
    f.x+=f.sp*f.d; f.wy+=.018;

  });

  ctx.lineJoin='round';

  ctx.fillStyle='rgba(248, 250, 252, 0.95)';

  // Glassmorphism Load-bar Bagrund
  ctx.fillStyle='rgba(0,0,0,0.3)';

  ctx.strokeStyle='rgba(255,255,255,0.1)';
  ctx.lineWidth=1;

  // Load-bar Fyld (Gradient)
  if(loadP>0.005){

    ctx.fillStyle='rgba(255,255,255,0.25)';
    rr(bx2,by,currentW,barH*0.4,10);

  ctx.font='bold 14px system-ui,sans-serif';
  ctx.fillStyle='rgba(255,255,255,0.8)';
  ctx.fillText(Math.min(100,Math.round(loadP*100))+'%',cx,by+barH+24);

<script>
(function(){
'use strict';
// Vent til DOM er klar, hent game-source og transpilér i Worker
function boot(){
  var el=document.getElementById('babel-source');
  if(!el){console.error('babel-source not found');return;}
  var src=el.textContent;
  var babelUrl='https://unpkg.com/@babel/standalone/babel.min.js';

  // --- Kør transpileret kode på main thread ---
  function exec(code){
    window.setLoaderProgress&&window.setLoaderProgress(.95);
    var s=document.createElement('script');
    s.textContent=code;
    document.body.appendChild(s);
  }

  // --- Fallback: main-thread Babel (fryser, men virker) ---
  function fallback(){
    window.setLoaderProgress&&window.setLoaderProgress(.30);
    function attempt(){
      if(window.Babel){
        try{var r=Babel.transform(src,{presets:['env','react']});exec(r.code);}
        catch(e){console.error('Babel fallback fejl:',e);}
      }else{setTimeout(attempt,300);}
    }
    attempt();
  }

  // --- Web Worker transpilation ---
  try{
    var wCode=[
      'var ok=false;',
      'try{importScripts("'+babelUrl+'");ok=true;}catch(e){}',
      'if(ok)self.postMessage({s:"ready"});',
      'else self.postMessage({s:"fail"});',
      'self.onmessage=function(e){',
      '  if(!ok){self.postMessage({s:"fail"});return;}',
      '  self.postMessage({s:"work"});',
      '  try{var r=Babel.transform(e.data,{presets:["env","react"]});',
      '    self.postMessage({s:"done",code:r.code});}',
      '  catch(err){self.postMessage({s:"fail",err:err.message});}',
      '};'
    ].join('\n');
    var blob=new Blob([wCode],{type:'application/javascript'});
    var w=new Worker(URL.createObjectURL(blob));
    var timeout=setTimeout(function(){w.terminate();console.warn('Worker timeout – fallback');fallback();},45000);

    w.onmessage=function(e){
      var d=e.data;
      if(d.s==='ready'){
        window.setLoaderProgress&&window.setLoaderProgress(.30);
        w.postMessage(src); // Send kildekode til transpilering
      }else if(d.s==='work'){
        window.setLoaderProgress&&window.setLoaderProgress(.55);
      }else if(d.s==='done'){
        clearTimeout(timeout);w.terminate();
        exec(d.code);
      }else if(d.s==='fail'){
        clearTimeout(timeout);w.terminate();
        console.warn('Worker fejl – fallback');fallback();
      }
    };
    w.onerror=function(){clearTimeout(timeout);w.terminate();fallback();};
  }catch(e){
    console.warn('Kan ikke starte Worker – fallback');fallback();
  }
}

// Start boot efter DOM er parset (så babel-source elementet eksisterer)
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);
else boot();
})();
</script>

// ── BRANDMAND (Jellyfish) – detaljeret 3D-model ────────────
function createBrandmandMesh() {
  const group = new THREE.Group();

  // Klokke (bell) – halvkugle med glasagtigt materiale
  const bellGeo = new THREE.SphereGeometry(1.15, 32, 24, 0, Math.PI * 2, 0, Math.PI * 0.62);
  const bellMat = new THREE.MeshPhysicalMaterial({
    color: 0xff77aa,
    transmission: 0.88,
    roughness: 0.2,
    metalness: 0,
    transparent: true,
    opacity: 0.68,
    emissive: 0x550033,
    emissiveIntensity: 0.4,
    clearcoat: 0.6,
    side: THREE.DoubleSide
  });
  const bell = new THREE.Mesh(bellGeo, bellMat);
  bell.scale.set(1, 0.48, 1);
  bell.position.y = 0.72;
  group.add(bell);

  // Ydre kant-ring for at give klokken en blødere kant
  const rimGeo = new THREE.TorusGeometry(1.12, 0.06, 12, 48);
  const rimMat = new THREE.MeshPhysicalMaterial({
    color: 0xff99cc,
    transparent: true,
    opacity: 0.55,
    emissive: 0xff3366,
    emissiveIntensity: 0.3,
    roughness: 0.3
  });
  const rim = new THREE.Mesh(rimGeo, rimMat);
  rim.position.y = 0.38;
  rim.rotation.x = Math.PI / 2; // ← OPdateret 2026
  group.add(rim);

  // Indre kerne/glow
  const core = new THREE.Mesh(
    new THREE.IcosahedronGeometry(0.48, 1),
    new THREE.MeshPhysicalMaterial({
      color: 0xff3366,
      transmission: 0.65,
      transparent: true,
      opacity: 0.5,
      emissive: 0xff0022,
      emissiveIntensity: 0.6
    })
  );
  core.position.y = 0.58;
  group.add(core);

  // Indre glødepunkt-lys
  const innerGlow = new THREE.PointLight(0xff2255, 1.2, 3);
  innerGlow.position.y = 0.55;
  group.add(innerGlow);

  // 16 tentakler med bølgende kurver
  const tentacleMat = new THREE.MeshPhongMaterial({
    color: 0xff4488,
    transparent: true,
    opacity: 0.42,
    shininess: 5,
    side: THREE.DoubleSide
  });
  const tentacles = [];
  const num = 16;
  for (let i = 0; i < num; i++) {
    const angle = (i / num) * Math.PI * 2;
    const offsetX = Math.cos(angle) * 1.08;
    const offsetZ = Math.sin(angle) * 1.08;
    const randSeed = Math.random();

    const curve = new THREE.QuadraticBezierCurve3(
      new THREE.Vector3(offsetX, 0.42, offsetZ),
      new THREE.Vector3(offsetX * 1.25, -1.1, offsetZ * 1.25),
      new THREE.Vector3(
        offsetX * 0.7 + (randSeed - 0.5) * 0.9,
        -5.2,
        offsetZ * 0.7 + (randSeed - 0.5) * 0.9
      )
    );

    const tubeGeo = new THREE.TubeGeometry(curve, 12, 0.022, 6, false);
    const tentacle = new THREE.Mesh(tubeGeo, tentacleMat);
    group.add(tentacle);
    tentacles.push({ mesh: tentacle, baseAngle: angle, idx: i });
  }

  // 4 tykkere orale arme (fra midten)
  const oralMat = new THREE.MeshPhongMaterial({
    color: 0xff6699,
    transparent: true,
    opacity: 0.5,
    shininess: 10
  });
  const oralArms = [];
  for (let i = 0; i < 4; i++) {
    const angle = (i / 4) * Math.PI * 2 + Math.PI / 4;
    const ox = Math.cos(angle) * 0.35;
    const oz = Math.sin(angle) * 0.35;

    const curve = new THREE.QuadraticBezierCurve3(
      new THREE.Vector3(ox, 0.3, oz),
      new THREE.Vector3(ox * 2.5, -1.5, oz * 2.5),
      new THREE.Vector3(ox * 1.8, -3.8, oz * 1.8)
    );
    const tubeGeo = new THREE.TubeGeometry(curve, 10, 0.055, 6, false);
    const arm = new THREE.Mesh(tubeGeo, oralMat);
    group.add(arm);
    oralArms.push({ mesh: arm, baseAngle: angle });
  }

  group.scale.setScalar(0.68);

  // Flash-materiale til "rammer krogen"-effekt
  let flashIntensity = 0;

  group.userData = {
    type: 'brandmand',
    triggerFlash: () => { flashIntensity = 1.0; },
    customUpdate: (time) => {
      const pulse = Math.sin(time * 2.8) * 0.11 + 1.0;
      const breathe = 1 - Math.sin(time * 1.4) * 0.08;
      group.scale.set(pulse * 0.68, breathe * 0.68, pulse * 0.68);

      tentacles.forEach((t) => {
        const wave = Math.sin(time * 4 + t.idx * 1.3) * 0.35;
        t.mesh.rotation.z = wave * 0.8;
        t.mesh.rotation.x = Math.cos(t.baseAngle) * wave * 0.6;
      });

      oralArms.forEach((a, idx) => {
        const wave = Math.sin(time * 3 + idx * 1.8) * 0.25;
        a.mesh.rotation.z = wave * 0.6;
        a.mesh.rotation.x = Math.cos(a.baseAngle) * wave * 0.5;
      });

      group.position.y = Math.sin(time * 0.8) * 0.25 - 0.1;
      group.rotation.y = Math.sin(time * 0.5) * 0.15;

      // Rød fare-flash (aftager over tid)
      if (flashIntensity > 0) {
        flashIntensity *= 0.92;
        bellMat.emissiveIntensity = 0.4 + flashIntensity * 2.0;
        bellMat.emissive.setHex(flashIntensity > 0.3 ? 0xff0000 : 0x550033);
        innerGlow.intensity = 1.2 + flashIntensity * 4.0;
        if (flashIntensity < 0.01) {
          flashIntensity = 0;
          bellMat.emissiveIntensity = 0.4;
          bellMat.emissive.setHex(0x550033);
          innerGlow.intensity = 1.2;
        }
      }

      // Indre kerne pulserer
      core.scale.setScalar(0.9 + Math.sin(time * 5) * 0.12);
      core.material.emissiveIntensity = 0.6 + Math.sin(time * 3.5) * 0.3;

      // Glødepunkt flimrer
      innerGlow.intensity = 1.2 + Math.sin(time * 6) * 0.4;
    }
  };

  return group;
}

// === OPdateret Søuhyre Ambient Logic v2 (kun despawn ved fangst + Surface/Dive cyklus) ===
function createSoeUhyreMesh() {
  const monster = new THREE.Group();
  const segments = [];
  const numSegments = 30;

  const skinMaterial = new THREE.MeshStandardMaterial({
    color: 0x11aa33,
    roughness: 0.4,
    metalness: 0.1,
    flatShading: true
  });

  const bellyMaterial = new THREE.MeshStandardMaterial({
    color: 0x88ffaa,
    roughness: 0.5
  });

  for (let i = 0; i < numSegments; i++) {
    let radius = 2.5;
    if (i > 0) {
      const tailFactor = i / numSegments;
      radius = 2.5 * Math.cos(tailFactor * Math.PI / 2);
    }
    if (radius < 0.2) radius = 0.2;

    const geo = new THREE.SphereGeometry(radius, 6, 6);
    const segmentMesh = new THREE.Mesh(geo, skinMaterial);
    segmentMesh.castShadow = true;
    segmentMesh.receiveShadow = true;
    segmentMesh.position.z = -i * 2.2;

    // Rygrad-pigge
    if (i > 2 && i < numSegments - 2 && i % 2 === 0) {
      const spikeGeo = new THREE.ConeGeometry(radius * 0.3, radius * 1.5, 4);
      const spikeMat = new THREE.MeshStandardMaterial({ color: 0x005511, flatShading: true });
      const spike = new THREE.Mesh(spikeGeo, spikeMat);
      spike.position.y = radius + (radius * 0.2);
      spike.rotation.x = -0.2;
      segmentMesh.add(spike);
    }

    // Hoved (første segment)
    if (i === 0) {
      const eyeGeo = new THREE.SphereGeometry(0.5, 16, 16);
      const eyeMat = new THREE.MeshStandardMaterial({ color: 0xffdd00, emissive: 0x665500 });
      const pupilMat = new THREE.MeshBasicMaterial({ color: 0x000000 });

      const eyeR = new THREE.Mesh(eyeGeo, eyeMat);
      eyeR.position.set(1.5, 1.2, 1.8);
      const pupilR = new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 16), pupilMat);
      pupilR.position.set(0.1, 0, 0.4);
      eyeR.add(pupilR);
      segmentMesh.add(eyeR);

      const eyeL = eyeR.clone();
      eyeL.position.set(-1.5, 1.2, 1.8);
      eyeL.children[0].position.set(-0.1, 0, 0.4);
      segmentMesh.add(eyeL);

      const hornGeo = new THREE.ConeGeometry(0.4, 2, 8);
      const hornMat = new THREE.MeshStandardMaterial({ color: 0x004411 });
      const hornR = new THREE.Mesh(hornGeo, hornMat);
      hornR.position.set(1.2, 2.2, 0);
      hornR.rotation.x = -0.5;
      hornR.rotation.z = -0.3;
      segmentMesh.add(hornR);

      const hornL = hornR.clone();
      hornL.position.set(-1.2, 2.2, 0);
      hornL.rotation.z = 0.3;
      segmentMesh.add(hornL);

      const toothGeo = new THREE.ConeGeometry(0.25, 1.2, 4);
      const toothMat = new THREE.MeshStandardMaterial({ color: 0xffffee, flatShading: true });
      const numTeeth = 9;
      for (let t = 0; t < numTeeth; t++) {
        const tooth = new THREE.Mesh(toothGeo, toothMat);
        const tFactor = (t / (numTeeth - 1)) - 0.5;
        tooth.position.x = tFactor * 3.8;
        tooth.position.y = -0.9 + Math.abs(tFactor) * 0.5;
        tooth.position.z = 2.7 - Math.abs(tFactor) * 2.0;
        tooth.rotation.x = Math.PI - 0.8;
        tooth.rotation.z = -tFactor * 1.5;
        tooth.rotation.y = tFactor * 0.5;
        segmentMesh.add(tooth);
      }
    }

    segments.push(segmentMesh);
    monster.add(segmentMesh);
  }

  // Boble-partikler
  const particlesCount = 400;
  const particlesGeo = new THREE.BufferGeometry();
  const posArray = new Float32Array(particlesCount * 3);
  for (let i = 0; i < particlesCount * 3; i++) {
    posArray[i] = (Math.random() - 0.5) * 40;
  }
  particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
  const particlesMat = new THREE.PointsMaterial({
    size: 0.15,
    color: 0xffffff,
    transparent: true,
    opacity: 0.4,
    blending: THREE.AdditiveBlending
  });
  const bubbles = new THREE.Points(particlesGeo, particlesMat);
  monster.add(bubbles);

  // Skalér ned til spilverdenen
  monster.scale.setScalar(0.22);

  // diveAngle: 0 = normal svømning, >0 = halen peger opad (dykker nedad)
  monster.userData = {
    type: 'soeuhyre',
    segments: segments,
    bubbles: bubbles,
    diveAngle: 0, // Styres af tickScene — 0..1 (0=overflade, 1=fuld dyk)
    customUpdate: (time) => {
      const speed = 3.0;
      const waveLength = 0.4;
      const da = monster.userData.diveAngle || 0;

      segments.forEach((segment, i) => {
        const offset = i * waveLength;
        // Normal S-kurve bevægelse (dæmpet under dyk)
        const surfaceMix = 1.0 - da * 0.7; // Dæmp S-kurve under dyk
        segment.position.x = Math.sin(time * speed - offset) * 4 * surfaceMix;
        segment.position.y = Math.cos(time * speed * 0.8 - offset) * 0.5 * surfaceMix; // Flad mod vandet (var 1.5)
        segment.rotation.z = Math.cos(time * speed - offset) * 0.04 * surfaceMix; // Minimal body-roll (var 0.15)
        segment.rotation.y = Math.sin(time * speed - offset) * 0.2 * surfaceMix;

        // Dyk-rotation: hale-segmenter tipper opad jo længere bagud de er
        // (= hele kroppen buer nedad mod dybet)
        const tailT = i / numSegments; // 0=hoved, 1=halespids
        segment.rotation.x = da * tailT * 0.6; // Halen løftes, hovedet peger ned
      });

      // Boble-animation (flere bobler under dyk for effekt)
      const positions = bubbles.geometry.attributes.position.array;
      const bubbleSpeed = 0.4 + da * 0.6;
      for (let i = 2; i < particlesCount * 3; i += 3) {
        positions[i] += bubbleSpeed;
        positions[i - 1] += 0.03 + da * 0.05;
        if (positions[i] > 20) {
          positions[i] = -40;
          positions[i - 1] = (Math.random() - 0.5) * 30;
          positions[i - 2] = (Math.random() - 0.5) * 40;
        }
      }
      bubbles.geometry.attributes.position.needsUpdate = true;
    }
  };

  return monster;
}

// === DISPLAY SCALE SYSTEM v1.0 – FUTURE-PROOF & GENERAL ===
function calculateDisplayScale(entry, actualWeight) {
  if (!entry?.model) return 1.0;

  const baseScale = entry.model.scale || 1.0;
  const avgWeight = (entry.baseWeightMin + entry.baseWeightMax) / 2 || 10;

  let ratio = actualWeight / avgWeight;

  // Non-linear dæmpning – store vægte vokser langsommere
  const curve = entry.model.scaleCurve ??
                (entry.isTrueBoss || entry.rarity === 'Legendarisk' || entry.rarity === 'Forhistorisk' ? 0.58 : 0.82);
  ratio = Math.pow(ratio, curve);

  let scale = baseScale * ratio;

  // Hard cap fra data eller rarity-default
  let maxScale = entry.model.maxDisplayScale;
  if (maxScale === undefined) {
    maxScale = {
      'Almindelig': 2.15,
      'Sjælden':    2.55,
      'Legendarisk': 2.95,
      'Boss':       5.15,
      'Forhistorisk': 3.45,
      'Mystisk':    2.75
    }[entry.rarity] ?? 2.85;
  }

  scale = Math.min(scale, maxScale);
  scale = Math.max(scale, baseScale * 0.58); // aldrig mikro-fisk

  return scale;
}

function getEnrichedEntry(id) { return ENRICHED_CATCH_DATA.find(e => e.id === id) || null; }

/** Byg minimal catchData til createCatchModel ud fra kun fishId (til preload). */
function buildCatchDataFromFishId(fishId) {
  const entry = getEnrichedEntry(fishId);
  if (entry) {
    const [minW, maxW] = entry.weightRange || [1, 5];
    return {
      fishModelId: fishId,
      itemType: entry.itemType || 'fish',
      weight: (minW + maxW) / 2,
      species: entry.name,
      rarity: entry.rarity || 'Almindelig',
      color: entry.model?.color
    };
  }
  return { fishModelId: fishId, itemType: fishId, weight: 1, species: String(fishId) };
}

/** Returnerer alle entries der har en 3D-model og matcher lokation + upgrades. */
function getPreloadCandidates(location, upgrades) {
  return ENRICHED_CATCH_DATA.filter(e => {
    if (!matchesLocation(e, location)) return false;
    const req = e.requirements || {};
    if (req.requiredRod && !upgrades.includes(req.requiredRod)) return false;
    if (req.requiredUpgrade && !upgrades.includes(req.requiredUpgrade)) return false;
    // Inkludér alt med en model-definition, visual, eller en itemType som createCatchModel kan bygge
    if (e.model || e.visual) return true;
    // Fallback: itemTypes som createCatchModel altid kan håndtere (generisk fisk-form)
    if (e.itemType === 'fish' || e.itemType === 'treasure' || e.itemType === 'kraken' ||
        e.itemType === 'jellyfish' || e.itemType === 'bottle' || e.itemType === 'fossil' ||
        e.itemType === 'oyster' || e.itemType === 'conch' || e.itemType === 'plesiosaur' ||
        e.itemType === 'boss_hvidhaj' || e.itemType === 'halibut' || e.itemType === 'crystal_junk' ||
        e.itemType === 'junk' || e.itemType === 'piranha' || e.itemType === 'soeuhyre') return true; // === NY SØUHYRE tilføjet ===
    return false;
  });
}

/** Maks. ensartet skala for legendære/meget store fangster i spanden (undgår freeze + clipping). */
const MAX_BUCKET_SCALE = 0.55;

function catchDataNeedsBucketScaleCap(catchData) {
  if (!catchData) return false;
  if (catchData.rarity === 'Legendarisk') return true;
  const enriched = catchData.fishModelId ? getEnrichedEntry(catchData.fishModelId) : null;
  const model = enriched?.model || catchData.model || {};
  if (model.maxDisplayScale != null && model.maxDisplayScale > 2.0) return true;
  if (model.scale != null && model.scale > 1.8) return true;
  return false;
}

/** Efter bucket-tier (kun materiale): sørg for at capped fisk aldrig overstiger MAX_BUCKET_SCALE. */
function reapplyBucketMegaFishScaleClamp(refs) {
  if (!refs.bucketFishModels || !refs.bucketFishModels.length) return;
  refs.bucketFishModels.forEach(m => {
    const cd = m.userData._catchData;
    if (!cd || !catchDataNeedsBucketScaleCap(cd)) return;
    if (m.scale.x > MAX_BUCKET_SCALE) m.scale.setScalar(MAX_BUCKET_SCALE);
    if (m.userData.targetScale != null && m.userData.targetScale > MAX_BUCKET_SCALE) {
      m.userData.targetScale = MAX_BUCKET_SCALE;
    }
  });
}

const FishPool = (() => {
  const _pool     = new Map();   // id → THREE.Group (færdigbyggede meshes)
  const _inFlight = new Map();   // id → Promise<THREE.Group> (igangværende builds)
  const _warmed   = new Set();   // ids hvis shaders er GPU-kompilerede
  const MAX_SIZE  = 40;

  // Scheduling-primitiver med fallback til ældre browsere / mobile
  const _idle = (ms) => new Promise(resolve => {
    if (typeof requestIdleCallback === 'function') requestIdleCallback(resolve, { timeout: ms });
    else setTimeout(resolve, 0);
  });
  const _nextFrame = () => new Promise(r => requestAnimationFrame(r));

  // LRU eviction: ældste entry (start af Map) fjernes først
  function _evict() {
    while (_pool.size > MAX_SIZE) {
      const oldest = _pool.keys().next().value;
      const mesh = _pool.get(oldest);
      if (mesh) mesh.traverse(c => {
        if (c.geometry) c.geometry.dispose();
        if (c.material) { (Array.isArray(c.material) ? c.material : [c.material]).forEach(m => m.dispose()); }
      });
      _pool.delete(oldest);
      _warmed.delete(oldest);
    }
  }

  // Flyt entry til enden af Map (sidst brugt = sidst evicted)
  function _touch(key) {
    const v = _pool.get(key);
    if (v) { _pool.delete(key); _pool.set(key, v); }
  }

  // Defer tung geometri til næste frame
  async function _build(fishId, location) {
    await _nextFrame();
    const catchData = buildCatchDataFromFishId(fishId);
    return createCatchModel(catchData, location);
  }

  return {
    has(fishId) { return _pool.has(fishId) || _inFlight.has(fishId); },

    // ── ACQUIRE: Pool-hit → instant genbrug, ellers deferred build ──
    async acquire(fishId, location = 'pier') {
      if (_pool.has(fishId)) { _touch(fishId); return _pool.get(fishId); }
      if (_inFlight.has(fishId)) return _inFlight.get(fishId);
      const promise = _build(fishId, location).then(mesh => {
        _pool.set(fishId, mesh); _inFlight.delete(fishId); _evict(); return mesh;
      });
      promise.catch(() => _inFlight.delete(fishId));
      _inFlight.set(fishId, promise);
      return promise;
    },

    // ── PRELOAD: Lav-prioritets build under idle tid ──
    async preload(fishId, location = 'pier') {
      if (_pool.has(fishId) || _inFlight.has(fishId)) return;
      const promise = (async () => { await _idle(200); return _build(fishId, location); })()
        .then(mesh => { _pool.set(fishId, mesh); _inFlight.delete(fishId); _evict(); return mesh; });
      promise.catch(() => _inFlight.delete(fishId));
      _inFlight.set(fishId, promise);
      return promise;
    },

    // ── SHADER PRE-WARMING: Off-screen GPU-kompilering ──
    warmShaders(fishId, renderer, camera) {
      if (!renderer || !camera || _warmed.has(fishId)) return;
      const mesh = _pool.get(fishId);
      if (!mesh) return;
      try {
        const tmp = new THREE.Scene();
        tmp.add(mesh);
        renderer.compile(tmp, camera);
        tmp.remove(mesh);
        _warmed.add(fishId);
      } catch (_) { /* Harmless — shader kompileres ved første render i stedet */ }
    },

    // ── BATCH PRELOAD + WARM: alle fangst-typer for en lokation ──
    async preloadForContext(location, upgrades, activeBait, renderer, camera) {
      const candidates = getPreloadCandidates(location, upgrades);
      const sorted = [...candidates].sort((a, b) => (b.lootWeight || 1) - (a.lootWeight || 1));
      const top = sorted.slice(0, 12);
      for (const entry of top) {
        if (!_pool.has(entry.id)) await this.preload(entry.id, location);
        this.warmShaders(entry.id, renderer, camera);
      }
    },

    // ── RELEASE: Fjern fra scene, behold i pool til genbrug ──
    release(mesh, scene) {
      if (mesh && scene) { scene.remove(mesh); mesh.visible = false; }
    },

    // ── SYNC CLONE: Billigt klon til spand-fisk (deler geometri+materiale) ──
    cloneFromPool(fishId) {
      const template = _pool.get(fishId);
      if (!template) return null;
      _touch(fishId);
      return template.clone(true);
    },

    get size() { return _pool.size; }
  };
})();

// ── Backward-kompatible wrappers (alle eksisterende kaldesteder virker uændret) ──
async function lazyLoadFish(fishId, location = 'pier') {
  if (!fishId) return null;
  const key = typeof fishId === 'object' ? getFishCacheKey(fishId) : fishId;
  return FishPool.acquire(key, location);
}

async function getDisplayFishForCatch(lastCatch, location = 'pier') {
  if (!lastCatch) return null;
  const key = getFishCacheKey(lastCatch);
  return FishPool.acquire(key, location);
}

function getCandidatesForLocation(location, upgrades, activeBait) {
  return ENRICHED_CATCH_DATA.filter(e => {
    if (e.type !== 'fish') return false;
    if (!matchesLocation(e, location)) return false;
    const req = e.requirements || {};
    if (req.requiredRod && !upgrades.includes(req.requiredRod)) return false;
    if (req.requiredUpgrade && !upgrades.includes(req.requiredUpgrade)) return false;
    if (req.requiredBait && req.requiredBait !== activeBait) return false;
    return true;
  });
}

const MODIFIER_PIPELINE = {
  applyLootModifiers(baseWeights, ctx) {
    return { ...baseWeights };
  },
  applyCombatModifiers(baseFP, ctx) {
    let { requiredAnswers, baseTimeLimit } = baseFP;
    let timeLimit = baseTimeLimit > 0 ? baseTimeLimit : (ctx.difficulty === 3 ? 12 : ctx.difficulty === 2 ? 10 : 8);
    if (ctx.isBoss || ctx.isPlesiosaur) timeLimit = Math.max(timeLimit, 30);
    timeLimit += (ctx.rodTimeBonus || 0);
    if (ctx.zenMode) timeLimit = Infinity;
    return { requiredAnswers, timeLimit };
  },
  applyRewardModifiers(baseReward, ctx) {
    let { value, xp } = baseReward;
    let xpMultiplier = 1;
    return { value, xp, xpMultiplier, specialEvent: ctx.specialOnCatch || null };
  }
};

// Fisher-Yates shuffle der sikrer at første element ≠ lastUsed
function shuffleParrotJokes(lastUsedIdx) {
  const arr = Array.from({ length: PARROT_JOKES.length }, (_, i) => i);
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  // Undgå gentagelse: hvis første element === sidst brugte, byt med en tilfældig anden
  if (arr[0] === lastUsedIdx && arr.length > 1) {
    const swapWith = 1 + Math.floor(Math.random() * (arr.length - 1));
    [arr[0], arr[swapWith]] = [arr[swapWith], arr[0]];
  }
  return arr;
}

function getNextMilestone(type, delivered) {
  const cfg = COLLECTIBLES[type];
  if (!cfg) return null;
  const milestones = Object.keys(cfg.milestoneRewards).map(Number).sort((a, b) => a - b);
  for (const m of milestones) { if (delivered < m) return m; }
  return null;
}

// ── PROGRESSIV STREAK RIGDOM BONUS + ZEN MODE (v2) ─────────────────
// Streak-tæller vises fra 1, men bonus udløses KUN fra streak >= 5.
// Normal mode: +3 rigdom pr. 5-tier (tier 1 = +3, tier 2 = +6, tier 3 = +9 …)
// Zen mode: Flad +1 rigdom pr. streak-niveau (streak 5 = +5, streak 6 = +6 …)
// baseTotalValue <= 0 (junk) → ingen bonus nogensinde.
function calculateStreakBonus(currentStreak, isZenMode, baseTotalValue = 0) {
  if (currentStreak < 5) return 0;            // Ingen bonus under 5
  if (baseTotalValue <= 0) return 0;          // Junk-fisk → aldrig bonus
  if (isZenMode) return currentStreak;        // Zen: flad streak-værdi (5 = +5, 6 = +6 …)
  // Normal: tiers * 3 → hvert 5. streak giver næste tier
  const tiers = Math.floor(currentStreak / 5);
  return tiers * 3;                           // 5–9 = +3, 10–14 = +6, 15–19 = +9 …
}
// Beregn den endelige streak-bonus (wrapper — bruges i UI-visninger)
function getFinalStreakBonus(currentStreak, isZenMode, baseTotalValue = 1) {
  return calculateStreakBonus(currentStreak, isZenMode, baseTotalValue);
}

function getUnlockedAreas(level, upgrades, questItems = []) {

    if (loc.requiresItem === 'desert_set') return DESERT_SET.every(id => upgrades.includes(id));

const XP_REWARDS = { fish: { Almindelig: 10, Sjælden: 25, Legendarisk: 60 }, item: { treasure: 80, junk: 2 }, weightBonus: (weight) => 0 /* DEAKTIVERET: vægt-bonus fjernet i nyt system */ };
const XP_BALANCING = { baseXp: 100, linearStep: 75, exponentialFrom: 10, exponentialRate: 1.06 };
function xpNeededForLevel(lvl) {
  const { baseXp, linearStep, exponentialFrom, exponentialRate } = XP_BALANCING;
  const linear = baseXp + (lvl - 1) * linearStep;
  if (lvl <= exponentialFrom) return linear;
  return Math.floor(linear * Math.pow(exponentialRate, lvl - exponentialFrom));
}
function calcXpForCatch(catchData, additiveXR = 0) {
  if (!catchData) return 0;
  if (catchData.itemType === 'nothing') return 0;
  // ★ TRIN 5: Prøv at slå enriched entry op for baseXP ★
  const enriched = getEnrichedEntry(catchData.fishModelId || '');
  if (enriched && enriched.baseXP != null) {
    return enriched.baseXP + additiveXR;
  }
  // Fallback: brug catchData.xpReward eller rarity-baseret
  if (catchData.xpReward != null) return catchData.xpReward + additiveXR;
  if (catchData.itemType === 'junk') return 2 + additiveXR;
  if (catchData.itemType === 'bottle') return 25 + additiveXR;
  if (catchData.itemType === 'fossil') return 50 + additiveXR;
  if (catchData.itemType === 'plesiosaur') return 100 + additiveXR;
  if (catchData.itemType === 'treasure') return 40 + additiveXR;
  // Rarity fallback
  const base = XP_REWARDS.fish[catchData.rarity] ?? XP_REWARDS.fish.Almindelig ?? 8;
  return base + additiveXR;
}
function getDifficultyThresholds(level) {
  if (level <= 2) return { hard: 0.95, medium: 0.80 };
  if (level <= 5) return { hard: 0.85, medium: 0.55 };
  if (level <= 9) return { hard: 0.70, medium: 0.35 };
  if (level <= 14) return { hard: 0.55, medium: 0.20 };
  return { hard: 0.45, medium: 0.15 };
}
function rollDifficulty(level) {
  const r = Math.random();
  const { hard, medium } = getDifficultyThresholds(level);
  if (r > hard) return 3;
  if (r > medium) return 2;
  return 1;
}
// ★ TRIN 4: DR-baseret rarity system ★
// additiveDR kan komme fra upgrades, vejr, bait osv.
function getRarityWeights(level, additiveDR = 0) {
  // baseDR = 100 for alle. additiveDR forskyder sandsynligheder.
  // Positiv DR = bedre drops. Negativ DR = dårligere.
  const drBonus = additiveDR;
  // Junk håndteres som flat %-check pre-pipeline (v3.1)
  const common    = Math.max(5, 55 - drBonus * 0.2);
  const rare      = Math.max(3, 3 + drBonus * 0.15 + Math.max(0, level - 3) * 2);
  const legendary = Math.max(1, 1 + drBonus * 0.08 + Math.max(0, level - 8) * 0.5);
  const mystisk   = 1; // Flad – altid sjælden, ingen level-scaling
  return { common, rare, legendary, mystisk };
}

function startAmbience() {
  const ctx = initAudio();
  if (!ctx || ambienceNode) return;
  const bufferSize = 2 * ctx.sampleRate;
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
  const noise = ctx.createBufferSource();
  noise.buffer = buffer; noise.loop = true;
  const filter = ctx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 400;
  const gainNode = ctx.createGain(); gainNode.gain.value = 0.05;
  const lfo = ctx.createOscillator(); const lfoGain = ctx.createGain();
  lfo.type = 'sine'; lfo.frequency.value = 0.1; lfoGain.gain.value = 0.03;
  noise.connect(filter); filter.connect(gainNode); lfo.connect(lfoGain); lfoGain.connect(gainNode.gain); gainNode.connect(ctx.destination);
  noise.start(); lfo.start();
  ambienceNode = noise; ambienceGain = gainNode;
}

function stopAmbience() {
  if (ambienceNode) { try { ambienceNode.stop(); ambienceNode.disconnect(); } catch (_) {} ambienceNode = null; }
  if (ambienceGain) { ambienceGain.disconnect(); ambienceGain = null; }
  setRainVolume(0); // Sluk regn hvis ambience slukkes
}

function setRainVolume(vol) {
  const ctx = initAudio();
  if (!ctx) return;
  if (vol > 0 && !rainNode) {
    // Start rain loop (white noise filtered high)
    const bSize = ctx.sampleRate;
    const buf = ctx.createBuffer(1, bSize, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0; i<bSize; i++) d[i] = Math.random() * 2 - 1;
    rainNode = ctx.createBufferSource();
    rainNode.buffer = buf;
    rainNode.loop = true;
    const rainFilter = ctx.createBiquadFilter();
    rainFilter.type = 'highpass';
    rainFilter.frequency.value = 800;
    rainGain = ctx.createGain();
    rainGain.gain.value = 0;
    rainNode.connect(rainFilter);
    rainFilter.connect(rainGain);
    rainGain.connect(ctx.destination);
    rainNode.start();
  }
  if (rainGain) {
    rainGain.gain.setTargetAtTime(vol * 0.15, ctx.currentTime, 0.5);
  }
  if (vol === 0 && rainNode) {
    setTimeout(() => {
      if (rainGain && rainGain.gain.value < 0.001) {
        try { rainNode.stop(); } catch(e){}
        rainNode = null; rainGain = null;
      }
    }, 1000);
  }
}

function retEntalFlertal(tekst) {
  let resultat = tekst;
  // ── 1. Flertal → ental når tallet er præcis 1 ──
  const entalMap = {
    "hajer": "haj",
    "krabber": "krabbe",
    "muslinger": "musling",
    "håndklæder": "håndklæde",
    "bølger": "bølge",
    "ispinde": "ispind",
    "måger": "måge",
    "både": "båd",
    "sandslotte": "sandslot",
    "skaller": "skal",
    "søstjerner": "søstjerne",
    "kugler is": "kugle is",
    "dage": "dag",
    "tænder": "tand",
    "fiskere": "fisker",
    "akvarier": "akvarie",
    "tuber": "tube",
    "flasker": "flaske",
    "poser": "pose",
    "solcremer": "solcreme"
  };
  for (const [flertal, ental] of Object.entries(entalMap)) {
    const regex = new RegExp(`\\b1 ${flertal}\\b`, 'gi');
    resultat = resultat.replace(regex, `1 ${ental}`);
  }
  // ── 2. Ental → flertal når tallet er 2 eller højere ──
  const flertalMap = {
    "tube": "tuber",
    "solcreme": "solcremer",
    "flaske": "flasker",
    "pose": "poser"
  };
  for (const [ental, flertal] of Object.entries(flertalMap)) {
    const regex = new RegExp(`\\b([2-9]|[1-9][0-9]+) ${ental}\\b`, 'gi');
    resultat = resultat.replace(regex, `$1 ${flertal}`);
  }
  return resultat;
}

function generateRegneHistorie(mathDifficulty, activeOps) {
  // Filtrér templates efter aktive regnearter
  const opsToCheck = activeOps && activeOps.length > 0 ? activeOps.filter(o => ['+','-','*','/'].includes(o)) : ['+','-','*','/'];
  const possible = REGNEHISTORIE_TEMPLATES.filter(t => opsToCheck.includes(t.type));
  if (possible.length === 0) return null;
  const tmpl = possible[Math.floor(Math.random() * possible.length)];

  const mult = getDifficultyMultiplier(mathDifficulty);
  let a, b, total, div, answer;

  if (tmpl.type === '+') {
    a = Math.floor(Math.random() * (tmpl.maxA * mult - tmpl.minA + 1)) + tmpl.minA;
    b = Math.floor(Math.random() * (tmpl.maxB * mult - tmpl.minB + 1)) + tmpl.minB;
    answer = a + b;
  } else if (tmpl.type === '-') {
    a = Math.floor(Math.random() * (tmpl.maxA * mult - tmpl.minA + 1)) + tmpl.minA;
    b = Math.floor(Math.random() * (tmpl.maxB * mult - tmpl.minB + 1)) + tmpl.minB;
    if (tmpl.cond && !tmpl.cond(a,b)) b = Math.floor(a * 0.6);
    answer = a - b;
  } else if (tmpl.type === '*') {
    a = Math.floor(Math.random() * (tmpl.maxA * mult - tmpl.minA + 1)) + tmpl.minA;
    b = Math.floor(Math.random() * (tmpl.maxB * mult - tmpl.minB + 1)) + tmpl.minB;
    answer = a * b;
  } else if (tmpl.type === '/') {
    div = tmpl.divOptions[Math.floor(Math.random() * tmpl.divOptions.length)];
    const base = mathDifficulty === 'beginner' ? 6 : mathDifficulty === 'intermediate' ? 9 : 12;
    answer = (base + Math.floor(Math.random() * 6)) * (mathDifficulty === 'expert' ? 3 : 1);
    total = answer * div;
  }

  let question = tmpl.template
    .replace('{a}', a || '')
    .replace('{b}', b || '')
    .replace('{total}', total || '')
    .replace('{div}', div || '');
  question = retEntalFlertal(question);

  return {
    question: question,
    answer: answer,
    difficulty: 2,
    op: tmpl.type,
    multiplier: OP_MULTIPLIERS[tmpl.type] || 1,
    category: 'regnehistorier',
    displayType: 'regnehistorie',
    unit: tmpl.unit,
    xpBonus: 20
  };
}

const OP_MULTIPLIERS = { '+': 1, '-': 2, '*': 3, '/': 4, 'tenfriends': 1, '100friends': 1.25, 'skaeve100friends': 1.5 };

function generateNumbersForOp(op, mathDifficulty) {
  let a, b;
  if (op === '+') {
    if (mathDifficulty === 'beginner')          { a = Math.floor(Math.random() * 9) + 1; b = Math.floor(Math.random() * 9) + 1; }
    else if (mathDifficulty === 'intermediate') { a = Math.floor(Math.random() * 50) + 10; b = Math.floor(Math.random() * 40) + 5; }
    else /* expert */                           { a = Math.floor(Math.random() * 600) + 100; b = Math.floor(Math.random() * 500) + 50; }
  } else if (op === '-') {
    if (mathDifficulty === 'beginner')          { a = Math.floor(Math.random() * 9) + 1; b = Math.floor(Math.random() * a) + 1; }
    else if (mathDifficulty === 'intermediate') { a = Math.floor(Math.random() * 70) + 20; b = Math.floor(Math.random() * (a - 1)) + 1; }
    else /* expert */                           { a = Math.floor(Math.random() * 700) + 200; b = Math.floor(Math.random() * (a - 1)) + 1; }
  } else if (op === '*') {
    if (mathDifficulty === 'beginner') {
      const easyTables = [1, 2, 5, 10];
      a = easyTables[Math.floor(Math.random() * easyTables.length)];
      b = Math.floor(Math.random() * 10) + 1;
    } else if (mathDifficulty === 'intermediate') {
      a = Math.floor(Math.random() * 7) + 3;
      b = Math.floor(Math.random() * 7) + 3;
    } else /* expert */ {
      a = Math.floor(Math.random() * 30) + 10;
      b = Math.floor(Math.random() * 9) + 2;
    }
  } else { // division
    if (mathDifficulty === 'beginner') {
      const easyDivisors = [1, 2, 5, 10];
      b = easyDivisors[Math.floor(Math.random() * easyDivisors.length)];
      const ans = Math.floor(Math.random() * 9) + 1;
      a = b * ans;
    } else if (mathDifficulty === 'intermediate') {
      b = Math.floor(Math.random() * 7) + 3;
      const ans = Math.floor(Math.random() * 9) + 2;
      a = b * ans;
    } else /* expert */ {
      b = Math.floor(Math.random() * 9) + 2;
      const ans = Math.floor(Math.random() * 15) + 5;
      a = b * ans;
    }
  }
  return { a, b };
}

function generate100FriendsQuestion(activeOps) {
  const tiere = [10,20,30,40,50,60,70,80,90];
  const valgtTal = tiere[Math.floor(Math.random() * tiere.length)];
  const svar = 100 - valgtTal;
  
  const typer = [
    `${valgtTal} + ? = 100`,
    `? + ${valgtTal} = 100`
  ];
  if (activeOps && activeOps.includes('-')) {
    typer.push(`100 − ? = ${valgtTal}`);
    typer.push(`100 − ${valgtTal} = ?`);
  }
  const visTekst = typer[Math.floor(Math.random() * typer.length)];
  
  // Beregn svar ud fra den valgte type
  let answer;
  if (visTekst.startsWith('?')) {
    answer = 100 - valgtTal;          // ? + X = 100
  } else if (visTekst.includes('+ ?')) {
    answer = svar;                     // X + ? = 100
  } else if (visTekst.endsWith('= ?')) {
    answer = svar;                     // 100 − X = ?
  } else {
    answer = svar;                     // 100 − ? = X  → ? = svar
  }
  
  return {
    question: visTekst,
    answer: answer,
    difficulty: 1,
    op: '100friends',
    multiplier: 1.25,
    category: '100friends',
    displayType: 'text'
  };
}

function generateMultiTermProblem(mathDifficulty) {
  // 3 led: a op1 b op2 c
  const ops = ['+', '-'];
  const op1 = ops[Math.floor(Math.random() * ops.length)];
  const op2 = ops[Math.floor(Math.random() * ops.length)];
  let a, b, c;
  if (mathDifficulty === 'beginner') {
    a = Math.floor(Math.random() * 8) + 2;
    b = Math.floor(Math.random() * 5) + 1;
    c = Math.floor(Math.random() * 5) + 1;
  } else if (mathDifficulty === 'intermediate') {
    a = Math.floor(Math.random() * 30) + 10;
    b = Math.floor(Math.random() * 20) + 5;
    c = Math.floor(Math.random() * 15) + 1;
  } else /* expert */ {
    a = Math.floor(Math.random() * 200) + 50;
    b = Math.floor(Math.random() * 100) + 20;
    c = Math.floor(Math.random() * 80) + 10;
  }
  // Sikr positivt resultat
  let result = a;
  result = op1 === '+' ? result + b : result - b;
  result = op2 === '+' ? result + c : result - c;
  if (result < 0) { return generateMultiTermProblem(mathDifficulty); }
  const sym1 = op1 === '-' ? '−' : '+';
  const sym2 = op2 === '-' ? '−' : '+';
  return {
    question: `${a} ${sym1} ${b} ${sym2} ${c}`,
    answer: result,
    difficulty: 3,
    op: '*',
    multiplier: 4,
    category: 'multi-term',
    displayType: 'text'
  };
}

function generateEquationProblem(mathDifficulty) {
  // Simpel ligning: a + x = c  eller  x − b = c
  const mult = getDifficultyMultiplier(mathDifficulty);
  const type = Math.floor(Math.random() * 3);
  let question, answer;
  if (type === 0) {
    // a + x = c
    const a = Math.floor(Math.random() * 15 * mult) + 1;
    const x = Math.floor(Math.random() * 15 * mult) + 1;
    const c = a + x;
    question = `${a} + x = ${c}`;
    answer = x;
  } else if (type === 1) {
    // x − b = c
    const x = Math.floor(Math.random() * 20 * mult) + 5;
    const b = Math.floor(Math.random() * (x - 1)) + 1;
    const c = x - b;
    question = `x − ${b} = ${c}`;
    answer = x;
  } else {
    // b × x = c
    const b = Math.floor(Math.random() * (mathDifficulty === 'expert' ? 15 : 8)) + 2;
    const x = Math.floor(Math.random() * (mathDifficulty === 'expert' ? 20 : mathDifficulty === 'intermediate' ? 12 : 10)) + 1;
    const c = b * x;
    question = `${b} × x = ${c}`;
    answer = x;
  }
  return {
    question,
    answer,
    difficulty: 3,
    op: '*',
    multiplier: 4,
    category: 'equations',
    displayType: 'text'
  };
}

function generateDecimalProblem(mathDifficulty) {
  // Simpel decimal +/- med 1 decimal – skaleret med sværhedsgrad
  const mult = getDifficultyMultiplier(mathDifficulty);
  const isAdd = Math.random() < 0.6;
  const a = Math.round((Math.random() * 8 * mult + 1) * 10) / 10;
  const b = Math.round((Math.random() * 4 * mult + 0.5) * 10) / 10;
  let result;
  if (isAdd) {
    result = Math.round((a + b) * 10) / 10;
  } else {
    const big = Math.max(a, b);
    const small = Math.min(a, b);
    result = Math.round((big - small) * 10) / 10;
    return {
      question: `${big} ${isAdd ? '+' : '−'} ${small}`,
      answer: result,
      difficulty: 3,
      op: isAdd ? '+' : '-',
      multiplier: 4,
      category: 'decimals',
      displayType: 'text',
      isDecimal: true
    };
  }
  return {
    question: `${a} ${isAdd ? '+' : '−'} ${b}`,
    answer: result,
    difficulty: 3,
    op: isAdd ? '+' : '-',
    multiplier: 4,
    category: 'decimals',
    displayType: 'text',
    isDecimal: true
  };
}

/**
 * Genererer et regnestykke – understøtter basic + ekspert-kategorier + 10'er-venner.
 */
function generateMathProblem(difficulty, allowDivision = false, activeOps = null, mathDifficulty = 'intermediate', mathCategory = 'basic') {
  // === SPECIAL-MADDINGER HAR ABSOLUT PRIORITET ===
  // Hvis en special-type er aktiv, generer KUN den – ingen blanding
  if (activeOps && activeOps.includes('tenfriends')) {
    return generateTenFriendsProblem(mathDifficulty);
  }
  if (activeOps && activeOps.includes('100friends')) {
    return generate100FriendsQuestion(activeOps);
  }
  if (activeOps && activeOps.includes('skaeve100friends')) {
    return generateSkaeve100FriendsQuestion(activeOps);
  }

  // Regnehistorier har egen generator
  if (mathCategory === 'regnehistorier') {
    const rh = generateRegneHistorie(mathDifficulty, activeOps);
    if (rh) return rh;
  }

  // Lette regnehistorier (Kysten – 0.-1. klasse)
  if (mathCategory === 'lette-historier') {
    return generateLetRegneHistorie(mathDifficulty);
  }

  // Ekspert-kategorier (brøker fjernet)
  if (mathCategory === 'multi-term') return generateMultiTermProblem(mathDifficulty);
  if (mathCategory === 'equations')  return generateEquationProblem(mathDifficulty);
  if (mathCategory === 'decimals')   return generateDecimalProblem(mathDifficulty);

  // Standard basic-logik
  let ops;
  if (activeOps && activeOps.length > 0) {
    ops = activeOps.filter(o => o !== 'tenfriends' && o !== '100friends' && o !== 'skaeve100friends');
    if (ops.length === 0) ops = ['+'];
  } else {
    if (difficulty === 1) ops = ['+'];
    else if (difficulty === 2) ops = ['+', '-', '*'];
    else ops = allowDivision ? ['+', '-', '*', '/'] : ['+', '-', '*'];
  }

  const op = ops[Math.floor(Math.random() * ops.length)];
  const { a, b } = generateNumbersForOp(op, mathDifficulty);

  const answer = op === '+' ? a + b : op === '-' ? a - b : op === '*' ? a * b : a / b;
  const opSymbol = op === '*' ? '×' : op === '/' ? ':' : op;
  const multiplier = OP_MULTIPLIERS[op] ?? 1;

  return { question: `${a} ${opSymbol} ${b}`, answer, difficulty, op, multiplier, category: 'basic', displayType: 'text' };
}

function rollForCatch(difficulty, playerUpgrades = [], level = 1, hasMapLeft = false, location = 'pier', isBossFight = false, junkStreak = 0, helleflynderCaught = 0, questItems = [], activeConchBait = false, activeFossilBait = false, activeFlyBait = false, activeBait = null, hajBloodExpiry = 0, perleLimExpiry = 0, additiveDR = 0, additiveVR = 0) {

  const loc = getLocation(location);

  // ── PRIORITET 0: FJERNET – nothingChance er nu 0 overalt ─────
  // Tom krog sker KUN hvis getCandidatesForLocation returnerer tom liste (se bunden)

  if (!isBossFight) {
    if (activeConchBait && Math.random() < 0.30) {
      return { id: makeId(), species: 'Konkylie', weight: 0.3, value: 0, rarity: 'Quest', color: 0xf4a460, itemType: 'conch' };
    }
    if (activeFossilBait && Math.random() < 0.25) {
      return { id: makeId(), species: 'Mystisk Fossil', weight: 3.0, value: 0, rarity: 'Mystisk', color: 0x8B7355, itemType: 'fossil' };
    }
  }

  // ── PRIORITET 2: SPECIELLE FANGSTER ──
  if (!hasMapLeft && Math.random() < 0.05) return { id: makeId(), species: 'Flaskepost', weight: 0.5, value: 0, rarity: 'Quest', color: 0x88ccaa, itemType: 'bottle' };

  const fossilLocationBonus = loc.specialRules.fossilBonus ?? -1;
  if (fossilLocationBonus >= 0 && !isBossFight && junkStreak < 3) {
    const fossilChance = 0.015 + Math.max(0, level - 5) * 0.002 + fossilLocationBonus;
    if (Math.random() < Math.min(fossilChance, 0.08)) return { id: makeId(), species: 'Mystisk Fossil', weight: 3.0, value: 0, rarity: 'Mystisk', color: 0x8B7355, itemType: 'fossil' };
  }

  if (loc.specialRules.plesioChance && !isBossFight) {
    if (Math.random() < loc.specialRules.plesioChance && activeBait === 'bait') {
      return { id: makeId(), species: 'Plesiosaurus', weight: 450, value: 0, rarity: 'Forhistorisk', color: 0x2d6a4f, itemType: 'plesiosaur' };
    }
  }

  if (!isBossFight && Math.random() < 0.02) {
    return { id: makeId(), species: 'Konkylie', weight: 0.3, value: 0, rarity: 'Quest', color: 0xf4a460, itemType: 'conch' };
  }

  // ★ Brandmand: LOCATION-FILTRERET (kun pier + tropical_island + forbidden)
  if (!isBossFight && Math.random() < 0.02) {
    const bmEntry = ENRICHED_CATCH_DATA.find(e => e.id === 'brandmand');
    if (bmEntry && matchesLocation(bmEntry, location)) {
      return { id: makeId(), species: 'Brandmand', weight: 0.1, value: 0, rarity: 'Fare', color: 0xFF4500, itemType: 'jellyfish' };
    }
  }

  // ── JUNK: Flat 12% pre-pipeline check (v3.1) ──
  if (!isBossFight && Math.random() < 0.12) {
    return createJunkItem(location);
  }

  // ── BOSS BALANCERING – KUN LOCATION-FILTRERET (ingen level-krav) ──
  const baseBossChance = 0.10;
  const activeHajBlood = Date.now() < hajBloodExpiry;
  const activePerleLim = Date.now() < perleLimExpiry;

  // ── BOSS: Byg kandidat-liste FØR roll – skip helt hvis ingen bosses på lokationen ──
  const possibleBosses = [];
  const ke = ENRICHED_CATCH_DATA.find(e => e.id === 'kraken');
  // === Kraken: kun med hvalbof aktiv + ikke allerede besejret ===
  if (ke && matchesLocation(ke, location) && _hvalbofActiveFlag && !_krakenDefeatedFlag) possibleBosses.push({species: 'Kraken', itemType: 'kraken', rarity: 'Legendarisk'});
  if (!isBossFight) {
    const oe = ENRICHED_CATCH_DATA.find(e => e.id === 'oyster');
    if (oe && matchesLocation(oe, location)) {
      const oysterCount = activePerleLim ? 7 : 1;
      for (let i = 0; i < oysterCount; i++) possibleBosses.push({species: 'Østers med Perle', itemType: 'oyster', rarity: 'Boss'});
    }
  }
  if (!isBossFight) {
    const he = ENRICHED_CATCH_DATA.find(e => e.id === 'fisk_hvidhaj');
    if (he && matchesLocation(he, location)) {
      const sharkCount = activeHajBlood ? 6 : 1;
      for (let i = 0; i < sharkCount; i++) possibleBosses.push({species: 'Hvidhaj', itemType: 'boss_hvidhaj', rarity: 'Boss'});
    }
  }
  // === Søuhyre: boss spawn (kun med koedklump aktiv + ikke allerede besejret) ===
  if (!isBossFight && !_soeUhyreDefeatedFlag && _koedklumpActiveFlag) {
    const se = ENRICHED_CATCH_DATA.find(e => e.id === 'fisk_soeuhyre');
    if (se && matchesLocation(se, location)) {
      possibleBosses.push({species: 'Søuhyre', itemType: 'soeuhyre', rarity: 'Legendarisk'});
    }
  }
  // === SLUT Søuhyre v3 === boss spawn ===
  if (possibleBosses.length > 0) {
    if (Math.random() < baseBossChance) {
      const boss = possibleBosses[Math.floor(Math.random() * possibleBosses.length)];
      const bossWeight = boss.itemType === 'boss_hvidhaj' ? 800 + Math.floor(Math.random() * 1468) : boss.itemType === 'soeuhyre' ? 1200 + Math.floor(Math.random() * 1600) : 800;
      const bossColor = boss.itemType === 'kraken' ? 0x6B006B : boss.itemType === 'oyster' ? 0xEEEED1 : boss.itemType === 'boss_hvidhaj' ? 0x5a636b : boss.itemType === 'soeuhyre' ? 0x11aa33 : 0xFFD700;
      return { id: makeId(), fishModelId: boss.itemType === 'boss_hvidhaj' ? 'fisk_hvidhaj' : boss.itemType === 'soeuhyre' ? 'fisk_soeuhyre' : undefined, species: boss.species, weight: bossWeight, value: 0, rarity: boss.rarity, color: bossColor, itemType: boss.itemType };
    }
  }

  // ★ Legendarisk Maddingspakke: LOCATION-FILTRERET
  if (activeBait === 'legendary_bait' && !isBossFight) {
    const legendaryHere = ENRICHED_CATCH_DATA.filter(e =>
      e.type === 'fish' && e.rarity === 'Legendarisk' && matchesLocation(e, location)
    );
    if (legendaryHere.length > 0) {
      const chosen = legendaryHere[Math.floor(Math.random() * legendaryHere.length)];
      const [minW, maxW] = chosen.weightRange;
      const weight = Number((minW + Math.random() * (maxW - minW)).toFixed(1));
      // ★ TRIN 3 + PHASE 2: Additiv value = baseValue + additiveVR ★
      const value = (chosen.baseValue || 80) + additiveVR;
      return { id: makeId(), fishModelId: chosen.id, species: chosen.name, weight, value, rarity: 'Legendarisk', color: 0xFFD700, itemType: chosen.itemType || 'fish' };
    }
  }

  // ── LOOT PIPELINE: Modificerede rarity-vægte ──
  const baseWeights = getRarityWeights(level, additiveDR);
  const modW = MODIFIER_PIPELINE.applyLootModifiers(baseWeights, {
    level, activeBait, activeConchBait, activeFossilBait,
    weatherType: (typeof weatherType !== 'undefined') ? weatherType : 'clear',
    location, questItems
  });

  const rarityKey = rollRarityPipeline(modW);

  const rarity = RARITY_MAP[rarityKey] ?? 'Almindelig';

  // ════════════════════════════════════════════════════════════
  // ★★★ Filtrer fisk + kister på LOKATION og RARITY ★★★
  // ════════════════════════════════════════════════════════════
  const candidates = ENRICHED_CATCH_DATA.filter(e => {
    if (e.type !== 'fish' && e.type !== 'treasure') return false;
    if (e.rarity !== rarity) return false;
    if (!matchesLocation(e, location)) return false;
    const req = e.requirements || {};
    if (req.requiredRod && !playerUpgrades.includes(req.requiredRod)) return false;
    if (req.requiredUpgrade && !playerUpgrades.includes(req.requiredUpgrade)) return false;
    if (req.requiredBait && req.requiredBait !== activeBait) return false;
    return true;
  });

  // Fallback til Almindelig hvis ingen match for den rullede rarity
  let pool = candidates.length > 0 ? candidates : ENRICHED_CATCH_DATA.filter(e => {
    if (e.type !== 'fish' && e.type !== 'treasure') return false;
    if (e.rarity !== 'Almindelig') return false;
    if (!matchesLocation(e, location)) return false;
    const req = e.requirements || {};
    if (req.requiredRod && !playerUpgrades.includes(req.requiredRod)) return false;
    if (req.requiredUpgrade && !playerUpgrades.includes(req.requiredUpgrade)) return false;
    return true;
  });
  if (pool.length === 0) {
    return { id: makeId(), species: 'Tom Krog', weight: 0, value: 0, rarity: 'Skuffelse', color: 0x111111, itemType: 'nothing' };
  }

  // ★ ADDITIV DR: Farverig Flue booster ALLE frøer (fisk_frø + fisk_gylden_frø) ★
  if (activeFlyBait) {
    pool = pool.map(e => {
      if (e.id === 'fisk_frø')        return { ...e, lootWeight: (e.lootWeight || 1) * 3.0 };
      if (e.id === 'fisk_gylden_frø') return { ...e, lootWeight: (e.lootWeight || 1) * 4.0 };
      return e;
    });
  }

  // Weighted random selection via enriched lootWeight
  const chosen = weightedFishPick(pool);
  const [minW, maxW] = chosen.weightRange;
  const weight = Number((minW + Math.random() * (maxW - minW)).toFixed(1));
  // Kister: bevar treasure-itemType og guld-farve til UI
  if (chosen.type === 'treasure') {
    const value = (chosen.baseValue || 0) + additiveVR;
    return { id: makeId(), fishModelId: chosen.id, species: chosen.name, weight, value, rarity, color: 0xD4AF37, itemType: 'treasure', visual: chosen.visual };
  }
  // ADDITIV VR: finalValue = baseValue + additiveVR (fra Guld Krog, Storm osv.)
  const value = (chosen.baseValue || 0) + additiveVR;
  // --- NY FARVE-VARIATIONS LOGIK --- // ← OPdateret 2026
  let finalColor = chosen.model?.color ?? pickColor(rarity);
  if (chosen.id === 'fisk_hummer' && Math.random() < 0.25) {
    finalColor = 0xEE3333; // Postkasserød // ← OPdateret 2026
  }
  else if (chosen.id === 'fisk_krabbe' && Math.random() < 0.25) {
    finalColor = 0xE0B070; // Gul-brun krabbe // ← OPdateret 2026
  }
  return { id: makeId(), fishModelId: chosen.id, species: chosen.name, weight, value, rarity, color: finalColor, itemType: chosen.itemType || 'fish' };
}
// ── Pipeline rarity-roll (med modificerede vægte) ──
function rollRarityPipeline(w) {
  const entries = [['mystisk', w.mystisk], ['legendary', w.legendary], ['rare', w.rare], ['common', w.common]];
  const total = entries.reduce((s, [, v]) => s + v, 0);
  let roll = Math.random() * total;
  for (const [key, wt] of entries) { roll -= wt; if (roll <= 0) return key; }
  return 'common';
}
// ── Weighted fish selection ──
function weightedFishPick(entries) {
  const totalW = entries.reduce((s, e) => s + (e.lootWeight || 1), 0);
  let roll = Math.random() * totalW;
  for (const entry of entries) { roll -= (entry.lootWeight || 1); if (roll <= 0) return entry; }
  return entries[entries.length - 1];
}
function createJunkItem(location = 'pier') {
  const junkPool = ENRICHED_CATCH_DATA.filter(e => e.itemType === 'junk' && matchesLocation(e, location));
  if (junkPool.length > 0) {
    const chosen = junkPool[Math.floor(Math.random() * junkPool.length)];
    const [minW, maxW] = chosen.weightRange || [1.0, 2.0];
    const weight = Number((minW + Math.random() * (maxW - minW)).toFixed(1));
    return { id: makeId(), fishModelId: chosen.id, species: chosen.name, weight, value: chosen.value ?? 0, rarity: 'Skrald', color: chosen.model?.color ?? 0x4A3728, itemType: 'junk', visual: chosen.visual, xpReward: chosen.xpReward ?? 2 };
  }
  return { id: makeId(), species: 'Gammel Støvle', weight: 1.5, value: 0, rarity: 'Skrald', color: 0x4A3728, itemType: 'junk', xpReward: 2 };
}
function getRequirementText(fish) {
  const req = fish.requirements || {};
  let text = [];
  if (req.requiredRod === 'rod_mahogni') text.push('Mahogni-stang');
  if (req.requiredBait === 'bait') text.push('Mystisk madding (10 fossiler til piraten)');
  if (req.requiredBait === 'koedklump') text.push('Klistret Kødklump 🍖 (5 fossiler til piraten)');
  if (req.requiredBait === 'hvalbof') text.push('Kæmpe Hvalbøf 🥩 (1 fossil til piraten)');
  if (req.requiredUpgrade === 'biolum_floats') text.push('Selvlysende Prop');
  if (req.requiredUpgrade === 'golden_hook') text.push('Guld Krog');
  return text.length ? `Kræver: ${text.join(' + ')}` : 'Ingen specielle krav';
}

function applyXP(currentLevel, currentXp, amount) {
  let level = currentLevel; let xp = currentXp + amount; const levelUps = [];
  while (xp >= xpNeededForLevel(level)) { xp -= xpNeededForLevel(level); level += 1; levelUps.push(level); }
  return { level, xp, levelUps };
}

// ── BUILD-FUNKTIONER TIL BROER ───────────────────────────────────────────────
function buildBridgeForLocation(refs, locationId) {
  // Fjern gammel bro hvis den findes
  const bridgeKeys = ['locationBridge'];
  bridgeKeys.forEach(key => {
    if (refs[key]) { refs.scene.remove(refs[key]); refs[key] = null; }
  });
  if (locationId === 'fishing_cabin') return; // Ingen bro ved hytten

  let bridgeMesh;
  if (locationId === 'desert_lake') {
    bridgeMesh = BRIDGE_MODELS[1]();
    bridgeMesh.position.set(0, -0.3, 0);
    bridgeMesh.scale.set(1.05, 1, 1.0);
  } else if (locationId === 'forbidden') {
    bridgeMesh = BRIDGE_MODELS[2]();
    bridgeMesh.position.set(0, 0.05, 0);
    bridgeMesh.rotation.y = Math.PI * 0.02;
  } else if (locationId === 'arctic_sea') {
    bridgeMesh = BRIDGE_MODELS[3]();
    bridgeMesh.position.set(0, 0.1, 0);
  } else if (locationId === 'cave') {
    bridgeMesh = BRIDGE_MODELS[4]();
    bridgeMesh.position.set(0, 0.1, 0);
    bridgeMesh.scale.set(0.95, 1, 0.95);
  } else if (locationId === 'jungle_island') {
    bridgeMesh = BRIDGE_MODELS[0](); // Træmole – passer til jungle
    bridgeMesh.position.set(0, 0.1, 0);
  } else {
    // pier + alle andre/fremtidige lokationer → Træmole
    bridgeMesh = BRIDGE_MODELS[0]();
    bridgeMesh.position.set(0, 0.1, 0);
  }
  addLocationObject(refs, bridgeMesh);
  refs.locationBridge = bridgeMesh;
}


// ── DETALJERET FISKESTANG MODEL ────────────────────────────────────────────
function buildFishingRod(theme) {
  const rodGroup = new THREE.Group();
  const seg = 24; // Glatte cylindere, men ikke overdrevent tungt

  const matRod   = createCompanionPBR(theme.rodColor, { roughness: 0.8, metalness: theme.metalness });
  const matGrip  = createCompanionPBR(theme.gripColor, { roughness: 0.9, flatShading: true, pbrEnabled: false });
  const matSeat  = createCompanionPBR(theme.seatColor, { roughness: 0.3, metalness: 0.8 });
  const matReel  = createCompanionPBR(theme.reelBase, { roughness: 0.6, metalness: 0.4 });
  const matSpool = createCompanionPBR(theme.spoolColor, { roughness: 0.5, metalness: 0.2 });

  // Greb (bageste)
  const gripBack = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 0.9, 12), matGrip);
  gripBack.rotation.z = Math.PI / 2; gripBack.position.set(1.0, 0, 0); gripBack.castShadow = true; rodGroup.add(gripBack);

  // Endeknop
  const buttCap = new THREE.Mesh(new THREE.SphereGeometry(0.14, 12, 8), matSeat);
  buttCap.position.set(1.45, 0, 0); rodGroup.add(buttCap);

  // Reel seat
  const reelSeat = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 0.7, seg), matSeat);
  reelSeat.rotation.z = Math.PI / 2; reelSeat.position.set(0.2, 0, 0); reelSeat.castShadow = true; rodGroup.add(reelSeat);

  // Greb (forreste)
  const gripFront = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 0.4, 12), matGrip);
  gripFront.rotation.z = Math.PI / 2; gripFront.position.set(-0.35, 0, 0); gripFront.castShadow = true; rodGroup.add(gripFront);

  // Klinge (aftaperende skaft)
  const shaftLength = 4.5;
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.08, shaftLength, seg), matRod);
  shaft.rotation.z = Math.PI / 2; shaft.position.set(-0.55 - (shaftLength / 2), 0, 0); shaft.castShadow = true; rodGroup.add(shaft);

  // Fiskehjul
  const reelGroup = new THREE.Group();
  reelGroup.position.set(0.2, -0.12, 0);
  const stem = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.2, 0.06), matReel);
  stem.position.set(0, -0.1, 0); reelGroup.add(stem);
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 0.25, seg), matReel);
  body.rotation.z = Math.PI / 2; body.position.set(0.05, -0.22, 0); reelGroup.add(body);
  const spoolBack = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.05, seg), matSeat);
  spoolBack.rotation.z = Math.PI / 2; spoolBack.position.set(-0.1, -0.22, 0); reelGroup.add(spoolBack);
  const spoolCenter = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.15, seg), matSpool);
  spoolCenter.rotation.z = Math.PI / 2; spoolCenter.position.set(-0.2, -0.22, 0); reelGroup.add(spoolCenter);
  const spoolFront = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.1, 0.08, seg), matSeat);
  spoolFront.rotation.z = Math.PI / 2; spoolFront.position.set(-0.31, -0.22, 0); reelGroup.add(spoolFront);
  const crankShaft = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.2, 8), matSeat);
  crankShaft.rotation.x = Math.PI / 2; crankShaft.position.set(0.05, -0.22, 0.2); reelGroup.add(crankShaft);
  const crankKnob = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.12, 12), matReel);
  crankKnob.rotation.x = Math.PI / 2; crankKnob.position.set(0.05, -0.22, 0.3); reelGroup.add(crankKnob);
  rodGroup.add(reelGroup);

  // ═══════════════════════════════════════════════════════════════
  // Øjer + line guides langs klingen (UÆNDRET logik)
  // ═══════════════════════════════════════════════════════════════
  const ringPositions = [-1.2, -2.5, -3.8, -4.9];
  ringPositions.forEach((xPos, i) => {
    const progress = Math.abs((xPos - (-0.55)) / shaftLength);
    const currentRadius = 0.08 - (progress * 0.06);
    const outerRing = new THREE.Mesh(new THREE.TorusGeometry(currentRadius + 0.01, 0.015, 8, seg), matSeat);
    outerRing.rotation.y = Math.PI / 2; outerRing.position.set(xPos, 0, 0); rodGroup.add(outerRing);
    const eyeRadius = 0.03 - (i * 0.005);
    const eyeY = -currentRadius - 0.05;
    const eye = new THREE.Mesh(new THREE.TorusGeometry(eyeRadius, 0.008, 8, 16), matSeat);
    eye.rotation.y = Math.PI / 2; eye.position.set(xPos, eyeY, 0); rodGroup.add(eye);
    const support = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, 0.05, 8), matSeat);
    support.position.set(xPos, -currentRadius - 0.025, 0); rodGroup.add(support);
  });

  // ═══════════════════════════════════════════════════════════════
  // 🔴 DEBUG: STATISK FISKESNØRE — knaldrød, tyk, OVEN PÅ skaftet
  // Problemet var: alle punkter lå ved Y≈0 = inde i skaftet!
  // Fix: Y = skaftets radius ved hvert punkt + tubeRadius + margin
  // ═══════════════════════════════════════════════════════════════
  const tubeRadius = 0.005;
  const margin = 0.048; // hævet så linen løber pænt gennem øjernes midte
  const shaftStart = -0.55;
  const shaftEnd = -5.05;

  // Beregn skaftets radius ved en given X-position
  function shaftRadiusAt(x) {
    if (x > shaftStart) return 0.11; // over reel-seat området
    const progress = Math.min(1, (shaftStart - x) / shaftLength);
    return 0.08 - progress * 0.06; // taper fra 0.08 → 0.02
  }

  const staticLinePoints = [
    // Spole-exit: under reelSeat
    new THREE.Vector3(0.2, -(0.12 + tubeRadius + margin), 0),
    // Overgang mod skaftet
    new THREE.Vector3(-0.2, -(shaftRadiusAt(-0.2) + tubeRadius + margin), 0),
  ];

  // Gennem hvert øje
  ringPositions.forEach(xPos => {
    const sr = shaftRadiusAt(xPos);
    staticLinePoints.push(new THREE.Vector3(xPos, -(sr + tubeRadius + margin), 0));
  });

  // Stangspidsen
  const tipSR = shaftRadiusAt(-5.05);
  staticLinePoints.push(new THREE.Vector3(-5.05, -(tipSR + tubeRadius + margin), 0));

  const tubeCurve = new THREE.CatmullRomCurve3(staticLinePoints, false, 'catmullrom', 0.3);
  const tubeGeo = new THREE.TubeGeometry(tubeCurve, 48, tubeRadius, 8, false);

  const tubeMat = new THREE.MeshPhongMaterial({
    color: 0xeeeeee,
    transparent: true,
    opacity: 0.72,
    specular: 0x666666,
    shininess: 90,
    depthWrite: false,
    side: THREE.DoubleSide,
  });
  const staticFishingLine = new THREE.Mesh(tubeGeo, tubeMat);
  staticFishingLine.userData.isStaticLine = true;
  staticFishingLine.name = 'staticFishingLine';
  staticFishingLine.frustumCulled = false;
  rodGroup.add(staticFishingLine);

  return rodGroup;
}

function buildBobber() {
  const group = new THREE.Group();

  // Materialer
  const stickMat = createCompanionPBR(0x1a1a1a, {
    roughness: 0.6, metalness: 0.15, flatShading: false
  });
  const redMat = createCompanionPBR(0xe02828, {
    roughness: 0.45, metalness: 0.05, flatShading: false
  });
  const whiteMat = createCompanionPBR(0xf8f8f8, {
    roughness: 0.7, metalness: 0.0, flatShading: false
  });

  // Skaler ned så proppen passer i spilscenen
  const S = 0.055;

  // Sorte pinde
  const stickGeo = new THREE.CylinderGeometry(0.11 * S, 0.11 * S, 4.0 * S, 14);

  const topStick = new THREE.Mesh(stickGeo, stickMat);
  topStick.position.y = 3.35 * S;
  topStick.castShadow = true;
  group.add(topStick);
  const lineAttachment = new THREE.Object3D();
  lineAttachment.position.set(0, 3.35 * S + 2.0 * S, 0);
  group.add(lineAttachment);
  group.userData.lineAttachment = lineAttachment;

  const bottomStick = new THREE.Mesh(stickGeo, stickMat);
  bottomStick.position.y = -6.25 * S;
  bottomStick.castShadow = true;
  group.add(bottomStick);

  // Rød top (LatheGeometry)
  const redPoints = [];
  for (let i = 0; i <= 14; i++) {
    const t = i / 14;
    redPoints.push(new THREE.Vector2(
      Math.sin((Math.PI / 2) * t) * 1.68 * S,
      Math.cos((Math.PI / 2) * t) * 1.45 * S - 0.1 * S
    ));
  }
  const redTop = new THREE.Mesh(new THREE.LatheGeometry(redPoints, 24), redMat);
  redTop.castShadow = true;
  redTop.receiveShadow = true;
  group.add(redTop);

  // Hvid bund (LatheGeometry)
  const whitePoints = [];
  for (let i = 0; i <= 26; i++) {
    const t = i / 26;
    const radius = (1.72 * Math.pow(1 - t, 0.67) + 0.14 * t) * S;
    const y = -4.25 * t * S;
    whitePoints.push(new THREE.Vector2(radius, y));
  }
  const whiteBottom = new THREE.Mesh(new THREE.LatheGeometry(whitePoints, 24), whiteMat);
  whiteBottom.castShadow = true;
  whiteBottom.receiveShadow = true;
  group.add(whiteBottom);

  // Let oprejst vinkel så snøren møder pindens spids
  group.rotation.z = -Math.PI / 5;

  group.castShadow = true;
  return group;
}

function buildSteampunkDeepSeaBobber() {
    const group = new THREE.Group();
    const seg = 32;

    const brassMat = new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.9, roughness: 0.3 });
    const glassMat = new THREE.MeshPhysicalMaterial({ color: 0x88ccff, transparent: true, opacity: 0.3, roughness: 0.05, transmission: 1.0, thickness: 0.5 });

    const core = new THREE.Mesh(new THREE.SphereGeometry(0.35, seg, seg), glowMat);
    core.userData.isBiolumCore = true;
    group.add(core);
    // Pulserende lys der lyser op i den mørke grotte
    const biolumLight = new THREE.PointLight(0x00ffaa, 2.0, 8);
    biolumLight.userData.isBiolumCore = true;
    core.add(biolumLight);

    const body = new THREE.Mesh(new THREE.SphereGeometry(0.6, seg, seg), glassMat);
    group.add(body);

    const ring1 = new THREE.Mesh(new THREE.TorusGeometry(0.62, 0.04, 16, seg), brassMat);
    ring1.rotation.x = Math.PI / 2;
    group.add(ring1);
    
    const ring2 = new THREE.Mesh(new THREE.TorusGeometry(0.62, 0.03, 16, seg), brassMat);
    ring2.rotation.x = Math.PI / 2;
    ring2.rotation.y = Math.PI / 2;
    group.add(ring2);

    const topGlass = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.25, 0.4, seg), glassMat);
    topGlass.position.y = 0.7;
    group.add(topGlass);

    const topCore = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.25, seg), glowMat);
    topCore.position.y = 0.7;
    topCore.userData.isBiolumCore = true;
    group.add(topCore);

    const tip = new THREE.Mesh(new THREE.ConeGeometry(0.18, 0.3, seg), brassMat);
    tip.position.y = 1.05;
    group.add(tip);

    const gearRing = new THREE.Mesh(new THREE.TorusGeometry(0.25, 0.05, 16, 16), brassMat);
    gearRing.position.y = -0.9;
    group.add(gearRing);
    
    const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.4, 8), brassMat);
    stem.position.y = -0.6;
    group.add(stem);

    group.scale.setScalar(0.32);

    const lineAttachment = new THREE.Object3D();
    lineAttachment.position.set(0, 1.05 + 0.15, 0);
    group.add(lineAttachment);
    group.userData.lineAttachment = lineAttachment;

    group.rotation.z = -Math.PI / 5;

    group.castShadow = true;
    return group;
}

function swapBobber(refs, useBiolum) {
  if (!refs || !refs.bobber || !refs.scene) return;
  const oldBobber = refs.bobber;
  const pos = oldBobber.position.clone();
  const vis = oldBobber.visible;
  refs.scene.remove(oldBobber);
  oldBobber.traverse(child => { if (child.geometry) child.geometry.dispose(); if (child.material) { if (Array.isArray(child.material)) child.material.forEach(m => m.dispose()); else child.material.dispose(); }});
  
  const newBobber = useBiolum ? buildSteampunkDeepSeaBobber() : buildBobber();
  newBobber.position.copy(pos);
  newBobber.visible = vis;
  refs.scene.add(newBobber);
  refs.bobber = newBobber;
}

function createLowPolyCloud() {
  const cloud = new THREE.Group();
  const geo = new THREE.DodecahedronGeometry(1, 0);
  const mat = createCompanionPBR(0xffffff, { flatShading: false, roughness: 0.1 });
  const count = 3 + Math.floor(Math.random() * 3);
  for (let i = 0; i < count; i++) { const m = new THREE.Mesh(geo, mat); m.position.set(Math.random() * 2 - 1, Math.random() * 0.5, Math.random() * 2 - 1); m.scale.setScalar(0.5 + Math.random() * 0.5); cloud.add(m); }
  return cloud;
}

function spawnBackgroundElement(type, refs) {
  const loc = (refs && refs.currentLocation) || 'pier';
  const bounds = BACKGROUND_Z_BOUNDS[loc] || BACKGROUND_Z_BOUNDS.pier;
  if (bounds.disabled) return null; // ← NY Z-SIKKERHED: grotten → ingen spawn
  const zRange = bounds.maxZ - bounds.minZ;
  if (type === 'cloud') {
    const c = createLowPolyCloud();
    c.position.set(
      Math.random() * 80 - 40,                        // X uændret
      4 + Math.random() * 10,                          // Y uændret
      bounds.minZ + Math.random() * zRange              // ← NY Z-SIKKERHED
    );
    return c;
  }
  return null;
}

function createCamoTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 512;
    canvas.height = 512;
    const ctx = canvas.getContext('2d');

    // Mørkegrøn base
    ctx.fillStyle = '#0a1f0a';
    ctx.fillRect(0, 0, 512, 512);

    // Tegn overlappende "skæl" i forskellige grønne camo-farver
    const colors = ['#143314', '#1f4c1f', '#296629', '#0d260d'];
    for (let i = 0; i < 800; i++) {
        ctx.beginPath();
        const x = Math.random() * 512;
        const y = Math.random() * 512;
        const radiusX = 8 + Math.random() * 15;
        const radiusY = 5 + Math.random() * 10;

        ctx.ellipse(x, y, radiusX, radiusY, Math.random() * Math.PI, 0, Math.PI * 2);
        ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
        ctx.fill();

        // Mørk kant for skæl-effekt
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = '#050f05';
        ctx.stroke();
    }

    const texture = new THREE.CanvasTexture(canvas);
    texture.wrapS = THREE.RepeatWrapping;
    texture.wrapT = THREE.RepeatWrapping;
    texture.repeat.set(2, 2);
    return texture;
}

// MODEL 3: ØNSKE-ÅNDEN (Den nye grønne med guldkrone)
// ==========================================
function createFlatBody(mat) {
    const geo = new THREE.CylinderGeometry(0.5, 0.5, 1.4, 24);
    geo.rotateZ(-Math.PI / 2);
    const body = new THREE.Mesh(geo, mat);
    body.scale.set(1, 0.25, 1);
    return body;
}
function createEyes(eyeColor, pupilColor) {
    const group = new THREE.Group();
    const eyeMat = new THREE.MeshBasicMaterial({ color: eyeColor });
    const pupilMat = new THREE.MeshBasicMaterial({ color: pupilColor });
    const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.1, 10, 8), eyeMat);
    eyeL.position.set(0.5, 0.12, 0.25);
    const pupilL = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 6), pupilMat);
    pupilL.position.set(0.55, 0.12, 0.28);
    const eyeR = new THREE.Mesh(new THREE.SphereGeometry(0.1, 10, 8), eyeMat);
    eyeR.position.set(0.5, 0.12, -0.25);
    const pupilR = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 6), pupilMat);
    pupilR.position.set(0.55, 0.12, -0.28);
    group.add(eyeL, pupilL, eyeR, pupilR);
    return group;
}
function createSpirit() {
    const group = new THREE.Group();

    // Camouflage-materialet
    const camoTex = createCamoTexture();
    const camoMat = new THREE.MeshPhysicalMaterial({
        color: 0x113311,
        map: camoTex,
        roughness: 0.7,
        metalness: 0.1,
        clearcoat: 0.3,
        side: THREE.DoubleSide
    });

    // Finnen
    const toxicMat = new THREE.MeshPhysicalMaterial({
        color: 0x0d260d, transparent: true, opacity: 0.9, side: THREE.DoubleSide
    });
    const body = createFlatBody(camoMat);
    const eyes = createEyes(0xffd700, 0x000000); // Gule øjne for at matche guld og grøn

    const edgeFin = new THREE.Mesh(new THREE.TorusGeometry(1.5, 0.05, 8, 20), toxicMat);
    edgeFin.rotation.x = Math.PI / 2;
    edgeFin.scale.set(1.2, 1.0, 1.0);

    // ==========================================
    // GULDKRONEN
    // ==========================================
    const crown = new THREE.Group();
    const goldMat = new THREE.MeshStandardMaterial({
        color: 0xffd700,
        metalness: 1.0,
        roughness: 0.15
    });
    const crownBase = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.1, 16), goldMat);
    crown.add(crownBase);
    const spikesCount = 8;
    for(let i = 0; i < spikesCount; i++) {
        const spike = new THREE.Mesh(new THREE.ConeGeometry(0.04, 0.25, 4), goldMat);
        const angle = (i / spikesCount) * Math.PI * 2;
        spike.position.set(Math.cos(angle) * 0.18, 0.12, Math.sin(angle) * 0.18);

        spike.rotation.x = Math.sin(angle) * 0.3;
        spike.rotation.z = -Math.cos(angle) * 0.3;
        crown.add(spike);
    }

    crown.position.set(0.7, 0.3, 0); // Placer over hovedet
    // Lyskilde til at få kronen til at skinne
    const light = new THREE.PointLight(0xffd700, 1.0, 5.0);
    light.position.set(0.7, 0.6, 0);

    group.add(body, edgeFin, eyes, crown, light);
    group.userData = { fin: edgeFin, crown: crown, offset: Math.PI };
    return group;
}

function createCatchModel(catchData, location = 'pier') {
  const group = new THREE.Group();
  if (catchData.itemType === 'junk') {
    const enriched = catchData.fishModelId ? getEnrichedEntry(catchData.fishModelId) : null;
    const visual = enriched?.visual || catchData.visual || null;
    const modelDef = enriched?.model || catchData.model || null;
    const junkColor = modelDef?.color ?? 0x4A3728;
    const junkScale = modelDef?.scale ?? 1.5;
    const junkMat = createCompanionPBR(junkColor, { roughness: 0.9, flatShading: true, pbrEnabled: false });

    if (visual === 'tire') {
      // Tyk torus = bildæk
      const tire = new THREE.Mesh(new THREE.TorusGeometry(0.7, 0.3, 12, 24), junkMat);
      tire.rotation.x = Math.PI / 2;
      group.add(tire);
      group.scale.setScalar(junkScale);
    } else if (visual === 'wheel') {
      // Rustent Cykelhjul – fixed spokes + rust color
      const rimMat = createCompanionPBR(0xb55c2e, { roughness: 0.9, metalness: 0.15, flatShading: true });
      const rim = new THREE.Mesh(new THREE.TorusGeometry(0.6, 0.08, 8, 24), rimMat);
      rim.rotation.x = Math.PI / 2;
      group.add(rim);
      const spokeMat = createCompanionPBR(0x9c4a22, { roughness: 0.85, metalness: 0.12, flatShading: true });
      for (let i = 0; i < 6; i++) {
        const spoke = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 1.1, 4), spokeMat);
        spoke.rotation.x = Math.PI / 2;
        spoke.rotation.z = (i / 6) * Math.PI;
        group.add(spoke);
      }
      group.scale.setScalar(junkScale);
    } else if (visual === 'glove') {
      // Flade kugler/cylindere som handske
      const palm = new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 6), junkMat);
      palm.scale.set(1.0, 1.2, 0.4);
      group.add(palm);
      for (let i = 0; i < 4; i++) {
        const finger = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.35, 6), junkMat);
        finger.position.set(-0.15 + i * 0.1, 0.45, 0);
        group.add(finger);
        const tip = new THREE.Mesh(new THREE.SphereGeometry(0.06, 6, 4), junkMat);
        tip.position.set(-0.15 + i * 0.1, 0.63, 0);
