function createParrotCompanion() {
  const g = new THREE.Group();
  const paCfg = GRAPHICS_CONFIG[currentGraphicsQuality || 'medium'] || GRAPHICS_CONFIG.medium;
  const paSegs = Math.max(8, paCfg.segments >> 1);
  const mat = (color, opts = {}) => createCompanionPBR(color, { roughness: 0.35, flatShading: false, ...opts });
  function addEye(group, x, y, z, scale) {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(scale, paSegs, paSegs), mat(0x111111, { roughness: 0.1, metalness: 0.3 }));
    eye.position.set(x, y, z);
    const pupil = new THREE.Mesh(new THREE.SphereGeometry(scale * 0.35, Math.max(6, paSegs >> 1), Math.max(6, paSegs >> 1)), new THREE.MeshBasicMaterial({ color: 0xffffff }));
    pupil.position.set(x > 0 ? scale * 0.4 : -scale * 0.4, scale * 0.2, scale * 0.8);
    eye.add(pupil);
    group.add(eye);
  }
  const palette = { body: 0xE11D48, wing: 0x059669, tail: 0x2563EB, beak: 0xFBBF24, pole: 0x5C4033 };
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.4, paSegs, paSegs), mat(palette.body, { useScales: true }));
  body.scale.set(0.8, 1.5, 0.8);
  const beak = new THREE.Mesh(new THREE.ConeGeometry(0.15, 0.4, paSegs), mat(palette.beak, { roughness: 0.3 }));
  beak.rotation.x = -Math.PI / 2.5;
  beak.position.set(0, 0.4, 0.35);
  const wingOffset = -0.15;
  const wingL = new THREE.Mesh(new THREE.SphereGeometry(0.3, paSegs, paSegs), mat(palette.wing, { useScales: true }));
  wingL.scale.set(0.2, 1, 0.6);
  wingL.position.set(-0.35, 0, 0);
  wingL.rotation.x = -0.2 + wingOffset;
  const wingR = wingL.clone();
  wingR.position.set(0.35, 0, 0);
  const tail = new THREE.Mesh(new THREE.ConeGeometry(0.15, 1, paSegs), mat(palette.tail, { useScales: true }));
  tail.position.set(0, -0.6, -0.3);
  tail.rotation.x = -0.5;

  // Pind: en vandret perch-stang fastgjort til molebrædder med en enkelt lodret støtte
  // Vandret pind — fuglens siddeflade
  const perch = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.1, paSegs), mat(palette.pole, { roughness: 0.7 }));
  perch.rotation.z = Math.PI / 2;
  perch.position.set(0, -0.55, 0);
  // Lodret støtte ned til molen
  const support = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.045, 1.8, paSegs), mat(palette.pole, { roughness: 0.7 }));
  support.position.set(0, -1.45, 0);

  g.add(body, beak, wingL, wingR, tail, perch, support);
  addEye(g, -0.15, 0.5, 0.22, 0.06);
  addEye(g, 0.15, 0.5, 0.22, 0.06);
  g.scale.setScalar(0.95);
  g.userData = { type: 'parrotCompanion', clickable: true, wingL, wingR };
  return g;
}

function animateFishToBucket(refs, catchData, location) {
  const { scene, bucketGroup } = refs; if (!bucketGroup) return;
  const key = catchData.fishModelId || catchData.itemType;
  const poolClone = key ? FishPool.cloneFromPool(key) : null;
  const fishModel = poolClone || createCatchModel(catchData, location);
  const preBucketScale = fishModel.scale.x;
  const uncappedBucket = preBucketScale * 0.4;
  const bucketScalar = catchDataNeedsBucketScaleCap(catchData)
    ? Math.min(uncappedBucket, MAX_BUCKET_SCALE)
    : uncappedBucket;
  fishModel.scale.setScalar(bucketScalar);
  fishModel.userData._catchData = catchData; // v9.0: store for quality rebuild
  fishModel.userData._location = location;   // v9.0: store for quality rebuild
  fishModel.position.set(0, 2, -2); scene.add(fishModel);
  const dest = bucketGroup.position.clone().add(new THREE.Vector3(0, 0.6, 0));
  let t = 0; const start = fishModel.position.clone(); const mid = new THREE.Vector3((start.x + dest.x) / 2, Math.max(start.y, dest.y) + 3.5, (start.z + dest.z) / 2);
  const id = setInterval(() => {
    t += 0.035;
    if (t >= 1) {
      clearInterval(id);
      let shakeT = 0; const shakeId = setInterval(() => { shakeT += 0.3; bucketGroup.rotation.z = Math.sin(shakeT) * 0.08 * (1 - shakeT / (Math.PI * 2)); if (shakeT > Math.PI * 2) { bucketGroup.rotation.z = 0; clearInterval(shakeId); } }, 16);
      // Tilfældig placering for et organisk look (fisken lander hulter til bulter)
      const angle = Math.random() * Math.PI * 2;
      const r = Math.random() * 0.2 + 0.1;
      fishModel.position.set(dest.x + Math.cos(angle) * r, dest.y - 0.1, dest.z + Math.sin(angle) * r);
      fishModel.rotation.set(Math.PI / 2 + (Math.random()-0.5)*0.5, Math.random() * Math.PI * 2, (Math.random()-0.5)*0.5);
      fishModel.userData.targetScale = bucketScalar;

      // === UNIVERSEL BUCKET-CLIPPING: gælder ALLE fangster (fisk, junk, kister, krystaller…) ===
      if (bucketGroup.userData.isBucket) {
        const MAX_RADIUS = bucketGroup.userData.innerRadius * 1.85;
        const BUCKET_H   = bucketGroup.userData.height || 0.9;
        const MAX_HEIGHT  = BUCKET_H * 0.85;

        const box = new THREE.Box3().setFromObject(fishModel);
        const size = new THREE.Vector3();
        box.getSize(size);
        const itemWidth  = Math.max(size.x, size.z);
        const itemHeight = size.y;

        // Beregn UNIFORM skalering på alle 3 akser
        let scaleFactor = 1.0;
        if (itemWidth > MAX_RADIUS) {
          scaleFactor = Math.min(scaleFactor, (MAX_RADIUS / itemWidth) * 0.85);
        }
        if (itemHeight > MAX_HEIGHT) {
          scaleFactor = Math.min(scaleFactor, (MAX_HEIGHT / itemHeight) * 0.85);
        }
        if (scaleFactor < 1.0) {
          fishModel.scale.multiplyScalar(scaleFactor);
        }

        // Ryk lidt ned i bunden så det ser ud som om det ligger i spanden
        fishModel.position.y -= 0.12;

        // Dæmp procedural animation (customUpdate) for items der svajer/roterer
        if (fishModel.userData.customUpdate) {
          const _origUpdate = fishModel.userData.customUpdate;
          const DAMPING = 0.35;
          fishModel.userData.customUpdate = (time) => {
            const prevRotY = fishModel.rotation.y;
            const prevPosY = fishModel.position.y;
            const prevRotZ = fishModel.rotation.z;
            _origUpdate(time);
            fishModel.rotation.y = prevRotY + (fishModel.rotation.y - prevRotY) * DAMPING;
            fishModel.rotation.z = prevRotZ + (fishModel.rotation.z - prevRotZ) * DAMPING;
            fishModel.position.y = prevPosY + (fishModel.position.y - prevPosY) * DAMPING;
            fishModel.children.forEach(child => {
              if (child.userData.baseRotZ !== undefined) {
                const base = child.userData.baseRotZ;
                child.rotation.z = base + (child.rotation.z - base) * DAMPING;
              }
            });
          };
        }
      }

      refs.bucketFishModels.push(fishModel);
      // Max 3 fisk i 3D-scenen — ældste synker animeret væk
      if (refs.bucketFishModels.length > 3) {
        const oldFish = refs.bucketFishModels.shift();
        let shrinkT = 1.0;
        const shrinkId = setInterval(() => {
          shrinkT -= 0.15;
          if (shrinkT <= 0) {
            clearInterval(shrinkId);
            scene.remove(oldFish);
          } else {
            const ts = oldFish.userData.targetScale ?? 0.15;
            oldFish.scale.setScalar(ts * shrinkT);
            oldFish.position.y -= 0.02;
          }
        }, 16);
      }
      return;
    }
    const u = 1 - t; fishModel.position.x = u * u * start.x + 2 * u * t * mid.x + t * t * dest.x; fishModel.position.y = u * u * start.y + 2 * u * t * mid.y + t * t * dest.y; fishModel.position.z = u * u * start.z + 2 * u * t * mid.z + t * t * dest.z; fishModel.rotation.y += 0.15;
  }, 16);
  return id;
}
function clearBucketFishModels(refs) {
  if (!refs.bucketFishModels) return; refs.bucketFishModels.forEach(m => refs.scene.remove(m)); refs.bucketFishModels = [];
}

// ── OPdateret rebuildBucketFishModels ──────────────────────────────────────
function rebuildBucketFishModels(refs) {
  if (!refs || !refs.bucketFishModels || !refs.scene || !refs.bucketGroup) return;
  const oldModels = [...refs.bucketFishModels];
  // Collect stored catch data from existing models
  const fishData = oldModels.map(m => ({
    catchData: m.userData._catchData,
    location: m.userData._location,
    position: m.position.clone(),
    rotation: m.rotation.clone(),
    targetScale: m.userData.targetScale || m.scale.x,
  })).filter(d => d.catchData); // only rebuild fish with stored data

  // Remove old models
  oldModels.forEach(m => refs.scene.remove(m));
  refs.bucketFishModels = [];

  // Rebuild each fish with current quality
  fishData.forEach(d => {
    try {
      const key = d.catchData.fishModelId || d.catchData.itemType;
      const newModel = (key && FishPool.cloneFromPool(key)) || createCatchModel(d.catchData, d.location || 'pier');
      let rebuildScale = d.targetScale;
      if (catchDataNeedsBucketScaleCap(d.catchData)) {
        rebuildScale = Math.min(rebuildScale, MAX_BUCKET_SCALE);
      }
      newModel.scale.setScalar(rebuildScale);
      newModel.position.copy(d.position);
      newModel.rotation.copy(d.rotation);
      newModel.userData._catchData = d.catchData;
      newModel.userData._location = d.location;
      newModel.userData.targetScale = rebuildScale;

      // === UNIVERSEL BUCKET-CLIPPING: gælder ALLE fangster (fisk, junk, kister, krystaller…) ===
      if (refs.bucketGroup && refs.bucketGroup.userData.isBucket) {
        const MAX_RADIUS = refs.bucketGroup.userData.innerRadius * 1.85;
        const BUCKET_H   = refs.bucketGroup.userData.height || 0.9;
        const MAX_HEIGHT  = BUCKET_H * 0.85;

        // Mål fuld bounding box EFTER scale er sat
        const box = new THREE.Box3().setFromObject(newModel);
        const size = new THREE.Vector3();
        box.getSize(size);
        const itemWidth  = Math.max(size.x, size.z);
        const itemHeight = size.y;

        // Beregn UNIFORM skalering på alle 3 akser
        let scaleFactor = 1.0;
        if (itemWidth > MAX_RADIUS) {
          scaleFactor = Math.min(scaleFactor, (MAX_RADIUS / itemWidth) * 0.85);
        }
        if (itemHeight > MAX_HEIGHT) {
          scaleFactor = Math.min(scaleFactor, (MAX_HEIGHT / itemHeight) * 0.85);
        }
        if (scaleFactor < 1.0) {
          newModel.scale.multiplyScalar(scaleFactor);
        }

        // Ryk lidt ned i bunden
        newModel.position.y -= 0.12;

        // Dæmp procedural animation (customUpdate) for items der svajer/roterer
        if (newModel.userData.customUpdate) {
          const _origUpdate = newModel.userData.customUpdate;
          const DAMPING = 0.35;
          newModel.userData.customUpdate = (time) => {
            const prevRotY = newModel.rotation.y;
            const prevPosY = newModel.position.y;
            const prevRotZ = newModel.rotation.z;
            _origUpdate(time);
            newModel.rotation.y = prevRotY + (newModel.rotation.y - prevRotY) * DAMPING;
            newModel.rotation.z = prevRotZ + (newModel.rotation.z - prevRotZ) * DAMPING;
            newModel.position.y = prevPosY + (newModel.position.y - prevPosY) * DAMPING;
            newModel.children.forEach(child => {
              if (child.userData.baseRotZ !== undefined) {
                const base = child.userData.baseRotZ;
                child.rotation.z = base + (child.rotation.z - base) * DAMPING;
              }
            });
          };
        }
      }

      refs.scene.add(newModel);
      refs.bucketFishModels.push(newModel);
    } catch (e) { /* skip failed rebuilds */ }
  });
}

/* v9.0: Live-update exposure on renderer + envMapIntensity on fish materials */
function updateEnvironmentMap(refs) {
  if (!refs) return;
  const exposure = window.pmremExposure ?? 0.65;
  // Primary effect: tone mapping exposure on the renderer (always visible)
  if (refs.renderer) {
    refs.renderer.toneMappingExposure = exposure;
  }
  // Secondary effect: update envMapIntensity on fish PhysicalMaterials
  if (refs.scene) {
    refs.scene.traverse(obj => {
      if (obj.isMesh && obj.material && obj.material.isMeshPhysicalMaterial && obj.material.envMap) {
        obj.material.envMapIntensity = exposure;
      }
    });
  }
}

function createRainSystem(count = 2000) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    pos[i * 3] = (Math.random() - 0.5) * 60; // x spread
    pos[i * 3 + 1] = Math.random() * 40;     // y spread
    pos[i * 3 + 2] = (Math.random() - 0.5) * 60; // z spread
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({
    color: 0xaaaaaa,
    size: 0.15,
    transparent: true,
    opacity: 0.6
  });
  const system = new THREE.Points(geo, mat);
  system.visible = false;
  return { mesh: system, positions: pos, count };
}

function initScene(container) {
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87CEEB);

  const w = container.clientWidth || window.innerWidth;

      const envMat = new THREE.MeshBasicMaterial({ map: envTex, side: THREE.BackSide });

    }
  } catch (e) { /* Environment map optional — degrade gracefully */ }


  const waterGeo = new THREE.PlaneGeometry(120, 120, 40, 40);
  const water = new THREE.Mesh(waterGeo, createCompanionPBR(0x0099cc, { flatShading: true, side: THREE.DoubleSide, roughness: 0.4 }));
  water.rotation.x = -Math.PI / 2; water.receiveShadow = true; scene.add(water);

  const rodTipPoint = new THREE.Object3D(); rodTipPoint.position.set(-5.05, 0, 0);
  rodMesh.add(rodTipPoint); rodGroup.add(rodMesh); scene.add(rodGroup);

  const bucketGroup = buildBucket(BUCKET_TIERS[0]); bucketGroup.position.set(1.1, 0.72, 8.8); scene.add(bucketGroup);

  const clouds = [];
  for (let i = 0; i < 8; i++) {
    const c = spawnBackgroundElement('cloud', { currentLocation: 'pier' }); // ← NY Z-SIKKERHED

  }

  const bobber = buildBobber(); bobber.position.set(0, -10, 0); scene.add(bobber);

    color: 0xccccdd,

  });
  const initCurve = new THREE.CatmullRomCurve3(

// ── Centraliseret synlighed for bobber + dynamisk snøre ──
// Synlig i: casting, waiting, biting, fighting (under regnestykket)
// Skjult først ved svar (caught, escaped, lost, idle, osv.)
function updateFishingVisuals(refs, gameState) {
  const { fishingLine, castLine, dynamicLine, bobber } = refs;
  const dynLine = fishingLine ?? castLine ?? dynamicLine;
  const show = gameState === 'casting' || gameState === 'waiting' || gameState === 'biting' || gameState === 'fighting';
  if (dynLine) dynLine.visible = show;
  if (bobber) bobber.visible = show;
}

function updateFishingLine(refs, time, gameState) {
  const { fishingLine, bobber, rodTipPoint } = refs;
  if (!fishingLine || !bobber) return;
  const tipWorld = new THREE.Vector3();
  if (rodTipPoint) rodTipPoint.getWorldPosition(tipWorld);
  const lineEnd = new THREE.Vector3();
  if (bobber.userData.lineAttachment) bobber.userData.lineAttachment.getWorldPosition(lineEnd);
  else lineEnd.set(bobber.position.x, bobber.position.y + 0.3, bobber.position.z);
  const N = 5;
  const casting = gameState === 'casting';
  const inWater = gameState === 'waiting' || gameState === 'biting' || gameState === 'fighting';
  const sag = casting ? 0.7 : 0.25;
  const pts = [];
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    let x = tipWorld.x + (lineEnd.x - tipWorld.x) * t;
    let y = tipWorld.y + (lineEnd.y - tipWorld.y) * t;
    let z = tipWorld.z + (lineEnd.z - tipWorld.z) * t;
    const droop = 4 * sag * t * (1 - t);
    y -= droop;
    if (inWater && i > 0 && i < N) y += Math.sin(time * 1.5 + i * 1.2) * 0.06;
    pts.push(new THREE.Vector3(x, y, z));
  }
  const oldGeo = fishingLine.geometry;
  const curve = new THREE.CatmullRomCurve3(pts, false, 'catmullrom', 0.3);
  fishingLine.geometry = new THREE.TubeGeometry(curve, 32, 0.005, 6, false);
  oldGeo.dispose();
}

function tickScene(refs, time, gameState) {
  const { waterGeo, clouds, bobber, fishingLine, particles, scene, rainSystem } = refs;

  // Hent nuværende vejr-data
  const wData = Object.values(WEATHER_TYPES).find(w => w.id === refs.weatherType) || WEATHER_TYPES.CLEAR;

  // Bølger – specialmasker til lokationer (tropisk ø + ørkensø)
  const pos = waterGeo.attributes.position;
  const onTropicalIsland = refs.currentLocation === 'tropical_island';
  const onDesertLake = refs.currentLocation === 'desert_lake';
  const onArcticSea = refs.currentLocation === 'arctic_sea';
  // PlaneGeometry roteret -PI/2 om X: vertex.X → world.X, vertex.Y → world.-Z
  // Øens centrum: world (X=0, Z=11.5) = vertex (X=0, Y=-11.5)
  // sandTop radius 10.8 × ellipse-scale 1.32 ≈ 14.3 på X – sæt mask til 15 for god margin
  const ISLAND_VX = 0, ISLAND_VY = -11.5, ISLAND_R = 15.0;
  // Ørkensø: ellipse der starter ved broens forkant og slutter ved stensætningen
  const DESERT_CENTER_X = 0;
  const DESERT_CENTER_Z = -7.0;
  // +10% sø-areal (skaleret på begge akser med sqrt(1.10) ≈ 1.049)
  const DESERT_RADIUS_X = 15.7;
  const DESERT_RADIUS_Z = 9.1;
  // Udfladning starter helt ude i kanten, så vandet kommer tæt på stenene
  const DESERT_EDGE_START = 0.96; // 96% af radius = fuld vandhøjde
  const DESERT_WATER_LEVEL = 0.11;
  const DESERT_RIPPLE_FACTOR = 0.12;
  const DESERT_DRY_DEPTH = -1.25;
  // Ingen synligt vand indenfor broens rammer (under selve broen)
  const BRIDGE_FRAME_MIN_X = -1.65;
  const BRIDGE_FRAME_MAX_X = 1.65;
  // Start lidt længere inde på broen, så der ikke opstår synlig "hak"-udskæring ved spidsen
  const BRIDGE_FRAME_MIN_Z = 0.05;
  const BRIDGE_FRAME_MAX_Z = 11.2;
  // Ishavet: hav foran broen + ingen vand under broens footprint
  const ARCTIC_SEA_FRONT_Z = -0.9;
  const ARCTIC_SEA_BLEND = 2.1;
  const ARCTIC_DRY_DEPTH = -1.2;
  const ARCTIC_BRIDGE_MIN_X = -2.05;
  const ARCTIC_BRIDGE_MAX_X = 2.05;
  const ARCTIC_BRIDGE_MIN_Z = -1.2;
  const ARCTIC_BRIDGE_MAX_Z = 11.4;
  for (let i = 0; i < pos.count; i++) {
    const amp = wData.waveAmp;
    const speed = wData.storm ? 2.5 : 1.0;
    const wave = amp * Math.sin(pos.getX(i) * 0.5 + time * speed) + (amp * 0.5) * Math.cos(pos.getY(i) * 0.3 + time * (speed * 1.5));
    if (onTropicalIsland) {
      const dx = pos.getX(i) - ISLAND_VX;
      const dy = pos.getY(i) - ISLAND_VY;
      // Elliptisk maske – kompenser for øens X-scale 1.32
      const dist = Math.sqrt((dx / 1.32) ** 2 + dy ** 2);
      // Blød overgang over 2 enheder ved kysten
      const mask = Math.min(1, Math.max(0, (dist - ISLAND_R) / 2.0));
      pos.setZ(i, wave * mask);
    } else if (onDesertLake) {
      const wx = pos.getX(i);
      const wz = -pos.getY(i); // vertex.Y -> world.-Z
      const nx = (wx - DESERT_CENTER_X) / DESERT_RADIUS_X;
      const nz = (wz - DESERT_CENTER_Z) / DESERT_RADIUS_Z;
      const normDist = Math.sqrt(nx * nx + nz * nz);
      // Blød strandkant kun i yderste rand: 0 ved/udenfor kant, 1 i indre sø
      const rawMask = Math.min(1, Math.max(0, (1 - normDist) / (1 - DESERT_EDGE_START)));
      const shoreMask = rawMask * rawMask * (3 - 2 * rawMask);
      const insideBridgeFrame = wx >= BRIDGE_FRAME_MIN_X && wx <= BRIDGE_FRAME_MAX_X && wz >= BRIDGE_FRAME_MIN_Z && wz <= BRIDGE_FRAME_MAX_Z;
      const finalMask = insideBridgeFrame ? 0 : shoreMask;

      const calmWave = wave * DESERT_RIPPLE_FACTOR * finalMask;
      const targetLakeHeight = DESERT_WATER_LEVEL + calmWave;
      // Interpolér fra tør bund til hævet søniveau, så kanten flader roligt ud mod stenfoden
      pos.setZ(i, (DESERT_DRY_DEPTH * (1 - finalMask)) + (targetLakeHeight * finalMask));
    } else if (onArcticSea) {
      const wx = pos.getX(i);
      const wz = -pos.getY(i); // vertex.Y -> world.-Z
      // Havet ligger foran broen (mod negativ Z), med blød overgang ved iskanten
      const seaFrontMask = Math.min(1, Math.max(0, (ARCTIC_SEA_FRONT_Z - wz) / ARCTIC_SEA_BLEND));
      // Ingen synligt vand under selve broen
      const insideBridge = wx >= ARCTIC_BRIDGE_MIN_X && wx <= ARCTIC_BRIDGE_MAX_X && wz >= ARCTIC_BRIDGE_MIN_Z && wz <= ARCTIC_BRIDGE_MAX_Z;
      const finalMask = insideBridge ? 0 : seaFrontMask;
      pos.setZ(i, (wave * finalMask) + (ARCTIC_DRY_DEPTH * (1 - finalMask)));
    } else {
      pos.setZ(i, wave);
    }
  }
  pos.needsUpdate = true; waterGeo.computeVertexNormals();

  // Clouds
  const _cloudBounds = BACKGROUND_Z_BOUNDS[refs.currentLocation] || BACKGROUND_Z_BOUNDS.pier; // ← NY Z-SIKKERHED
  clouds.forEach((c, idx) => {
    if (_cloudBounds.disabled) { c.visible = false; return; } // ← NY Z-SIKKERHED: skjul i grotte
    c.visible = true;
    c.position.x += (wData.storm ? 0.08 : 0.02) * (idx % 2 === 0 ? 1 : -1);
    if (c.position.x > 50) c.position.x = -50; if (c.position.x < -50) c.position.x = 50;
    // ← NY Z-SIKKERHED: clamp Z hvert frame
    if (c.position.z > _cloudBounds.maxZ) c.position.z = _cloudBounds.maxZ;
    if (c.position.z < _cloudBounds.minZ) c.position.z = _cloudBounds.minZ;
  });

  // Rain Animation
  if (wData.rain) {
    rainSystem.mesh.visible = true;
    const positions = rainSystem.positions;
    const fallSpeed = wData.storm ? 0.8 : 0.4;
    for(let i=0; i<rainSystem.count; i++) {
      positions[i*3+1] -= fallSpeed; // Y nedad
      if(positions[i*3+1] < -2) positions[i*3+1] = 30; // Reset top
      // X drift ved storm
      if(wData.storm) {
        positions[i*3] += 0.1;
        if(positions[i*3] > 30) positions[i*3] = -30;
      }
    }
    rainSystem.mesh.geometry.attributes.position.needsUpdate = true;
  } else {
    rainSystem.mesh.visible = false;
  }

  // Prop-bevægelse: naturlig gyngen – KUN i 'waiting' (ikke under kast eller bid)
  if (gameState === 'waiting') {
    const wAmp = Math.max(0.2, wData.waveAmp ?? 0.2);
    const wSpeed = wData.storm ? 2.2 : 1.0;
    bobber.position.y = Math.sin(time * 1.8 * wSpeed) * 0.13 * wAmp * 5
                      + Math.sin(time * 3.1 * wSpeed + 1.3) * 0.055 * wAmp * 5;
    const baseRotZ = -Math.PI / 5;
    bobber.rotation.z = baseRotZ
      + Math.cos(time * 1.4 * wSpeed) * 0.09 * wAmp * 4
      + Math.cos(time * 2.6 * wSpeed + 0.8) * 0.035 * wAmp * 4;
    bobber.rotation.x = Math.sin(time * 1.1 * wSpeed + 0.5) * 0.04 * wAmp * 4;
  }
  if (bobber) {
    bobber.traverse(child => {
      if (child.userData?.isBiolumCore && child.material) {
        const pulse = Math.sin(time * 2.5) * 0.5 + Math.sin(time * 5.0) * 0.25;
        child.material.emissiveIntensity = 1.8 + pulse;
        child.material.emissive = child.material.emissive || new THREE.Color(0x00ffaa);
        const sc = 1.0 + Math.sin(time * 3.0) * 0.08;
        child.scale.setScalar(sc);
      }
    });
  }
  updateFishingLine(refs, time, gameState);
  updateFishingVisuals(refs, gameState);

  // Partikler
  for (let i = particles.length - 1; i >= 0; i--) { const p = particles[i]; p.life -= p.decay; p.mesh.position.add(p.velocity); p.velocity.y -= 0.02; p.mesh.scale.setScalar(p.life * (p.mesh.geometry.type === 'BoxGeometry' ? 0.2 : 0.5)); p.mesh.rotation.x += 0.1; p.mesh.rotation.y += 0.1; if (p.life <= 0 || p.mesh.position.y < -2) { scene.remove(p.mesh); particles.splice(i, 1); } }

  // Day/Night & Weather Lighting Mix
  if (refs.sunLight && refs.dayNightStart) {
    const elapsed = (Date.now() - refs.dayNightStart) * (refs.adminTimeScale || 1);
    const cycleProgress = (elapsed % DAY_NIGHT_CYCLE.duration) / DAY_NIGHT_CYCLE.duration;
    const phases = DAY_NIGHT_CYCLE.phases;
    let phaseIdx = phases.length - 1;
    for (let i = 0; i < phases.length - 1; i++) { if (cycleProgress >= phases[i].time && cycleProgress < phases[i + 1].time) { phaseIdx = i; break; } }
    const nextIdx = (phaseIdx + 1) % phases.length;
    const cur = phases[phaseIdx]; const nxt = phases[nextIdx];
    const segStart = cur.time; const segEnd = nextIdx === 0 ? 1.0 : nxt.time;
    const lerpT = Math.max(0, Math.min(1, (cycleProgress - segStart) / (segEnd - segStart)));

    // Base Colors
    const baseLight = new THREE.Color().lerpColors(new THREE.Color(cur.lightColor), new THREE.Color(nxt.lightColor), lerpT);
    const baseBg = new THREE.Color().lerpColors(new THREE.Color(cur.bgColor), new THREE.Color(nxt.bgColor), lerpT);
    const baseFog = new THREE.Color().lerpColors(new THREE.Color(cur.fogColor), new THREE.Color(nxt.fogColor), lerpT);

    // Apply Weather Modifier (darken)
    const mod = wData.lightMod;
    refs.sunLight.color.copy(baseLight).multiplyScalar(mod);
    refs.sunLight.intensity = THREE.MathUtils.lerp(cur.intensity, nxt.intensity, lerpT) * mod;

    // Storm special: grålig himmel
    const finalBg = baseBg.clone().multiplyScalar(mod);
    const finalFog = baseFog.clone().multiplyScalar(mod);

    if (refs.currentLocation === 'pier') { // Kun ændre bg/fog hvis vi ikke er et specielt sted
         // Ved storm: force gråblå tone
        if(wData.storm) {
           finalBg.lerp(new THREE.Color(0x1a202c), 0.8);
           finalFog.lerp(new THREE.Color(0x1a202c), 0.8);
        }
        refs.scene.background.copy(finalBg);
        refs.scene.fog.color.copy(finalFog);
    }

    // Fog Density
    refs.scene.fog.near = wData.fogDens > 0.04 ? 5 : 20;
    refs.scene.fog.far = wData.fogDens > 0.04 ? 25 : 60;

    if (refs.ambLight) {
        refs.ambLight.intensity = (THREE.MathUtils.lerp(0.6, cur.intensity < 0.5 ? 0.3 : 0.7, lerpT)) * Math.max(0.4, mod); // Aldrig helt sort
    }

    // Clouds dark in storm
    clouds.forEach(cloud => {
        cloud.children.forEach(m => {
            if (m.isMesh) {
                const cCol = new THREE.Color().lerpColors(new THREE.Color(cur.lightColor), new THREE.Color(0xffffff), 0.7);
                if (wData.storm || wData.rain) cCol.multiplyScalar(0.4);
                m.material.color.lerp(cCol, 0.05);
            }
        });
    });

    if (refs.lastPhaseIdx !== phaseIdx) { if (refs.lastPhaseIdx !== -1 && refs.onPhaseChange) refs.onPhaseChange(phaseIdx); refs.lastPhaseIdx = phaseIdx; }
  }

  // ── PANDELAMPE: Altid nulstil intensitet (uanset lokation) ──────
  if (refs.headlampLight) refs.headlampLight.intensity = (refs.currentLocation === 'cave' && refs.headlampOn) ? 3.0 : 0;

  // ── GROTTE: Tilsidesæt al dag/nat belysning ──────────────────
  if (refs.currentLocation === 'cave') {
    if (refs.sunLight) refs.sunLight.intensity = 0;
    if (refs.ambLight) refs.ambLight.intensity = 0.04;
    refs.scene.background.setHex(0x010101);
    refs.scene.fog.color.setHex(0x020202);
    refs.scene.fog.near = refs.headlampOn ? 6 : 12;
    refs.scene.fog.far  = refs.headlampOn ? 28 : 35;
    // Sluk måger i grotten
    if (refs.seagulls) refs.seagulls.forEach(sg => scene.remove(sg.mesh));
    if (refs.seagulls) refs.seagulls.length = 0;
  }
  const maxSeagulls = wData.storm ? 0 : 4;
  const _birdBounds = BACKGROUND_Z_BOUNDS[refs.currentLocation] || BACKGROUND_Z_BOUNDS.pier; // ← NY Z-SIKKERHED
  if (refs.seagulls !== undefined && seagullQueue.length > 0 && refs.seagulls.length < maxSeagulls && !_birdBounds.disabled) { // ← NY Z-SIKKERHED: skip cave
    seagullQueue.shift();
    if (refs.seagullPatternMirrored === undefined) {
      refs.seagullPatternMirrored = false;
      refs.seagullPatternCycleCount = 0;
      refs.seagullPatternFlipAfter = 2 + Math.floor(Math.random() * 2); // 2-3 cyklusser
    }
    const addSeagull = (x, y, z, dir, lifeScale = 1, formation = 'pair') => {
      const sg = buildSeagull(getSeagullPalette(refs.currentLocation, formation));
      sg.position.set(x, y, z);
      scene.add(sg);
      refs.seagulls.push({
        mesh: sg,
        dir,
        vx: (0.12 + Math.random() * 0.06) * dir,
        startY: sg.position.y,
        phase: Math.random() * Math.PI * 2,
        life: 0,
        maxLife: Math.floor((280 + Math.random() * 80) * lifeScale)
      });
    };

    const singleDir = refs.seagullPatternMirrored ? -1 : 1; // retning for den ene måge
    const pairDir = -singleDir; // modsat retning for paret
    const isCabin = refs.currentLocation === 'fishing_cabin';
    const spawnX = (dir) => isCabin ? -22 - Math.random() * 2 : -dir * (27 + Math.random() * 4);
    const baseY = isCabin ? 5 + Math.random() * 3 : 3.2 + Math.random() * 5;
    // ← NY Z-SIKKERHED: spawnZ bruger nu BACKGROUND_Z_BOUNDS i stedet for hardcodede værdier
    const _birdZRange = _birdBounds.maxZ - _birdBounds.minZ;
    const spawnZ = () => _birdBounds.minZ + Math.random() * _birdZRange;
    addSeagull(spawnX(singleDir), baseY, spawnZ(), isCabin ? 1 : singleDir, 1, 'single');
    if (refs.seagulls.length <= maxSeagulls - 2) {
      addSeagull(spawnX(pairDir), baseY - (0.6 + Math.random() * 0.6), spawnZ(), isCabin ? 1 : pairDir, 0.9, 'pair'); // ← NY Z-SIKKERHED
      addSeagull(spawnX(pairDir), baseY - (1.1 + Math.random() * 0.7), spawnZ(), isCabin ? 1 : pairDir, 1.05, 'pair'); // ← NY Z-SIKKERHED
    }

    refs.seagullPatternCycleCount++;
    if (refs.seagullPatternCycleCount >= refs.seagullPatternFlipAfter) {
      refs.seagullPatternMirrored = !refs.seagullPatternMirrored;
      refs.seagullPatternCycleCount = 0;
      refs.seagullPatternFlipAfter = 2 + Math.floor(Math.random() * 2); // næste skift om 2-3 cyklusser
    }
  }
  if (refs.seagulls) {
    let seagullFrustum = null;

  // Nuttede fisk i spanden — wiggle og svøm
  animateCuteFishQueue(refs.bucketFishModels, time);
    // 3 hajfinner patruljerer rundt om Tropisk Ø
  if (refs.sharkFins && refs.sharkFins.length > 0) {
    const t = Date.now() * 0.001;   // tid til bølge-gyng

    refs.sharkFins.forEach(fin => {
      // Opdater vinkel med individuel hastighed
      fin.userData.angle += fin.userData.patrolSpeed;

      const cx = 0;      // ø-centrum X
      const cz = 11.5;   // ø-centrum Z
      const r = fin.userData.radius;

      // Ny position i cirkel
      fin.position.x = cx + Math.cos(fin.userData.angle) * r;
      fin.position.z = cz + Math.sin(fin.userData.angle) * r;

      // Peg i svømmeretningen (modsat haj får anden rotation)
      fin.rotation.y = fin.userData.patrolSpeed > 0
        ? -fin.userData.angle + Math.PI
        : -fin.userData.angle;

      // Lille bølge-gyng + rotation (forskudt per haj)
      fin.position.y = 0.9 + Math.sin(t * 2.2 + fin.userData.angle) * 0.06;
      fin.rotation.z = Math.sin(t * 1.8 + fin.userData.angle * 1.5) * 0.1;
    });
  }
  // Papegøje companion — kun vinge-flap (ingen op/ned gynge)
  if (refs.parrotMesh && refs.parrotMesh.parent) {
    const ud = refs.parrotMesh.userData;
    if (ud.wingL) ud.wingL.rotation.z = Math.sin(Date.now() / 220) * 0.12;
    if (ud.wingR) ud.wingR.rotation.z = -Math.sin(Date.now() / 220) * 0.12;
  }
} // ── slut på tickScene ──────────────────────────────────────────

function applyLocation(refs, locationId, hasTurtle = false, questItems = [], cheeseSources = [], featherSources = [], playerLevel = 1) {
  refs.currentLocation = locationId;

  // ── FIX: Detect om lokationen faktisk ændrede sig ──────────────
  // Når kun cheeseSources/featherSources ændrede sig (collectible samlet),
  // springer vi den tunge scene-rebuild over. Dette forhindrer at broen
  // rives ned og genopbygges → ingen visuel glitch.
  const locationActuallyChanged = refs._lastBuiltLocation !== locationId;

  if (locationActuallyChanged) {
    // Hold mågefarver konsistente pr. lokation uden per-frame recolor
    if (refs.seagulls && refs.scene) {
      refs.seagulls.forEach(sg => refs.scene.remove(sg.mesh));
      refs.seagulls.length = 0;
    }
    // ← NY Z-SIKKERHED: Re-scatter skyernes Z til den nye lokations grænser
    if (refs.clouds) {
      const _locBounds = BACKGROUND_Z_BOUNDS[locationId] || BACKGROUND_Z_BOUNDS.pier;
      refs.clouds.forEach(c => {
        if (_locBounds.disabled) { c.visible = false; return; }
        c.visible = true;
        const zRange = _locBounds.maxZ - _locBounds.minZ;
        c.position.z = _locBounds.minZ + Math.random() * zRange;
      });
    }
    const area = getLocation(locationId);
    refs.scene.background.setHex(area.bgColor);
    refs.scene.fog.color.setHex(area.fogColor);
    if (refs.water) {
      refs.water.position.set(0, 0, 0);
      refs.water.scale.set(1, 1, 1);
      refs.water.material.color.setHex(area.waterColor);
      refs.water.material.specular = new THREE.Color(0x111111);
      refs.water.material.needsUpdate = true;
    }

    // ── Kaptajn Rotteskæg cleanup FØR lokations-build (forhindrer ghost-mesh) ──
    if (refs.pirateMesh) {
      refs.scene.remove(refs.pirateMesh);
      refs.pirateMesh.traverse(child => {
        if (child.geometry) child.geometry.dispose();
        if (child.material) child.material.dispose();
      });
      refs.pirateMesh = null;
    }
    if (refs.pirateRock) {
      refs.scene.remove(refs.pirateRock);
      refs.pirateRock.traverse(child => {
        if (child.geometry) child.geometry.dispose();
        if (child.material) child.material.dispose();
      });
      refs.pirateRock = null;
    }

    // ── Havfrue + sten cleanup FØR lokations-build ──
    if (refs.mermaidMesh) {
      refs.scene.remove(refs.mermaidMesh);
      refs.mermaidMesh.traverse(child => {
        if (child.geometry) child.geometry.dispose();
        if (child.material) child.material.dispose();
      });
      refs.mermaidMesh = null;
    }
    if (refs.mermaidStoneMesh) {
      refs.scene.remove(refs.mermaidStoneMesh);
      refs.mermaidStoneMesh.traverse(child => {
        if (child.geometry) child.geometry.dispose();
        if (child.material) child.material.dispose();
      });
      refs.mermaidStoneMesh = null;
    }
    // ── Plesiosaurus NPC cleanup FØR lokations-build ──
    if (refs.plesioNPCMesh) {
      refs.scene.remove(refs.plesioNPCMesh);
      refs.plesioNPCMesh.traverse(child => {
        if (child.geometry) child.geometry.dispose();
        if (child.material) child.material.dispose();
      });
      refs.plesioNPCMesh = null;
    }

    if (locationId === 'desert_lake') buildDesertLake(refs);
    else if (locationId === 'arctic_sea') buildArcticSea(refs);
    else if (locationId === 'fishing_cabin') buildFishingCabin(refs, hasTurtle, questItems, refs._movableObjectsRef || { current: [] });
    else if (locationId === 'tropical_island') buildTropicalIsland(refs);
    else if (locationId === 'cave') buildCave(refs);
    else if (locationId === 'jungle_island') buildJungleIsland(refs);
    else buildPierScene(refs);

    // ── Cave-specifik PMREM Exposure ───────────────────────────────
    window.pmremExposure = locationId === 'cave' ? 0.95 : 0.65;

    // ── Bro: placér korrekt bro for denne lokation ─────────────────
    buildBridgeForLocation(refs, locationId);

    // Juster kamera og tåge pr. lokation (data-drevet)
    refs.scene.fog.near = area.fogNear ?? 20;
    refs.scene.fog.far = area.fogFar ?? 60;
    if (area.bgOverride) refs.scene.background.setHex(area.bgOverride);
    if (area.fogOverride) refs.scene.fog.color.setHex(area.fogOverride);

    refs._lastBuiltLocation = locationId;
  }

  // ── Resten kører ALTID (collectibles, pirat, kiste, fjer) ──────

  if (locationActuallyChanged && locationId === 'forbidden') {
    // Klippe (~1500 polygoner via DodecahedronGeometry subdiv-3 + vertex noise)
    const rockGeo = new THREE.DodecahedronGeometry(2.5, 3);
    const rpos = rockGeo.attributes.position;
    const seed = 42;
    for (let i = 0; i < rpos.count; i++) {
      // Deterministisk pseudo-noise baseret på position
      const px = rpos.getX(i), py = rpos.getY(i), pz = rpos.getZ(i);
      const n = Math.sin(px * 3.1 + seed) * Math.cos(py * 2.7) * Math.sin(pz * 4.3 + seed * 0.5);
      const noise = 1 + n * 0.18;
      rpos.setXYZ(i, px * noise, py * noise, pz * noise);
    }
    rockGeo.computeVertexNormals();
    const rockMat = createCompanionPBR(0x4a4a5a, { roughness: 0.95, flatShading: true, pbrEnabled: false });
    const rock = new THREE.Mesh(rockGeo, rockMat);
    rock.scale.set(1.1, 0.65, 1.0);
    rock.position.set(5.2, -0.15, 3.5);
    // Mosgrønne highlight-patches (2 ekstra meshes i lidt lysere sten-farve)
    const mossMat = createCompanionPBR(0x3d5c3a, { roughness: 1.0, flatShading: true, pbrEnabled: false });
    const mossGeo = new THREE.DodecahedronGeometry(2.52, 2);
    const mossPos = mossGeo.attributes.position;
    // Skjul de fleste faces ved at trække dem ind — kun øverste del rager frem
    for (let i = 0; i < mossPos.count; i++) {
      const py = mossPos.getY(i);
      const scale = py > 0.5 ? (1 + (Math.sin(i * 1.7) * 0.04)) : 0.3;
      mossPos.setXYZ(i, mossPos.getX(i) * scale, mossPos.getY(i) * scale, mossPos.getZ(i) * scale);
    }
    mossGeo.computeVertexNormals();
    const moss = new THREE.Mesh(mossGeo, mossMat);
    moss.scale.copy(rock.scale);
    moss.position.set(5.2, -0.15, 3.5);
    const rockGroup = new THREE.Group();
    rockGroup.add(rock, moss);
    addLocationObject(refs, rockGroup);
    refs.pirateRock = rockGroup;

    // Piraten oven på klippen — til højre for fiskestangen (stang: x=2.5, z=8.5)
    // Klippe-top er ca. y = 0.65 * 2.5 * 0.9 ≈ 1.46 over center (y=-0.15) → pirat-fod ved ~1.31
    const pm = buildPirateMesh();
    pm.position.set(5.2, 1.35, 3.5);   // Længere ind i scenen (lavere z), til højre
    pm.rotation.y = -Math.PI * 0.15;    // Drej mod spilleren – modsat tidligere forsøg
    addLocationObject(refs, pm);
    refs.pirateMesh = pm;
  }

  // ── HAVFRUEN ved Dybet (abyss) — sten før lv17, havfrue fra lv17 ──
  // Kun ved lokationsskift — spawner IKKE live mens man er der
  if (locationActuallyChanged && locationId === 'abyss') {
    if (playerLevel >= 17) {
      const mermaidResult = createMermaidNPC();
      const mm = mermaidResult.model;
      mm.position.set(-11.43, -0.30, -5.76);
      mm.rotation.y = Math.PI * 0.3;
      addLocationObject(refs, mm);
      refs.mermaidMesh = mm;
    } else {
      const stoneMesh = createMermaidStone();
      stoneMesh.position.set(-11.43, -0.30, -5.76);
      addLocationObject(refs, stoneMesh);
      refs.mermaidStoneMesh = stoneMesh;
    }
  }

  // ── PLESIOSAURUS NPC ved Den Gamle Mole (efter besejring i Dybet) ──
  if (locationActuallyChanged && locationId === 'pier' && questItems.includes('plesio_defeated')) {
    const plesioNPC = new THREE.Group();
    const dinoMat = new THREE.MeshStandardMaterial({ color: 0x2e8b57, roughness: 0.5, metalness: 0.1 });
    // Body
    const pBody = new THREE.Mesh(new THREE.SphereGeometry(2, 32, 16), dinoMat);
    pBody.scale.set(1.5, 0.8, 1); pBody.position.set(0, 1.2, 0);
    plesioNPC.add(pBody);
    // Neck
    const pNeck = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.8, 4, 16), dinoMat);
    pNeck.position.set(3.5, 3, 0); pNeck.rotation.z = -Math.PI / 4;
    plesioNPC.add(pNeck);
    // Head
    const pHead = new THREE.Mesh(new THREE.SphereGeometry(0.8, 16, 16), dinoMat);
    pHead.position.set(5.2, 4.5, 0); pHead.scale.set(1.2, 0.8, 0.8);
    plesioNPC.add(pHead);
    // Eyes
    const pScleraMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 });
    const pPupilMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.2 });
    const pScleraGeo = new THREE.SphereGeometry(0.22, 16, 16);
    const pPupilGeo = new THREE.SphereGeometry(0.12, 16, 16);
    const pLEyeG = new THREE.Group(); pLEyeG.position.set(5.5, 4.7, 0.55);
    pLEyeG.add(new THREE.Mesh(pScleraGeo, pScleraMat));
    const pLP = new THREE.Mesh(pPupilGeo, pPupilMat); pLP.position.set(0.12, 0, 0.12); pLEyeG.add(pLP);
    plesioNPC.add(pLEyeG);
    const pREyeG = new THREE.Group(); pREyeG.position.set(5.5, 4.7, -0.55);
    pREyeG.add(new THREE.Mesh(pScleraGeo, pScleraMat));
    const pRP = new THREE.Mesh(pPupilGeo, pPupilMat); pRP.position.set(0.12, 0, -0.12); pREyeG.add(pRP);
    plesioNPC.add(pREyeG);
    // Tail
    const pTail = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.8, 5, 16), dinoMat);
    pTail.position.set(-3.5, 1, 0); pTail.rotation.z = Math.PI / 2.2;
    plesioNPC.add(pTail);
    // Saddle
    const pSaddleMat = new THREE.MeshStandardMaterial({ color: 0x5c4033, roughness: 0.9 });
    const pSaddle = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.2, 1.8), pSaddleMat);
    pSaddle.position.set(0, 2.0, 0); plesioNPC.add(pSaddle);
    const pBlanket = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.1, 2.2), new THREE.MeshStandardMaterial({ color: 0xb22222 }));
    pBlanket.position.set(0, 1.9, 0); plesioNPC.add(pBlanket);
    // Flippers
    const pFlipperGeo = new THREE.SphereGeometry(1, 16, 16);
    const _npcFlipperPivots = [];
    function _npcFlipper(x, y, z, rotY) {
      const bp = new THREE.Group(); bp.position.set(x, y, z); bp.rotation.y = rotY;
      const fp = new THREE.Group(); bp.add(fp);
      const fl = new THREE.Mesh(pFlipperGeo, dinoMat);
      fl.scale.set(1.5, 0.15, 0.8); fl.position.set(1.5, 0, 0);
      fp.add(fl); plesioNPC.add(bp);
      _npcFlipperPivots.push(fp);
    }
    _npcFlipper(1.5, 0.2, 1.2, -Math.PI / 2);
    _npcFlipper(1.5, 0.2, -1.2, Math.PI / 2);
    _npcFlipper(-1.5, 0.2, 1.0, -Math.PI / 2);
    _npcFlipper(-1.5, 0.2, -1.0, Math.PI / 2);

    plesioNPC.scale.setScalar(0.44);
    plesioNPC.position.set(-6.0, 0.15, 1.2);
    // Orienter med hovedet mod spilleren (broen/kamera-retning)
    plesioNPC.rotation.y = -Math.PI * 0.2;
    plesioNPC.userData.isPlesioNPC = true;
    plesioNPC.userData.originalScale = 0.44;
    plesioNPC.userData.hoverScale = 0.49;
    plesioNPC.userData.isHovered = false;
    plesioNPC.userData.timeOffset = Math.random() * 10;
    plesioNPC.userData._flipperPivots = _npcFlipperPivots;
    addLocationObject(refs, plesioNPC);
    refs.plesioNPCMesh = plesioNPC;
  }

  if (!refs.collectibles) refs.collectibles = {};
  // v2.0: Gamle flyvende collectibles fjernet — oste/fjer fås nu narrativt

  // ── PIRATKISTE på Forbudte Sø ──
  if (locationId === 'forbidden' && !refs.pirateChestMesh && !cheeseSources.includes('pirate_chest')) {
    const pirateChest = buildPirateChestMesh();
    pirateChest.position.set(5.529, 1.642, 4.401);
    pirateChest.rotation.y = Math.PI * 0.8;   // Låget vender mod spilleren
    pirateChest.scale.set(1.4, 1.4, 1.4);
    pirateChest.userData.isPirateChest = true;
    addLocationObject(refs, pirateChest);
    refs.pirateChestMesh = pirateChest;
  }

  // ── MÅGE-FJER på broen ved Den Gamle Mole ──
  if (locationId === 'pier' && !refs.seagullFeatherMesh && !featherSources.includes('seagull')) {
    const sgFeather = buildSeagullFeatherMesh();
    sgFeather.position.set(0.4, 0.55, 0.5);
    sgFeather.scale.set(1.6, 1.6, 1.6);
    sgFeather.userData.isSeagullFeather = true;
    addLocationObject(refs, sgFeather);
    refs.seagullFeatherMesh = sgFeather;
  }

  // ── PAPEGØJE-COMPANION på molen (alle 3 fjer samlet) ──
  if (featherSources.length >= 3 && !refs.parrotMesh) {
    const parrot = createParrotCompanion();
    parrot.position.set(-4.2, 1.2, 5.5);
    parrot.userData._baseY = 1.2;
    parrot.rotation.y = Math.PI * 0.15;
    parrot.visible = (locationId === 'pier');
    refs.scene.add(parrot);
    refs.parrotMesh = parrot;
  }
  if (refs.parrotMesh) {
    refs.parrotMesh.visible = (locationId === 'pier');
  }
}

function spawnParticles(refs, type, origin, count) {
  let geo, baseMat, velocityScale, decayRate, gravity;
  switch (type) {
    case 'water': geo = new THREE.TetrahedronGeometry(0.15); baseMat = new THREE.MeshBasicMaterial({ color: 0x87CEEB }); velocityScale = { x: 0.3, y: 0.5, z: 0.3 }; decayRate = 0.025; gravity = 0.02; break;
    case 'confetti': geo = new THREE.BoxGeometry(0.1, 0.1, 0.1); baseMat = new THREE.MeshBasicMaterial({ color: 0xffffff }); velocityScale = { x: 0.3, y: 0.5, z: 0.3 }; decayRate = 0.012; gravity = 0.02; break;
    case 'levelup': geo = new THREE.TetrahedronGeometry(0.2); baseMat = new THREE.MeshBasicMaterial({ color: 0xFFD700 }); velocityScale = { x: 0.5, y: 0.8, z: 0.5 }; decayRate = 0.008; gravity = 0.015; break;
    case 'xp': geo = new THREE.TetrahedronGeometry(0.08); baseMat = new THREE.MeshBasicMaterial({ color: 0x4ade80 }); velocityScale = { x: 0.15, y: 0.35, z: 0.15 }; decayRate = 0.035; gravity = 0.025; break;
    default: geo = new THREE.TetrahedronGeometry(0.15); baseMat = new THREE.MeshBasicMaterial({ color: 0xffffff }); velocityScale = { x: 0.3, y: 0.5, z: 0.3 }; decayRate = 0.02; gravity = 0.02;
  }
  for (let i = 0; i < count; i++) {
    const mat = baseMat.clone();
    if (type === 'confetti') mat.color.setHex(Math.random() * 0xffffff);
    else if (type === 'levelup') mat.color.setHex([0xFFD700, 0xFFA500, 0xFFFFFF, 0xFFF176][Math.floor(Math.random() * 4)]);
    const mesh = new THREE.Mesh(geo, mat); mesh.position.copy(origin); mesh.position.x += (Math.random() - 0.5) * 0.5; mesh.position.z += (Math.random() - 0.5) * 0.5;
    const vel = new THREE.Vector3((Math.random() - 0.5) * velocityScale.x, Math.random() * velocityScale.y + 0.1, (Math.random() - 0.5) * velocityScale.z);
    refs.scene.add(mesh); refs.particles.push({ mesh, velocity: vel, life: 1.0, decay: decayRate + Math.random() * 0.01, gravity });
  }
}

function ShopScreen({ coins, upgrades, level, questItems, cheeseSources, featherSources, onBuy, onClose, initialTab }) {

// Hjælpefunktion: auto-skaler og centrer 3D-model i fremviseren
function fitModelToViewer(model, desiredSize = 2.2) {
  const box = new THREE.Box3().setFromObject(model);
  const size = new THREE.Vector3();
  box.getSize(size);
  const maxDim = Math.max(size.x, size.y, size.z);
  if (maxDim === 0) return model;
  const scale = desiredSize / maxDim;
  model.scale.set(scale, scale, scale);
  box.setFromObject(model);
  const center = new THREE.Vector3();
  box.getCenter(center);
  model.position.x = -center.x;
  model.position.y = -center.y;
  model.position.z = -center.z;
  return model;
}

// ── FREE-ROAM OVERLAY v2.0 ── (on-screen coords, crosshair, copy toast)
function FreeRoamOverlay({ adminRef }) {
  const coordsRef = useRef(null);
  const toastRef = useRef(null);
  const toastTimer = useRef(null);

  // Update coordinates via direct DOM mutation (no React re-renders per frame)
  useEffect(() => {
    let raf;
    const tick = () => {
      const p = adminRef.current.camPos;
      if (coordsRef.current && p) {
        const x = typeof p.x === 'number' ? p.x : 0;
        const y = typeof p.y === 'number' ? p.y : 0;
        const z = typeof p.z === 'number' ? p.z : 0;
        coordsRef.current.textContent = `X: ${x.toFixed(2)}  |  Y: ${y.toFixed(2)}  |  Z: ${z.toFixed(2)}`;
      }
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [adminRef]);

  // Copy hotkey ('C') — works even under pointer lock
  useEffect(() => {
    const handler = (e) => {
      if (e.key.toLowerCase() !== 'c') return;
      const p = adminRef.current.camPos;
      if (!p) return;
      const x = typeof p.x === 'number' ? p.x : 0;
      const y = typeof p.y === 'number' ? p.y : 0;
      const z = typeof p.z === 'number' ? p.z : 0;
      const text = `x: ${x.toFixed(2)}, y: ${y.toFixed(2)}, z: ${z.toFixed(2)}`;
      navigator.clipboard.writeText(text).then(() => {
        // Show toast via direct DOM manipulation
        if (toastRef.current) {
          toastRef.current.textContent = `✓ Copied: ${text}`;
          toastRef.current.style.display = 'block';
          toastRef.current.style.animation = 'none';
          // Force reflow to restart animation
          void toastRef.current.offsetWidth;
          toastRef.current.style.animation = 'toastPop 1.4s ease-out forwards';
          clearTimeout(toastTimer.current);
          toastTimer.current = setTimeout(() => {
            if (toastRef.current) toastRef.current.style.display = 'none';
          }, 1500);
        }
      }).catch(() => {});
    };
    window.addEventListener('keydown', handler);
    return () => { window.removeEventListener('keydown', handler); clearTimeout(toastTimer.current); };
  }, [adminRef]);

  return (
    <>
      <div className="freeroam-overlay">
        <div className="freeroam-coords" ref={coordsRef}>X: 0.00  |  Y: 5.00  |  Z: 12.00</div>
        <div className="freeroam-hint">WASD move · Mouse look · Space/Ctrl up/down · Shift sprint · C copy · ESC exit</div>
      </div>
      <div className="freeroam-crosshair" />
      <div ref={toastRef} className="freeroam-toast" style={{ display: 'none' }} />
    </>
  );
}

                  <option value="">— Auto —</option>
                  {phases.map((p, i) => <option key={i} value={i}>{p.icon} {p.name}</option>)}

              </Row>
            </div>

            <div style={S.section}>

                </select>
              </Row>
            </div>

            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0.4rem', marginTop: '0.5rem' }}>
              <button onClick={() => { play('purchase'); setCoins(prev => prev + 9999000); }}
                style={S.btn('linear-gradient(135deg, #16a34a, #4ade80)', '#14532d')}>
                💰 +9.999.000 kr

              <button onClick={() => {
                play('levelup');
                setProgression(prev => {
                  const needed = xpNeededForLevel(prev.level);

                });
              }} style={S.btn('linear-gradient(135deg, #7c3aed, #a78bfa)', '#4c1d95')}>
                ⭐ Level +1
              </button>
            </div>
          </>}

          {/* ═══ FANGSTLOG ═══ */}
          {tab === 'fangstlog' && <>
            <div style={S.section}>
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '0.75rem' }}>

                  {isLogging ? '🟢 Logging AKTIV' : '⭕ Inaktiv'}
                </span>
                <span style={{ color: '#64748b', fontSize: '0.7rem' }}>{logEntries.length} / 1000</span>
              </div>
              <div style={{ display: 'flex', gap: '0.5rem', flexWrap: 'wrap', marginBottom: '0.75rem' }}>

                <button onClick={() => { if (confirm('Nulstil hele fangstloggen?')) { play('ui'); setLogEntries([]); } }}

                  🗑 Reset
                </button>
                <button onClick={() => {
                  const txt = logEntries.map(e => `[${e.timestamp}] [${e.type.toUpperCase()}] ${e.message}${e.details ? ' | ' + JSON.stringify(e.details) : ''}`).join('\n');
                  navigator.clipboard.writeText(txt || '(Tom log)').then(() => { play('ui'); });
                }} style={S.btn('rgba(56,189,248,0.2)', '#0c4a6e')}>

                : logEntries.map(e => (
                  <div key={e.id} style={{ fontFamily: 'monospace', fontSize: '0.65rem', color: e.type === 'catch' ? '#4ade80' : e.type === 'levelup' ? '#facc15' : e.type === 'location' ? '#38bdf8' : e.type === 'purchase' ? '#c084fc' : '#94a3b8', padding: '3px 6px', borderBottom: '1px solid rgba(255,255,255,0.04)', lineHeight: 1.5, wordBreak: 'break-all' }}>

            </div>
          </>}
        </div>
        <div style={{ marginTop: '0.75rem', paddingTop: '0.75rem', borderTop: '1px solid rgba(239,68,68,0.15)' }}>

  // === UNIFIED COLLECTIBLES v1.0 — deliverCollectible ===
  function deliverCollectible(type, amount) {
    const cfg = COLLECTIBLES[type];
    if (!cfg) return;
    const invKey = cfg.invKey;
    const currentInv = collectibleInventory[invKey] ?? 0;
    if (currentInv < amount) return;
    play('win');
    setCollectibleInventory(prev => ({ ...prev, [invKey]: prev[invKey] - amount }));
    const oldDelivered = collectibleDelivered[type] ?? 0;
    const newDelivered = oldDelivered + amount;
    setCollectibleDelivered(prev => ({ ...prev, [type]: newDelivered }));
    setShowCollectibleModal(null);
    setTimeout(() => {
      const milestones = Object.keys(cfg.milestoneRewards).map(Number).sort((a, b) => a - b);
      let rewarded = false;
      for (const m of milestones) {
        if (oldDelivered < m && newDelivered >= m) {
          const r = cfg.milestoneRewards[m];
          if (r.type === 'bait') {
            // Mystisk Madding: milestone 10 — auto-aktiv
            if (!questItems.includes('bait')) { setQuestItems(prev => [...prev, 'bait']); setActiveBait('bait'); }
            play('legendary');
            setDayNightToast(r.toast);
          } else if (r.type === 'koedklump') {
            // === Klistret Kødklump: auto-aktiv (som Mystisk Madding) ===
            if (!_soeUhyreDefeatedFlag && !_koedklumpActiveFlag) {
              setKoedklumpActive(true);
              play('legendary');
              setDayNightToast(r.toast);
            }
          } else if (r.type === 'hvalbof') {
            // === Kæmpe Hvalbøf: auto-aktiv (same pattern som Kødklump) ===
            if (!_krakenDefeatedFlag && !_hvalbofActiveFlag) {
              setHvalbofActive(true);
              play('legendary');
              setDayNightToast(r.toast);
            }
          } else if (r.type === 'cheese') {
            if (!cheeseSources.includes('penguin')) addCollectibleSource('cheese', 'penguin');
            const newCheeseCount = cheeseSources.includes('penguin') ? cheeseSources.length : cheeseSources.length + 1;
            if (newCheeseCount >= 3) {
              setDayNightToast('🐀 Pingvinen gylpede en ost op! Du har nu alle 3 oste — rotten er låst op! 🎉');
            } else {
              setDayNightToast(`🐀 Pingvinen gylpede en ost op! Du har nu ${newCheeseCount}/3 oste. Fortsæt med at aflevere muslinger!`);
            }
          } else if (r.type === 'xp_coins') {
            setCoins(prev => prev + r.coins);
            setProgression(prev => { const result = applyXP(prev.level, prev.xp, r.xp); if (result.levelUps.length > 0) Promise.resolve().then(() => setPendingLevelUps(q => [...q, ...result.levelUps])); return { level: result.level, xp: result.xp }; });
            setDayNightToast(r.toast);
          }
          spawnParticles(sceneRefsRef.current, 'confetti', new THREE.Vector3(0, 4, 8), r.particles ?? 25);
          rewarded = true;
        }
      }
      if (!rewarded) {
        spawnParticles(sceneRefsRef.current, 'confetti', new THREE.Vector3(0, 4, 8), 15);
        setToastMessage(`${cfg.icon} ${amount > 1 ? amount + ' ' : ''}${amount > 1 ? cfg.namePlural.toLowerCase() : cfg.name.toLowerCase()} afleveret til ${cfg.npcName}!`);
      }
    }, 300);
    if (type === 'conch' && sceneRefsRef.current && sceneRefsRef.current.penguinMesh) {
      const pMesh = sceneRefsRef.current.penguinMesh;
      const startY = pMesh.position.y;
      const hopStart = performance.now();
      const animHop = (now) => { const t = Math.min(1, (now - hopStart) / 500); pMesh.position.y = startY + Math.sin(t * Math.PI) * 0.5; if (t < 1) requestAnimationFrame(animHop); else pMesh.position.y = startY; };
      requestAnimationFrame(animHop);
      const pos = pMesh.position.clone(); pos.y += 1;
      spawnParticles(sceneRefsRef.current, 'levelup', pos, 30);
    }
    // === FULL FOSSIL/PIRAT SYMMETRI FIX v8.3 FINAL — pirat hop-animation ved fossil-aflevering ===
    if (type === 'fossil' && sceneRefsRef.current && sceneRefsRef.current.pirateMesh) {
      const pMesh = sceneRefsRef.current.pirateMesh;
      const startY = pMesh.position.y;
      const hopStart = performance.now();
      const animHop = (now) => { const t = Math.min(1, (now - hopStart) / 500); pMesh.position.y = startY + Math.sin(t * Math.PI) * 0.5; if (t < 1) requestAnimationFrame(animHop); else pMesh.position.y = startY; };
      requestAnimationFrame(animHop);
      const pos = pMesh.position.clone(); pos.y += 1;
      spawnParticles(sceneRefsRef.current, 'levelup', pos, 30);
    }
    // === HAVFRUE hop-animation ved perle-aflevering ===
    if (type === 'pearl' && sceneRefsRef.current && sceneRefsRef.current.mermaidMesh) {
      const pMesh = sceneRefsRef.current.mermaidMesh;
      const startY = pMesh.position.y;
      const hopStart = performance.now();
      const animHop = (now) => { const t = Math.min(1, (now - hopStart) / 500); pMesh.position.y = startY + Math.sin(t * Math.PI) * 0.5; if (t < 1) requestAnimationFrame(animHop); else pMesh.position.y = startY; };
      requestAnimationFrame(animHop);
      const pos = pMesh.position.clone(); pos.y += 1;
      spawnParticles(sceneRefsRef.current, 'levelup', pos, 30);
    }
  }

  // PHASE 6: sellAllFish med progressiv streak Rigdom-bonus (v2: threshold >= 10, baseTotalValue guard)
  function sellAllFish() {
    const sellable = inventory.filter(f => f.itemType !== 'plesiosaur');
    const keepable = inventory.filter(f => f.itemType === 'plesiosaur');
    const baseTotal = sellable.reduce((s, f) => s + (Number(f.value) || 0), 0);
    // STREAK BONUS: Beregn med baseTotalValue → ingen bonus på junk-spand
    const currentStreakBonus = calculateStreakBonus(currentStreak, zenMode, baseTotal);
    const total = baseTotal + currentStreakBonus;

    if (sellable.length === 0) {
      if (keepable.length > 0) setToastMessage('Intet at sælge!');
      return;
    }

    // Ryd altid spanden af sælgbare items
    setInventory(keepable);
    if (sceneRefsRef.current) clearBucketFishModels(sceneRefsRef.current);

    if (total > 0) {
      play('coin');
      setCoins(prev => prev + total);
      setStats(prev => {
        const newTotalSold = (prev.totalSold ?? 0) + sellable.length;
        const newStats = { ...prev, totalEarned: prev.totalEarned + total, totalSold: newTotalSold };
        if (newTotalSold >= 1000) {
          setAchievements(ach => ach.map(a => a.id === 'full_bucket' && !a.unlocked ? { ...a, unlocked: true } : a));
          setTimeout(() => setToastMessage('🏆 ACHIEVEMENT UNLOCKED: Spand af Guld!'), 500);
        }
        return newStats;
      });
      if (sceneRefsRef.current) spawnParticles(sceneRefsRef.current, 'confetti', new THREE.Vector3(0, 5, 8), 40);
      if (currentStreakBonus > 0) {
        setToastMessage(`🔥 Perfekt Streak! Solgt for ${total} kr (+${currentStreakBonus} Rigdom)`);
      }
    } else {
      setToastMessage(`Ryddede ${sellable.length} ting fra spanden.`);
    }

    // Streak nulstilles efter salg
    setCurrentStreak(0);
    setStreakMilestoneToast(null);
  }

  function buyUpgrade(itemId) {
    const item = SHOP_ITEMS.find(i => i.id === itemId); if (!item) return;
    // v2.0: Gammel stærk ost → oste-kilde
    if (itemId === 'cheese_bought') {
      if (cheeseSources.includes('shop')) { play('error'); setToastMessage('🧀 Du har allerede købt osten!'); return; }
      if (coins < item.cost) { play('error'); setToastMessage('Ikke nok penge!'); return; }
      setCoins(prev => prev - item.cost);
      addCollectibleSource('cheese', 'shop');
      setUnlockedCompanions(prev => prev.includes('cheese_pet') ? prev : [...prev, 'cheese_pet']);
      setToastMessage('🧀 Du købte en gammel stærk ost! Rotter elsker den!');
      return;
    }
    // v2.0: Tropisk Papegøjefjer → fjer-kilde fra butik
    if (itemId === 'feather_bought') {
      if (featherSources.includes('shop')) { play('error'); setToastMessage('🪶 Du har allerede købt fjeren!'); return; }
      if (featherSources.length >= 3) { play('error'); setToastMessage('🪶 Du har allerede alle tre fjer!'); return; }
      if (progression.level < item.requiredLevel) { play('error'); setToastMessage(`Kræver level ${item.requiredLevel}!`); return; }
      if (coins < item.cost) { play('error'); setToastMessage('Ikke nok penge!'); return; }
      play('purchase');
      setCoins(prev => prev - item.cost);
      addCollectibleSource('feather', 'shop');
      addLogEntry('purchase', `Købt: ${item.name} for ${item.cost} kr.`, { itemId, cost: item.cost });
      if (sceneRefsRef.current) spawnParticles(sceneRefsRef.current, 'confetti', new THREE.Vector3(0, 4, 8), 30);
      return;
    } if (progression.level < item.requiredLevel) { play('error'); setToastMessage(`Kræver level ${item.requiredLevel}!`); return; } if (item.requiresUpgrade && !upgrades.includes(item.requiresUpgrade)) { play('error'); const prev = SHOP_ITEMS.find(i => i.id === item.requiresUpgrade); setToastMessage(`Kræver ${prev ? prev.name : 'forrige opgradering'} først!`); return; } if (item.requiresQuestItem && !questItems.includes(item.requiresQuestItem)) { play('error'); setToastMessage('Du mangler venstre halvdel af kortet!'); return; } if (!item.consumable && upgrades.includes(itemId)) return; if (item.cost > 0 && coins < item.cost) return;
    // ── MADDING-BESKYTTELSE: Bloker køb af madding hvis en tidsbaseret madding allerede er aktiv ──
    if (item.consumable && item.category === 'bait') {
      const now = Date.now();
      const hasActiveTimed = now < conchBaitExpiry || now < fossilBaitExpiry || now < flyBaitExpiry || now < hajBloodExpiry || now < perleLimExpiry;
      if (hasActiveTimed) {
        play('error');
        setToastMessage('🚫 Du har allerede aktiv madding! Fjern den i Kisten → Madding-fanen først.');
        return;
      }
    }
    play('purchase'); setCoins(prev => prev - item.cost);
    // === FANGSTLOG: Log køb ===
    addLogEntry('purchase', `Købt: ${item.name} for ${item.cost} kr.`, { itemId, cost: item.cost, consumable: !!item.consumable });

    // NYT: Håndter forbrugsvarer
    function clearAllTimedBaits() {
      setConchBaitExpiry(0);
      setFossilBaitExpiry(0);
      setFlyBaitExpiry(0);
      setHajBloodExpiry(0);
      setPerleLimExpiry(0);
    }
    if (item.consumable) {
      if (itemId === 'bait_conch') {
        clearAllTimedBaits();
        const mins = Math.round((item.duration || 600) / 60);
        setConchBaitExpiry(Date.now() + (item.duration || 600) * 1000);
        setToastMessage(`🍬 Sød madding aktiveret i ${mins} minutter!`);
      } else if (itemId === 'bait_fossil') {
        clearAllTimedBaits();
        const mins = Math.round((item.duration || 600) / 60);
        setFossilBaitExpiry(Date.now() + (item.duration || 600) * 1000);
        setToastMessage(`🪨 Fossil-slam aktiveret i ${mins} minutter!`);
      } else if (itemId === 'bait_fly') {
        clearAllTimedBaits();
        const mins = Math.round((item.duration || 600) / 60);
        setFlyBaitExpiry(Date.now() + (item.duration || 600) * 1000);
        setToastMessage(`🪰 Farverig Flue aktiveret i ${mins} min – frøer bider lettere!`);
      } else if (itemId === 'haj_blod') {
        clearAllTimedBaits();
        setHajBloodExpiry(Date.now() + item.duration * 1000);
        setToastMessage('🩸 Hajblod aktiveret! Hajer er på vej...');
        play('win');
      } else if (itemId === 'perle_lim') {
        clearAllTimedBaits();
        setPerleLimExpiry(Date.now() + item.duration * 1000);
        setToastMessage('🦪 Perlelim aktiveret! Østers svømmer mod krogen!');
        play('win');
      } else {
        clearAllTimedBaits();
        setActiveBait(item.id);
        setBaitExpiry(0);
        setToastMessage(`🌈 ${item.name} aktiveret! Næste fangst er legendarisk!`);
      }
      if (sceneRefsRef.current) spawnParticles(sceneRefsRef.current, 'confetti', new THREE.Vector3(0, 4, 8), 30);
      return; // Afslut her — consumables tilføjes ikke til upgrades-arrayet
    }
    const newUpgrades = [...upgrades, itemId];
    setUpgrades(newUpgrades);

                                ? (comp.unlockValue === 'cheeses' ? `Ost: ${cheeseCount}/3` : `Fjer: ${featherCount}/3`)

                              return (
                                <div key={comp.id} style={{
                                  display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '0.35rem',

                          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '0.5rem' }}>

                            Erfaring: {[upgrades.includes('luxury_boat') && '⛵15'].filter(Boolean).join(' + ') || '—'}
                          </div>
                        </div>
                      );
                    })()}

                    {/* ── Skatte ── */}

                      const hasAnything = skatteItems.length > 0 || _cRows.length > 0 || hasMapLeft || hasMapRight || questItems.includes('cabin_key') || cf > 0 || ff > 0 || questItems.includes('turtle_hatched') || wildTurtleSpawned;

                              <div style={{ flex: 1 }}><span style={{ color: cfg.color, fontWeight: 700, fontSize: '0.8rem' }}>{inv}</span><span style={{ color: '#94a3b8', fontSize: '0.7rem' }}> i taske · {del} aflev.</span></div>

                          {ff > 0 && <div style={{ display: 'flex', alignItems: 'center', gap: '0.45rem', padding: '0.55rem 0.7rem', borderRadius: '0.75rem', background: 'rgba(10,15,25,0.85)', border: '1px solid rgba(148,163,184,0.4)' }}><span>🪶</span><span style={{ color: '#94a3b8', fontWeight: 700 }}>{ff}/3</span></div>}

                              <span style={{ fontSize: '1.2rem' }}>🗺</span>

                          {questItems.includes('turtle_hatched') && <div style={{ display: 'flex', alignItems: 'center', gap: '0.7rem', padding: '0.65rem', borderRadius: '0.875rem', background: 'rgba(10,40,20,0.85)', border: '1px solid rgba(34,197,94,0.4)' }}><span style={{ fontSize: '1.2rem' }} className="turtle-emoji">🐢</span><span style={{ color: '#86efac', fontWeight: 700, fontSize: '0.85rem' }}>Skildpadden i Fiskehytten</span></div>}
                          {wildTurtleSpawned && <div style={{ display: 'flex', alignItems: 'center', gap: '0.7rem', padding: '0.65rem', borderRadius: '0.875rem', background: 'rgba(20,35,10,0.85)', border: '1px solid rgba(74,222,128,0.4)' }}><span style={{ fontSize: '1.2rem' }} className="turtle-emoji">🐢</span><span style={{ color: '#4ade80', fontWeight: 700, fontSize: '0.85rem' }}>Fri skildpadde på Tropisk Ø</span></div>}
                          {skatteItems.length > 0 && (

                              </div>
                            </div>

                        </div>

                    })()}
                  </div>

              })()}

              {bagTab === 'maal' && (() => {
                const categories = ['alle', 'fangst', 'økonomi', 'progression', 'udfordring', 'samling'];
                const filteredGoals = GOALS.filter(g => 
                  mobileGoalCategory === 'alle' || g.category === mobileGoalCategory
                );
                const doneCount = GOALS.filter(g => completedGoals.includes(g.id)).length;

                const getProgress = (goal) => {
                  const s = stats;
                  switch (goal.id) {
                    case 'catch_10': return { cur: Math.min(s.totalCatches || 0, 10), max: 10 };
                    case 'catch_50': return { cur: Math.min(s.totalCatches || 0, 50), max: 50 };
                    case 'earn_500': return { cur: Math.min(s.totalEarned || 0, 500), max: 500 };
                    case 'earn_5000': return { cur: Math.min(s.totalEarned || 0, 5000), max: 5000 };
                    case 'boss_slayer': return { cur: Math.min(s.bossWins || 0, 5), max: 5 };
                    case 'no_junk': return { cur: Math.min(s.bestJunkStreak || 0, 10), max: 10 };
                    case 'reach_5': return { cur: Math.min(s.maxLevel || 1, 5), max: 5 };
                    case 'reach_10': return { cur: Math.min(s.maxLevel || 1, 10), max: 10 };
                    case 'reach_20': return { cur: Math.min(s.maxLevel || 1, 20), max: 20 };
                    case 'fossil_30': return { cur: Math.min(s.fossilCount ?? 0, 30), max: 30 };
                    case 'globetrotter': { const locCount = Object.keys(LOCATIONS).length; return { cur: Math.min((s.areasVisited || []).length, locCount), max: locCount }; }
                    case 'scavenger': return { cur: Math.min(s.collectiblesFound ?? 0, 6), max: 6 };
                    case 'conch_king': return { cur: Math.min(s.conchCount ?? 0, 10), max: 10 };
                    case 'combo_master': return { cur: Math.min(s.maxCombo ?? 0, 5), max: 5 };
                    case 'wish_master': return { cur: Math.min(s.wishesUsed ?? 0, 3), max: 3 };
                    case 'companion_master': return { cur: Math.min(s.companionsUnlocked ?? 0, 5), max: 5 };

                    case 'first_catch': case 'catch_rain': case 'catch_storm': case 'first_rare':
                    case 'first_legendary': case 'first_treasure': case 'kraken': case 'speed_catch':
                    case 'fossil_1': case 'turtle_dad': case 'cave_axolotl': case 'cave_crystal':
                    case 'cave_gorm': case 'cave_complete': case 'ouch_jellyfish': case 'golden_catch':
                      return { cur: completedGoals.includes(goal.id) ? 1 : 0, max: 1 };

                    default: return { cur: 0, max: 1 };
                  }
                };

                  <div style={{ display: 'flex', flexDirection: 'column', gap: '1rem' }}>

                      <div style={{ textAlign: 'right' }}>
                        <div style={{ color: '#94a3b8', fontSize: '0.85rem' }}>
                          <span style={{ color: 'white', fontWeight: 'bold' }}>{doneCount}</span>/{GOALS.length}
                        </div>
                        <div style={{ height: '6px', width: '90px', background: '#1e293b', borderRadius: '3px', overflow: 'hidden', marginTop: '4px' }}>
                          <div style={{ height: '100%', width: `${(doneCount / GOALS.length) * 100}%`, background: 'linear-gradient(to right, #f59e0b, #fbbf24)' }} />
                        </div>
                      </div>
                    </div>

                    <div style={{ display: 'flex', gap: '0.35rem', overflowX: 'auto', paddingBottom: '0.3rem' }} className="scrollbar-hide">

                            padding: '0.45rem 0.9rem',
                            borderRadius: '9999px',
                            fontSize: '0.78rem',
                            fontWeight: 700,
                            whiteSpace: 'nowrap',
                            background: mobileGoalCategory === cat ? '#eab308' : 'rgba(30,41,59,0.7)',
                            color: mobileGoalCategory === cat ? '#111827' : '#94a3b8',
                            border: mobileGoalCategory === cat ? 'none' : '1px solid rgba(255,255,255,0.1)'

                        const isSecret = goal.secret && !isDone;
                        const progress = isDone ? null : getProgress(goal);
                        const pct = progress ? (progress.cur / progress.max) * 100 : 0;

                        return (
                          <div key={goal.id} style={{
                            padding: '0.9rem',
                            borderRadius: '1rem',
                            background: isDone ? 'rgba(234,179,8,0.12)' : 'rgba(30,41,59,0.6)',
                            border: `1px solid ${isDone ? '#f59e0b' : 'rgba(51,65,85,0.6)'}`,

                            gap: '0.9rem',
                            alignItems: 'flex-start'

                            <div style={{
                              fontSize: '1.65rem',

                              height: '48px',
                              display: 'flex',
                              alignItems: 'center',
                              justifyContent: 'center',
                              background: isDone ? 'rgba(234,179,8,0.2)' : isSecret ? '#1e293b' : 'rgba(51,65,85,0.5)',
                              borderRadius: '12px',
                              flexShrink: 0
                            }}>
                              {isSecret ? '❓' : goal.icon}
                            </div>
                            <div style={{ flex: 1 }}>
                              <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', marginBottom: '0.2rem' }}>
                                <span style={{ fontWeight: 700, fontSize: '0.92rem', color: isDone ? '#fde68a' : 'white' }}>
                                  {isSecret ? 'Hemmeligt mål' : goal.title}
                                </span>
                                {isDone && <span style={{ fontSize: '0.7rem', background: '#f59e0b', color: '#111827', padding: '1px 7px', borderRadius: '9999px', fontWeight: 800 }}>✓ KLAR</span>}
                              </div>
                              <div style={{ fontSize: '0.8rem', color: '#94a3b8', lineHeight: 1.35 }}>
                                {isSecret ? 'Spil videre for at afsløre det...' : goal.description}

                                <div style={{ marginTop: '0.55rem', display: 'flex', alignItems: 'center', gap: '0.6rem' }}>
                                  <div style={{ flex: 1, height: '5px', background: '#1e293b', borderRadius: '9999px', overflow: 'hidden' }}>
                                    <div style={{ height: '100%', width: `${pct}%`, background: '#3b82f6', borderRadius: '9999px' }} />
                                  </div>
                                  <span style={{ fontSize: '0.75rem', fontFamily: 'monospace', color: '#64748b' }}>
                                    {progress.cur}/{progress.max}
                                  </span>
                                </div>
                              )}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                );
              })()}

            </div>{/* end scroll-område */}
          </div>
        </div>

      <div className="absolute inset-0 z-20 flex flex-col items-center justify-center pointer-events-none">
        {gameState === 'shop' && <ShopScreen coins={coins} upgrades={upgrades} level={progression.level} questItems={questItems} cheeseSources={cheeseSources} featherSources={featherSources} onBuy={buyUpgrade} initialTab={shopInitialTab} onClose={() => { play('ui'); setGameState('idle'); setShopInitialTab('fishing_gear'); }} />}

        {gameState === 'goals' && <GoalsScreen completedGoals={completedGoals} stats={{ ...stats, maxLevel: progression.level, rainCatches: stats.rainCatches, stormCatches: stats.stormCatches, hasTurtleHatched: questItems.includes('turtle_hatched'), collectiblesFound: cheeseSources.length + featherSources.length, conchCount: collectibleInventory.conchCount, fossilCount: collectibleDelivered.fossil ?? 0, companionsUnlocked: unlockedCompanions.length, wishesUsed: usedWishes.length }} onClose={() => { play('ui'); setGameState('idle'); }} />}
        {gameState === 'idle' && (
          <div className="text-center w-full h-full flex flex-col justify-center items-center pointer-events-none">
            {/* Map / Navigation knap – Optimeret til mobil + desktop */}
<div
  className="absolute left-4 pointer-events-auto"
  style={{ bottom: '5.5rem' }}
>
  <button
    onClick={handleNavigation}
    className="flex items-center justify-center rounded-2xl text-white transition-all border border-white/20 shadow-lg btn-glass hover:bg-sky-600 hover:scale-110 active:scale-95"
    style={{ width: '6.85rem', height: '6.85rem' }}
  >
    <span className={`transition-all duration-200 ${uiMode === 'desktop' ? 'text-5xl' : 'text-4xl'}`}>
      🗺
    </span>
  </button>
</div>

            {/* ── NPC IKONER: Grupperet til højre for Rejs-knappen ── */}

            </div>
            <div className="absolute top-16 left-0 right-0 text-center pointer-events-none">{(() => { const area = getLocation(currentLocation); return <h3 className="text-2xl font-black uppercase tracking-widest text-white text-shadow-strong text-center mx-auto">{area.emoji ?? '📍'} {area.name}</h3>; })()}</div>

            {/* ── FISKEHYTTEN: Ingen fiskemulighed ── */}
{currentLocation === 'fishing_cabin' ? (
  <div className="pointer-events-auto mt-32 flex flex-col items-center gap-4 relative">

    {/* DEN NYE INFO-TAVLE (Vises kun første gang) */}
