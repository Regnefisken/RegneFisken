      if (_flipperPivots.length === 4) {
        const paddleSpeed = time * 3;
        const frontFlap = Math.sin(paddleSpeed) * 0.4;
        const backFlap = Math.sin(paddleSpeed - 1) * 0.3;
        _flipperPivots[0].rotation.z = frontFlap;
        _flipperPivots[1].rotation.z = -frontFlap;
        _flipperPivots[2].rotation.z = backFlap;
        _flipperPivots[3].rotation.z = -backFlap;
      }
    };
    return group;
  } else if (catchData.itemType === 'bottle' || catchData.itemType === 'fossil' || catchData.itemType === 'oyster' || catchData.itemType === 'conch') {
    // Flaskepost, Fossil, Østers, Konkylie — brug CUTE_FISH_CONFIG via CATCH_MASTER_DATA
    const entryId = catchData.itemType === 'bottle' ? 'flaskepost' : catchData.itemType === 'oyster' ? 'oyster' : catchData.itemType === 'conch' ? 'konkylie' : 'fossil';
    const cuteModel = buildCuteFishModel({ ...catchData, id: entryId });
    if (cuteModel) {
      // Kopier customUpdate til group
      if (cuteModel.userData.customUpdate) group.userData.customUpdate = cuteModel.userData.customUpdate;
      group.add(cuteModel);
    }
  } else {
    // Prøv buildCuteFishModel — brug fishModelId (art-ID) ikke catch-UUID
    const modelId = catchData.fishModelId || null;
    const cuteModel = modelId ? buildCuteFishModel({ ...catchData, id: modelId }) : null;
    if (cuteModel) {
      // Juster skala efter location
      const isAbyss = location === 'abyss';
      if (isAbyss) {
        cuteModel.traverse(m => {
          if (m.isMesh && m.material) {
            const mat = m.material.clone();
            mat.roughness = Math.max(0.05, mat.roughness - 0.15);
            mat.metalness = Math.min(1.0, mat.metalness + 0.3);
            mat.emissiveIntensity = (mat.emissiveIntensity || 0) + 0.15;
            mat.needsUpdate = true;
            m.material = mat;
          }
        });
      }
      return cuteModel;
    }
    // Fallback: generisk fisk for ukendte ID'er
    const isLeg = catchData.rarity === 'Legendarisk'; const isAbyss = location === 'abyss';
    const fishColor = isAbyss && isLeg ? new THREE.Color(catchData.color).multiplyScalar(0.6) : catchData.color;
    const mat = createCompanionPBR(fishColor, { roughness: isAbyss ? 0.15 : 0.3, metalness: isLeg ? (isAbyss ? 0.95 : 0.8) : 0.1, flatShading: true });
    const body = new THREE.Mesh(new THREE.ConeGeometry(0.5, 2, 8), mat); body.rotation.z = Math.PI / 2;
    const tail = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.8, 4), mat); tail.rotation.z = -Math.PI / 2; tail.position.x = -1.2;
    const fin = new THREE.Mesh(new THREE.TetrahedronGeometry(0.3), mat); fin.position.set(0, 0.5, 0); fin.rotation.y = Math.PI / 4;
    const eyeGeo = new THREE.SphereGeometry(0.1, 8, 8); const eyeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
    const eyeL = new THREE.Mesh(eyeGeo, eyeMat); eyeL.position.set(0.6, 0.1, 0.2);
    const eyeR = new THREE.Mesh(eyeGeo, eyeMat); eyeR.position.set(0.6, 0.1, -0.2);
    group.add(body, tail, fin, eyeL, eyeR);
    const fallbackEntry = catchData.fishModelId ? getEnrichedEntry(catchData.fishModelId) : null;
    if (fallbackEntry) {
      group.scale.setScalar(calculateDisplayScale(fallbackEntry, catchData.weight));
    } else {
      const baseScale = Math.min(0.5 + catchData.weight / 30, 2.85);
      group.scale.setScalar(catchData.itemType === 'plesiosaur' ? baseScale * 0.5 : baseScale);
    }
  }
  return group;
}
/* ================================================================
   v9.0 – Procedural Scale Texture Generator
   ================================================================ */
function createScaleTexture(color, isNormalMap, resolution, quality) {
  if (resolution === 0) return null;
  const key = `${color}_${quality}_${isNormalMap}`;
  if (fishTextureCache.has(key)) return fishTextureCache.get(key);

  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = resolution;
  const ctx = canvas.getContext('2d');

  // Base fill
  if (isNormalMap) {
    ctx.fillStyle = '#8080ff';
    ctx.fillRect(0, 0, resolution, resolution);
  } else {
    ctx.fillStyle = typeof color === 'number' ? '#' + color.toString(16).padStart(6, '0') : color;
    ctx.fillRect(0, 0, resolution, resolution);
  }

  // Radial gradient for smooth UV fade at poles (prevents pinching artifacts)
  const grad = ctx.createRadialGradient(
    resolution / 2, resolution / 2, resolution * 0.05,
    resolution / 2, resolution / 2, resolution * 0.5
  );
  if (isNormalMap) {
    grad.addColorStop(0, 'rgba(128,128,255,0)');
    grad.addColorStop(1, 'rgba(128,128,255,0)');
  } else {
    grad.addColorStop(0, 'rgba(255,255,255,0.08)');
    grad.addColorStop(1, 'rgba(0,0,0,0.12)');
  }
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, resolution, resolution);

  // Overlapping scales pattern
  const scaleCount = quality === 'ultra' ? 220 : quality === 'high' ? 180 : 120;
  const rows = quality === 'ultra' ? 14 : quality === 'high' ? 10 : 8;
  const cols = quality === 'ultra' ? 16 : quality === 'high' ? 12 : 10;
  const cellW = resolution / cols;
  const cellH = resolution / rows;

  for (let row = 0; row < rows; row++) {
    for (let col = 0; col < cols; col++) {
      const offsetX = (row % 2 === 0) ? 0 : cellW * 0.5;
      const cx = col * cellW + offsetX + cellW * 0.5;
      const cy = row * cellH + cellH * 0.5;
      const r = Math.min(cellW, cellH) * 0.45;

      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);

      if (isNormalMap) {
        // Normal map: raised scale bumps
        const ng = ctx.createRadialGradient(cx - r * 0.3, cy - r * 0.3, 0, cx, cy, r);
        ng.addColorStop(0, 'rgba(160,160,255,0.7)');
        ng.addColorStop(0.6, 'rgba(128,128,255,0.3)');
        ng.addColorStop(1, 'rgba(100,100,255,0.1)');
        ctx.fillStyle = ng;
      } else {
        // Diffuse: subtle highlight per scale
        const sg = ctx.createRadialGradient(cx - r * 0.2, cy - r * 0.2, 0, cx, cy, r);
        sg.addColorStop(0, 'rgba(255,255,255,0.18)');
        sg.addColorStop(0.5, 'rgba(255,255,255,0.04)');
        sg.addColorStop(1, 'rgba(0,0,0,0.08)');
        ctx.fillStyle = sg;
      }
      ctx.fill();

      // Scale outline
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      if (isNormalMap) {
        ctx.strokeStyle = 'rgba(90,90,200,0.25)';
      } else {
        ctx.strokeStyle = 'rgba(0,0,0,0.1)';
      }
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }

  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
  fishTextureCache.set(key, texture);
  return texture;
}

/* ================================================================
   v9.0 – Organic Fish Body (LatheGeometry with smooth profile)
   ================================================================ */
function createFishBody(config, quality) {
  const cfg = GRAPHICS_CONFIG[quality] || GRAPHICS_CONFIG.medium;
  const segs = cfg.segments;

  // Profile curve: snout → thick belly → narrow tail
  // LatheGeometry rotates these Vector2 points around Y-axis
  // x = radius at that height, y = position along body axis
  const profilePoints = [];
  const steps = Math.max(12, segs);

  // Define control points for the fish silhouette
  const controlX = [0.02, 0.35, 0.65, 0.82, 0.75, 0.50, 0.22, 0.08]; // radius
  const controlY = [0.0,  0.12, 0.30, 0.50, 0.65, 0.80, 0.92, 1.0];  // along body

  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    // Catmull-Rom style interpolation through control points
    let x = 0, totalWeight = 0;
    for (let j = 0; j < controlX.length; j++) {
      const dist = Math.abs(t - controlY[j]);
      const w = Math.max(0, 1 - dist * controlX.length * 0.42);
      const ww = w * w * (3 - 2 * w); // smoothstep
      x += controlX[j] * ww;
      totalWeight += ww;
    }
    x = totalWeight > 0 ? x / totalWeight : 0.01;
    // Ensure endpoints are nearly zero for clean caps
    if (i === 0) x = 0.015;
    if (i === steps) x = 0.01;
    profilePoints.push(new THREE.Vector2(x, t * 2.0)); // scale Y to body length
  }

  const geometry = new THREE.LatheGeometry(profilePoints, segs);
  // Rotate so the fish body lies along X-axis (nose forward)
  geometry.rotateZ(-Math.PI / 2);
  // Center the body
  geometry.translate(0.0, 0, 0);
  geometry.computeVertexNormals();

  return geometry;
}

    emissive = 0xffaa00;
    emissiveIntensity = 0.55;
  } else if (id === 'fisk_frø' || (config.isFrog && col == null)) {
    col = FROG_COLOR_VARIANTS[Math.floor(Math.random() * FROG_COLOR_VARIANTS.length)];
  } else if (config.isFrog) {
    const FROG_COLORS = [0x4A8A4A, 0x32CD32, 0x8B4513]; // fallback
    const idx = id.length ? id.charCodeAt(id.length - 1) % 3 : 0;
    col = FROG_COLORS[idx];
  }
  const [sx, sy, sz] = config.bodyShape;

  const bodyMat = new THREE.MeshStandardMaterial({
    color: col,
    roughness: 0.4, metalness: 0.1,
    emissive: emissive,
    emissiveIntensity: emissiveIntensity,

    for (let i = 0; i < 5; i++) {
      const angle = (i / 5) * Math.PI * 2;
      const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.08, 0.85, 8), bodyMat);
      arm.rotation.z = Math.PI / 2;

    // Øjne
    const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.07, 6, 5), eyePupilMat);
    eyeL.position.set(0.18, 0.12, 0.1);
    const eyeR = new THREE.Mesh(new THREE.SphereGeometry(0.07, 6, 5), eyePupilMat);
    eyeR.position.set(0.18, 0.12, -0.1);

  if (config.isFrog) {

  if (config.isGoldenCarp) {

  if (config.isBottle) {

    // Ribber på ydersiden (realistisk østers-look)

  if (config.isConch) {
    // ── FLOT NY KONKYLIE (optimeret ~2800 polygoner) ──
    class ConchCurve extends THREE.Curve {
      getPoint(t, target = new THREE.Vector3()) {
        const turns = 4.2;
        const angle = t * Math.PI * 2 * turns;
        const radius = Math.pow(2.65, t) * 0.135;
        const y = -t * 1.65;
        return target.set(
          Math.cos(angle) * radius,
          y,
          Math.sin(angle) * radius
        ).multiplyScalar(this.scale || 0.8);
      }
    }

    const path = new ConchCurve();
    const tubeGeo = new THREE.TubeGeometry(path, 72, 0.38, 16, false);

    // Bedre flare af åbningen (mere naturlig konkylie-form)
    const pos = tubeGeo.attributes.position;
    const v = new THREE.Vector3();
    for (let i = 0; i < pos.count; i++) {
      v.fromBufferAttribute(pos, i);
      const t = Math.max(0, Math.min(1, (-v.y) / 1.65));
      const flare = 1 + Math.pow(t, 2.2) * 3.2;
      v.x *= flare * 0.96;
      v.z *= flare;
      pos.setXYZ(i, v.x, v.y, v.z);
    }
    tubeGeo.computeVertexNormals();

    const mat = new THREE.MeshPhysicalMaterial({
      color: 0xffe4c4,
      emissive: 0xff9eb8,
      emissiveIntensity: 0.25,
      roughness: 0.25,

    });

  // ─── STANDARD FISKEkrop — v9.0 Organic LatheGeometry ──────────

  }

  // Side-finne (brystfinne)
  const sideFinGeo = new THREE.ConeGeometry(0.15, 0.55, 7);
  const sideFinL = new THREE.Mesh(sideFinGeo, finMat);
  sideFinL.position.set(sz * 0.12, -sy * 0.28, sx * 0.7);
  sideFinL.rotation.set(0.5, 0, 0.6);
  const sideFinR = sideFinL.clone();
  sideFinR.position.z = -sideFinL.position.z;
  sideFinR.rotation.x = -0.5;
  group.add(sideFinL, sideFinR);

  // ─── SPECIELLE KENDETEGN ─────────────────────────────────────────
  if (config.stripes) {
    const stripeMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.2 });
    for (let si = 0; si < 2; si++) {
      const stripe = new THREE.Mesh(new THREE.TorusGeometry(sy * 0.72, 0.075, 6, 20), stripeMat);
      stripe.rotation.y = Math.PI / 2;
      stripe.position.x = sz * (0.0 - si * 0.22);
      group.add(stripe);
    }
  }
  if (config.spots) {
    const spotMat = new THREE.MeshBasicMaterial({ color: config.spots });
    for (let si = 0; si < 6; si++) {
      const spot = new THREE.Mesh(new THREE.SphereGeometry(0.085, 5, 4), spotMat);
      const angle = (si / 6) * Math.PI * 2;
      spot.position.set(
        sz * (-0.1 + Math.cos(angle * 0.7) * 0.38),
        sy * (Math.sin(angle) * 0.45),
        sx * (Math.cos(angle) * 0.55)
      );
      group.add(spot);
    }
  }
  if (config.sword) {
    const sword = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.02, 2.0, 6), bodyMat);
    sword.rotation.z = Math.PI / 2; sword.position.x = sz * 0.75 + 1.0;
    group.add(sword);
  }
  if (config.longBeak) {
    const beak = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.03, sz * 0.9, 6), bodyMat);
    beak.rotation.z = Math.PI / 2; beak.position.x = sz * 0.75 + sz * 0.4;
    group.add(beak);
  }
  if (config.whiskers) {
    // Knurhår (Karpe)
    [-0.12, 0.12].forEach((yOff, wi) => {
      const w = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.01, 0.55, 4), finMat);
      w.position.set(sz * 0.72, yOff, sx * 0.25 * (wi === 0 ? 1 : -1));
      w.rotation.z = 0.5;
      group.add(w);
    });
  }
  if (config.isDino) {
    // Plesiosaurus — lang hals frem
    const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.28, 1.4, 8), bodyMat);
    neck.rotation.z = -Math.PI / 3; neck.position.set(sz * 0.72, sy * 0.55, 0);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.3, 10, 8), bodyMat);
    head.position.set(sz * 1.1, sy * 1.1, 0);
    const dEyeL = new THREE.Mesh(new THREE.SphereGeometry(0.07, 6, 5), eyePupilMat);
    dEyeL.position.set(sz * 1.24, sy * 1.18, 0.17);
    const dEyeR = dEyeL.clone(); dEyeR.position.z = -0.17;
    group.add(neck, head, dEyeL, dEyeR);
    // Flipper
    const flipperGeo = new THREE.SphereGeometry(0.35, 8, 6);
    flipperGeo.scale(1.6, 0.35, 1.0);
    [[sz*0.2, -sy*0.6, sx*0.85],[sz*0.2, -sy*0.6, -sx*0.85]].forEach(([fx,fy,fz]) => {
      const fl = new THREE.Mesh(flipperGeo, bodyMat);
      fl.position.set(fx, fy, fz);
      group.add(fl);
    });
  }
  if (config.lure || config.isBossGorm) {
    const lureColor = config.emissive || 0x39FF14;
    const stalk = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.2, 6), bodyMat);
    stalk.position.set(sz * 0.35, sy * 0.7, 0); stalk.rotation.z = -0.45;
    const bulbMat = new THREE.MeshStandardMaterial({ color: lureColor, emissive: lureColor, emissiveIntensity: 1.2 });
    const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.17, 10, 8), bulbMat);
    bulb.position.set(sz * 0.7, sy * 1.15, 0);
    const lureLight = new THREE.PointLight(lureColor, 1.5, 5);
    bulb.add(lureLight);
    group.add(stalk, bulb);
  }
  if (config.isPiranha) {
    // --- PIRATFISK (PIRANHA) ---
    // Aggressivt underbid med rød bug, skarpe tænder og hidsig animation
    
    const jawGroup = new THREE.Group();
    
    // Rødlig/orange underkæbe og bug (Red-bellied Piranha)
    const jawMat = new THREE.MeshStandardMaterial({ color: 0x8b2500, roughness: 0.5 });
    const jaw = new THREE.Mesh(new THREE.BoxGeometry(sz * 0.6, sy * 0.35, sx * 0.6), jawMat);
    jaw.position.set(sz * 0.5, -sy * 0.25, 0);
    jaw.rotation.z = -0.15;
    jawGroup.add(jaw);

    // Skarpe, trekantede tænder (fremtrædende underbid)
    const toothMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    for (let i = 0; i < 5; i++) {
      const tooth = new THREE.Mesh(new THREE.ConeGeometry(0.03, 0.15, 4), toothMat);
      tooth.position.set(sz * 0.75, -sy * 0.10, (i - 2) * (sx * 0.12));
      tooth.rotation.z = -0.3;
      jawGroup.add(tooth);
    }
    
    // Onde, røde øjne
    const evilEyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
    const evilEyeL = new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 6), evilEyeMat);
    evilEyeL.position.set(sz * 0.65, sy * 0.20, sx * 0.56);
    const evilEyeR = evilEyeL.clone();
    evilEyeR.position.z = -sx * 0.56;
    group.add(evilEyeL, evilEyeR);

    group.add(jawGroup);

    // --- ANIMATION: Darting & Snapping ---
    group.userData.customUpdate = (t) => {
      // Snapping (kæben klapper aggressivt)
      const snap = Math.sin(t * 18);
      jawGroup.rotation.z = snap > 0.4 ? 0.25 : -0.15; 

      // Darting (hurtige ryk fremad)
      const dart = Math.pow(Math.sin(t * 4), 7);
      group.position.x = dart * 0.5;
      
      // Svømmerotation med kraftige vrid under dart
      group.rotation.y += 0.01 + (dart * 0.08);
    };
  }

  const finalScale = (config.scale || 1.0) * 0.55;
  group.scale.setScalar(finalScale);
  return group;
}

/* ================================================================
   animateCuteFishQueue — animér nuttede fisk i spanden
   ================================================================ */
function animateCuteFishQueue(bucketFishModels, time) {
  if (!bucketFishModels) return;
  bucketFishModels.forEach((fishModel, index) => {
    if (!fishModel || !fishModel.userData.fishConfig) return;
    const config = fishModel.userData.fishConfig;
    const speed = (config.speed || 1.0) * 2.5;
    const offset = index * 0.6;
    if (fishModel.position) {
      fishModel.position.y += Math.sin(time * speed + offset) * 0.003;
    }
    const tail = fishModel.userData.tailGroup;
    if (tail && tail.rotation) {
      tail.rotation.y = Math.sin(time * speed * 2 + offset) * 0.35;
    }
    if (fishModel.rotation) {
      fishModel.rotation.y += Math.sin(time * speed * 1.3 + offset) * 0.005;
    }
  });
}

function getSeagullPalette(locationId, formation = 'pair') {
  if (locationId === 'desert_lake') return { body: 0x1a1a1a, wing: 0x101010 };

  return { body: 0xf5f5f0, wing: 0xe8e8e0 };

/* ================================================================
   v9.0 – Companion PBR Material Helper
   Creates quality-adaptive materials for non-fish creatures.
   Options: { roughness, metalness, flatShading, useScales, emissive, transparent, opacity, side, pbrEnabled }
   pbrEnabled: true (default) = clearcoat + envMap. false = matte look (no clearcoat/envMap).
   ================================================================ */
function createCompanionPBR(color, opts = {}) {
  const quality = currentGraphicsQuality || 'medium';
  const cfg = GRAPHICS_CONFIG[quality] || GRAPHICS_CONFIG.medium;
  const roughness = opts.roughness ?? 0.45;
  const metalness = opts.metalness ?? 0.08;
  const flatShading = opts.flatShading ?? true;
  const pbrEnabled = opts.pbrEnabled !== false; // default true

  if (cfg.material === 'Standard' || quality === 'low') {
    return new THREE.MeshStandardMaterial({
      color,
      roughness: Math.min(1, roughness + 0.15),
      metalness: Math.max(0, metalness - 0.05),
      flatShading,
      ...(opts.emissive ? { emissive: opts.emissive, emissiveIntensity: opts.emissiveIntensity || 0.3 } : {}),
      ...(opts.transparent ? { transparent: true, opacity: opts.opacity ?? 0.9 } : {}),
      ...(opts.side ? { side: opts.side } : {}),
    });
  }

  const matOpts = {
    color,
    roughness,
    metalness,
    clearcoat: pbrEnabled ? cfg.clearcoat * 0.6 : 0,
    clearcoatRoughness: 0.15,
    flatShading,
  };

  if (opts.emissive) {
    matOpts.emissive = opts.emissive;
    matOpts.emissiveIntensity = opts.emissiveIntensity || 0.3;
  }
  if (opts.transparent) {
    matOpts.transparent = true;
    matOpts.opacity = opts.opacity ?? 0.9;
  }
  if (opts.side) matOpts.side = opts.side;

  // Optionally add scale/feather texture
  if (opts.useScales && cfg.texSize > 0) {
    const scaleTex = createScaleTexture(color, false, cfg.texSize, quality);
    const normalTex = createScaleTexture(color, true, cfg.texSize, quality);
    if (scaleTex) matOpts.map = scaleTex;
    if (normalTex) {
      matOpts.normalMap = normalTex;
      matOpts.normalScale = new THREE.Vector2(0.8, 0.8);
    }
  }

  // Environment map for wet/glossy look — skip if pbrEnabled is false
  if (pbrEnabled && window._fishEnvMap) {
    matOpts.envMap = window._fishEnvMap;
    matOpts.envMapIntensity = (window.pmremExposure ?? 0.65) * 0.7;
  }

  return new THREE.MeshPhysicalMaterial(matOpts);
}

// ── OPdateret buildBucket (createBucketMesh) ──────────────────────────────
function buildBucket(tier) {
  const group = new THREE.Group();
  const SIDES = 16; // Præcis samme antal sider på krop, bund og rim

  const mat = createCompanionPBR(tier.color, { metalness: tier.metalness, roughness: tier.roughness, flatShading: true, side: THREE.DoubleSide });

  // Krop: åben cylinder med SIDES radialSegments
  const body = new THREE.Mesh(
    new THREE.CylinderGeometry(0.55, 0.42, 0.9, SIDES, 1, true),
    mat
  );
  body.position.y = 0.45;

  // Bund: cirkel med SIDES segmenter → flugter med cylinderens underste ring
  const bottom = new THREE.Mesh(
    new THREE.CircleGeometry(0.42, SIDES),
    mat
  );
  bottom.rotation.x = -Math.PI / 2;
  bottom.position.y = 0.01;

  // Rim: torus med tubularSegments = SIDES
  // KUN rotation.x for at lægge den fladt — INGEN rotation.y (det ville tilte den skævt via Euler)
  const rimMat = createCompanionPBR(tier.color, { metalness: tier.metalness, roughness: tier.roughness, flatShading: true, side: THREE.DoubleSide });
  rimMat.color.multiply(new THREE.Color(0.78, 0.78, 0.78));
  const rim = new THREE.Mesh(
    new THREE.TorusGeometry(0.55, 0.03, 6, SIDES),
    rimMat
  );
  rim.rotation.x = Math.PI / 2;  // Flad vandret — ingen ekstra rotation
  rim.position.y = 0.9;
  rim.userData.isRim = true;

  // Hank: højere bue, hæftet på hver sin side af spandens overkant
  const handleMat = createCompanionPBR(tier.color, { metalness: tier.metalness, roughness: tier.roughness });
  handleMat.color.multiply(new THREE.Color(0.78, 0.78, 0.78));
  const handleCurve = new THREE.QuadraticBezierCurve3(
    new THREE.Vector3(-0.55, 0.9, 0),   // venstre side af rim
    new THREE.Vector3(0, 1.85, 0),       // kontrolpunkt – højere bue
    new THREE.Vector3(0.55, 0.9, 0)      // højre side af rim
  );
  const handleGeo = new THREE.TubeGeometry(handleCurve, 12, 0.04, 6, false);
  const handle = new THREE.Mesh(handleGeo, handleMat);
  handle.userData.isRim = true;

  group.add(body, bottom, rim, handle);
  group.userData.isBucket = true;
  group.userData.innerRadius = 0.48;
  group.userData.height = 0.9;
  return group;
}

// ── ØRKENSØ ─────────────────────────────────────────────────────
function buildDesertLake(refs) {
  clearLocationObjects(refs);
  if (refs.water) refs.water.visible = true;
  const sandMat = createCompanionPBR(0xE8C97A, { roughness: 1.0, flatShading: true, pbrEnabled: false });
  const sand = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), sandMat);
  sand.rotation.x = -Math.PI / 2; sand.position.y = -0.02;
  addLocationObject(refs, sand);
  const rockMat = createCompanionPBR(0xC4A35A, { roughness: 0.9, flatShading: true, pbrEnabled: false });
  // Bagerste, buet stensætning der afgrænser søen mod broens retning
  const STONE_RING_CENTER_Z = -7.0;
  const STONE_RING_RX = 15.5;
  const STONE_RING_RZ = 8.0;
  const STONE_COUNT = 12;
  for (let i = 0; i < STONE_COUNT; i++) {
    const s = 0.8 + Math.random() * 1.6;
    const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(s, 0), rockMat);
    // Arc fra venstre front -> bagom -> højre front (åbning ved broens midte)
    const t = i / (STONE_COUNT - 1);
    const angle = Math.PI + (Math.PI * t);
    const jitterX = (Math.random() - 0.5) * 1.9;
    const jitterZ = (Math.random() - 0.5) * 1.4;
    const x = Math.cos(angle) * STONE_RING_RX + jitterX;
    const z = STONE_RING_CENTER_Z + Math.sin(angle) * STONE_RING_RZ + jitterZ;
    rock.position.set(x, s * 0.38, z);
    rock.rotation.set(Math.random(), Math.random(), Math.random());
    addLocationObject(refs, rock);
  }
  // Ekstra side-sten tættere på bro-området for tydelig afgrænsning
  [-1, 1].forEach(side => {
    for (let i = 0; i < 2; i++) {
      const s = 0.9 + Math.random() * 1.2;
      const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(s, 0), rockMat);
      rock.position.set(side * (9.5 + i * 1.8 + Math.random() * 0.8), s * 0.36, -1.8 - i * 1.6 + (Math.random() - 0.5) * 0.6);
      rock.rotation.set(Math.random(), Math.random(), Math.random());
      addLocationObject(refs, rock);
    }
  });
  // 4 dedikerede low-poly kaktusser til Ørkensøen
  const matSaguaro = createCompanionPBR(0x4CAF50, { roughness: 0.82, flatShading: true, pbrEnabled: false });
  const matBarrel  = createCompanionPBR(0x1a5624, { roughness: 0.85, flatShading: true, pbrEnabled: false });
  const matPrickly = createCompanionPBR(0x7cb31b, { roughness: 0.84, flatShading: true, pbrEnabled: false });
  const matPipes   = createCompanionPBR(0x24756c, { roughness: 0.80, flatShading: true, pbrEnabled: false });
  const matRedFlow = createCompanionPBR(0xd93829, { roughness: 0.70, flatShading: true });

  const setShadows = (group) => group.traverse(obj => {
    if (obj.isMesh) {
      obj.castShadow = true;
      obj.receiveShadow = true;
    }
  });

  function buildSaguaroCactus() {
    const g = new THREE.Group();
    const trunkGeo = new THREE.CylinderGeometry(0.5, 0.5, 4, 8);
    const armGeo = new THREE.CylinderGeometry(0.4, 0.4, 1.5, 8);

    const trunk = new THREE.Mesh(trunkGeo, matSaguaro); trunk.position.y = 2; g.add(trunk);
    const armL = new THREE.Mesh(armGeo, matSaguaro); armL.position.set(-0.8, 2.5, 0); armL.rotation.z = Math.PI / 2; g.add(armL);
    const armLUp = new THREE.Mesh(armGeo, matSaguaro); armLUp.position.set(-1.35, 3.05, 0); g.add(armLUp);
    const armR = new THREE.Mesh(armGeo, matSaguaro); armR.position.set(0.8, 1.5, 0); armR.rotation.z = Math.PI / 2; g.add(armR);
    const armRUp = new THREE.Mesh(armGeo, matSaguaro); armRUp.position.set(1.35, 2.05, 0); g.add(armRUp);
    setShadows(g);
    return g;
  }

  function buildBarrelCactus() {
    const g = new THREE.Group();
    const body = new THREE.Mesh(new THREE.IcosahedronGeometry(1.5, 1), matBarrel);
    body.position.y = 1.0; body.scale.set(1.2, 0.8, 1.2); g.add(body);
    const flower = new THREE.Mesh(new THREE.ConeGeometry(0.8, 1, 5), matRedFlow);
    flower.position.y = 2.4; flower.rotation.x = Math.PI; g.add(flower);
    setShadows(g);
    return g;
  }

  function buildPricklyPearCactus() {
    const g = new THREE.Group();
    const padGeo = new THREE.DodecahedronGeometry(0.8, 0);
    const padDef = [
      [0, 0.8, 0, 0, 1.0],
      [-0.6, 2.0, 0, -0.4, 0.8],
      [0.8, 1.8, 0.2, 0.3, 0.9],
      [-1.2, 3.0, 0.1, -0.6, 0.7],
      [0.2, 3.2, -0.1, 0.1, 0.8],
      [1.2, 2.8, -0.1, 0.5, 0.6],
    ];
    padDef.forEach(([x, y, z, rz, scale]) => {
      const pad = new THREE.Mesh(padGeo, matPrickly);
      pad.position.set(x, y, z);
      pad.rotation.z = rz;
      pad.scale.set(1, 1.2, 0.4);
      pad.scale.multiplyScalar(scale);
      g.add(pad);
    });
    const fruitGeo = new THREE.BoxGeometry(0.4, 0.4, 0.4);
    const fruit1 = new THREE.Mesh(fruitGeo, matRedFlow); fruit1.position.set(-1.6, 3.6, 0.1); g.add(fruit1);
    const fruit2 = new THREE.Mesh(fruitGeo, matRedFlow); fruit2.position.set(1.6, 3.3, -0.1); g.add(fruit2);
    setShadows(g);
    return g;
  }

  function buildOrganPipeCactus() {
    const g = new THREE.Group();
    const pipeGeo = new THREE.CylinderGeometry(0.35, 0.35, 1, 6);
    const pipes = [
      [0, 0, 5],
      [0.6, 0.2, 4],
      [-0.6, -0.1, 3.5],
      [0.3, 0.6, 2.5],
      [-0.4, 0.5, 4.5],
      [0.8, -0.4, 2.0],
    ];
    pipes.forEach(([x, z, h]) => {
      const p = new THREE.Mesh(pipeGeo, matPipes);
      p.scale.y = h;
      p.position.set(x, h / 2, z);
      g.add(p);
    });
    setShadows(g);
    return g;
  }

  // Placering: 1 erstatter gammel nær broen, 2 til venstre for broen, 1 i højre horisont bag sø/sten
  const cactusA = buildSaguaroCactus();      cactusA.position.set(3.8, 0, 4.9);  cactusA.rotation.y = THREE.MathUtils.degToRad(-35); cactusA.scale.setScalar(0.9);  addLocationObject(refs, cactusA);
  const cactusB = buildBarrelCactus();       cactusB.position.set(-10.0, 0, 0.9); cactusB.scale.setScalar(1.15);  addLocationObject(refs, cactusB);
  const cactusC = buildPricklyPearCactus();  cactusC.position.set(-4.4, 0, 4.8); cactusC.rotation.y = THREE.MathUtils.degToRad(180); cactusC.scale.setScalar(0.88); addLocationObject(refs, cactusC);
  const cactusD = buildOrganPipeCactus();    cactusD.position.set(20.5, 0, -15.5); cactusD.scale.setScalar(1.35); addLocationObject(refs, cactusD);
  const sun3D = new THREE.Mesh(new THREE.SphereGeometry(3, 12, 8), new THREE.MeshBasicMaterial({ color: 0xFFD700 }));
  sun3D.position.set(-20, 18, -35);
  addLocationObject(refs, sun3D);
  const dustGeo = new THREE.BufferGeometry();
  const dustPos = new Float32Array(300 * 3);
  for (let i = 0; i < 300; i++) { dustPos[i*3]=(Math.random()-0.5)*60; dustPos[i*3+1]=Math.random()*2; dustPos[i*3+2]=(Math.random()-0.5)*60; }
  dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
  const dustMesh = new THREE.Points(dustGeo, new THREE.PointsMaterial({ color: 0xFFAA55, size: 0.18, transparent: true, opacity: 0.35 }));
  addLocationObject(refs, dustMesh);
  refs._desertDust = { mesh: dustMesh, pos: dustPos };
}

// ── ISHAVET ─────────────────────────────────────────────────────
function buildArcticSea(refs) {
  clearLocationObjects(refs);
  if (refs.water) refs.water.visible = true;
  const iceMat = createCompanionPBR(0xCCEEFF, { roughness: 0.1, metalness: 0.2, flatShading: true });
  // Isflage under broen: havet skal primært ligge foran broen
  const iceShelfGeo = new THREE.PlaneGeometry(30, 20, 18, 12);
  const shelfPos = iceShelfGeo.attributes.position;
  for (let i = 0; i < shelfPos.count; i++) {
    const x = shelfPos.getX(i);
    const y = shelfPos.getY(i);
    const bump = Math.sin(x * 0.35) * 0.06 + Math.cos(y * 0.42) * 0.05 + (Math.random() - 0.5) * 0.04;
    shelfPos.setZ(i, bump);
  }
  shelfPos.needsUpdate = true;
  iceShelfGeo.computeVertexNormals();
  const iceFloor = new THREE.Mesh(iceShelfGeo, iceMat);
  iceFloor.rotation.x = -Math.PI / 2;
  iceFloor.position.set(0, 0.06, 7.0);
  addLocationObject(refs, iceFloor);
  for (let i = 0; i < 14; i++) {
    const w = 1 + Math.random() * 2.5; const h = 0.6 + Math.random() * 2; const d = 1 + Math.random() * 2;
    const block = new THREE.Mesh(new THREE.BoxGeometry(w, h, d),
      createCompanionPBR(new THREE.Color().setHSL(0.55, 0.4, 0.75 + Math.random()*0.15), { roughness: 0.1, metalness: 0.1, flatShading: true, transparent: true, opacity: 0.85 }));
    const angle = (i / 14) * Math.PI * 2;
    const r = 10 + Math.random() * 12;
    block.position.set(Math.cos(angle) * r, h / 2, Math.sin(angle) * r);
    block.rotation.y = Math.random() * Math.PI;
    addLocationObject(refs, block);
  }
  // ── PINGVIN (nuttet, detaljeret, v9.0 PBR) ──────────────────
  const penguinGroup = new THREE.Group();
  penguinGroup.position.set(-3, 0, 5);
  const pCfg = GRAPHICS_CONFIG[currentGraphicsQuality || 'medium'] || GRAPHICS_CONFIG.medium;
  const pSegs = Math.max(8, pCfg.segments >> 1);

  const bodyMat2  = createCompanionPBR(0x111111, { roughness: 0.35, metalness: 0.05, useScales: true, flatShading: false });
  const bellyMat2 = createCompanionPBR(0xfafafa, { roughness: 0.5, flatShading: false });
  const beakMat2  = createCompanionPBR(0xFF8C00, { roughness: 0.35, flatShading: false });
  const eyeMat2   = createCompanionPBR(0x000000, { roughness: 0.05, metalness: 0.5, flatShading: false });
  const eyeWhiteMat = createCompanionPBR(0xffffff, { roughness: 0.3, flatShading: false });

  // Krop — aflang sphere (skaleret på y)
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.45, pSegs, Math.max(8, pSegs >> 1)), bodyMat2);
  body.scale.set(1, 1.25, 1);
  body.position.y = 0.56;
  penguinGroup.add(body);

  // Mave — hvid oval sphere skubbet frem
  const belly = new THREE.Mesh(new THREE.SphereGeometry(0.3, Math.max(8, pSegs - 2), Math.max(6, pSegs >> 1)), bellyMat2);
  belly.scale.set(0.85, 1.1, 0.5);
  belly.position.set(0, 0.5, 0.32);
  penguinGroup.add(belly);

  // Hoved — lille rund sphere ovenpå
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.27, Math.max(8, pSegs - 2), Math.max(6, pSegs >> 1)), bodyMat2);
  head.position.set(0, 1.12, 0.04);
  penguinGroup.add(head);

  // Øjen-hvider (bag de sorte øjne)
  const leftEyeWhite = new THREE.Mesh(new THREE.SphereGeometry(0.075, Math.max(6, pSegs >> 1), Math.max(6, pSegs >> 1)), eyeWhiteMat);
  leftEyeWhite.position.set(-0.12, 1.17, 0.22);
  penguinGroup.add(leftEyeWhite);
  const rightEyeWhite = new THREE.Mesh(new THREE.SphereGeometry(0.075, Math.max(6, pSegs >> 1), Math.max(6, pSegs >> 1)), eyeWhiteMat);
  rightEyeWhite.position.set(0.12, 1.17, 0.22);
  penguinGroup.add(rightEyeWhite);

  // Øjne — skinnende sorte kugler
  const leftEye = new THREE.Mesh(new THREE.SphereGeometry(0.055, Math.max(6, pSegs >> 1), Math.max(6, pSegs >> 1)), eyeMat2);
  leftEye.position.set(-0.12, 1.17, 0.285);
  penguinGroup.add(leftEye);
  const rightEye = new THREE.Mesh(new THREE.SphereGeometry(0.055, Math.max(6, pSegs >> 1), Math.max(6, pSegs >> 1)), eyeMat2);
  rightEye.position.set(0.12, 1.17, 0.285);
  penguinGroup.add(rightEye);

  // Næb — lille flad orange cylinder
  const beak = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.065, 0.16, Math.max(6, pSegs >> 1)), beakMat2);
  beak.rotation.x = Math.PI / 2;
  beak.position.set(0, 1.1, 0.38);
  penguinGroup.add(beak);

  // Vinger — to flade, lidt roterede sfærer
  const wingGeo = new THREE.SphereGeometry(0.18, Math.max(6, pSegs >> 1), Math.max(5, pSegs >> 2));
  wingGeo.scale(0.5, 0.9, 1);
  const leftWing = new THREE.Mesh(wingGeo, bodyMat2);
  leftWing.position.set(-0.46, 0.62, 0.1);
  leftWing.rotation.z = 0.3;
  penguinGroup.add(leftWing);
  const rightWing = new THREE.Mesh(wingGeo, bodyMat2);
  rightWing.position.set(0.46, 0.62, 0.1);
  rightWing.rotation.z = -0.3;
  penguinGroup.add(rightWing);

  // Fødder — to orange, flade sfærer
  const footGeo = new THREE.SphereGeometry(0.1, Math.max(6, pSegs >> 1), Math.max(4, pSegs >> 2));
  const leftFoot = new THREE.Mesh(footGeo, beakMat2);
  leftFoot.scale.set(1.4, 0.4, 1.6);
  leftFoot.position.set(-0.16, 0.08, 0.14);
  penguinGroup.add(leftFoot);
  const rightFoot = new THREE.Mesh(footGeo, beakMat2);
  rightFoot.scale.set(1.4, 0.4, 1.6);
  rightFoot.position.set(0.16, 0.08, 0.14);
  penguinGroup.add(rightFoot);

  penguinGroup.userData = { id: 'np_penguin', interactable: true, type: 'npc', isPenguinNPC: true };
  penguinGroup.rotation.y = Math.PI * 0.15; // Pingvin roteret mod kamera (~27°)
  addLocationObject(refs, penguinGroup);
  refs.penguinMesh = penguinGroup;
  const snowGeo = new THREE.BufferGeometry();
  const snowPos = new Float32Array(500 * 3);
  for (let i = 0; i < 500; i++) { snowPos[i*3]=(Math.random()-0.5)*60; snowPos[i*3+1]=Math.random()*30; snowPos[i*3+2]=(Math.random()-0.5)*60; }
  snowGeo.setAttribute('position', new THREE.BufferAttribute(snowPos, 3));
  const snowMesh = new THREE.Points(snowGeo, new THREE.PointsMaterial({ color: 0xFFFFFF, size: 0.2, transparent: true, opacity: 0.85 }));
  addLocationObject(refs, snowMesh);
  refs._arcticSnow = { mesh: snowMesh, pos: snowPos };
}

// ── KÆMPE LANDSKILDPADDE 3D ─────────────────────────────────────
function addEyes(group, x, y, zOffset, scale = 1) {
  const eyeW = new THREE.Mesh(new THREE.SphereGeometry(0.08*scale,12,12), createCompanionPBR(0xffffff, { flatShading: false }));
  eyeW.position.set(x,y,zOffset);
  const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.04*scale,12,12), createCompanionPBR(0x111111, { flatShading: false }));
  pupil.position.set(x+0.04*scale, y, zOffset + (zOffset>0?0.04*scale:-0.04*scale));
  group.add(eyeW, pupil);
}

// Flat shading på skjoldet – kun denne ene ændring
function buildGiantLandTurtle() {
  const group = new THREE.Group();
  const tCfg = GRAPHICS_CONFIG[currentGraphicsQuality || 'medium'] || GRAPHICS_CONFIG.medium;
  const shellMat = createCompanionPBR(0x5C4033, { roughness: 0.55, metalness: 0.06, useScales: true, flatShading: true });
  const skinMat = createCompanionPBR(0x8B7355, { roughness: 0.65, flatShading: false });
  const mouthMat = createCompanionPBR(0x2A1B18, { roughness: 0.8, flatShading: false });
  const tongueMat = createCompanionPBR(0xCD5C5C, { roughness: 0.5, flatShading: false });

  const shell = new THREE.Mesh(new THREE.IcosahedronGeometry(1, tCfg.segments >= 32 ? 3 : 2), shellMat);
  shell.scale.set(1.35, 0.95, 1.25);
  shell.position.y = 0.45;
  group.add(shell);

  const rim = new THREE.Mesh(new THREE.TorusGeometry(0.98, 0.12, Math.max(8, tCfg.segments >> 1), Math.max(16, tCfg.segments)), shellMat);
  rim.rotation.x = Math.PI / 2;
  rim.scale.set(1.35, 1.05, 1.25);
  rim.position.y = 0.12;
  group.add(rim);

  const neckCurve = new THREE.QuadraticBezierCurve3(
    new THREE.Vector3(0.8, 0.25, 0),
    new THREE.Vector3(1.45, 0.25, 0),
    new THREE.Vector3(1.72, 0.88, 0)
  );
  const neck = new THREE.Mesh(new THREE.TubeGeometry(neckCurve, Math.max(10, tCfg.segments >> 1), 0.19, Math.max(6, tCfg.segments >> 2), false), skinMat);
  group.add(neck);

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.29, Math.max(10, tCfg.segments >> 1), Math.max(10, tCfg.segments >> 1)), skinMat);
  head.position.set(1.72, 0.92, 0);
  head.name = "turtleHead";

  const slit = new THREE.Mesh(new THREE.BoxGeometry(0.038, 0.019, 0.135), mouthMat);
  slit.position.set(0.255, -0.092, 0);
  const tongue = new THREE.Mesh(new THREE.SphereGeometry(0.033, 9, 9), tongueMat);
  tongue.scale.set(1.68, 0.49, 0.87);
  tongue.position.set(0.295, -0.095, 0);
  tongue.rotation.z = -0.18;
  head.add(slit, tongue);
  group.add(head);

  const legGeo = new THREE.CylinderGeometry(0.23, 0.29, 0.72, Math.max(8, tCfg.segments >> 1));
  const legPos = [[0.62,-0.18,0.62],[0.62,-0.18,-0.62],[-0.72,-0.17,0.52],[-0.72,-0.17,-0.52]];
  legPos.forEach(p => {
    const leg = new THREE.Mesh(legGeo, skinMat);
    leg.position.set(...p);
    group.add(leg);
  });

  const tail = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.62, 7), skinMat);
  tail.rotation.z = Math.PI / 2;
  tail.position.set(-1.32, 0.09, 0);
  group.add(tail);

  addEyes(group, 1.88, 1.02, 0.22, 0.82);
  addEyes(group, 1.88, 1.02, -0.22, 0.82);

  group.userData.isTurtle = true;
  return group;
}

// ── FISKESTANGSVÆG (dekorativt, flytbart) ──────────────────────────────────
// Alle mål er præ-skaleret med S=1/3 så gruppen har y=0 og ingen scale-transform.
// Det giver identisk drag-adfærd som bogreolen.
function buildRodWall() {
  const S = 1 / 3;
  const group = new THREE.Group();

  const themes = [
    { rodColor: 0x8b6540, gripColor: 0x6b4a2e, seatColor: 0xcccccc, reelBase: 0x8b5a2b, spoolColor: 0xff8c00, metalness: 0.1 },
    { rodColor: 0x243e60, gripColor: 0x1b2d47, seatColor: 0xdddddd, reelBase: 0x188a85, spoolColor: 0x3ac2bd, metalness: 0.2 },
    { rodColor: 0xe0c08b, gripColor: 0xceab70, seatColor: 0xffffff, reelBase: 0xdeaa73, spoolColor: 0xf26666, metalness: 0.1 },
    { rodColor: 0x6b2b2b, gripColor: 0x4a1818, seatColor: 0xc87d4a, reelBase: 0x5a3e2b, spoolColor: 0x4a9e5b, metalness: 0.3 },
  ];

  const rackMat = createCompanionPBR(0x3d2314, { roughness: 0.9, flatShading: true, pbrEnabled: false });
  const pegMat  = createCompanionPBR(0x5c3a21, { roughness: 0.8, pbrEnabled: false });

  const rackL = new THREE.Mesh(new THREE.BoxGeometry(0.18*S, 5.5*S, 0.1*S), rackMat);
  rackL.position.set(-1.8*S, 0, 0); group.add(rackL);
  const rackR = new THREE.Mesh(new THREE.BoxGeometry(0.18*S, 5.5*S, 0.1*S), rackMat);
  rackR.position.set(1.8*S, 0, 0); group.add(rackR);

  const spacingY = 1.2 * S;
  const startY   = ((themes.length - 1) * spacingY) / 2;

  themes.forEach((theme, idx) => {
    const currentY = startY - idx * spacingY;
    const rod = buildSingleRod(theme, S);
    rod.position.set(0, currentY, 0.05*S);
    rod.rotation.x = 0.35;
    group.add(rod);

    [-1.8*S, 1.8*S].forEach(xOff => {
      const peg = new THREE.Mesh(new THREE.CylinderGeometry(0.04*S, 0.04*S, 0.4*S, 8), pegMat);
      peg.rotation.x = Math.PI / 2;
      peg.position.set(xOff, currentY - 0.05*S, 0.08*S);
      group.add(peg);
    });
  });

  // Usynlig hitbox — dækker hele holderens areal så man nemt kan grabbes overalt.
  // visible=true så raycaster finder den, opacity=0 så den ikke ses.
  const hitbox = new THREE.Mesh(
    new THREE.BoxGeometry(1.8*S*2 + 0.3*S, 5.5*S, 0.6*S),
    new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false, side: THREE.DoubleSide })
  );
  group.add(hitbox);

  return group;
}

function buildSingleRod(theme, S) {
  if (S === undefined) S = 1;
  const g = new THREE.Group();
  const seg = 16;
  const mRod  = createCompanionPBR(theme.rodColor, { roughness: 0.8, metalness: theme.metalness });
  const mGrip = createCompanionPBR(theme.gripColor, { roughness: 0.9, flatShading: true, pbrEnabled: false });
  const mSeat = createCompanionPBR(theme.seatColor, { roughness: 0.3, metalness: 0.8 });
  const mReel = createCompanionPBR(theme.reelBase, { roughness: 0.6, metalness: 0.4 });
  const mSpol = createCompanionPBR(theme.spoolColor, { roughness: 0.5, metalness: 0.2 });

  // Greb bageste
  const gB = new THREE.Mesh(new THREE.CylinderGeometry(0.10*S, 0.10*S, 0.9*S, 10), mGrip);
  gB.rotation.z = Math.PI / 2; gB.position.set(1.0*S, 0, 0); g.add(gB);
  // Endeknop
  const cap = new THREE.Mesh(new THREE.SphereGeometry(0.10*S, 10, 8), mSeat);
  cap.position.set(1.45*S, 0, 0); g.add(cap);
  // Reel seat
  const rs = new THREE.Mesh(new THREE.CylinderGeometry(0.09*S, 0.09*S, 0.7*S, seg), mSeat);
  rs.rotation.z = Math.PI / 2; rs.position.set(0.2*S, 0, 0); g.add(rs);
  // Greb forreste
  const gF = new THREE.Mesh(new THREE.CylinderGeometry(0.10*S, 0.10*S, 0.4*S, 10), mGrip);
  gF.rotation.z = Math.PI / 2; gF.position.set(-0.35*S, 0, 0); g.add(gF);
  // Klinge
  const shaftLen = 3.5*S;
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.015*S, 0.07*S, shaftLen, seg), mRod);
  shaft.rotation.z = Math.PI / 2; shaft.position.set(-0.55*S - (shaftLen / 2), 0, 0); g.add(shaft);
  // Hjul
  const reelGrp = new THREE.Group();
  reelGrp.position.set(0.2*S, -0.12*S, 0);
  const stem = new THREE.Mesh(new THREE.BoxGeometry(0.08*S, 0.18*S, 0.05*S), mReel);
  stem.position.set(0, -0.1*S, 0); reelGrp.add(stem);
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.12*S, 0.12*S, 0.22*S, seg), mReel);
  body.rotation.z = Math.PI / 2; body.position.set(0.05*S, -0.22*S, 0); reelGrp.add(body);
  const spoolC = new THREE.Mesh(new THREE.CylinderGeometry(0.10*S, 0.10*S, 0.14*S, seg), mSpol);
  spoolC.rotation.z = Math.PI / 2; spoolC.position.set(-0.18*S, -0.22*S, 0); reelGrp.add(spoolC);
  const crank = new THREE.Mesh(new THREE.CylinderGeometry(0.015*S, 0.015*S, 0.15*S, 8), mSeat);
  crank.rotation.x = Math.PI / 2; crank.position.set(0.05*S, -0.22*S, 0.18*S); reelGrp.add(crank);
  g.add(reelGrp);
  // Øjer
  [[-1.0*S], [-2.1*S], [-3.3*S]].forEach(([xPos], i) => {
    const r = 0.065 - i * 0.015;
    const ring = new THREE.Mesh(new THREE.TorusGeometry(r + 0.008, 0.010, 6, seg), mSeat);
    ring.rotation.y = Math.PI / 2; ring.position.set(xPos, 0, 0); g.add(ring);
  });
  return g;
}

// ── FISKEHYTTEN (v5 – indendørs, flytbare møbler, pejs, dør til rejsemenu) ──
function buildFishingCabin(refs, hasTurtle = false, questItems = [], movableObjectsRef = { current: [] }) {
  clearLocationObjects(refs);
  if (refs.water) refs.water.visible = false;
  movableObjectsRef.current = [];
  refs.cabinMovableObjects = movableObjectsRef;

  // v2.0: Permanent dekorativ ost i hytten når alle 3 oste-kilder er fundet
  // (cheeseSources er ikke tilgængelig her, så vi tjekker via refs)

  // Kamera er ved z=7, kigger mod (0,0,0).
  // Rum: frontvæg (bag kamera) z=+5, bagvæg (langt fremme) z=-5, sidevægge x=±6
  // Gulv og indhold er synligt foran kameraet i z-området 0 til -4

  const W = 12;   // rumbredde
  const D = 10;   // rumdybde
  const H = 5.5;  // rumhøjde (sidevægge + indhold)
  const H_BACK = 9.0; // bagvæggens fulde højde — når op til tagets spids
  const ZF = 5;   // frontvæg z (bag kamera)
  const ZB = -5;  // bagvæg z (hvad man ser)

  // ── GULV (strækker sig forbi kameraet så man ikke ser kanten) ──
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(W, D + 4),
    createCompanionPBR(0x5C4033, { roughness: 0.92 })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.position.set(0, 0.01, (ZF + ZB) / 2);
  floor.receiveShadow = true;
  addLocationObject(refs, floor);

  const wallMat = createCompanionPBR(0x7A5230, { roughness: 0.88, flatShading: true, pbrEnabled: false });
  const frameMat = createCompanionPBR(0x3E2208, { roughness: 0.9, flatShading: true, pbrEnabled: false });

  // ── SIDEVÆGGE (kun den synlige del — stopper ved z=+3, kameraet er ved z=6.5) ──
  const WALL_Z_FRONT = 3;   // sidevæggene stopper her — bag kameraets synsfelt
  const WALL_D = WALL_Z_FRONT - ZB; // dybde: fra bagvæg til WALL_Z_FRONT
  const lwMesh = new THREE.Mesh(new THREE.BoxGeometry(0.3, H, WALL_D), wallMat);
  lwMesh.position.set(-W / 2, H / 2, (WALL_Z_FRONT + ZB) / 2); addLocationObject(refs, lwMesh);
  const rwMesh = new THREE.Mesh(new THREE.BoxGeometry(0.3, H, WALL_D), wallMat);
  rwMesh.position.set(W / 2, H / 2, (WALL_Z_FRONT + ZB) / 2); addLocationObject(refs, rwMesh);

  // ── FRONTVÆG: fjernet — kameraet sidder her, ville fylde hele billedet ──

  // ── BAGVÆG MED VINDUE (vinduet er flytbart langs bagvæggen) ──────
  const WIN_W = 2.8; const WIN_H = 2.0; const WIN_Y = 3.05; // mellem 2.4 og 3.7 — vinduet sænket en smule
  const sideW = (W - WIN_W) / 2;
  const bwLeft = new THREE.Mesh(new THREE.BoxGeometry(sideW, H_BACK, 0.3), wallMat);
  bwLeft.position.set(-(WIN_W / 2 + sideW / 2), H_BACK / 2, ZB); addLocationObject(refs, bwLeft);
  const bwRight = new THREE.Mesh(new THREE.BoxGeometry(sideW, H_BACK, 0.3), wallMat);
  bwRight.position.set(WIN_W / 2 + sideW / 2, H_BACK / 2, ZB); addLocationObject(refs, bwRight);
  const topH = H_BACK - (WIN_Y + WIN_H / 2);
  const bwTopM = new THREE.Mesh(new THREE.BoxGeometry(WIN_W, topH, 0.3), wallMat);
  bwTopM.position.set(0, WIN_Y + WIN_H / 2 + topH / 2, ZB); addLocationObject(refs, bwTopM);

  // ── VINDUESLYS (behold — giver naturlig belysning indefra) ──
  const bwBotM = new THREE.Mesh(new THREE.BoxGeometry(WIN_W, WIN_Y - WIN_H / 2, 0.3), wallMat);
  bwBotM.position.set(0, (WIN_Y - WIN_H / 2) / 2, ZB); addLocationObject(refs, bwBotM);

  // ── VINDUESLYS (behold — giver naturlig belysning indefra) ──
  // Ingen falsk skyView/treeStrip — glasset er ægte gennemsigtigt til 3D-verdenen udenfor
  const windowLight = new THREE.PointLight(0xB0D8F0, 0.6, 8);
  windowLight.position.set(0, WIN_Y, ZB + 0.5); addLocationObject(refs, windowLight);

  // Vinduesgruppe — LÅST til bagvæggen (ikke flytbar)
  const windowGroup = new THREE.Group();
  const winMat = createCompanionPBR(0x99CCEE, { transparent: true, opacity: 0.22, roughness: 0.05, depthWrite: false, side: THREE.DoubleSide });
  const winGlass = new THREE.Mesh(new THREE.PlaneGeometry(WIN_W, WIN_H), winMat);
  winGlass.position.set(0, WIN_Y, 0); windowGroup.add(winGlass);
  // Ramme på begge sider (DoubleSide visning)
  [-0.18, 0.18].forEach(zo => {
    const wfH = new THREE.Mesh(new THREE.BoxGeometry(WIN_W + 0.1, 0.1, 0.06), frameMat);
    wfH.position.set(0, WIN_Y, zo); windowGroup.add(wfH);
    const wfV = new THREE.Mesh(new THREE.BoxGeometry(0.1, WIN_H + 0.1, 0.06), frameMat);
    wfV.position.set(0, WIN_Y, zo); windowGroup.add(wfV);
    const wfT = new THREE.Mesh(new THREE.BoxGeometry(WIN_W + 0.25, 0.1, 0.06), frameMat);
    wfT.position.set(0, WIN_Y + WIN_H / 2 + 0.07, zo); windowGroup.add(wfT);
    const wfB = new THREE.Mesh(new THREE.BoxGeometry(WIN_W + 0.25, 0.1, 0.06), frameMat);
    wfB.position.set(0, WIN_Y - WIN_H / 2 - 0.07, zo); windowGroup.add(wfB);
    const wfL = new THREE.Mesh(new THREE.BoxGeometry(0.1, WIN_H + 0.25, 0.06), frameMat);
    wfL.position.set(-WIN_W / 2 - 0.07, WIN_Y, zo); windowGroup.add(wfL);
    const wfR = new THREE.Mesh(new THREE.BoxGeometry(0.1, WIN_H + 0.25, 0.06), frameMat);
    wfR.position.set(WIN_W / 2 + 0.07, WIN_Y, zo); windowGroup.add(wfR);
  });
  windowGroup.position.set(0, 0, ZB + 0.02);
  windowGroup.userData = { isMovable: false, movableType: 'window' };
  addLocationObject(refs, windowGroup);
  // Vinduet tilføjes IKKE til movableObjectsRef — det er låst fast

  // ── TAG ─────────────────────────────────────────────────────────
  const roofMat = createCompanionPBR(0x4A2F12, { roughness: 1.0, flatShading: true, pbrEnabled: false });
  // Bredere (8.5 → 7) og centerposition rykket ud, så tagfladen hænger forbi sidevæggene
  const roofL = new THREE.Mesh(new THREE.BoxGeometry(8.5, 0.2, D + 4), roofMat);
  roofL.position.set(-3.2, H + 0.8, (ZF + ZB) / 2); roofL.rotation.z = 0.40; addLocationObject(refs, roofL);
  const roofR = new THREE.Mesh(new THREE.BoxGeometry(8.5, 0.2, D + 4), roofMat);
  roofR.position.set(3.2, H + 0.8, (ZF + ZB) / 2); roofR.rotation.z = -0.40; addLocationObject(refs, roofR);

  // ── DØR (venstre væg, synlig fra kameraet) ──────────────────────
  const doorFrameM = createCompanionPBR(0x3A2010, { roughness: 0.9, flatShading: true, pbrEnabled: false });
  const doorFrameMesh = new THREE.Mesh(new THREE.BoxGeometry(0.35, 4.0, 2.4), doorFrameM);
  doorFrameMesh.position.set(-W / 2 + 0.05, 2.0, 1.5); addLocationObject(refs, doorFrameMesh);
  const doorM = createCompanionPBR(0x5A3518, { roughness: 0.8, flatShading: true, pbrEnabled: false });
  const door = new THREE.Mesh(new THREE.BoxGeometry(0.2, 3.6, 2.0), doorM);
  door.position.set(-W / 2 + 0.1, 1.8, 1.5);
  door.userData = { isExitDoor: true };
  addLocationObject(refs, door);
  refs.doorMesh = door;
  const handle = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 6), createCompanionPBR(0xC8A04A, { metalness: 0.9, roughness: 0.2, flatShading: true }));
  handle.position.set(-W / 2 + 0.22, 1.8, 0.65); addLocationObject(refs, handle);

  // ── LOW-POLY MURSTEN PEJS (flytbar gruppe) ──────────────────────
  const fireplaceGroup = new THREE.Group();
  const PX = 0; const PZ = 0; // lokale koordinater — gruppen flyttes som helhed

  const brickMat = createCompanionPBR(0x888888, { flatShading: true, roughness: 0.9, pbrEnabled: false });
  const darkBrickMat = createCompanionPBR(0x5a4a45, { flatShading: true, roughness: 0.9, pbrEnabled: false });
  const fireBgMat = createCompanionPBR(0x2a1a10, { flatShading: true, roughness: 1.0, pbrEnabled: false });
  const brickGeo = new THREE.BoxGeometry(0.52, 0.24, 0.36);

  // Gulvsokkel
  for (let i = -2; i <= 2; i++) {
    const b = new THREE.Mesh(brickGeo, brickMat);
    b.position.set(i * 0.55, 0.14, 0.4);
    b.rotation.y = (Math.random() - 0.5) * 0.08; b.rotation.z = (Math.random() - 0.5) * 0.04;
    fireplaceGroup.add(b);
  }
  // Søjler venstre/højre, 7 lag
  for (let y = 1; y <= 7; y++) {
    for (const side of [-1, 1]) {
      const b = new THREE.Mesh(brickGeo, brickMat);
      b.position.set(side * 1.32, y * 0.26, 0);
      b.rotation.y = (Math.random() - 0.5) * 0.08; b.rotation.z = (Math.random() - 0.5) * 0.04;
      fireplaceGroup.add(b);
    }
  }
  // Overlægger
  for (let i = -2; i <= 2; i++) {
    const b = new THREE.Mesh(brickGeo, darkBrickMat);
    b.position.set(i * 0.55, 8 * 0.26, 0);
    b.rotation.y = (Math.random() - 0.5) * 0.08;
    fireplaceGroup.add(b);
  }
  // Mantel
  const mantel = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.17, 0.48), createCompanionPBR(0x4A2F12, { roughness: 0.75, flatShading: true, pbrEnabled: false }));
  mantel.position.set(0, 8 * 0.26 + 0.16, 0.04); fireplaceGroup.add(mantel);
  // Solid bagplade bag flammerne
  const fireBg = new THREE.Mesh(new THREE.BoxGeometry(2.6, 2.1, 0.12), createCompanionPBR(0x1a0d05, { roughness: 1.0, flatShading: true, pbrEnabled: false }));
  fireBg.position.set(0, 1.1, -0.15); fireplaceGroup.add(fireBg);
  const fireFloor = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.1, 0.7), createCompanionPBR(0x1a0d05, { roughness: 1.0, flatShading: true, pbrEnabled: false }));
  fireFloor.position.set(0, 0.12, 0.1); fireplaceGroup.add(fireFloor);
  // Skrå sidevægge
  const fsGeo = new THREE.BoxGeometry(0.18, 1.8, 0.7);
  const fsL = new THREE.Mesh(fsGeo, fireBgMat); fsL.position.set(-1.04, 1.0, 0.22); fsL.rotation.y = 0.26; fireplaceGroup.add(fsL);
  const fsR = new THREE.Mesh(fsGeo, fireBgMat); fsR.position.set( 1.04, 1.0, 0.22); fsR.rotation.y = -0.26; fireplaceGroup.add(fsR);

  // Kul
  const coalColors = [0xff4500, 0xff8c00, 0xffd700, 0xb22222];
  for (let i = 0; i < 20; i++) {
    const col = coalColors[i % coalColors.length];
    const c = new THREE.Mesh(new THREE.DodecahedronGeometry(0.11, 0), createCompanionPBR(col, { emissive: col, emissiveIntensity: 0.55 + Math.random() * 0.35, flatShading: true }));
    c.position.set((Math.random() - 0.5) * 1.5, 0.20 + Math.random() * 0.14, 0.08 + Math.random() * 0.22);
    const s = Math.random() * 0.55 + 0.45; c.scale.set(s, s, s);
    fireplaceGroup.add(c);
  }
  // Flammer
  const fireParticles = [];
  const flameColors = [0xff4500, 0xff8c00, 0xffd700];
  for (let i = 0; i < 20; i++) {
    const fcol = flameColors[i % 3];
    const fl = new THREE.Mesh(new THREE.OctahedronGeometry(0.13, 0), createCompanionPBR(fcol, { emissive: fcol, emissiveIntensity: 0.85 + Math.random() * 0.4, flatShading: true }));
    fl.scale.y = Math.random() * 1.5 + 0.8; fl.scale.x = Math.random() * 0.5 + 0.4; fl.scale.z = fl.scale.x;
    fl.position.set((Math.random() - 0.5) * 1.1, 0.55 + Math.random() * 0.65, 0.12);
    fl.userData.baseY = fl.position.y; fl.userData.speed = Math.random() * 0.02 + 0.008; fl.userData.offset = Math.random() * Math.PI * 2;
    fl.rotation.y = Math.random() * Math.PI;
    fireplaceGroup.add(fl); fireParticles.push(fl);
  }
  const fireLight = new THREE.PointLight(0xFFAA33, 2.5, 10);
  fireLight.position.set(0, 1.6, 0.5); fireplaceGroup.add(fireLight);
  refs.fireParticles = fireParticles;
  refs.fireLight = fireLight;

  fireplaceGroup.position.set(-3.6, 0, -4.5); // venstre væg, lidt til højre
  fireplaceGroup.userData = { isMovable: true, movableType: 'fireplace' };
  addLocationObject(refs, fireplaceGroup);
  movableObjectsRef.current.push(fireplaceGroup);

  // ── BORD (flytbart) ──────────────────────────────────────────────
  const tableGroup = new THREE.Group();
  const tableMat = createCompanionPBR(0x7A5230, { roughness: 0.8, flatShading: true, pbrEnabled: false });
  const tableTop = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.12, 1.4), tableMat);
  tableTop.position.y = 1.155; tableGroup.add(tableTop); // +10% højde
  [[1.1, 0.55, 0.6], [-1.1, 0.55, 0.6], [1.1, 0.55, -0.6], [-1.1, 0.55, -0.6]].forEach(([lx, ly, lz]) => {
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 1.1, 6), tableMat);
    leg.position.set(lx, ly, lz); tableGroup.add(leg);
  });
  tableGroup.position.set(0.22, 0, -1.0); // flugter med vinduet, lidt til højre
  tableGroup.userData = { isMovable: true, movableType: 'table' };
  addLocationObject(refs, tableGroup);
  movableObjectsRef.current.push(tableGroup);
  refs.tableGroup = tableGroup;

  // ── GULVTÆPPE (flytbart) ─────────────────────────────────────────
  const rugGroup = new THREE.Group();
  const rugW = 2.6 * 1.35; // lidt bredere end bordet
  const rugD = 1.4 * 1.55; // lidt dybere end bordet

  // Canvas-tekstur: lodrette striber + mørk kant
  const rugCanvas = document.createElement('canvas');
  rugCanvas.width = 512; rugCanvas.height = 512;
  const rugCtx = rugCanvas.getContext('2d');
  // Baggrund (varm beige)
  rugCtx.fillStyle = '#c8a87a';
  rugCtx.fillRect(0, 0, 512, 512);
  // Lodrette striber (mørkerød)
  rugCtx.fillStyle = '#7a0000';
  const sw = 28, sp = 72;
  for (let x = 0; x < 512; x += sp) { rugCtx.fillRect(x, 0, sw, 512); }
  // Kant
  rugCtx.strokeStyle = '#2e1a0e';
  rugCtx.lineWidth = 52;
  rugCtx.strokeRect(0, 0, 512, 512);
  const rugTex = new THREE.CanvasTexture(rugCanvas);

  const rugMesh = new THREE.Mesh(
    new THREE.PlaneGeometry(rugW, rugD),
    (() => { const q = currentGraphicsQuality || 'medium'; const c = GRAPHICS_CONFIG[q] || GRAPHICS_CONFIG.medium; return c.material === 'Physical' ? new THREE.MeshPhysicalMaterial({ map: rugTex, roughness: 0.85, metalness: 0.0, clearcoat: c.clearcoat * 0.2 }) : new THREE.MeshStandardMaterial({ map: rugTex, roughness: 1.0, metalness: 0.0 }); })()
  );
  rugMesh.rotation.x = -Math.PI / 2;
  rugMesh.position.y = 0.02; // lige over gulvet
  rugGroup.add(rugMesh);

  rugGroup.position.set(0.30, 0, -1.0); // samme startposition som bordet
  rugGroup.userData = { isMovable: true, movableType: 'rug' };
  addLocationObject(refs, rugGroup);
  movableObjectsRef.current.push(rugGroup);

  // ── STOL (flytbar) ────────────────────────────────────────────
  const chairGroup = new THREE.Group();
  const chairSeat = new THREE.Mesh(new THREE.BoxGeometry(0.72, 0.09, 0.72), tableMat);
  chairSeat.position.y = 0.792; chairGroup.add(chairSeat); // +10% højde
  const chairBack = new THREE.Mesh(new THREE.BoxGeometry(0.72, 0.72, 0.08), tableMat);
  chairBack.position.set(0, 1.21, -0.34); chairGroup.add(chairBack);
  [[0.3, 0.385, 0.3], [-0.3, 0.385, 0.3], [0.3, 0.385, -0.3], [-0.3, 0.385, -0.3]].forEach(([lx, ly, lz]) => {
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.77, 6), tableMat);
    leg.position.set(lx, ly, lz); chairGroup.add(leg);
  });
  chairGroup.position.set(1.34, 0, -1.0); // sæde under bordet, ryg udenfor kant, 180° roteret
  chairGroup.rotation.y = (3 * Math.PI) / 2; // 180° mere end før (vender mod bordet fra anden side)
  chairGroup.userData = { isMovable: true, movableType: 'chair' };
  addLocationObject(refs, chairGroup);
  movableObjectsRef.current.push(chairGroup);

  // ── AKVARIUM (flytbart) ──────────────────────────────────────
  const aquariumGroup = new THREE.Group();
  const glassMat = createCompanionPBR(0x88CCFF, { transparent: true, opacity: 0.35, roughness: 0.1 });
  const aquBase = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.08, 0.9), createCompanionPBR(0x2255AA, { roughness: 0.5 }));
  aquBase.position.y = 1.386; aquariumGroup.add(aquBase); // +10% højde (tilsvarende bord)
  [[0,1.815,0,1.8,0.8,0.05],[0,1.815,-0.45,1.8,0.8,0.05],[-0.9,1.815,0,0.05,0.8,0.9],[0.9,1.815,0,0.05,0.8,0.9],[0,2.266,0,1.8,0.05,0.9]].forEach(([x,y,z,w,h,d]) => {
    const p = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), glassMat); p.position.set(x,y,z); aquariumGroup.add(p);
  });
  const aquWater = new THREE.Mesh(new THREE.BoxGeometry(1.6,0.55,0.75), createCompanionPBR(0x1166CC, { transparent: true, opacity: 0.4 }));
  aquWater.position.set(0,1.738,0); aquariumGroup.add(aquWater);
  const aquStand = new THREE.Mesh(new THREE.BoxGeometry(1.9,1.25,1.0), createCompanionPBR(0x3E2208, { roughness: 0.9, pbrEnabled: false }));
  aquStand.position.y = 0.682; aquariumGroup.add(aquStand);
  for (let i = 0; i < 8; i++) {
    const bub = new THREE.Mesh(new THREE.SphereGeometry(0.04,6,5), new THREE.MeshBasicMaterial({ color: 0xAADDFF, transparent: true, opacity: 0.7 }));
    bub.position.set((Math.random()-0.5)*1.2, 1.54+Math.random()*0.55, (Math.random()-0.5)*0.5); aquariumGroup.add(bub);
  }
  const aquFish = new THREE.Mesh(new THREE.SphereGeometry(0.1,8,6), createCompanionPBR(0xFF6600, { roughness: 0.5 }));
  aquFish.scale.set(1.8,1,0.8); aquFish.position.set(0.3,1.782,0); aquariumGroup.add(aquFish);
  aquariumGroup.position.set(4.15, -0.20, -4.2); // samme afstand til højre væg som til vinduet (0.35)
  aquariumGroup.scale.set(1.05, 1.05, 1.05); // +5% størrelse
  aquariumGroup.userData = { isMovable: true, movableType: 'aquarium' };
  addLocationObject(refs, aquariumGroup);
  movableObjectsRef.current.push(aquariumGroup);
  refs.aquariumGroup = aquariumGroup;

  // ── BOGHYLDE (flytbar) ────────────────────────────────────────
  const shelfGroup = new THREE.Group();
  const shelfMat = createCompanionPBR(0x5A3010, { roughness: 0.85, pbrEnabled: false });
  const shelfBack = new THREE.Mesh(new THREE.BoxGeometry(2.4, 3.0, 0.12), shelfMat);
  shelfBack.position.y = 1.5; shelfGroup.add(shelfBack);
  for (let s = 0; s < 3; s++) {
    const shelf = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.08, 0.3), shelfMat);
    shelf.position.set(0, 0.7 + s * 1.1, 0.1); shelfGroup.add(shelf);
    let xPos = -0.9;
    const bookColors = [0xCC2222, 0x2244CC, 0x228833, 0xAA6622, 0x882288, 0x336666];
    for (let b = 0; b < 5 + Math.floor(Math.random() * 3); b++) {
      const bH = 0.5 + Math.random() * 0.3; const bW = 0.12 + Math.random() * 0.1;
      // depth 0.20 (kortere end hylden 0.3) og z=0.18 så bogenes bagflade (0.18-0.10=0.08)
      // er foran hyldens bagflade (0.1-0.15=-0.05) — ingen z-fighting
      const book = new THREE.Mesh(new THREE.BoxGeometry(bW, bH, 0.20), createCompanionPBR(bookColors[(s*5+b) % bookColors.length], { roughness: 0.9, pbrEnabled: false }));
      book.position.set(xPos, shelf.position.y + bH/2 + 0.045, 0.18); shelfGroup.add(book); xPos += bW + 0.06;
    }
  }
  // Bogreolen placeres op ad højre væg (x≈+6), bagbeklædning mod væggen
  // rotation.y = -PI/2 vender bagpladen mod højre væg
  shelfGroup.position.set(5.4, 0, 1.5); // op ad højre væg, modsat døren (z=1.5)
  shelfGroup.rotation.y = -Math.PI / 2;
  shelfGroup.userData = { isMovable: true, movableType: 'shelf' };
  addLocationObject(refs, shelfGroup);
  movableObjectsRef.current.push(shelfGroup);

  // ── FISKESTANGSVÆG (flytbar) ────────────────────────────────────
  const rodWallGroup = buildRodWall();
  rodWallGroup.position.set(5.4, 2.091, -1.3); // højre væg: lidt tilbage fra akvariet
  rodWallGroup.rotation.y = -Math.PI / 2;     // drejet mod rummet (samme som bogreolen)
  rodWallGroup.userData = { isMovable: true, movableType: 'rod_wall' };
  addLocationObject(refs, rodWallGroup);
  movableObjectsRef.current.push(rodWallGroup);

  // ── SKILT fjernet ────────────────────────────────────────────

  // ── SKILDPADDE (flytbar) ──────────────────────────────────────
  if (hasTurtle) {
    const turtle = buildGiantLandTurtle();
    turtle.scale.set(0.34 * 1.05, 0.34 * 1.05, 0.34 * 1.05); // +5% størrelse (0.357)
    turtle.position.set(-1.92, 0.19, -1.48); // Skildpadde: ny position
    turtle.rotation.y = -Math.PI * 0.15; // Skildpadde: front mod spiller, bagende mod pejs
    turtle.userData.isMovable = true;
    turtle.userData.movableType = 'turtle';
    movableObjectsRef.current.push(turtle);

// Palmer til Tropisk Ø
const _trunkMat = createCompanionPBR(0x6B4A31, { roughness: 0.9, flatShading: false, pbrEnabled: false });
const _leafMat  = createCompanionPBR(0x2E8B57, { roughness: 0.8, flatShading: false });
const _brightLeafMat = createCompanionPBR(0x3CB371, { roughness: 0.8, flatShading: false });
const _nutMat   = createCompanionPBR(0x3E2723, { roughness: 1.0, flatShading: false, pbrEnabled: false });

function _createPalmLeaf(mat, sx, sy, sz) {
  const leaf = new THREE.Mesh(new THREE.SphereGeometry(1, 10, 6), mat);
  leaf.scale.set(sx, sy, sz); return leaf;
}

function buildPalm1() {
  const group = new THREE.Group();
  let yPos = 0, radius = 0.42;
  for (let i = 0; i < 12; i++) {
    const seg = new THREE.Mesh(new THREE.CylinderGeometry(radius * 0.9, radius, 0.33, 8), _trunkMat);
    seg.position.set(Math.sin(i * 0.12) * 0.28, yPos, Math.cos(i * 0.12) * 0.14);
    seg.rotation.z = Math.sin(i * 0.12) * 0.08;
    group.add(seg); yPos += 0.29; radius *= 0.96;
  }
  const crown = new THREE.Group();
  crown.position.set(Math.sin(11 * 0.12) * 0.28, yPos, Math.cos(11 * 0.12) * 0.14);
  for (let i = 0; i < 7; i++) {
    const leaf = _createPalmLeaf(_leafMat, 2.2, 0.14, 0.55);
    const pivot = new THREE.Group(); leaf.position.set(1.4, 0, 0); pivot.add(leaf);
    pivot.rotation.y = (i / 7) * Math.PI * 2; pivot.rotation.z = 0.38 + Math.random() * 0.28;
    crown.add(pivot);
  }
  for (let i = 0; i < 3; i++) {
    const nut = new THREE.Mesh(new THREE.DodecahedronGeometry(0.25, 1), _nutMat);
    nut.position.set(Math.cos(i * 2.1) * 0.28, -0.18, Math.sin(i * 2.1) * 0.28); crown.add(nut);
  }
  group.add(crown);
  return group;
}

function buildPalm4() {
  const group = new THREE.Group();
  const fullCrown = new THREE.Group();
  function createBranch(rotAngle, heightMod) {
    const branch = new THREE.Group(); let yPos = 0, xPos = 0, radius = 0.38;
    for (let i = 0; i < 10; i++) {
      const seg = new THREE.Mesh(new THREE.CylinderGeometry(radius * 0.9, radius, 0.38, 7), _trunkMat);
      seg.position.set(xPos, yPos, 0); seg.rotation.z = rotAngle * (i / 10); branch.add(seg);
      yPos += 0.32 * heightMod; xPos += rotAngle * 0.13; radius *= 0.95;
    }
    const crown = new THREE.Group(); crown.position.set(xPos, yPos, 0);
    for (let i = 0; i < 6; i++) {
      const leaf = _createPalmLeaf(_brightLeafMat, 1.9, 0.12, 0.48);
      const pivot = new THREE.Group(); leaf.position.set(1.1, 0, 0); pivot.add(leaf);
      pivot.rotation.y = (i / 6) * Math.PI * 2; pivot.rotation.z = 0.3 + Math.random() * 0.28;
      crown.add(pivot);
    }
    for (let i = 0; i < 2; i++) {
      const nut = new THREE.Mesh(new THREE.DodecahedronGeometry(0.22, 1), _nutMat);
      nut.position.set(Math.cos(i * 3.14) * 0.22, -0.18, Math.sin(i * 3.14) * 0.22); crown.add(nut);
    }
    fullCrown.add(crown); group.add(branch);
  }
  createBranch(0.5, 1.0); createBranch(-0.7, 0.88);
  group.add(fullCrown);
  return group;
}

function buildCave(refs) {

  const rockPositions = [
    [0, 2, -18], [-12, 0, -14], [12, 0, -14],
    [-18, -2, -4], [18, -2, -4],
    [-16, 1, 8], [16, 1, 8],
    [-8, 4, -20], [8, 4, -20],
    [0, 8, -22],
  ];
  rockPositions.forEach(([x, y, z], i) => {

  });

  // Drypsten fra loftet
  const stalMat = createCompanionPBR(0x1a1a1a, { roughness: 0.9, flatShading: true, pbrEnabled: false });
  for (let i = 0; i < 8; i++) {
    const h = 1.5 + Math.random() * 3;

    stal.position.set(-8 + i * 2.3 + (Math.random() - 0.5), 10 - h / 2, -8 + Math.random() * 6);
    stal.rotation.z = Math.PI;
    addLocationObject(refs, stal);
  }

  // Krystal-gløde punkter på vægge (selvlysende grønne krystaller)
  const crystalColors = [0x00ff88, 0x00ffcc, 0x44ff44, 0x88ffcc];
  for (let i = 0; i < 6; i++) {

      -10 + Math.random() * 4

    refs._crystals = refs._crystals || [];

  // Glødende spore-partikler (bioluminescens)

    color: 0x4ade80,
    size: 0.22,
    transparent: true,

    blending: THREE.AdditiveBlending,
    depthWrite: false,
  });
  const sporeMesh = new THREE.Points(sporeGeo, sporeMat);
  addLocationObject(refs, sporeMesh);
  refs._caveSpores = { mesh: sporeMesh, pos: sporePos, count: sporeCount, alpha: sporeAlpha };

  // Svagt grønt ambient lys fra sporerne
  const sporeAmbient = new THREE.PointLight(0x00ff88, 0.4, 30);

const RAT_ALLOWED_LOCATIONS = ['pier', 'smaragd', 'tropical_island', 'forbidden'];

function buildHarborRat(locationId) {
  const g = new THREE.Group();
  const mat = createCompanionPBR(0x7A6A5A, { roughness: 0.55, pbrEnabled: false, flatShading: false });
  const hrSegs = Math.max(5, (GRAPHICS_CONFIG[currentGraphicsQuality || 'medium'] || GRAPHICS_CONFIG.medium).segments >> 2);
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.18, hrSegs, hrSegs - 1), mat);
  body.scale.set(1.4, 0.9, 1.0);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.12, hrSegs, hrSegs - 1), mat);
  head.position.set(0.22, 0.04, 0);
  const snout = new THREE.Mesh(new THREE.SphereGeometry(0.055, hrSegs - 1, hrSegs - 2), mat);
  snout.position.set(0.33, 0.0, 0);
  const earL = new THREE.Mesh(new THREE.SphereGeometry(0.06, hrSegs - 1, hrSegs - 2), createCompanionPBR(0x9A8A7A, { roughness: 0.45, pbrEnabled: false, flatShading: false }));
  earL.position.set(0.2, 0.14, 0.08);
  const earR = earL.clone(); earR.position.z = -0.08;
  const tailM = createCompanionPBR(0xE8A090, { roughness: 0.4, pbrEnabled: false, flatShading: false });
  const tail = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.008, 0.45, hrSegs), tailM);
  tail.position.set(-0.34, -0.04, 0); tail.rotation.z = Math.PI / 2.5;
  const eyeWM = new THREE.MeshBasicMaterial({ color: 0xFFFFFF });
  const pupilM = new THREE.MeshBasicMaterial({ color: 0x000000 });
  const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.02, hrSegs, hrSegs), eyeWM);
  eyeL.position.set(0.32, 0.06, 0.06);
  const pL = new THREE.Mesh(new THREE.SphereGeometry(0.008, 4, 4), pupilM);
  pL.position.set(0.016, 0, 0.005); eyeL.add(pL);
  const eyeR = new THREE.Mesh(new THREE.SphereGeometry(0.02, hrSegs, hrSegs), eyeWM);
  eyeR.position.set(0.32, 0.06, -0.06);
  const pR = new THREE.Mesh(new THREE.SphereGeometry(0.008, 4, 4), pupilM);
  pR.position.set(0.016, 0, -0.005); eyeR.add(pR);
  g.add(body, head, snout, earL, earR, tail, eyeL, eyeR);
  g.userData.isHarborRat = true;

  var sx, ex, gy, baseZ, startZ;
  if (locationId === 'pier')            { sx=-0.880; ex=-0.880; gy=0.640; baseZ=3.0;  startZ=14; }
  else if (locationId === 'smaragd')    { sx=-0.5;   ex=-0.5;  gy=1.28;  baseZ=2.5;  startZ=14; }
  else if (locationId === 'tropical_island') { sx=-0.5; ex=-0.5; gy=1.28; baseZ=2.5; startZ=14; }
  else                                  { sx=-0.5;   ex=-0.5;  gy=1.28;  baseZ=2.5;  startZ=14; }

  g.position.set(sx, gy, startZ);

  g.userData.ratParams = { sx: sx, ex: ex, gy: gy, baseZ: baseZ, startZ: startZ };

  g.userData.update = function(time) {
    var p = this.userData.ratParams;
    var t = time % 16;
    if (t < 5) {
      // Løb ind: fra bag kameraet (startZ høj) frem mod vandet (baseZ lav)
      var raw = t / 5;
      var prog = raw - Math.sin(raw * Math.PI * 4) * 0.04;
      this.position.x = p.sx + Math.sin(t * 2.5) * 0.08;
      this.position.z = p.startZ + (p.baseZ - p.startZ) * prog;
      this.position.y = p.gy + Math.abs(Math.sin(t * 15)) * 0.06;
      // Snude langs X-akse → drej -90° for at pege mod negativ Z (fremad)
      this.rotation.y = Math.PI / 2 + Math.sin(t * 10) * 0.12;
    } else if (t < 9) {
      // Snuser rundt ude på molen
      this.position.x = p.sx + Math.sin(t * 1.2) * 0.3;
      this.position.y = p.gy;
      this.position.z = p.baseZ + Math.sin(t * 1.5) * 0.4;
      this.rotation.y = Math.PI / 2 + Math.sin(t * 3) * 0.6 + Math.sin(t * 12) * 0.1;
    } else if (t < 14) {
      // Løb tilbage: fra molen (baseZ lav) bagud (startZ høj)
      var raw2 = (t - 9) / 5;
      var prog2 = raw2 - Math.sin(raw2 * Math.PI * 4) * 0.04;
      this.position.x = p.sx + Math.sin(t * 2.5) * 0.08;
      this.position.z = p.baseZ + (p.startZ - p.baseZ) * prog2;
      this.position.y = p.gy + Math.abs(Math.sin(t * 15)) * 0.06;
      // Peger mod positiv Z (bagud mod kameraet)
      this.rotation.y = -Math.PI / 2 + Math.sin(t * 10) * 0.12;
    } else {
      // Pause bag kameraet
      this.position.set(p.sx, p.gy, p.startZ);
      this.rotation.y = -Math.PI / 2;
    }
  };
  return g;
}

function spawnHarborRat(refs, locationId) {
  if (refs.harborRat) {
    refs.scene.remove(refs.harborRat);
    refs.harborRat = null;
  }
  if (RAT_ALLOWED_LOCATIONS.indexOf(locationId) === -1) return;
  var rat = buildHarborRat(locationId);
  refs.scene.add(rat);
  refs.harborRat = rat;
}
