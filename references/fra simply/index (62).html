  'kraken': 'krakenPenalty', 'halibut': 'wishMenu', 'golden_fish': 'instantGold',
  'jellyfish': 'bucketWipe', 'axolotl': 'companionUnlock', 'gnavne_gorm': 'bossReward',
  'crystal_junk': 'crystalReward', 'plesiosaur': 'consumeBait', 'oyster': 'pearlDrop'
};

// NB: LOCATIONS er endnu ikke defineret her, så 'all' resolves ved runtime i matchesLocation()
const ENRICHED_CATCH_DATA = CATCH_MASTER_DATA.map(c => {
  const rarityRange = WEIGHT_RANGES[c.rarity] || [1, 5];
  return {
    ...c,
    locations: [...c.primaryAreas], // beholder 'all' som streng – resolves i matchesLocation()
    weightRange: [rarityRange[0], rarityRange[1]],
    fightParams: FIGHT_PARAMS[c.itemType] || { requiredAnswers: 1, baseTimeLimit: 0 },
    specialOnCatch: SPECIAL_ON_CATCH[c.itemType] || null,
    lootWeight: (c.type === 'fish') ? (LOOT_WEIGHTS[c.rarity] || 10) : 0
  };
});
// Hjælper: Tjek om en enriched entry matcher en given lokation (håndterer 'all')
function matchesLocation(entry, location) {
  return entry.locations.includes(location) || entry.locations.includes('all');
}

function getEnrichedEntry(id) { return ENRICHED_CATCH_DATA.find(e => e.id === id) || null; }

function getCandidatesForLocation(location, level, upgrades, activeBait) {
  return ENRICHED_CATCH_DATA.filter(e => {
    if (e.type !== 'fish') return false;
    if (!matchesLocation(e, location)) return false;
    if (level < e.minLevel) return false;
    if (e.requirements.requiredRod && !upgrades.includes(e.requirements.requiredRod)) return false;
    if (e.requirements.requiredBait && e.requirements.requiredBait !== activeBait) return false;
    return true;
  });
}

const MODIFIER_PIPELINE = {
  applyLootModifiers(baseWeights, ctx) {
    const w = { ...baseWeights };
    if (ctx.activeConchBait) w.rare *= 1.25;
    if (ctx.activeFossilBait) w.legendary *= 1.15;
    if (ctx.weatherType === 'storm') { w.rare *= 1.20; w.legendary *= 1.10; }
    if (ctx.weatherType === 'rain') w.rare *= 1.10;
    if (ctx.hasLuck) { w.rare *= 1.10; w.legendary *= 1.05; }
    // Fremtidig: if (ctx.doubleXpWeekend) { w.legendary *= 1.5; w.rare *= 1.3; }
    return w;
  },
  applyCombatModifiers(baseFP, ctx) {
    let { requiredAnswers, baseTimeLimit } = baseFP;
    let timeLimit = baseTimeLimit > 0 ? baseTimeLimit : (ctx.difficulty === 3 ? 12 : ctx.difficulty === 2 ? 10 : 8);
    if (ctx.isBoss || ctx.isPlesiosaur) timeLimit = Math.max(timeLimit, 30);
    timeLimit += (ctx.rodTimeBonus || 0);
    if (ctx.zenMode) timeLimit = Infinity;
    return { requiredAnswers, timeLimit };
  },
  applyRewardModifiers(baseReward, ctx) {
    let { value, xp } = baseReward;
    if (ctx.weatherType === 'storm' && value > 0) value = Math.ceil(value * 1.25);
    let xpMultiplier = ctx.upgrades?.includes('luxury_boat') ? 2 : ctx.upgrades?.includes('golden_hook') ? 1.4 : 1;
    if (ctx.mathCategory && ctx.mathCategory !== 'basic') xp = (xp || 0) + 15;
    // Fremtidig: if (ctx.doubleXpWeekend) xpMultiplier *= 2;
    return { value, xp, xpMultiplier, specialEvent: ctx.specialOnCatch || null };
  }
};

const DESERT_SET = ['desert_sunglasses','desert_waterbottle','desert_sunhat','desert_sunscreen'];
const ARCTIC_SET = ['arctic_beanie','arctic_gloves','arctic_hotwater','arctic_scarf'];

function getUnlockedAreas(level, upgrades, questItems = []) {
  return Object.values(LOCATIONS).filter(loc => {
    if (level < loc.unlockLevel) return false;
    if (loc.requiresItem === null) return true;
    if (loc.requiresItem === 'desert_set') return DESERT_SET.every(id => upgrades.includes(id));
    if (loc.requiresItem === 'arctic_set') return ARCTIC_SET.every(id => upgrades.includes(id));
    if (loc.id === 'fishing_cabin') return upgrades.includes('magnet') && questItems.includes('cabin_key');
    if (loc.id === 'tropical_island') return upgrades.includes('rowboat');
    if (loc.id === 'cave') return upgrades.includes('rowboat') && upgrades.includes('headlamp');
    if (loc.requiresQuestItem) return questItems.includes(loc.requiresQuestItem);
    return upgrades.includes(loc.requiresItem);
  });
}

const XP_REWARDS = { fish: { Almindelig: 10, Sjælden: 25, Legendarisk: 60 }, item: { treasure: 80, junk: 2 }, weightBonus: (weight) => Math.min(Math.floor(weight * 2), 40) };
const XP_BALANCING = { baseXp: 100, linearStep: 75, exponentialFrom: 10, exponentialRate: 1.06 };
function xpNeededForLevel(lvl) {
  const { baseXp, linearStep, exponentialFrom, exponentialRate } = XP_BALANCING;
  const linear = baseXp + (lvl - 1) * linearStep;
  if (lvl <= exponentialFrom) return linear;
  return Math.floor(linear * Math.pow(exponentialRate, lvl - exponentialFrom));
}
function calcXpForCatch(catchData) {
  if (!catchData) return 0;
  if (catchData.itemType === 'junk') return XP_REWARDS.item.junk;
  if (catchData.itemType === 'bottle') return 50;
  if (catchData.itemType === 'fossil') return 0;
  if (catchData.itemType === 'plesiosaur') return 500;
  if (catchData.itemType === 'treasure') return XP_REWARDS.item.treasure;
  const base = XP_REWARDS.fish[catchData.rarity] ?? XP_REWARDS.fish.Almindelig;
  return base + XP_REWARDS.weightBonus(catchData.weight ?? 0);
}
function getDifficultyThresholds(level) {
  if (level <= 2) return { hard: 0.95, medium: 0.80 };
  if (level <= 5) return { hard: 0.85, medium: 0.55 };
  if (level <= 9) return { hard: 0.70, medium: 0.35 };
  if (level <= 14) return { hard: 0.55, medium: 0.20 };
  return { hard: 0.45, medium: 0.15 };
}
function rollDifficulty(level) {
  const r = Math.random();
  const { hard, medium } = getDifficultyThresholds(level);
  if (r > hard) return 3;
  if (r > medium) return 2;
  return 1;
}
function getRarityWeights(level, areaBonus = 0) {
  const bonus = areaBonus;
  return { junk: Math.max(2, 15 - level), common: Math.max(20, 55 - level * 1.5), rare: Math.min(40, 15 + level * 1.5 + bonus * 30), legendary: Math.min(25, 5 + level * 0.8 + bonus * 20), treasure: Math.min(12, 2 + level * 0.4 + bonus * 10) };
}

function initAudio() {

function playSoundEffect(type) {
  const ctx = initAudio();
  if (!ctx) return;

function startAmbience() {
  const ctx = initAudio();
  if (!ctx || ambienceNode) return;
  const bufferSize = 2 * ctx.sampleRate;
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
  const noise = ctx.createBufferSource();
  noise.buffer = buffer; noise.loop = true;
  const filter = ctx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 400;
  const gainNode = ctx.createGain(); gainNode.gain.value = 0.05;
  const lfo = ctx.createOscillator(); const lfoGain = ctx.createGain();
  lfo.type = 'sine'; lfo.frequency.value = 0.1; lfoGain.gain.value = 0.03;
  noise.connect(filter); filter.connect(gainNode); lfo.connect(lfoGain); lfoGain.connect(gainNode.gain); gainNode.connect(ctx.destination);
  noise.start(); lfo.start();
  ambienceNode = noise; ambienceGain = gainNode;
}

function stopAmbience() {
  if (ambienceNode) { try { ambienceNode.stop(); ambienceNode.disconnect(); } catch (_) {} ambienceNode = null; }
  if (ambienceGain) { ambienceGain.disconnect(); ambienceGain = null; }
  setRainVolume(0); // Sluk regn hvis ambience slukkes
}

function setRainVolume(vol) {
  const ctx = initAudio();
  if (!ctx) return;
  if (vol > 0 && !rainNode) {
    // Start rain loop (white noise filtered high)
    const bSize = ctx.sampleRate;
    const buf = ctx.createBuffer(1, bSize, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0; i<bSize; i++) d[i] = Math.random() * 2 - 1;
    rainNode = ctx.createBufferSource();
    rainNode.buffer = buf;
    rainNode.loop = true;
    const rainFilter = ctx.createBiquadFilter();
    rainFilter.type = 'highpass';
    rainFilter.frequency.value = 800;
    rainGain = ctx.createGain();
    rainGain.gain.value = 0;
    rainNode.connect(rainFilter);
    rainFilter.connect(rainGain);
    rainGain.connect(ctx.destination);
    rainNode.start();
  }
  if (rainGain) {
    rainGain.gain.setTargetAtTime(vol * 0.15, ctx.currentTime, 0.5);
  }
  if (vol === 0 && rainNode) {
    setTimeout(() => {
      if (rainGain && rainGain.gain.value < 0.001) {
        try { rainNode.stop(); } catch(e){}
        rainNode = null; rainGain = null;
      }
    }, 1000);
  }
}

function generateRegneHistorie(mathDifficulty, activeOps) {
  // Filtrér templates efter aktive regnearter
  const opsToCheck = activeOps && activeOps.length > 0 ? activeOps.filter(o => ['+','-','*','/'].includes(o)) : ['+','-','*','/'];
  const possible = REGNEHISTORIE_TEMPLATES.filter(t => opsToCheck.includes(t.type));
  if (possible.length === 0) return null;
  const tmpl = possible[Math.floor(Math.random() * possible.length)];

  let a, b, total, div, answer;

  if (tmpl.type === '+') {
    a = Math.floor(Math.random() * (tmpl.maxA - tmpl.minA + 1)) + tmpl.minA;
    b = Math.floor(Math.random() * (tmpl.maxB - tmpl.minB + 1)) + tmpl.minB;
    answer = a + b;
  } else if (tmpl.type === '-') {
    a = Math.floor(Math.random() * (tmpl.maxA - tmpl.minA + 1)) + tmpl.minA;
    b = Math.floor(Math.random() * (tmpl.maxB - tmpl.minB + 1)) + tmpl.minB;
    if (tmpl.cond && !tmpl.cond(a,b)) b = Math.floor(a * 0.6);
    answer = a - b;
  } else if (tmpl.type === '*') {
    a = Math.floor(Math.random() * (tmpl.maxA - tmpl.minA + 1)) + tmpl.minA;
    b = Math.floor(Math.random() * (tmpl.maxB - tmpl.minB + 1)) + tmpl.minB;
    answer = a * b;
  } else if (tmpl.type === '/') {
    div = tmpl.divOptions[Math.floor(Math.random() * tmpl.divOptions.length)];
    const base = mathDifficulty === 'beginner' ? 6 : mathDifficulty === 'intermediate' ? 9 : 12;
    answer = base + Math.floor(Math.random() * 6);
    total = answer * div;
  }

  let question = tmpl.template
    .replace('{a}', a || '')
    .replace('{b}', b || '')
    .replace('{total}', total || '')
    .replace('{div}', div || '');

  return {
    question: question,
    answer: answer,
    difficulty: 2,
    op: tmpl.type,
    multiplier: OP_MULTIPLIERS[tmpl.type] || 1,
    category: 'regnehistorier',
    displayType: 'regnehistorie',
    unit: tmpl.unit,
    xpBonus: 20,
    rarityBonus: 0.15
  };
}

const OP_MULTIPLIERS = { '+': 1, '-': 2, '*': 3, '/': 4, 'tenfriends': 1, '100friends': 1.25, 'skaeve100friends': 1.5 };

function generateNumbersForOp(op, mathDifficulty) {
  let a, b;
  if (op === '+') {
    if (mathDifficulty === 'beginner')          { a = Math.floor(Math.random() * 9) + 1; b = Math.floor(Math.random() * 9) + 1; }
    else if (mathDifficulty === 'intermediate') { a = Math.floor(Math.random() * 50) + 10; b = Math.floor(Math.random() * 40) + 5; }
    else /* expert */                           { a = Math.floor(Math.random() * 600) + 100; b = Math.floor(Math.random() * 500) + 50; }
  } else if (op === '-') {
    if (mathDifficulty === 'beginner')          { a = Math.floor(Math.random() * 9) + 1; b = Math.floor(Math.random() * a) + 1; }
    else if (mathDifficulty === 'intermediate') { a = Math.floor(Math.random() * 70) + 20; b = Math.floor(Math.random() * (a - 1)) + 1; }
    else /* expert */                           { a = Math.floor(Math.random() * 700) + 200; b = Math.floor(Math.random() * (a - 1)) + 1; }
  } else if (op === '*') {
    if (mathDifficulty === 'beginner') {
      const easyTables = [1, 2, 5, 10];
      a = easyTables[Math.floor(Math.random() * easyTables.length)];
      b = Math.floor(Math.random() * 10) + 1;
    } else if (mathDifficulty === 'intermediate') {
      a = Math.floor(Math.random() * 7) + 3;
      b = Math.floor(Math.random() * 7) + 3;
    } else /* expert */ {
      a = Math.floor(Math.random() * 30) + 10;
      b = Math.floor(Math.random() * 9) + 2;
    }
  } else { // division
    if (mathDifficulty === 'beginner') {
      const easyDivisors = [1, 2, 5, 10];
      b = easyDivisors[Math.floor(Math.random() * easyDivisors.length)];
      const ans = Math.floor(Math.random() * 9) + 1;
      a = b * ans;
    } else if (mathDifficulty === 'intermediate') {
      b = Math.floor(Math.random() * 7) + 3;
      const ans = Math.floor(Math.random() * 9) + 2;
      a = b * ans;
    } else /* expert */ {
      b = Math.floor(Math.random() * 9) + 2;
      const ans = Math.floor(Math.random() * 15) + 5;
      a = b * ans;
    }
  }
  return { a, b };
}

function generateMultiTermProblem(mathDifficulty) {
  // 3 led: a op1 b op2 c
  const ops = ['+', '-'];
  const op1 = ops[Math.floor(Math.random() * ops.length)];
  const op2 = ops[Math.floor(Math.random() * ops.length)];
  let a, b, c;
  if (mathDifficulty === 'beginner') {
    a = Math.floor(Math.random() * 8) + 2;
    b = Math.floor(Math.random() * 5) + 1;
    c = Math.floor(Math.random() * 5) + 1;
  } else {
    a = Math.floor(Math.random() * 30) + 10;
    b = Math.floor(Math.random() * 20) + 5;
    c = Math.floor(Math.random() * 15) + 1;
  }
  // Sikr positivt resultat
  let result = a;
  result = op1 === '+' ? result + b : result - b;
  result = op2 === '+' ? result + c : result - c;
  if (result < 0) { return generateMultiTermProblem(mathDifficulty); }
  const sym1 = op1 === '-' ? '−' : '+';
  const sym2 = op2 === '-' ? '−' : '+';
  return {
    question: `${a} ${sym1} ${b} ${sym2} ${c}`,
    answer: result,
    difficulty: 3,
    op: '*',
    multiplier: 4,
    category: 'multi-term',
    displayType: 'text'
  };
}

function generateEquationProblem(mathDifficulty) {
  // Simpel ligning: a + x = c  eller  x − b = c
  const type = Math.floor(Math.random() * 3);
  let question, answer;
  if (type === 0) {
    // a + x = c
    const a = Math.floor(Math.random() * 15) + 1;
    const x = Math.floor(Math.random() * 15) + 1;
    const c = a + x;
    question = `${a} + x = ${c}`;
    answer = x;
  } else if (type === 1) {
    // x − b = c
    const x = Math.floor(Math.random() * 20) + 5;
    const b = Math.floor(Math.random() * (x - 1)) + 1;
    const c = x - b;
    question = `x − ${b} = ${c}`;
    answer = x;
  } else {
    // b × x = c
    const b = Math.floor(Math.random() * 8) + 2;
    const x = Math.floor(Math.random() * 10) + 1;
    const c = b * x;
    question = `${b} × x = ${c}`;
    answer = x;
  }
  return {
    question,
    answer,
    difficulty: 3,
    op: '*',
    multiplier: 4,
    category: 'equations',
    displayType: 'text'
  };
}

function generateDecimalProblem(mathDifficulty) {
  // Simpel decimal +/- med 1 decimal
  const isAdd = Math.random() < 0.6;
  const a = Math.round((Math.random() * 8 + 1) * 10) / 10; // 1.0–9.0
  const b = Math.round((Math.random() * 4 + 0.5) * 10) / 10; // 0.5–4.5
  let result;
  if (isAdd) {
    result = Math.round((a + b) * 10) / 10;
  } else {
    const big = Math.max(a, b);
    const small = Math.min(a, b);
    result = Math.round((big - small) * 10) / 10;
    return {
      question: `${big} ${isAdd ? '+' : '−'} ${small}`,
      answer: result,
      difficulty: 3,
      op: isAdd ? '+' : '-',
      multiplier: 4,
      category: 'decimals',
      displayType: 'text',
      isDecimal: true
    };
  }
  return {
    question: `${a} ${isAdd ? '+' : '−'} ${b}`,
    answer: result,
    difficulty: 3,
    op: isAdd ? '+' : '-',
    multiplier: 4,
    category: 'decimals',
    displayType: 'text',
    isDecimal: true
  };
}

/**
 * Genererer et regnestykke – understøtter basic + ekspert-kategorier + 10'er-venner.
 */
function generateMathProblem(difficulty, allowDivision = false, activeOps = null, mathDifficulty = 'intermediate', mathCategory = 'basic') {
  // 10'er-venner har egen generator
  if (activeOps && activeOps.includes('tenfriends') && activeOps.length === 1) {
    return generateTenFriendsProblem(mathDifficulty);
  }
  if (activeOps && activeOps.includes('tenfriends') && Math.random() < 0.3) {
    return generateTenFriendsProblem(mathDifficulty);
  }

  // 100'er-venner (Kysten)
  if (activeOps && activeOps.includes('100friends') && activeOps.length === 1) {
    return generate100FriendsQuestion(activeOps);
  }
  if (activeOps && activeOps.includes('100friends') && Math.random() < 0.3) {
    return generate100FriendsQuestion(activeOps);
  }

  // Skæve 100'er-venner (4.-6. klasse)
  if (activeOps && activeOps.includes('skaeve100friends') && activeOps.length === 1) {
    return generateSkaeve100FriendsQuestion(activeOps);
  }
  if (activeOps && activeOps.includes('skaeve100friends') && Math.random() < 0.3) {
    return generateSkaeve100FriendsQuestion(activeOps);
  }

  // Regnehistorier har egen generator
  if (mathCategory === 'regnehistorier') {
    const rh = generateRegneHistorie(mathDifficulty, activeOps);
    if (rh) return rh;
  }

  // Ekspert-kategorier (brøker fjernet)
  if (mathCategory === 'multi-term') return generateMultiTermProblem(mathDifficulty);
  if (mathCategory === 'equations')  return generateEquationProblem(mathDifficulty);
  if (mathCategory === 'decimals')   return generateDecimalProblem(mathDifficulty);

  // Standard basic-logik
  let ops;
  if (activeOps && activeOps.length > 0) {
    ops = activeOps.filter(o => o !== 'tenfriends' && o !== '100friends' && o !== 'skaeve100friends');
    if (ops.length === 0) ops = ['+'];
  } else {
    if (difficulty === 1) ops = ['+'];
    else if (difficulty === 2) ops = ['+', '-', '*'];
    else ops = allowDivision ? ['+', '-', '*', '/'] : ['+', '-', '*'];
  }

  const op = ops[Math.floor(Math.random() * ops.length)];
  const { a, b } = generateNumbersForOp(op, mathDifficulty);

  const answer = op === '+' ? a + b : op === '-' ? a - b : op === '*' ? a * b : a / b;
  const opSymbol = op === '*' ? '×' : op === '/' ? ':' : op;
  const multiplier = OP_MULTIPLIERS[op] ?? 1;

  return { question: `${a} ${opSymbol} ${b}`, answer, difficulty, op, multiplier, category: 'basic', displayType: 'text' };
}

function rollRarity(level, areaBonus) {
  const w = getRarityWeights(level, areaBonus);
  const entries = [['treasure', w.treasure], ['legendary', w.legendary], ['rare', w.rare], ['common', w.common], ['junk', w.junk]];
  const total = entries.reduce((s, [, v]) => s + v, 0);
  let roll = Math.random() * total;
  for (const [key, weight] of entries) {
    roll -= weight; if (roll <= 0) return key;
  }
  return 'common';
}

function rollForCatch(difficulty, hasLuck, level = 1, areaBonus = 0, hasMapLeft = false, location = 'pier', isBossFight = false, junkStreak = 0, helleflynderCaught = 0, questItems = [], activeConchBait = false, activeFossilBait = false, activeBait = null) {

// ── Pipeline rarity-roll (med modificerede vægte) ──
function rollRarityPipeline(w) {
  const entries = [['treasure', w.treasure], ['legendary', w.legendary], ['rare', w.rare], ['common', w.common], ['junk', w.junk]];
  const total = entries.reduce((s, [, v]) => s + v, 0);
  let roll = Math.random() * total;
  for (const [key, wt] of entries) { roll -= wt; if (roll <= 0) return key; }
  return 'common';
}
// ── Weighted fish selection ──
function weightedFishPick(entries) {
  const totalW = entries.reduce((s, e) => s + (e.lootWeight || 1), 0);
  let roll = Math.random() * totalW;
  for (const entry of entries) { roll -= (entry.lootWeight || 1); if (roll <= 0) return entry; }
  return entries[entries.length - 1];
}
function createJunkItem() { return { id: makeId(), species: 'Gammel Støvle', weight: 1.5, value: 0, rarity: 'Skrald', color: 0x4A3728, itemType: 'junk' }; }
function getRequirementText(fish) {
  const req = fish.requirements || {};
  let text = [];
  if (req.requiredRod === 'rod_mahogni') text.push('Mahogni-stang');
  if (req.requiredBait === 'bait') text.push('Mystisk madding (fra piraten)');
  if (req.requiredBait === 'biolum_floats') text.push('Bioluminescerende Flåd');
  return text.length ? `Kræver: ${text.join(' + ')}` : 'Ingen specielle krav';
}

function applyXP(currentLevel, currentXp, amount) {
  let level = currentLevel; let xp = currentXp + amount; const levelUps = [];
  while (xp >= xpNeededForLevel(level)) { xp -= xpNeededForLevel(level); level += 1; levelUps.push(level); }
  return { level, xp, levelUps };
}

  const deck = new THREE.Mesh(new THREE.BoxGeometry(4, 0.3, 12.2), createCompanionPBR(0xDCE8F0, { roughness: 0.3, flatShading: true }));
  deck.position.set(0, 0.3, 5); deck.castShadow = true; deck.receiveShadow = true; g.add(deck);
  const edgeMat = createCompanionPBR(0x1E3A5F, { metalness: 0.7, roughness: 0.3, flatShading: true });
  for (let side of [-2, 2]) {
    const edge = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 12.2, 16), edgeMat);
    edge.position.set(side, 0.35, 5); edge.rotation.x = Math.PI / 2; g.add(edge);
    const rail = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 12, 12), createCompanionPBR(0xE0E8F0, { metalness: 0.95, roughness: 0.05, flatShading: true }));
    rail.position.set(side * 0.9, 1.1, 5); rail.rotation.x = Math.PI / 2; g.add(rail);
  }
  for (let z = 0; z <= 10; z += 2) {
    for (let side of [-1.8, 1.8]) {
      const post = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.8, 8), edgeMat);
      post.position.set(side, 0.75, z); post.castShadow = true; g.add(post);
    }
  }
  return g;
});
BRIDGE_MODELS.push(() => { // 4 = Mystisk Ruin (Grotte)
  const g = new THREE.Group();

  const glowMat = createCompanionPBR(0x2A4A3A, { emissive: 0x001F10, emissiveIntensity: 0.8 });
  for (let z = 0; z <= 10; z += 3.5) {

});

// ── BUILD-FUNKTIONER TIL BROER ───────────────────────────────────────────────
function buildBridgeForLocation(refs, locationId) {
  // Fjern gammel bro hvis den findes
  const bridgeKeys = ['locationBridge'];
  bridgeKeys.forEach(key => {
    if (refs[key]) { refs.scene.remove(refs[key]); refs[key] = null; }
  });
  if (locationId === 'fishing_cabin') return; // Ingen bro ved hytten

  let bridgeMesh;
  if (locationId === 'desert_lake') {
    bridgeMesh = BRIDGE_MODELS[1]();
    bridgeMesh.position.set(0, -0.3, 0);
    bridgeMesh.scale.set(1.05, 1, 1.0);
  } else if (locationId === 'forbidden') {
    bridgeMesh = BRIDGE_MODELS[2]();
    bridgeMesh.position.set(0, 0.05, 0);
    bridgeMesh.rotation.y = Math.PI * 0.02;
  } else if (locationId === 'arctic_sea') {
    bridgeMesh = BRIDGE_MODELS[3]();
    bridgeMesh.position.set(0, 0.1, 0);
  } else if (locationId === 'cave') {
    bridgeMesh = BRIDGE_MODELS[4]();
    bridgeMesh.position.set(0, 0.1, 0);
    bridgeMesh.scale.set(0.95, 1, 0.95);
  } else {
    // pier + alle andre/fremtidige lokationer → Træmole
    bridgeMesh = BRIDGE_MODELS[0]();
    bridgeMesh.position.set(0, 0.1, 0);
  }
  addLocationObject(refs, bridgeMesh);
  refs.locationBridge = bridgeMesh;
}

// ── DETALJERET FISKESTANG MODEL ────────────────────────────────────────────
function buildFishingRod(theme) {
  const rodGroup = new THREE.Group();
  const seg = 24; // Glatte cylindere, men ikke overdrevent tungt

  const matRod   = createCompanionPBR(theme.rodColor, { roughness: 0.8, metalness: theme.metalness });
  const matGrip  = createCompanionPBR(theme.gripColor, { roughness: 0.9, flatShading: true, pbrEnabled: false });
  const matSeat  = createCompanionPBR(theme.seatColor, { roughness: 0.3, metalness: 0.8 });
  const matReel  = createCompanionPBR(theme.reelBase, { roughness: 0.6, metalness: 0.4 });
  const matSpool = createCompanionPBR(theme.spoolColor, { roughness: 0.5, metalness: 0.2 });

  // Greb (bageste)
  const gripBack = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 0.9, 12), matGrip);
  gripBack.rotation.z = Math.PI / 2; gripBack.position.set(1.0, 0, 0); gripBack.castShadow = true; rodGroup.add(gripBack);

  // Endeknop
  const buttCap = new THREE.Mesh(new THREE.SphereGeometry(0.14, 12, 8), matSeat);
  buttCap.position.set(1.45, 0, 0); rodGroup.add(buttCap);

  // Reel seat
  const reelSeat = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 0.7, seg), matSeat);
  reelSeat.rotation.z = Math.PI / 2; reelSeat.position.set(0.2, 0, 0); reelSeat.castShadow = true; rodGroup.add(reelSeat);

  // Greb (forreste)
  const gripFront = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 0.4, 12), matGrip);
  gripFront.rotation.z = Math.PI / 2; gripFront.position.set(-0.35, 0, 0); gripFront.castShadow = true; rodGroup.add(gripFront);

  // Klinge (aftaperende skaft)
  const shaftLength = 4.5;
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.08, shaftLength, seg), matRod);
  shaft.rotation.z = Math.PI / 2; shaft.position.set(-0.55 - (shaftLength / 2), 0, 0); shaft.castShadow = true; rodGroup.add(shaft);

  // Fiskehjul
  const reelGroup = new THREE.Group();
  reelGroup.position.set(0.2, -0.12, 0);
  const stem = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.2, 0.06), matReel);
  stem.position.set(0, -0.1, 0); reelGroup.add(stem);
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 0.25, seg), matReel);
  body.rotation.z = Math.PI / 2; body.position.set(0.05, -0.22, 0); reelGroup.add(body);
  const spoolBack = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.05, seg), matSeat);
  spoolBack.rotation.z = Math.PI / 2; spoolBack.position.set(-0.1, -0.22, 0); reelGroup.add(spoolBack);
  const spoolCenter = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.15, seg), matSpool);
  spoolCenter.rotation.z = Math.PI / 2; spoolCenter.position.set(-0.2, -0.22, 0); reelGroup.add(spoolCenter);
  const spoolFront = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.1, 0.08, seg), matSeat);
  spoolFront.rotation.z = Math.PI / 2; spoolFront.position.set(-0.31, -0.22, 0); reelGroup.add(spoolFront);
  const crankShaft = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.2, 8), matSeat);
  crankShaft.rotation.x = Math.PI / 2; crankShaft.position.set(0.05, -0.22, 0.2); reelGroup.add(crankShaft);
  const crankKnob = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.12, 12), matReel);
  crankKnob.rotation.x = Math.PI / 2; crankKnob.position.set(0.05, -0.22, 0.3); reelGroup.add(crankKnob);
  rodGroup.add(reelGroup);

  // Øjer + line guides langs klingen
  const ringPositions = [-1.2, -2.5, -3.8, -4.9];
  ringPositions.forEach((xPos, i) => {
    const progress = Math.abs((xPos - (-0.55)) / shaftLength);
    const currentRadius = 0.08 - (progress * 0.06);
    const outerRing = new THREE.Mesh(new THREE.TorusGeometry(currentRadius + 0.01, 0.015, 8, seg), matSeat);
    outerRing.rotation.y = Math.PI / 2; outerRing.position.set(xPos, 0, 0); rodGroup.add(outerRing);
    const eyeRadius = 0.03 - (i * 0.005);
    const eyeY = -currentRadius - 0.05;
    const eye = new THREE.Mesh(new THREE.TorusGeometry(eyeRadius, 0.008, 8, 16), matSeat);
    eye.rotation.y = Math.PI / 2; eye.position.set(xPos, eyeY, 0); rodGroup.add(eye);
    const support = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, 0.05, 8), matSeat);
    support.position.set(xPos, -currentRadius - 0.025, 0); rodGroup.add(support);
  });

  return rodGroup;
}

function buildBobber() {
  const group = new THREE.Group();

  // Materialer
  const stickMat = createCompanionPBR(0x1a1a1a, {
    roughness: 0.6, metalness: 0.15, flatShading: false
  });
  const redMat = createCompanionPBR(0xe02828, {
    roughness: 0.45, metalness: 0.05, flatShading: false
  });
  const whiteMat = createCompanionPBR(0xf8f8f8, {
    roughness: 0.7, metalness: 0.0, flatShading: false
  });

  // Skaler ned så proppen passer i spilscenen
  const S = 0.055;

  // Sorte pinde
  const stickGeo = new THREE.CylinderGeometry(0.11 * S, 0.11 * S, 4.0 * S, 14);

  const topStick = new THREE.Mesh(stickGeo, stickMat);
  topStick.position.y = 3.35 * S;
  topStick.castShadow = true;
  group.add(topStick);
  const lineAttachment = new THREE.Object3D();
  lineAttachment.position.set(0, 3.35 * S + 2.0 * S, 0);
  group.add(lineAttachment);
  group.userData.lineAttachment = lineAttachment;

  const bottomStick = new THREE.Mesh(stickGeo, stickMat);
  bottomStick.position.y = -6.25 * S;
  bottomStick.castShadow = true;
  group.add(bottomStick);

  // Rød top (LatheGeometry)
  const redPoints = [];
  for (let i = 0; i <= 14; i++) {
    const t = i / 14;
    redPoints.push(new THREE.Vector2(
      Math.sin((Math.PI / 2) * t) * 1.68 * S,
      Math.cos((Math.PI / 2) * t) * 1.45 * S - 0.1 * S
    ));
  }
  const redTop = new THREE.Mesh(new THREE.LatheGeometry(redPoints, 24), redMat);
  redTop.castShadow = true;
  redTop.receiveShadow = true;
  group.add(redTop);

  // Hvid bund (LatheGeometry)
  const whitePoints = [];
  for (let i = 0; i <= 26; i++) {
    const t = i / 26;
    const radius = (1.72 * Math.pow(1 - t, 0.67) + 0.14 * t) * S;
    const y = -4.25 * t * S;
    whitePoints.push(new THREE.Vector2(radius, y));
  }
  const whiteBottom = new THREE.Mesh(new THREE.LatheGeometry(whitePoints, 24), whiteMat);
  whiteBottom.castShadow = true;
  whiteBottom.receiveShadow = true;
  group.add(whiteBottom);

  // Let oprejst vinkel så snøren møder pindens spids
  group.rotation.z = -Math.PI / 5;

  group.castShadow = true;
  return group;
}
function createLowPolyCloud() {
  const cloud = new THREE.Group();
  const geo = new THREE.DodecahedronGeometry(1, 0);
  const mat = createCompanionPBR(0xffffff, { flatShading: false, roughness: 0.1 });
  const count = 3 + Math.floor(Math.random() * 3);
  for (let i = 0; i < count; i++) { const m = new THREE.Mesh(geo, mat); m.position.set(Math.random() * 2 - 1, Math.random() * 0.5, Math.random() * 2 - 1); m.scale.setScalar(0.5 + Math.random() * 0.5); cloud.add(m); }
  return cloud;
}
function createCatchModel(catchData, location = 'pier') {
  const group = new THREE.Group();
  if (catchData.itemType === 'junk') {
    const junkMat = createCompanionPBR(0x4A3728, { roughness: 0.9, flatShading: true, pbrEnabled: false });
    const shaft = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.2, 0.6), junkMat); shaft.position.y = 0.6;
    const foot = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.5, 1.0), junkMat); foot.position.set(0, 0.25, 0.3);
    group.add(shaft, foot); group.rotation.x = Math.PI / 6; group.scale.setScalar(1.5);
  } else if (catchData.itemType === 'treasure') {
    const woodMat = createCompanionPBR(0x8B4513, { roughness: 0.7, flatShading: true, pbrEnabled: false });
    const goldMat = createCompanionPBR(0xFFD700, { metalness: 0.8, roughness: 0.2 });
    const base = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.8, 0.8), woodMat);
    const lid = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 1.2, 16, 1, false, 0, Math.PI), goldMat);
    lid.rotation.z = Math.PI / 2; lid.position.y = 0.4;
    const lock = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.3, 0.1), goldMat); lock.position.set(0, 0.3, 0.4);
    group.add(base, lid, lock);
  } else if (catchData.itemType === 'crystal_junk') {
    // ── UR-KRYSTAL (~1000 polygoner via flatShading geometrier) ────
    const crystalMat = createCompanionPBR(0x00FFFF, {
      emissive: 0x0066AA, emissiveIntensity: 0.6,
      roughness: 0.05, metalness: 0.9, flatShading: true, transparent: true, opacity: 0.88
    });
    const innerMat = createCompanionPBR(0x88FFFF, {
      emissive: 0x00AAFF, emissiveIntensity: 0.8,
      roughness: 0.0, metalness: 1.0, transparent: true, opacity: 0.55
    });
    // Hoved-oktaeder
    const core = new THREE.Mesh(new THREE.OctahedronGeometry(0.8, 2), crystalMat);
    core.scale.set(1, 1.6, 1);
    // Indre glødende kerne
    const inner = new THREE.Mesh(new THREE.OctahedronGeometry(0.45, 1), innerMat);
    inner.scale.set(1, 1.6, 1);
    // Sideskår
    const shard1 = new THREE.Mesh(new THREE.TetrahedronGeometry(0.5, 1), crystalMat);
    shard1.position.set(0.55, -0.25, 0.3); shard1.rotation.set(0.4, 0.2, 0.8);
    const shard2 = new THREE.Mesh(new THREE.TetrahedronGeometry(0.6, 1), crystalMat);
    shard2.position.set(-0.45, 0.3, -0.4); shard2.rotation.set(-0.2, 0.7, -0.5);
    const shard3 = new THREE.Mesh(new THREE.TetrahedronGeometry(0.35, 1), crystalMat);
    shard3.position.set(0.2, -0.5, -0.5); shard3.rotation.set(0.8, -0.3, 0.4);
    // Glow-punkt
    const glow = new THREE.PointLight(0x00FFFF, 1.5, 4);
    group.add(core, inner, shard1, shard2, shard3, glow);
  } else if (catchData.itemType === 'axolotl') {
    // ── GLØDENDE AXOLOTL ──────────────────────────────────────────
    const axoMat = createCompanionPBR(0xFFB6C1, { roughness: 0.4, flatShading: true });
    const axoDarkMat = createCompanionPBR(0xFF7FA8, { roughness: 0.5, flatShading: true });
    const axoGillMat = createCompanionPBR(0xFF1493, { emissive: 0xFF1493, emissiveIntensity: 0.5, flatShading: true });
    const axoEyeMat = new THREE.MeshBasicMaterial({ color: 0x1a0010 });
    const axoShineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const axoBody = new THREE.Mesh(new THREE.SphereGeometry(0.4, 10, 8), axoMat);
    axoBody.scale.set(1.8, 1.0, 1.0);
    const axoHead = new THREE.Mesh(new THREE.SphereGeometry(0.38, 10, 8), axoMat);
    axoHead.position.x = 0.72; axoHead.scale.set(1.0, 0.85, 1.0);
    const axoJaw = new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 6), axoMat);
    axoJaw.position.set(0.85, -0.1, 0); axoJaw.scale.set(0.9, 0.5, 1.1);
    const axoTail = new THREE.Mesh(new THREE.ConeGeometry(0.25, 0.9, 6), axoDarkMat);
    axoTail.rotation.z = Math.PI / 2; axoTail.position.x = -0.9;
    const axoDorsalFin = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.55, 4), axoDarkMat);

    const axoEyeL = new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 6), axoEyeMat);
    axoEyeL.position.set(0.88, 0.14, 0.22);
    const axoEyeR = new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 6), axoEyeMat);
    axoEyeR.position.set(0.88, 0.14, -0.22);
    const axoShineL = new THREE.Mesh(new THREE.SphereGeometry(0.035, 5, 4), axoShineMat);
    axoShineL.position.set(0.95, 0.18, 0.23);
    const axoShineR = axoShineL.clone(); axoShineR.position.set(0.95, 0.18, -0.23);
    [-0.18, 0, 0.18].forEach((zOff, gi) => {
      const gLen = 0.28 - gi * 0.02;
      const gillL = new THREE.Mesh(new THREE.ConeGeometry(0.055, gLen, 4), axoGillMat);
      gillL.position.set(0.62 - gi * 0.04, 0.28, 0.32 + Math.abs(zOff));
      gillL.rotation.set(0.5, 0, 0.4);
      const gillR = new THREE.Mesh(new THREE.ConeGeometry(0.055, gLen, 4), axoGillMat);
      gillR.position.set(0.62 - gi * 0.04, 0.28, -0.32 - Math.abs(zOff));
      gillR.rotation.set(-0.5, 0, 0.4);
      const branchL = new THREE.Mesh(new THREE.SphereGeometry(0.05, 5, 4), axoGillMat);
      branchL.position.copy(gillL.position);
      const branchR = branchL.clone(); branchR.position.copy(gillR.position);
      group.add(gillL, gillR, branchL, branchR);

    [[-0.2, -0.35, 0.38],[0.3, -0.35, 0.38],[-0.2, -0.35, -0.38],[0.3, -0.35, -0.38]].forEach(([lx,ly,lz]) => {

    group.add(axoBody, axoHead, axoJaw, axoTail, axoDorsalFin, axoEyeL, axoEyeR, axoShineL, axoShineR, axoGlow);
    group.scale.setScalar(1.3);

    keyShape.moveTo(0, 2); keyShape.lineTo(1.5, 1); keyShape.lineTo(1.5, -1);
    keyShape.lineTo(0.3, -1.5); keyShape.lineTo(0.3, -5);

    const keyGlow = new THREE.PointLight(0xFFD700, 1.2, 5);
    keyGlow.position.set(0, 0.5, 1);
    group.add(keyMesh, keyGlow);
    group.scale.setScalar(0.28);
    group.rotation.z = 0.15;

      const tooth = new THREE.Mesh(new THREE.ConeGeometry(0.07, th, 4), gormToothMat);
      tooth.position.set(0.55 + (Math.random() - 0.5) * 0.3, -0.25, -0.55 + (ti * 0.18));
      tooth.rotation.set(0.1 + Math.random() * 0.25, 0, (Math.random() - 0.5) * 0.4);
      group.add(tooth);
    }
    const gormEyeMat = new THREE.MeshBasicMaterial({ color: 0xFF2200 });
    const gormEyeGeo = new THREE.SphereGeometry(0.08, 6, 5);
    const gormEyeL = new THREE.Mesh(gormEyeGeo, gormEyeMat); gormEyeL.position.set(0.55, 0.38, 0.55);
    const gormEyeR = new THREE.Mesh(gormEyeGeo, gormEyeMat); gormEyeR.position.set(0.55, 0.38, -0.55);
    const gormStalk = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 1.3, 5), gormStalkMat);
    gormStalk.position.set(0.3, 1.15, 0); gormStalk.rotation.z = -0.5;
    const gormBulbMat = createCompanionPBR(0x39FF14, { emissive: 0x39FF14, emissiveIntensity: 1.2 });
    const gormBulb = new THREE.Mesh(new THREE.SphereGeometry(0.22, 9, 8), gormBulbMat);
    gormBulb.position.set(0.85, 1.75, 0);

  } else if (catchData.itemType === 'bottle' || catchData.itemType === 'fossil' || catchData.itemType === 'oyster') {

  } else {

          }

      }
      return cuteModel;
    }
    // Fallback: generisk fisk for ukendte ID'er
    const isLeg = catchData.rarity === 'Legendarisk'; const isAbyss = location === 'abyss';
    const fishColor = isAbyss && isLeg ? new THREE.Color(catchData.color).multiplyScalar(0.6) : catchData.color;
    const mat = createCompanionPBR(fishColor, { roughness: isAbyss ? 0.15 : 0.3, metalness: isLeg ? (isAbyss ? 0.95 : 0.8) : 0.1, flatShading: true });
    const body = new THREE.Mesh(new THREE.ConeGeometry(0.5, 2, 8), mat); body.rotation.z = Math.PI / 2;
    const tail = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.8, 4), mat); tail.rotation.z = -Math.PI / 2; tail.position.x = -1.2;
    const fin = new THREE.Mesh(new THREE.TetrahedronGeometry(0.3), mat); fin.position.set(0, 0.5, 0); fin.rotation.y = Math.PI / 4;
    const eyeGeo = new THREE.SphereGeometry(0.1, 8, 8); const eyeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
    const eyeL = new THREE.Mesh(eyeGeo, eyeMat); eyeL.position.set(0.6, 0.1, 0.2);
    const eyeR = new THREE.Mesh(eyeGeo, eyeMat); eyeR.position.set(0.6, 0.1, -0.2);
    group.add(body, tail, fin, eyeL, eyeR);
    const baseScale = 0.5 + catchData.weight / 30;
    group.scale.setScalar(catchData.itemType === 'plesiosaur' ? baseScale * 0.5 : baseScale);
  }
  return group;
}
/* ================================================================
   v9.0 – Procedural Scale Texture Generator
   ================================================================ */
function createScaleTexture(color, isNormalMap, resolution, quality) {
  if (resolution === 0) return null;
  const key = `${color}_${quality}_${isNormalMap}`;
  if (fishTextureCache.has(key)) return fishTextureCache.get(key);

  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = resolution;
  const ctx = canvas.getContext('2d');

  // Base fill
  if (isNormalMap) {
    ctx.fillStyle = '#8080ff';
    ctx.fillRect(0, 0, resolution, resolution);
  } else {
    ctx.fillStyle = typeof color === 'number' ? '#' + color.toString(16).padStart(6, '0') : color;
    ctx.fillRect(0, 0, resolution, resolution);
  }

  // Radial gradient for smooth UV fade at poles (prevents pinching artifacts)
  const grad = ctx.createRadialGradient(
    resolution / 2, resolution / 2, resolution * 0.05,
    resolution / 2, resolution / 2, resolution * 0.5
  );
  if (isNormalMap) {
    grad.addColorStop(0, 'rgba(128,128,255,0)');
    grad.addColorStop(1, 'rgba(128,128,255,0)');
  } else {
    grad.addColorStop(0, 'rgba(255,255,255,0.08)');
    grad.addColorStop(1, 'rgba(0,0,0,0.12)');
  }
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, resolution, resolution);

  // Overlapping scales pattern
  const scaleCount = quality === 'ultra' ? 220 : quality === 'high' ? 180 : 120;
  const rows = quality === 'ultra' ? 14 : quality === 'high' ? 10 : 8;
  const cols = quality === 'ultra' ? 16 : quality === 'high' ? 12 : 10;
  const cellW = resolution / cols;
  const cellH = resolution / rows;

  for (let row = 0; row < rows; row++) {
    for (let col = 0; col < cols; col++) {
      const offsetX = (row % 2 === 0) ? 0 : cellW * 0.5;
      const cx = col * cellW + offsetX + cellW * 0.5;
      const cy = row * cellH + cellH * 0.5;
      const r = Math.min(cellW, cellH) * 0.45;

      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);

      if (isNormalMap) {
        // Normal map: raised scale bumps
        const ng = ctx.createRadialGradient(cx - r * 0.3, cy - r * 0.3, 0, cx, cy, r);
        ng.addColorStop(0, 'rgba(160,160,255,0.7)');
        ng.addColorStop(0.6, 'rgba(128,128,255,0.3)');
        ng.addColorStop(1, 'rgba(100,100,255,0.1)');
        ctx.fillStyle = ng;
      } else {
        // Diffuse: subtle highlight per scale
        const sg = ctx.createRadialGradient(cx - r * 0.2, cy - r * 0.2, 0, cx, cy, r);
        sg.addColorStop(0, 'rgba(255,255,255,0.18)');
        sg.addColorStop(0.5, 'rgba(255,255,255,0.04)');
        sg.addColorStop(1, 'rgba(0,0,0,0.08)');
        ctx.fillStyle = sg;
      }
      ctx.fill();

      // Scale outline
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      if (isNormalMap) {
        ctx.strokeStyle = 'rgba(90,90,200,0.25)';
      } else {
        ctx.strokeStyle = 'rgba(0,0,0,0.1)';
      }
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }

  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
  fishTextureCache.set(key, texture);
  return texture;
}

/* ================================================================
   v9.0 – Organic Fish Body (LatheGeometry with smooth profile)
   ================================================================ */
function createFishBody(config, quality) {
  const cfg = GRAPHICS_CONFIG[quality] || GRAPHICS_CONFIG.medium;
  const segs = cfg.segments;

  // Profile curve: snout → thick belly → narrow tail
  // LatheGeometry rotates these Vector2 points around Y-axis
  // x = radius at that height, y = position along body axis
  const profilePoints = [];
  const steps = Math.max(12, segs);

  // Define control points for the fish silhouette
  const controlX = [0.02, 0.35, 0.65, 0.82, 0.75, 0.50, 0.22, 0.08]; // radius
  const controlY = [0.0,  0.12, 0.30, 0.50, 0.65, 0.80, 0.92, 1.0];  // along body

  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    // Catmull-Rom style interpolation through control points
    let x = 0, totalWeight = 0;
    for (let j = 0; j < controlX.length; j++) {
      const dist = Math.abs(t - controlY[j]);
      const w = Math.max(0, 1 - dist * controlX.length * 0.42);
      const ww = w * w * (3 - 2 * w); // smoothstep
      x += controlX[j] * ww;
      totalWeight += ww;
    }
    x = totalWeight > 0 ? x / totalWeight : 0.01;
    // Ensure endpoints are nearly zero for clean caps
    if (i === 0) x = 0.015;
    if (i === steps) x = 0.01;
    profilePoints.push(new THREE.Vector2(x, t * 2.0)); // scale Y to body length
  }

  const geometry = new THREE.LatheGeometry(profilePoints, segs);
  // Rotate so the fish body lies along X-axis (nose forward)
  geometry.rotateZ(-Math.PI / 2);
  // Center the body
  geometry.translate(0.0, 0, 0);
  geometry.computeVertexNormals();

  return geometry;
}

      metalness: 0.12,
      roughness: 0.18,
      clearcoat: gfxCfg.clearcoat,
      clearcoatRoughness: 0.08,
      emissive: config.emissive || 0x000000,
      emissiveIntensity: config.emissive ? 0.45 : (gfxCfg.shimmer > 0 ? 0.06 : 0),
    });
    // Apply env map only to fish (not scene-wide) with exposure from slider
    if (window._fishEnvMap) {
      physMat.envMap = window._fishEnvMap;
      physMat.envMapIntensity = window.pmremExposure ?? 0.65;
    }
    if (scaleTex) physMat.map = scaleTex;
    if (normalTex) {
      physMat.normalMap = normalTex;
      physMat.normalScale = new THREE.Vector2(1.2, 1.2);
    }
    // Ultra shimmer: subtle emissive glow for "wet iridescent" look
    if (gfxCfg.shimmer > 0) {
      physMat.emissive = new THREE.Color(col).lerp(new THREE.Color(0x4488ff), 0.15);
      physMat.emissiveIntensity = 0.08;
    }

    body = new THREE.Mesh(bodyGeo, physMat);
    // Also upgrade fin material for higher qualities
    finMat.roughness = 0.25;
    finMat.metalness = 0.08;
  }

  body.scale.set(sz * 0.7, sy * 0.7, sx * 0.7);
  group.add(body);

  // Øjne — store og nuttede
  const eyeWGeo = new THREE.SphereGeometry(0.14, 10, 8);
  const eyePGeo = new THREE.SphereGeometry(0.08, 8, 6);
  const eyeShGeo = new THREE.SphereGeometry(0.035, 5, 4);
  const eyeL = new THREE.Mesh(eyeWGeo, eyeWhiteMat);
  eyeL.position.set(sz * 0.65, sy * 0.15, sx * 0.55);
  const pupilL = new THREE.Mesh(eyePGeo, eyePupilMat);
  pupilL.position.set(sz * 0.73, sy * 0.16, sx * 0.57);
  const shineL = new THREE.Mesh(eyeShGeo, eyeShineMat);
  shineL.position.set(sz * 0.76, sy * 0.21, sx * 0.59);
  const eyeR = eyeL.clone(); eyeR.position.z = -eyeL.position.z;
  const pupilR = pupilL.clone(); pupilR.position.z = -pupilL.position.z;
  const shineR = shineL.clone(); shineR.position.z = -shineL.position.z;
  group.add(eyeL, pupilL, shineL, eyeR, pupilR, shineR);

  // Halegruppe
  const tailGroup = new THREE.Group();
  if (config.tail === 'forked') {
    const t1 = new THREE.Mesh(new THREE.ConeGeometry(0.28, 0.9, 10), finMat);
    t1.rotation.z = -Math.PI / 4; t1.position.set(-sz * 0.72, sy * 0.25, 0);
    const t2 = new THREE.Mesh(new THREE.ConeGeometry(0.28, 0.9, 10), finMat);
    t2.rotation.z = -Math.PI * 0.75; t2.position.set(-sz * 0.72, -sy * 0.25, 0);
    tailGroup.add(t1, t2);
  } else if (config.tail === 'shark') {
    const tMain = new THREE.Mesh(new THREE.ConeGeometry(0.36, 1.3, 10), finMat);
    tMain.rotation.z = -Math.PI / 3; tMain.position.set(-sz * 0.72, sy * 0.45, 0);
    const tLow = new THREE.Mesh(new THREE.ConeGeometry(0.18, 0.7, 8), finMat);
    tLow.rotation.z = -Math.PI * 0.62; tLow.position.set(-sz * 0.68, -sy * 0.18, 0);
    tailGroup.add(tMain, tLow);
  } else if (config.tail === 'flat' || config.tail === 'whip') {
    const t = new THREE.Mesh(new THREE.ConeGeometry(0.45, 1.0, 12), finMat);
    t.rotation.z = Math.PI / 2; t.position.set(-sz * 0.72, 0, 0);
    tailGroup.add(t);
  } else if (config.tail === 'eel' || config.isEel) {
    const t = new THREE.Mesh(new THREE.ConeGeometry(0.18, 0.7, 8), finMat);
    t.rotation.z = Math.PI / 2; t.position.set(-sz * 0.8, 0, 0);
    tailGroup.add(t);
  } else if (config.tail === 'dino') {
    const t = new THREE.Mesh(new THREE.ConeGeometry(0.5, 1.4, 10), finMat);
    t.rotation.z = -Math.PI * 0.45; t.position.set(-sz * 0.8, sy * 0.35, 0);
    tailGroup.add(t);
  } else if (config.tail !== 'none') {
    // Standard
    const t = new THREE.Mesh(new THREE.ConeGeometry(0.38, 1.1, 14), finMat);
    t.rotation.z = Math.PI / 2; t.position.set(-sz * 0.75, 0, 0);
    tailGroup.add(t);
  }
  group.userData.tailGroup = tailGroup;
  group.add(tailGroup);

  // Ryg-finne
  if (config.finUp || config.tail === 'shark' || config.spikes) {
    const dCount = config.spikes ? 3 : 1;
    for (let di = 0; di < dCount; di++) {
      const dorsal = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.65, 8), finMat);
      dorsal.position.set(sz * (0.15 - di * 0.2), sy * 0.68, 0);
      group.add(dorsal);
    }
  }

  // Side-finne (brystfinne)
  const sideFinGeo = new THREE.ConeGeometry(0.15, 0.55, 7);
  const sideFinL = new THREE.Mesh(sideFinGeo, finMat);
  sideFinL.position.set(sz * 0.12, -sy * 0.28, sx * 0.7);
  sideFinL.rotation.set(0.5, 0, 0.6);
  const sideFinR = sideFinL.clone();
  sideFinR.position.z = -sideFinL.position.z;
  sideFinR.rotation.x = -0.5;
  group.add(sideFinL, sideFinR);

  // ─── SPECIELLE KENDETEGN ─────────────────────────────────────────
  if (config.stripes) {
    const stripeMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.2 });
    for (let si = 0; si < 2; si++) {
      const stripe = new THREE.Mesh(new THREE.TorusGeometry(sy * 0.72, 0.075, 6, 20), stripeMat);
      stripe.rotation.y = Math.PI / 2;
      stripe.position.x = sz * (0.0 - si * 0.22);
      group.add(stripe);
    }
  }
  if (config.spots) {
    const spotMat = new THREE.MeshBasicMaterial({ color: config.spots });
    for (let si = 0; si < 6; si++) {
      const spot = new THREE.Mesh(new THREE.SphereGeometry(0.085, 5, 4), spotMat);
      const angle = (si / 6) * Math.PI * 2;
      spot.position.set(
        sz * (-0.1 + Math.cos(angle * 0.7) * 0.38),
        sy * (Math.sin(angle) * 0.45),
        sx * (Math.cos(angle) * 0.55)
      );
      group.add(spot);
    }
  }
  if (config.sword) {
    const sword = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.02, 2.0, 6), bodyMat);
    sword.rotation.z = Math.PI / 2; sword.position.x = sz * 0.75 + 1.0;
    group.add(sword);
  }
  if (config.longBeak) {
    const beak = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.03, sz * 0.9, 6), bodyMat);
    beak.rotation.z = Math.PI / 2; beak.position.x = sz * 0.75 + sz * 0.4;
    group.add(beak);
  }
  if (config.whiskers) {
    // Knurhår (Karpe)
    [-0.12, 0.12].forEach((yOff, wi) => {
      const w = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.01, 0.55, 4), finMat);
      w.position.set(sz * 0.72, yOff, sx * 0.25 * (wi === 0 ? 1 : -1));
      w.rotation.z = 0.5;
      group.add(w);
    });
  }
  if (config.isDino) {
    // Plesiosaurus — lang hals frem
    const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.28, 1.4, 8), bodyMat);
    neck.rotation.z = -Math.PI / 3; neck.position.set(sz * 0.72, sy * 0.55, 0);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.3, 10, 8), bodyMat);
    head.position.set(sz * 1.1, sy * 1.1, 0);
    const dEyeL = new THREE.Mesh(new THREE.SphereGeometry(0.07, 6, 5), eyePupilMat);
    dEyeL.position.set(sz * 1.24, sy * 1.18, 0.17);
    const dEyeR = dEyeL.clone(); dEyeR.position.z = -0.17;
    group.add(neck, head, dEyeL, dEyeR);
    // Flipper
    const flipperGeo = new THREE.SphereGeometry(0.35, 8, 6);
    flipperGeo.scale(1.6, 0.35, 1.0);
    [[sz*0.2, -sy*0.6, sx*0.85],[sz*0.2, -sy*0.6, -sx*0.85]].forEach(([fx,fy,fz]) => {
      const fl = new THREE.Mesh(flipperGeo, bodyMat);
      fl.position.set(fx, fy, fz);
      group.add(fl);
    });
  }
  if (config.lure || config.isBossGorm) {
    const stalk = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.2, 6), bodyMat);
    stalk.position.set(sz * 0.35, sy * 0.7, 0); stalk.rotation.z = -0.45;
    const bulbMat = new THREE.MeshStandardMaterial({ color: 0x39FF14, emissive: 0x39FF14, emissiveIntensity: 1.2 });
    const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.17, 10, 8), bulbMat);
    bulb.position.set(sz * 0.7, sy * 1.15, 0);
    const lureLight = new THREE.PointLight(0x39FF14, 1.5, 5);
    bulb.add(lureLight);
    group.add(stalk, bulb);
  }

  const finalScale = (config.scale || 1.0) * 0.55;
  group.scale.setScalar(finalScale);
  return group;
}

/* ================================================================
   animateCuteFishQueue — animér nuttede fisk i spanden
   ================================================================ */
function animateCuteFishQueue(bucketFishModels, time) {
  if (!bucketFishModels) return;
  bucketFishModels.forEach((fishModel, index) => {
    if (!fishModel || !fishModel.userData.fishConfig) return;
    const config = fishModel.userData.fishConfig;
    const speed = (config.speed || 1.0) * 2.5;
    const offset = index * 0.6;
    fishModel.position.y += Math.sin(time * speed + offset) * 0.003;
    if (fishModel.userData.tailGroup) {
      fishModel.userData.tailGroup.rotation.y = Math.sin(time * speed * 2 + offset) * 0.35;
    }
    fishModel.rotation.y += Math.sin(time * speed * 1.3 + offset) * 0.005;
  });
}

function getSeagullPalette(locationId, formation = 'pair') {
  if (locationId === 'desert_lake') return { body: 0x1a1a1a, wing: 0x101010 };
  if (locationId === 'tropical_island') {
    return formation === 'single'
      ? { body: 0xcc2b2b, wing: 0x9a1f1f } // enlig fugl = rød
      : { body: 0x2e8b57, wing: 0x1f6b41 }; // par-fugle = grøn
  }
  return { body: 0xf5f5f0, wing: 0xe8e8e0 };
}

/* ================================================================
   v9.0 – Companion PBR Material Helper
   Creates quality-adaptive materials for non-fish creatures.
   Options: { roughness, metalness, flatShading, useScales, emissive, transparent, opacity, side, pbrEnabled }
   pbrEnabled: true (default) = clearcoat + envMap. false = matte look (no clearcoat/envMap).
   ================================================================ */
function createCompanionPBR(color, opts = {}) {
  const quality = currentGraphicsQuality || 'medium';
  const cfg = GRAPHICS_CONFIG[quality] || GRAPHICS_CONFIG.medium;
  const roughness = opts.roughness ?? 0.45;
  const metalness = opts.metalness ?? 0.08;
  const flatShading = opts.flatShading ?? true;
  const pbrEnabled = opts.pbrEnabled !== false; // default true

  if (cfg.material === 'Standard' || quality === 'low') {
    return new THREE.MeshStandardMaterial({
      color,
      roughness: Math.min(1, roughness + 0.15),
      metalness: Math.max(0, metalness - 0.05),
      flatShading,
      ...(opts.emissive ? { emissive: opts.emissive, emissiveIntensity: opts.emissiveIntensity || 0.3 } : {}),
      ...(opts.transparent ? { transparent: true, opacity: opts.opacity ?? 0.9 } : {}),
      ...(opts.side ? { side: opts.side } : {}),
    });
  }

  const matOpts = {
    color,
    roughness,
    metalness,
    clearcoat: pbrEnabled ? cfg.clearcoat * 0.6 : 0,
    clearcoatRoughness: 0.15,
    flatShading,
  };

  if (opts.emissive) {
    matOpts.emissive = opts.emissive;
    matOpts.emissiveIntensity = opts.emissiveIntensity || 0.3;
  }
  if (opts.transparent) {
    matOpts.transparent = true;
    matOpts.opacity = opts.opacity ?? 0.9;
  }
  if (opts.side) matOpts.side = opts.side;

  // Optionally add scale/feather texture
  if (opts.useScales && cfg.texSize > 0) {
    const scaleTex = createScaleTexture(color, false, cfg.texSize, quality);
    const normalTex = createScaleTexture(color, true, cfg.texSize, quality);
    if (scaleTex) matOpts.map = scaleTex;
    if (normalTex) {
      matOpts.normalMap = normalTex;
      matOpts.normalScale = new THREE.Vector2(0.8, 0.8);
    }
  }

  // Environment map for wet/glossy look — skip if pbrEnabled is false
  if (pbrEnabled && window._fishEnvMap) {
    matOpts.envMap = window._fishEnvMap;
    matOpts.envMapIntensity = (window.pmremExposure ?? 0.65) * 0.7;
  }

  return new THREE.MeshPhysicalMaterial(matOpts);
}

function buildSeagull(palette = { body: 0xf5f5f0, wing: 0xe8e8e0 }) {
  const group = new THREE.Group();
  const cfg = GRAPHICS_CONFIG[currentGraphicsQuality || 'medium'] || GRAPHICS_CONFIG.medium;
  const segs = Math.max(4, cfg.segments >> 2);
  const mat = createCompanionPBR(palette.body, { roughness: 0.5, useScales: true, flatShading: false });
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.25, segs, Math.max(4, segs >> 1)), mat);
  const wingGeo = new THREE.BoxGeometry(1.2, 0.06, 0.35); const wingMat = createCompanionPBR(palette.wing, { roughness: 0.55, useScales: true, flatShading: false });
  const wingL = new THREE.Mesh(wingGeo, wingMat); wingL.position.set(-0.6, 0, 0);
  const wingR = new THREE.Mesh(wingGeo, wingMat); wingR.position.set(0.6, 0, 0);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.14, Math.max(5, segs), Math.max(4, segs >> 1)), mat); head.position.set(0, 0.2, 0.3);
  const beak = new THREE.Mesh(new THREE.ConeGeometry(0.04, 0.18, Math.max(4, segs >> 1)), createCompanionPBR(0xffcc40, { roughness: 0.4, flatShading: false }));
  beak.rotation.x = Math.PI / 2; beak.position.set(0, 0.18, 0.52);
  group.add(body, wingL, wingR, head, beak); group.scale.setScalar(0.7);
  return group;
}

function buildFishShadow() {
  const geo = new THREE.ConeGeometry(0.25, 0.9, 6); const mat = new THREE.MeshBasicMaterial({ color: 0x000020, transparent: true, opacity: 0.28, side: THREE.DoubleSide });
  const mesh = new THREE.Mesh(geo, mat); mesh.rotation.z = Math.PI / 2; return mesh;
}
function buildBucket(tier) {
  const group = new THREE.Group();
  const mat = createCompanionPBR(tier.color, { metalness: tier.metalness, roughness: tier.roughness, flatShading: true, side: THREE.DoubleSide });
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.42, 0.9, 10, 1, true), mat); body.position.y = 0.45;
  const bottom = new THREE.Mesh(new THREE.CircleGeometry(0.42, 10), mat); bottom.rotation.x = -Math.PI / 2; bottom.position.y = 0.01;
  const rim = new THREE.Mesh(new THREE.TorusGeometry(0.55, 0.04, 4, 10), mat); rim.position.y = 0.9;
  const handleMat = createCompanionPBR(tier.color, { metalness: tier.metalness, roughness: tier.roughness });
  const handleCurve = new THREE.QuadraticBezierCurve3(new THREE.Vector3(-0.55, 0.9, 0), new THREE.Vector3(0, 1.5, 0), new THREE.Vector3(0.55, 0.9, 0));
  const handleGeo = new THREE.TubeGeometry(handleCurve, 8, 0.03, 4, false);
  const handle = new THREE.Mesh(handleGeo, handleMat);
  group.add(body, bottom, rim, handle); return group;
}
function updateBucketAppearance(refs, tier) {
  if (!refs.bucketGroup) return;
  refs.bucketGroup.traverse(m => { if (m.isMesh) { m.material.color.setHex(tier.color); m.material.metalness = tier.metalness; m.material.roughness = tier.roughness; m.material.needsUpdate = true; } });
}

function updateRodAppearance(refs, tier) {
  if (!refs.rodGroup || !refs.rodMesh) return;
  refs.rodGroup.remove(refs.rodMesh);
  const newRodMesh = buildFishingRod(tier);
  newRodMesh.rotation.z = -Math.PI / 2; // Modellen er langs X – roter til Y-akse
  // Fastgørelsespunkt for fiskelinen (stangens spids i lokal X)
  const rodTipPoint = new THREE.Object3D();
  rodTipPoint.position.set(-5.05, 0, 0);
  newRodMesh.add(rodTipPoint);
  refs.rodGroup.add(newRodMesh);
  refs.rodMesh = newRodMesh;
  refs.rodTipPoint = rodTipPoint;
}

function clearLocationObjects(refs) {
  if (!refs.locationObjects) return;
  refs.locationObjects.forEach(obj => refs.scene.remove(obj));
  refs.locationObjects = [];
  refs.turtleEggMesh = null;
  refs.turtleMesh = null;
  refs.wildTurtleMesh = null;
  refs.locationBridge = null;
}
function addLocationObject(refs, obj) {
  if (!refs.locationObjects) refs.locationObjects = [];
  refs.scene.add(obj);
  refs.locationObjects.push(obj);
  return obj;
}

// ── ØRKENSØ ─────────────────────────────────────────────────────
function buildDesertLake(refs) {
  clearLocationObjects(refs);
  if (refs.water) refs.water.visible = true;
  const sandMat = createCompanionPBR(0xE8C97A, { roughness: 1.0, flatShading: true, pbrEnabled: false });
  const sand = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), sandMat);
  sand.rotation.x = -Math.PI / 2; sand.position.y = -0.02;
  addLocationObject(refs, sand);
  const rockMat = createCompanionPBR(0xC4A35A, { roughness: 0.9, flatShading: true, pbrEnabled: false });
  // Bagerste, buet stensætning der afgrænser søen mod broens retning
  const STONE_RING_CENTER_Z = -7.0;
  const STONE_RING_RX = 15.5;
  const STONE_RING_RZ = 8.0;
  const STONE_COUNT = 12;
  for (let i = 0; i < STONE_COUNT; i++) {
    const s = 0.8 + Math.random() * 1.6;
    const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(s, 0), rockMat);
    // Arc fra venstre front -> bagom -> højre front (åbning ved broens midte)
    const t = i / (STONE_COUNT - 1);
    const angle = Math.PI + (Math.PI * t);
    const jitterX = (Math.random() - 0.5) * 1.9;
    const jitterZ = (Math.random() - 0.5) * 1.4;
    const x = Math.cos(angle) * STONE_RING_RX + jitterX;
    const z = STONE_RING_CENTER_Z + Math.sin(angle) * STONE_RING_RZ + jitterZ;
    rock.position.set(x, s * 0.38, z);
    rock.rotation.set(Math.random(), Math.random(), Math.random());
    addLocationObject(refs, rock);
  }
  // Ekstra side-sten tættere på bro-området for tydelig afgrænsning
  [-1, 1].forEach(side => {
    for (let i = 0; i < 2; i++) {
      const s = 0.9 + Math.random() * 1.2;
      const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(s, 0), rockMat);
      rock.position.set(side * (9.5 + i * 1.8 + Math.random() * 0.8), s * 0.36, -1.8 - i * 1.6 + (Math.random() - 0.5) * 0.6);
      rock.rotation.set(Math.random(), Math.random(), Math.random());
      addLocationObject(refs, rock);
    }
  });
  // 4 dedikerede low-poly kaktusser til Ørkensøen
  const matSaguaro = createCompanionPBR(0x4CAF50, { roughness: 0.82, flatShading: true, pbrEnabled: false });
  const matBarrel  = createCompanionPBR(0x1a5624, { roughness: 0.85, flatShading: true, pbrEnabled: false });
  const matPrickly = createCompanionPBR(0x7cb31b, { roughness: 0.84, flatShading: true, pbrEnabled: false });
  const matPipes   = createCompanionPBR(0x24756c, { roughness: 0.80, flatShading: true, pbrEnabled: false });
  const matRedFlow = createCompanionPBR(0xd93829, { roughness: 0.70, flatShading: true });

  const setShadows = (group) => group.traverse(obj => {
    if (obj.isMesh) {
      obj.castShadow = true;
      obj.receiveShadow = true;
    }
  });

  function buildSaguaroCactus() {
    const g = new THREE.Group();
    const trunkGeo = new THREE.CylinderGeometry(0.5, 0.5, 4, 8);
    const armGeo = new THREE.CylinderGeometry(0.4, 0.4, 1.5, 8);

    const trunk = new THREE.Mesh(trunkGeo, matSaguaro); trunk.position.y = 2; g.add(trunk);
    const armL = new THREE.Mesh(armGeo, matSaguaro); armL.position.set(-0.8, 2.5, 0); armL.rotation.z = Math.PI / 2; g.add(armL);
    const armLUp = new THREE.Mesh(armGeo, matSaguaro); armLUp.position.set(-1.35, 3.05, 0); g.add(armLUp);
    const armR = new THREE.Mesh(armGeo, matSaguaro); armR.position.set(0.8, 1.5, 0); armR.rotation.z = Math.PI / 2; g.add(armR);
    const armRUp = new THREE.Mesh(armGeo, matSaguaro); armRUp.position.set(1.35, 2.05, 0); g.add(armRUp);
    setShadows(g);
    return g;
  }

  function buildBarrelCactus() {
    const g = new THREE.Group();
    const body = new THREE.Mesh(new THREE.IcosahedronGeometry(1.5, 1), matBarrel);
    body.position.y = 1.0; body.scale.set(1.2, 0.8, 1.2); g.add(body);
    const flower = new THREE.Mesh(new THREE.ConeGeometry(0.8, 1, 5), matRedFlow);
    flower.position.y = 2.4; flower.rotation.x = Math.PI; g.add(flower);
    setShadows(g);
    return g;
  }

  function buildPricklyPearCactus() {
    const g = new THREE.Group();
    const padGeo = new THREE.DodecahedronGeometry(0.8, 0);
    const padDef = [
      [0, 0.8, 0, 0, 1.0],
      [-0.6, 2.0, 0, -0.4, 0.8],
      [0.8, 1.8, 0.2, 0.3, 0.9],
      [-1.2, 3.0, 0.1, -0.6, 0.7],
      [0.2, 3.2, -0.1, 0.1, 0.8],
      [1.2, 2.8, -0.1, 0.5, 0.6],
    ];
    padDef.forEach(([x, y, z, rz, scale]) => {
      const pad = new THREE.Mesh(padGeo, matPrickly);
      pad.position.set(x, y, z);
      pad.rotation.z = rz;
      pad.scale.set(1, 1.2, 0.4);
      pad.scale.multiplyScalar(scale);
      g.add(pad);
    });
    const fruitGeo = new THREE.BoxGeometry(0.4, 0.4, 0.4);
    const fruit1 = new THREE.Mesh(fruitGeo, matRedFlow); fruit1.position.set(-1.6, 3.6, 0.1); g.add(fruit1);
    const fruit2 = new THREE.Mesh(fruitGeo, matRedFlow); fruit2.position.set(1.6, 3.3, -0.1); g.add(fruit2);
    setShadows(g);
    return g;
  }

  function buildOrganPipeCactus() {
    const g = new THREE.Group();
    const pipeGeo = new THREE.CylinderGeometry(0.35, 0.35, 1, 6);
    const pipes = [
      [0, 0, 5],
      [0.6, 0.2, 4],
      [-0.6, -0.1, 3.5],
      [0.3, 0.6, 2.5],
      [-0.4, 0.5, 4.5],
      [0.8, -0.4, 2.0],
    ];
    pipes.forEach(([x, z, h]) => {
      const p = new THREE.Mesh(pipeGeo, matPipes);
      p.scale.y = h;
      p.position.set(x, h / 2, z);
      g.add(p);
    });
    setShadows(g);
    return g;
  }

  // Placering: 1 erstatter gammel nær broen, 2 til venstre for broen, 1 i højre horisont bag sø/sten
  const cactusA = buildSaguaroCactus();      cactusA.position.set(3.8, 0, 4.9);  cactusA.rotation.y = THREE.MathUtils.degToRad(-35); cactusA.scale.setScalar(0.9);  addLocationObject(refs, cactusA);
  const cactusB = buildBarrelCactus();       cactusB.position.set(-10.0, 0, 0.9); cactusB.scale.setScalar(1.15);  addLocationObject(refs, cactusB);
  const cactusC = buildPricklyPearCactus();  cactusC.position.set(-4.4, 0, 4.8); cactusC.rotation.y = THREE.MathUtils.degToRad(180); cactusC.scale.setScalar(0.88); addLocationObject(refs, cactusC);
  const cactusD = buildOrganPipeCactus();    cactusD.position.set(20.5, 0, -15.5); cactusD.scale.setScalar(1.35); addLocationObject(refs, cactusD);
  const sun3D = new THREE.Mesh(new THREE.SphereGeometry(3, 12, 8), new THREE.MeshBasicMaterial({ color: 0xFFD700 }));
  sun3D.position.set(-20, 18, -35);
  addLocationObject(refs, sun3D);
  const dustGeo = new THREE.BufferGeometry();
  const dustPos = new Float32Array(300 * 3);
  for (let i = 0; i < 300; i++) { dustPos[i*3]=(Math.random()-0.5)*60; dustPos[i*3+1]=Math.random()*2; dustPos[i*3+2]=(Math.random()-0.5)*60; }
  dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
  const dustMesh = new THREE.Points(dustGeo, new THREE.PointsMaterial({ color: 0xFFAA55, size: 0.18, transparent: true, opacity: 0.35 }));
  addLocationObject(refs, dustMesh);
  refs._desertDust = { mesh: dustMesh, pos: dustPos };
}

// ── ISHAVET ─────────────────────────────────────────────────────
function buildArcticSea(refs) {
  clearLocationObjects(refs);
  if (refs.water) refs.water.visible = true;
  const iceMat = createCompanionPBR(0xCCEEFF, { roughness: 0.1, metalness: 0.2, flatShading: true });
  // Isflage under broen: havet skal primært ligge foran broen
  const iceShelfGeo = new THREE.PlaneGeometry(30, 20, 18, 12);
  const shelfPos = iceShelfGeo.attributes.position;
  for (let i = 0; i < shelfPos.count; i++) {
    const x = shelfPos.getX(i);
    const y = shelfPos.getY(i);
    const bump = Math.sin(x * 0.35) * 0.06 + Math.cos(y * 0.42) * 0.05 + (Math.random() - 0.5) * 0.04;
    shelfPos.setZ(i, bump);
  }
  shelfPos.needsUpdate = true;
  iceShelfGeo.computeVertexNormals();
  const iceFloor = new THREE.Mesh(iceShelfGeo, iceMat);
  iceFloor.rotation.x = -Math.PI / 2;
  iceFloor.position.set(0, 0.06, 7.0);
  addLocationObject(refs, iceFloor);
  for (let i = 0; i < 14; i++) {
    const w = 1 + Math.random() * 2.5; const h = 0.6 + Math.random() * 2; const d = 1 + Math.random() * 2;
    const block = new THREE.Mesh(new THREE.BoxGeometry(w, h, d),
      createCompanionPBR(new THREE.Color().setHSL(0.55, 0.4, 0.75 + Math.random()*0.15), { roughness: 0.1, metalness: 0.1, flatShading: true, transparent: true, opacity: 0.85 }));
    const angle = (i / 14) * Math.PI * 2;
    const r = 10 + Math.random() * 12;
    block.position.set(Math.cos(angle) * r, h / 2, Math.sin(angle) * r);
    block.rotation.y = Math.random() * Math.PI;
    addLocationObject(refs, block);
  }
  // ── PINGVIN (nuttet, detaljeret, v9.0 PBR) ──────────────────
  const penguinGroup = new THREE.Group();
  penguinGroup.position.set(-3, 0, 5);
  const pCfg = GRAPHICS_CONFIG[currentGraphicsQuality || 'medium'] || GRAPHICS_CONFIG.medium;
  const pSegs = Math.max(8, pCfg.segments >> 1);

  const bodyMat2  = createCompanionPBR(0x111111, { roughness: 0.35, metalness: 0.05, useScales: true, flatShading: false });
  const bellyMat2 = createCompanionPBR(0xfafafa, { roughness: 0.5, flatShading: false });
  const beakMat2  = createCompanionPBR(0xFF8C00, { roughness: 0.35, flatShading: false });
  const eyeMat2   = createCompanionPBR(0x000000, { roughness: 0.05, metalness: 0.5, flatShading: false });
  const eyeWhiteMat = createCompanionPBR(0xffffff, { roughness: 0.3, flatShading: false });

  // Krop — aflang sphere (skaleret på y)
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.45, pSegs, Math.max(8, pSegs >> 1)), bodyMat2);
  body.scale.set(1, 1.25, 1);
  body.position.y = 0.56;
  penguinGroup.add(body);

  // Mave — hvid oval sphere skubbet frem
  const belly = new THREE.Mesh(new THREE.SphereGeometry(0.3, Math.max(8, pSegs - 2), Math.max(6, pSegs >> 1)), bellyMat2);
  belly.scale.set(0.85, 1.1, 0.5);
  belly.position.set(0, 0.5, 0.32);
  penguinGroup.add(belly);

  // Hoved — lille rund sphere ovenpå
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.27, Math.max(8, pSegs - 2), Math.max(6, pSegs >> 1)), bodyMat2);
  head.position.set(0, 1.12, 0.04);
  penguinGroup.add(head);

  // Øjen-hvider (bag de sorte øjne)
  const leftEyeWhite = new THREE.Mesh(new THREE.SphereGeometry(0.075, Math.max(6, pSegs >> 1), Math.max(6, pSegs >> 1)), eyeWhiteMat);
  leftEyeWhite.position.set(-0.12, 1.17, 0.22);
  penguinGroup.add(leftEyeWhite);
  const rightEyeWhite = new THREE.Mesh(new THREE.SphereGeometry(0.075, Math.max(6, pSegs >> 1), Math.max(6, pSegs >> 1)), eyeWhiteMat);
  rightEyeWhite.position.set(0.12, 1.17, 0.22);
  penguinGroup.add(rightEyeWhite);

  // Øjne — skinnende sorte kugler
  const leftEye = new THREE.Mesh(new THREE.SphereGeometry(0.055, Math.max(6, pSegs >> 1), Math.max(6, pSegs >> 1)), eyeMat2);
  leftEye.position.set(-0.12, 1.17, 0.285);
  penguinGroup.add(leftEye);
  const rightEye = new THREE.Mesh(new THREE.SphereGeometry(0.055, Math.max(6, pSegs >> 1), Math.max(6, pSegs >> 1)), eyeMat2);
  rightEye.position.set(0.12, 1.17, 0.285);
  penguinGroup.add(rightEye);

  // Næb — lille flad orange cylinder
  const beak = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.065, 0.16, Math.max(6, pSegs >> 1)), beakMat2);
  beak.rotation.x = Math.PI / 2;
  beak.position.set(0, 1.1, 0.38);
  penguinGroup.add(beak);

  // Vinger — to flade, lidt roterede sfærer
  const wingGeo = new THREE.SphereGeometry(0.18, Math.max(6, pSegs >> 1), Math.max(5, pSegs >> 2));
  wingGeo.scale(0.5, 0.9, 1);
  const leftWing = new THREE.Mesh(wingGeo, bodyMat2);
  leftWing.position.set(-0.46, 0.62, 0.1);
  leftWing.rotation.z = 0.3;
  penguinGroup.add(leftWing);
  const rightWing = new THREE.Mesh(wingGeo, bodyMat2);
  rightWing.position.set(0.46, 0.62, 0.1);
  rightWing.rotation.z = -0.3;
  penguinGroup.add(rightWing);

  // Fødder — to orange, flade sfærer
  const footGeo = new THREE.SphereGeometry(0.1, Math.max(6, pSegs >> 1), Math.max(4, pSegs >> 2));
  const leftFoot = new THREE.Mesh(footGeo, beakMat2);
  leftFoot.scale.set(1.4, 0.4, 1.6);
  leftFoot.position.set(-0.16, 0.08, 0.14);
  penguinGroup.add(leftFoot);
  const rightFoot = new THREE.Mesh(footGeo, beakMat2);
  rightFoot.scale.set(1.4, 0.4, 1.6);
  rightFoot.position.set(0.16, 0.08, 0.14);
  penguinGroup.add(rightFoot);

  penguinGroup.userData = { id: 'np_penguin', interactable: true, type: 'npc', isPenguinNPC: true };
  addLocationObject(refs, penguinGroup);
  refs.penguinMesh = penguinGroup;
  const snowGeo = new THREE.BufferGeometry();
  const snowPos = new Float32Array(500 * 3);
  for (let i = 0; i < 500; i++) { snowPos[i*3]=(Math.random()-0.5)*60; snowPos[i*3+1]=Math.random()*30; snowPos[i*3+2]=(Math.random()-0.5)*60; }
  snowGeo.setAttribute('position', new THREE.BufferAttribute(snowPos, 3));
  const snowMesh = new THREE.Points(snowGeo, new THREE.PointsMaterial({ color: 0xFFFFFF, size: 0.2, transparent: true, opacity: 0.85 }));
  addLocationObject(refs, snowMesh);
  refs._arcticSnow = { mesh: snowMesh, pos: snowPos };
}

function addEyes(group, x, y, zOffset, scale = 1) {
  const eyeW = new THREE.Mesh(new THREE.SphereGeometry(0.08*scale,12,12), createCompanionPBR(0xffffff, { flatShading: false }));
  eyeW.position.set(x,y,zOffset);
  const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.04*scale,12,12), createCompanionPBR(0x111111, { flatShading: false }));
  pupil.position.set(x+0.04*scale, y, zOffset + (zOffset>0?0.04*scale:-0.04*scale));
  group.add(eyeW, pupil);
}

function buildGiantLandTurtle() {
  const group = new THREE.Group();
  const tCfg = GRAPHICS_CONFIG[currentGraphicsQuality || 'medium'] || GRAPHICS_CONFIG.medium;
  const shellMat = createCompanionPBR(0x5C4033, { roughness: 0.55, metalness: 0.06, useScales: true, flatShading: false });
  const skinMat = createCompanionPBR(0x8B7355, { roughness: 0.65, flatShading: false });
  const mouthMat = createCompanionPBR(0x2A1B18, { roughness: 0.8, flatShading: false });
  const tongueMat = createCompanionPBR(0xCD5C5C, { roughness: 0.5, flatShading: false });

  const shell = new THREE.Mesh(new THREE.IcosahedronGeometry(1, tCfg.segments >= 32 ? 3 : 2), shellMat);
  shell.scale.set(1.35, 0.95, 1.25);
  shell.position.y = 0.45;
  group.add(shell);

  const rim = new THREE.Mesh(new THREE.TorusGeometry(0.98, 0.12, Math.max(8, tCfg.segments >> 1), Math.max(16, tCfg.segments)), shellMat);
  rim.rotation.x = Math.PI / 2;
  rim.scale.set(1.35, 1.05, 1.25);
  rim.position.y = 0.12;
  group.add(rim);

  const neckCurve = new THREE.QuadraticBezierCurve3(
    new THREE.Vector3(0.8, 0.25, 0),
    new THREE.Vector3(1.45, 0.25, 0),
    new THREE.Vector3(1.72, 0.88, 0)
  );
  const neck = new THREE.Mesh(new THREE.TubeGeometry(neckCurve, Math.max(10, tCfg.segments >> 1), 0.19, Math.max(6, tCfg.segments >> 2), false), skinMat);
  group.add(neck);

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.29, Math.max(10, tCfg.segments >> 1), Math.max(10, tCfg.segments >> 1)), skinMat);
  head.position.set(1.72, 0.92, 0);
  head.name = "turtleHead";

  const slit = new THREE.Mesh(new THREE.BoxGeometry(0.038, 0.019, 0.135), mouthMat);
  slit.position.set(0.255, -0.092, 0);
  const tongue = new THREE.Mesh(new THREE.SphereGeometry(0.033, 9, 9), tongueMat);
  tongue.scale.set(1.68, 0.49, 0.87);
  tongue.position.set(0.295, -0.095, 0);
  tongue.rotation.z = -0.18;
  head.add(slit, tongue);
  group.add(head);

  const legGeo = new THREE.CylinderGeometry(0.23, 0.29, 0.72, Math.max(8, tCfg.segments >> 1));
  const legPos = [[0.62,-0.18,0.62],[0.62,-0.18,-0.62],[-0.72,-0.17,0.52],[-0.72,-0.17,-0.52]];
  legPos.forEach(p => {
    const leg = new THREE.Mesh(legGeo, skinMat);
    leg.position.set(...p);
    group.add(leg);
  });

  const tail = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.62, 7), skinMat);
  tail.rotation.z = Math.PI / 2;
  tail.position.set(-1.32, 0.09, 0);
  group.add(tail);

  addEyes(group, 1.88, 1.02, 0.22, 0.82);
  addEyes(group, 1.88, 1.02, -0.22, 0.82);

  group.userData.isTurtle = true;
  return group;
}

// ── FISKESTANGSVÆG (dekorativt, flytbart) ──────────────────────────────────
// Alle mål er præ-skaleret med S=1/3 så gruppen har y=0 og ingen scale-transform.
// Det giver identisk drag-adfærd som bogreolen.
function buildRodWall() {
  const S = 1 / 3;
  const group = new THREE.Group();

  const themes = [
    { rodColor: 0x8b6540, gripColor: 0x6b4a2e, seatColor: 0xcccccc, reelBase: 0x8b5a2b, spoolColor: 0xff8c00, metalness: 0.1 },
    { rodColor: 0x243e60, gripColor: 0x1b2d47, seatColor: 0xdddddd, reelBase: 0x188a85, spoolColor: 0x3ac2bd, metalness: 0.2 },
    { rodColor: 0xe0c08b, gripColor: 0xceab70, seatColor: 0xffffff, reelBase: 0xdeaa73, spoolColor: 0xf26666, metalness: 0.1 },
    { rodColor: 0x6b2b2b, gripColor: 0x4a1818, seatColor: 0xc87d4a, reelBase: 0x5a3e2b, spoolColor: 0x4a9e5b, metalness: 0.3 },
  ];

  const rackMat = createCompanionPBR(0x3d2314, { roughness: 0.9, flatShading: true, pbrEnabled: false });
  const pegMat  = createCompanionPBR(0x5c3a21, { roughness: 0.8, pbrEnabled: false });

  const rackL = new THREE.Mesh(new THREE.BoxGeometry(0.18*S, 5.5*S, 0.1*S), rackMat);
  rackL.position.set(-1.8*S, 0, 0); group.add(rackL);
  const rackR = new THREE.Mesh(new THREE.BoxGeometry(0.18*S, 5.5*S, 0.1*S), rackMat);
  rackR.position.set(1.8*S, 0, 0); group.add(rackR);

  const spacingY = 1.2 * S;
  const startY   = ((themes.length - 1) * spacingY) / 2;

  themes.forEach((theme, idx) => {
    const currentY = startY - idx * spacingY;
    const rod = buildSingleRod(theme, S);
    rod.position.set(0, currentY, 0.05*S);
    rod.rotation.x = 0.35;
    group.add(rod);

    [-1.8*S, 1.8*S].forEach(xOff => {
      const peg = new THREE.Mesh(new THREE.CylinderGeometry(0.04*S, 0.04*S, 0.4*S, 8), pegMat);
      peg.rotation.x = Math.PI / 2;
      peg.position.set(xOff, currentY - 0.05*S, 0.08*S);
      group.add(peg);
    });
  });

  // Usynlig hitbox — dækker hele holderens areal så man nemt kan grabbes overalt.
  // visible=true så raycaster finder den, opacity=0 så den ikke ses.
  const hitbox = new THREE.Mesh(
    new THREE.BoxGeometry(1.8*S*2 + 0.3*S, 5.5*S, 0.6*S),
    new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false, side: THREE.DoubleSide })
  );
  group.add(hitbox);

  return group;
}

function buildSingleRod(theme, S) {
  if (S === undefined) S = 1;
  const g = new THREE.Group();
  const seg = 16;
  const mRod  = createCompanionPBR(theme.rodColor, { roughness: 0.8, metalness: theme.metalness });
  const mGrip = createCompanionPBR(theme.gripColor, { roughness: 0.9, flatShading: true, pbrEnabled: false });
  const mSeat = createCompanionPBR(theme.seatColor, { roughness: 0.3, metalness: 0.8 });
  const mReel = createCompanionPBR(theme.reelBase, { roughness: 0.6, metalness: 0.4 });
  const mSpol = createCompanionPBR(theme.spoolColor, { roughness: 0.5, metalness: 0.2 });

  // Greb bageste
  const gB = new THREE.Mesh(new THREE.CylinderGeometry(0.10*S, 0.10*S, 0.9*S, 10), mGrip);
  gB.rotation.z = Math.PI / 2; gB.position.set(1.0*S, 0, 0); g.add(gB);
  // Endeknop
  const cap = new THREE.Mesh(new THREE.SphereGeometry(0.10*S, 10, 8), mSeat);
  cap.position.set(1.45*S, 0, 0); g.add(cap);
  // Reel seat
  const rs = new THREE.Mesh(new THREE.CylinderGeometry(0.09*S, 0.09*S, 0.7*S, seg), mSeat);
  rs.rotation.z = Math.PI / 2; rs.position.set(0.2*S, 0, 0); g.add(rs);
  // Greb forreste
  const gF = new THREE.Mesh(new THREE.CylinderGeometry(0.10*S, 0.10*S, 0.4*S, 10), mGrip);
  gF.rotation.z = Math.PI / 2; gF.position.set(-0.35*S, 0, 0); g.add(gF);
  // Klinge
  const shaftLen = 3.5*S;
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.015*S, 0.07*S, shaftLen, seg), mRod);
  shaft.rotation.z = Math.PI / 2; shaft.position.set(-0.55*S - (shaftLen / 2), 0, 0); g.add(shaft);
  // Hjul
  const reelGrp = new THREE.Group();
  reelGrp.position.set(0.2*S, -0.12*S, 0);
  const stem = new THREE.Mesh(new THREE.BoxGeometry(0.08*S, 0.18*S, 0.05*S), mReel);
  stem.position.set(0, -0.1*S, 0); reelGrp.add(stem);
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.12*S, 0.12*S, 0.22*S, seg), mReel);
  body.rotation.z = Math.PI / 2; body.position.set(0.05*S, -0.22*S, 0); reelGrp.add(body);
  const spoolC = new THREE.Mesh(new THREE.CylinderGeometry(0.10*S, 0.10*S, 0.14*S, seg), mSpol);
  spoolC.rotation.z = Math.PI / 2; spoolC.position.set(-0.18*S, -0.22*S, 0); reelGrp.add(spoolC);
  const crank = new THREE.Mesh(new THREE.CylinderGeometry(0.015*S, 0.015*S, 0.15*S, 8), mSeat);
  crank.rotation.x = Math.PI / 2; crank.position.set(0.05*S, -0.22*S, 0.18*S); reelGrp.add(crank);
  g.add(reelGrp);
  // Øjer
  [[-1.0*S], [-2.1*S], [-3.3*S]].forEach(([xPos], i) => {
    const r = 0.065 - i * 0.015;
    const ring = new THREE.Mesh(new THREE.TorusGeometry(r + 0.008, 0.010, 6, seg), mSeat);
    ring.rotation.y = Math.PI / 2; ring.position.set(xPos, 0, 0); g.add(ring);
  });
  return g;
}

// ── FISKEHYTTEN (v5 – indendørs, flytbare møbler, pejs, dør til rejsemenu) ──
function buildFishingCabin(refs, hasTurtle = false, questItems = [], movableObjectsRef = { current: [] }) {
  clearLocationObjects(refs);
  if (refs.water) refs.water.visible = false;
  movableObjectsRef.current = [];
  refs.cabinMovableObjects = movableObjectsRef;

  // Kamera er ved z=7, kigger mod (0,0,0).
  // Rum: frontvæg (bag kamera) z=+5, bagvæg (langt fremme) z=-5, sidevægge x=±6
  // Gulv og indhold er synligt foran kameraet i z-området 0 til -4

  const W = 12;   // rumbredde
  const D = 10;   // rumdybde
  const H = 5.5;  // rumhøjde (sidevægge + indhold)
  const H_BACK = 9.0; // bagvæggens fulde højde — når op til tagets spids
  const ZF = 5;   // frontvæg z (bag kamera)
  const ZB = -5;  // bagvæg z (hvad man ser)

  // ── GULV (strækker sig forbi kameraet så man ikke ser kanten) ──
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(W, D + 4),
    createCompanionPBR(0x5C4033, { roughness: 0.92 })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.position.set(0, 0.01, (ZF + ZB) / 2);
  floor.receiveShadow = true;
  addLocationObject(refs, floor);

  const wallMat = createCompanionPBR(0x7A5230, { roughness: 0.88, flatShading: true, pbrEnabled: false });
  const frameMat = createCompanionPBR(0x3E2208, { roughness: 0.9, flatShading: true, pbrEnabled: false });

  // ── SIDEVÆGGE (kun den synlige del — stopper ved z=+3, kameraet er ved z=6.5) ──
  const WALL_Z_FRONT = 3;   // sidevæggene stopper her — bag kameraets synsfelt
