                          <button style={btnStyle()} onClick={() => { const inp = document.getElementById('adm-level-inp'); setLevel(inp?.value || progression.level + 1); }}>Set Level</button>
                          <button style={btnStyle('#475569')} onClick={() => grantXp(100)}>+100 XP</button>
                          <button style={btnStyle('#475569')} onClick={() => grantXp(1000)}>+1000 XP</button>
                          <button style={btnStyle('#475569')} onClick={() => grantXp(99999)}>Max XP</button>
                        </div>
                      </div>

                      {/* Mønter */}
                      <div style={cardStyle}>
                        <span style={labelStyle}>💰 Mønter</span>
                        <div style={{ color: 'white', fontWeight: 900, fontSize: '1.5rem', marginBottom: '0.5rem' }}>{coins} kr.</div>
                        <input id="adm-coins-inp" type="number" min="0" placeholder="Sæt mønter..." style={inputStyle} />
                        <div style={{ display: 'flex', gap: '0.5rem', flexWrap: 'wrap' }}>
                          <button style={btnStyle('#b45309')} onClick={() => { const v = parseInt(document.getElementById('adm-coins-inp')?.value) || 0; setCoins(v); showAdminMsg(`✅ Mønter sat til ${v}`); }}>Set Kr.</button>
                          <button style={btnStyle('#475569')} onClick={() => { setCoins(c => c + 1000); showAdminMsg('✅ +1000 kr.'); }}>+1000</button>
                          <button style={btnStyle('#475569')} onClick={() => { setCoins(c => c + 10000); showAdminMsg('✅ +10.000 kr.'); }}>+10K</button>
                          <button style={btnStyle('#475569')} onClick={() => { setCoins(99999); showAdminMsg('✅ 99.999 kr. sat!'); }}>Max</button>
                        </div>
                      </div>

                      {/* MAX EVERYTHING */}
                      <div style={{ ...cardStyle, border: '2px solid rgba(234,179,8,0.5)' }}>
                        <span style={labelStyle}>🏆 Max Everything</span>
                        <p style={{ color: '#94a3b8', fontSize: '0.78rem', marginBottom: '0.75rem', lineHeight: 1.5 }}>Sætter level 50, 99.999 kr., og alle upgrades.</p>
                        <button
                          style={{ ...btnStyle('#854d0e'), width: '100%', padding: '0.75rem', fontSize: '0.9rem' }}
                          onClick={() => {
                            if (!window.confirm('Max everything? Dette kan ikke fortrydes.')) return;
                            setProgression({ level: 50, xp: 0 });
                            setCoins(99999);
                            const allUpgradeIds = SHOP_ITEMS.map(i => i.id);
                            setUpgrades(allUpgradeIds);
                            showAdminMsg('🏆 MAX EVERYTHING aktiveret!');
                            play('legendary');
                          }}
                        >
                          ⚡ Aktiver Max Everything
                        </button>
                      </div>

                      {/* Kompletér alle mål */}
                      <div style={cardStyle}>
                        <span style={labelStyle}>🎯 Mål</span>
                        <p style={{ color: '#94a3b8', fontSize: '0.78rem', marginBottom: '0.75rem' }}>Fuldfør alle mål på én gang.</p>
                        <button style={{ ...btnStyle('#065f46'), width: '100%' }} onClick={() => { setCompletedGoals(GOALS.map(g => g.id)); showAdminMsg('✅ Alle mål gennemført!'); play('win'); }}>✅ Fuldfør alle mål</button>
                      </div>
                    </div>
                  </div>
                )}

                {/* ── TAB: INVENTORY ── */}
                {adminTab === 'inventory' && (
                  <div>
                    <div style={cardStyle}>
                      <span style={labelStyle}>🔍 Søg item (tilføj til inventory)</span>
                      <input
                        type="text"
                        placeholder="Søg fisk, grej, objekt..."
                        value={itemSearch}
                        onChange={e => setItemSearch(e.target.value)}
                        style={inputStyle}
                      />
                      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(200px, 1fr))', gap: '0.5rem', maxHeight: 280, overflowY: 'auto' }} className="scrollbar-hide">
                        {filteredItems.slice(0, 40).map(item => (
                          <div key={item.id} style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', padding: '0.5rem 0.75rem', borderRadius: '0.5rem', background: 'rgba(30,41,59,0.6)', border: '1px solid rgba(51,65,85,0.5)', cursor: 'pointer' }}
                            onClick={() => {
                              setInventory(prev => [...prev, { ...item, id: `${item.id}_${Date.now()}`, weight: 2, value: 50, species: item.name, rarity: item.rarity || 'Sjælden', itemType: 'fish' }]);
                              showAdminMsg(`✅ ${item.name} tilføjet til inventory`);
                              play('coin');
                            }}
                          >
                            <span style={{ fontSize: '1.1rem' }}>{item.emoji || '🐟'}</span>
                            <div style={{ flex: 1, minWidth: 0 }}>
                              <div style={{ color: 'white', fontSize: '0.78rem', fontWeight: 700, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{item.name}</div>
                              <div style={{ color: '#6b7280', fontSize: '0.68rem' }}>{item.rarity}</div>
                            </div>
                            <span style={{ color: '#8b5cf6', fontSize: '0.7rem', fontWeight: 900 }}>+</span>
                          </div>
                        ))}
                        {filteredItems.length === 0 && <div style={{ color: '#6b7280', fontStyle: 'italic', padding: '1rem', gridColumn: '1/-1' }}>Ingen resultater...</div>}
                      </div>
                    </div>
                    <div style={cardStyle}>
                      <span style={labelStyle}>🗑️ Inventory ({inventory.length} items)</span>
                      <div style={{ display: 'flex', gap: '0.5rem', marginBottom: '0.75rem', flexWrap: 'wrap' }}>
                        <button style={btnStyle('#dc2626')} onClick={() => { if (window.confirm('Tøm inventory?')) { setInventory([]); showAdminMsg('✅ Inventory tømt'); } }}>🗑️ Tøm inventory</button>
                        <button style={btnStyle('#065f46')} onClick={() => { sellAllFish(); showAdminMsg('✅ Alt solgt!'); }}>💵 Sælg alt nu</button>
                        <button style={btnStyle('#1e3a5f')} onClick={() => { setUpgrades([]); showAdminMsg('✅ Alle upgrades fjernet'); }}>❌ Fjern alle upgrades</button>
                      </div>
                    </div>
                  </div>
                )}

                {/* ── TAB: VERDEN ── */}
                {adminTab === 'world' && (
                  <div>
                    <div style={cardStyle}>
                      <span style={labelStyle}>🗺️ Skift lokation</span>
                      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(160px, 1fr))', gap: '0.5rem' }}>
                        {Object.values(LOCATIONS).map(area => (
                          <button key={area.id}
                            style={{ padding: '0.7rem', borderRadius: '0.6rem', border: currentLocation === area.id ? `2px solid ${ACCENT}` : '1px solid rgba(255,255,255,0.1)', background: currentLocation === area.id ? 'rgba(139,92,246,0.2)' : 'rgba(30,41,59,0.5)', color: 'white', cursor: 'pointer', fontSize: '0.82rem', fontWeight: 700, transition: 'all 0.15s' }}
                            onClick={() => { travelTo(area.id); showAdminMsg(`✅ Rejser til ${area.name}`); }}
                          >
                            {area.name}
                          </button>
                        ))}
                      </div>
                    </div>
                    <div style={cardStyle}>
                      <span style={labelStyle}>🌦️ Tving vejr</span>
                      <div style={{ display: 'flex', gap: '0.5rem', flexWrap: 'wrap' }}>
                        {Object.values(WEATHER_TYPES).map(w => (
                          <button key={w.id}
                            style={{ padding: '0.5rem 0.9rem', borderRadius: '0.5rem', border: weatherType === w.id ? `2px solid ${ACCENT}` : '1px solid rgba(255,255,255,0.12)', background: weatherType === w.id ? 'rgba(139,92,246,0.25)' : 'rgba(30,41,59,0.5)', color: 'white', cursor: 'pointer', fontSize: '0.82rem', fontWeight: 700 }}
                            onClick={() => { setWeatherType(w.id); addLog('VEJR', `Vejr skiftede til ${w.id}`); if (sceneRefsRef.current) sceneRefsRef.current.weatherType = w.id; if (!isMuted) { if (w.id === 'storm') setRainVolume(0.8); else if (w.id === 'rain') setRainVolume(0.4); else setRainVolume(0); } showAdminMsg(`✅ Vejr sat til ${w.name}`); }}
                          >
                            {w.icon} {w.name}
                          </button>
                        ))}
                      </div>
                    </div>
                    <div style={cardStyle}>
                      <span style={labelStyle}>📦 Quest Items</span>
                      <div style={{ color: '#94a3b8', fontSize: '0.82rem', marginBottom: '0.75rem' }}>Nuværende: {questItems.length === 0 ? 'ingen' : questItems.join(', ')}</div>
                      <div style={{ display: 'flex', gap: '0.5rem', flexWrap: 'wrap' }}>
                        {['cabin_key', 'turtle_egg', 'turtle_hatched', 'has_axolotl', 'bait', 'biolum_floats'].map(qi => (
                          <button key={qi}
                            style={{ padding: '0.4rem 0.7rem', borderRadius: '0.5rem', border: questItems.includes(qi) ? '2px solid #22c55e' : '1px solid rgba(255,255,255,0.12)', background: questItems.includes(qi) ? 'rgba(34,197,94,0.2)' : 'rgba(30,41,59,0.5)', color: questItems.includes(qi) ? '#86efac' : '#94a3b8', cursor: 'pointer', fontSize: '0.75rem', fontWeight: 700 }}
                            onClick={() => { setQuestItems(prev => prev.includes(qi) ? prev.filter(x => x !== qi) : [...prev, qi]); showAdminMsg(`✅ Quest item toggled: ${qi}`); }}
                          >
                            {questItems.includes(qi) ? '✓' : '+'} {qi}
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>
                )}

                {/* ── TAB: CATCHES ── */}
                {adminTab === 'catches' && (
                  <div>
                    <div style={cardStyle}>
                      <span style={labelStyle}>🎣 Force Catch (næste kast)</span>
                      <select
                        value={adminForceCatch}
                        onChange={e => { setAdminForceCatch(e.target.value); showAdminMsg(`✅ Næste fangst: ${e.target.value}`); }}
                        style={{ ...inputStyle, cursor: 'pointer' }}
                      >
                        <option value="random">🎲 Tilfældig</option>
                        <option value="kraken">🦑 Kraken (Boss)</option>
                        <option value="plesiosaur">🦕 Plesiosaurus (Boss)</option>
                        <option value="gnavne_gorm">🐡 Gnavne-Gorm (Boss)</option>
                        <option value="axolotl">🦎 Glødende Axolotl</option>
                        <option value="golden_fish">✨ Gylden Fisk (+1000 kr)</option>
                        <option value="halibut">🐟 Helleflynder (Ønsker)</option>
                        <option value="treasure">💎 Sunket Kiste</option>
                        <option value="bottle">🍾 Flaskepost</option>
                        <option value="fossil">🦴 Mystisk Fossil</option>
                        <option value="conch">🐚 Konkylie</option>
                        <option value="crystal_junk">💠 Ur-Krystal (Grotte)</option>
                      </select>
                    </div>
                    <div style={cardStyle}>
                      <span style={labelStyle}>🎯 Force Rarity (tilfældig af denne rarity)</span>
                      <div style={{ display: 'flex', gap: '0.5rem', flexWrap: 'wrap' }}>
                        {['any', 'Almindelig', 'Sjælden', 'Legendarisk', 'Mystisk'].map(r => (
                          <button key={r}
                            style={{ padding: '0.5rem 0.9rem', borderRadius: '0.5rem', border: adminForceRarity === r ? `2px solid ${ACCENT}` : '1px solid rgba(255,255,255,0.12)', background: adminForceRarity === r ? 'rgba(139,92,246,0.25)' : 'rgba(30,41,59,0.5)', color: 'white', cursor: 'pointer', fontSize: '0.82rem', fontWeight: 700 }}
                            onClick={() => { setAdminForceRarity(r); showAdminMsg(`✅ Force rarity: ${r}`); }}
                          >
                            {r}
                          </button>
                        ))}
                      </div>
                    </div>
                    <div style={cardStyle}>
                      <span style={labelStyle}>📊 Statistik (hurtig reset)</span>
                      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0.4rem', marginBottom: '0.75rem' }}>
                        {[['totalCatches', stats.totalCatches], ['rareCatches', stats.rareCatches], ['legendaryCatches', stats.legendaryCatches], ['coins', coins]].map(([k, v]) => (
                          <div key={k} style={{ padding: '0.5rem 0.75rem', borderRadius: '0.5rem', background: 'rgba(30,41,59,0.6)', border: '1px solid rgba(51,65,85,0.5)', fontSize: '0.78rem' }}>
                            <span style={{ color: '#6b7280' }}>{k}: </span><span style={{ color: 'white', fontWeight: 700 }}>{v ?? 0}</span>
                          </div>
                        ))}
                      </div>
                      <button style={{ ...btnStyle('#dc2626'), width: '100%' }} onClick={() => { if (window.confirm('Nulstil stats?')) { setStats(emptyStats()); showAdminMsg('✅ Stats nulstillet'); } }}>🗑️ Nulstil stats</button>
                    </div>
                  </div>
                )}

                {/* ── TAB: DEBUG ── */}
                {adminTab === 'debug' && (
                  <div>
                    <div style={cardStyle}>
                      <span style={labelStyle}>🔔 Toast/UI Tests</span>
                      <div style={{ display: 'flex', gap: '0.5rem', flexWrap: 'wrap', marginBottom: '0.75rem' }}>
                        <button style={btnStyle()} onClick={() => { setToastMessage('🎉 Test toast fra admin panel!'); showAdminMsg('✅ Toast afsendt'); }}>Toast</button>
                        <button style={btnStyle('#065f46')} onClick={() => { setXpToast('+999 XP'); showAdminMsg('✅ XP toast afsendt'); }}>XP Toast</button>
                        <button style={btnStyle('#b45309')} onClick={() => { play('legendary'); if (sceneRefsRef.current) spawnParticles(sceneRefsRef.current, 'levelup', new THREE.Vector3(0, 5, 8), 80); showAdminMsg('✅ Konfetti!'); }}>🎊 Konfetti</button>
                        <button style={btnStyle('#1e3a5f')} onClick={() => { setPendingLevelUps(q => [...q, progression.level + 1]); showAdminMsg('✅ Level-up overlay test'); }}>Level-up Overlay</button>
                      </div>
                    </div>
                    {/* ── FREE CAMERA MODE ── */}
                    <div style={{ ...cardStyle, border: freeCamEnabled ? '2px solid rgba(56,189,248,0.65)' : `1px solid ${BORDER}` }}>
                      <span style={labelStyle}>📷 Free Camera Mode</span>
                      <p style={{ color: '#94a3b8', fontSize: '0.78rem', marginBottom: '0.75rem', lineHeight: 1.5 }}>
                        Fly frit rundt i 3D-scenen. WASD + mus-look · Space = op · Shift = ned · ESC = afslut.
                      </p>
                      <button
                        style={{ ...btnStyle(freeCamEnabled ? '#0c4a6e' : '#0369a1'), width: '100%', padding: '0.75rem', fontSize: '0.9rem', boxShadow: freeCamEnabled ? '0 0 18px rgba(56,189,248,0.4)' : 'none' }}
                        onClick={() => {
                          const next = !freeCamEnabled;
                          setFreeCamEnabled(next);
                          if (next) { setShowAdvancedAdmin(false); showAdminMsg('📷 Free Camera aktiveret – klik på 3D-vinduet'); }
                          else showAdminMsg('📷 Free Camera deaktiveret');
                        }}
                      >
                        {freeCamEnabled ? '🔵 Free Camera ON – klik for at slå fra' : '📷 Aktivér Free Camera Mode'}
                      </button>
                    </div>
                    <div style={cardStyle}>
                      <span style={labelStyle}>🗺️ Unlock alle areas (tilføj til visited)</span>
                      <button style={{ ...btnStyle('#065f46'), width: '100%', marginBottom: '0.5rem' }} onClick={() => { Object.values(LOCATIONS).forEach(a => { if (!stats.areasVisited?.includes(a.id)) setStats(prev => ({ ...prev, areasVisited: [...(prev.areasVisited || []), a.id] })); }); showAdminMsg('✅ Alle areas markeret som besøgt'); }}>🌍 Unlock alle lokationer</button>
                    </div>
                    <div style={cardStyle}>
                      <span style={labelStyle}>📝 Game State info</span>
                      <div style={{ fontFamily: 'monospace', fontSize: '0.72rem', color: '#94a3b8', lineHeight: 1.6, background: 'rgba(0,0,0,0.3)', padding: '0.75rem', borderRadius: '0.5rem', wordBreak: 'break-all' }}>
                        gameState: {gameState}<br/>
                        location: {currentLocation}<br/>
                        weather: {weatherType}<br/>
                        level: {progression.level} | xp: {progression.xp}<br/>
                        coins: {coins}<br/>
                        inventory: {inventory.length} items<br/>
                        upgrades: {upgrades.length} stk<br/>
                        questItems: {questItems.join(', ') || 'ingen'}<br/>
                        freeCam: {freeCamEnabled ? '🔵 AKTIV' : 'slukket'}
                      </div>
                    </div>
                  </div>
                )}

                {/* ── TAB: SAVE ── */}
                {adminTab === 'save' && (
                  <div>
                    <div style={cardStyle}>
                      <span style={labelStyle}>📤 Export Save</span>
                      <p style={{ color: '#94a3b8', fontSize: '0.82rem', marginBottom: '0.75rem', lineHeight: 1.5 }}>Downloader en JSON-fil med alt din progression. Kan importeres senere.</p>
                      <button style={{ ...btnStyle('#065f46'), width: '100%', padding: '0.85rem', fontSize: '0.95rem' }} onClick={exportSave}>
                        💾 Download regnefisken_save_[DATO].json
                      </button>
                    </div>
                    <div style={cardStyle}>
                      <span style={labelStyle}>📥 Import Save</span>
                      <p style={{ color: '#94a3b8', fontSize: '0.82rem', marginBottom: '0.75rem', lineHeight: 1.5 }}>Indlæs en tidligere eksporteret save-fil. Siden genindlæses automatisk.</p>
                      <label style={{ display: 'block', padding: '0.85rem', borderRadius: '0.6rem', background: 'rgba(30,41,59,0.6)', border: '2px dashed rgba(139,92,246,0.4)', color: '#d8b4fe', fontWeight: 700, cursor: 'pointer', textAlign: 'center', fontSize: '0.9rem' }}>
                        📂 Vælg save-fil (.json)
                        <input
                          type="file"
                          accept=".json"
                          style={{ display: 'none' }}
                          onChange={e => {
                            const file = e.target.files?.[0];
                            if (!file) return;
                            const reader = new FileReader();
                            reader.onload = (ev) => {
                              try {
                                const data = JSON.parse(ev.target.result);
                                if (data.progression) localStorage.setItem('regnefisken_save', JSON.stringify(data));
                                showAdminMsg('✅ Save importeret! Genindlæser...');
                                setTimeout(() => window.location.reload(), 1500);
                              } catch (err) {
                                showAdminMsg('❌ Ugyldig save-fil!');
                              }
                            };
                            reader.readAsText(file);
                          }}
                        />
                      </label>
                    </div>
                    <div style={{ ...cardStyle, border: '2px solid rgba(220,38,38,0.35)' }}>
                      <span style={{ ...labelStyle, color: '#f87171' }}>⚠️ Nulstil ALT</span>
                      <p style={{ color: '#94a3b8', fontSize: '0.82rem', marginBottom: '0.75rem', lineHeight: 1.5 }}>Sletter AL progression, mønter, opgrades og stats. Kan IKKE fortrydes!</p>
                      <button
                        style={{ ...btnStyle('#dc2626'), width: '100%', padding: '0.85rem', fontSize: '0.95rem' }}
                        onClick={() => {
                          if (!window.confirm('⚠️ ER DU HELT SIKKER? Alt progression slettes permanent!')) return;
                          if (!window.confirm('Anden bekræftelse: Nulstil virkelig ALT?')) return;
                          try { localStorage.removeItem('regnefisken_save'); } catch (_) {}
                          window.location.reload();
                        }}
                      >
                        🗑️ NULSTIL ALT OG GENSTART
                      </button>
                    </div>
                  </div>
                )}

                {adminTab === 'logger' && (
                  <div>
                    <div style={cardStyle}>
                      <span style={labelStyle}>📊 Balancing Logger v2.0</span>
                      <p style={{ color: '#94a3b8', fontSize: '0.75rem', marginBottom: '1rem' }}>
                        Perfekt til at finpudse pacing og se præcis hvad spilleren laver.
                      </p>

                      <div style={{ display: 'flex', gap: '0.5rem', marginBottom: '1rem', flexWrap: 'wrap' }}>
                        <button style={btnStyle(isLoggingUI ? '#dc2626' : '#16a34a')}
                          onClick={() => {
                            const newState = !isLoggingRef.current;
                            isLoggingRef.current = newState;
                            setIsLoggingUI(newState);
                            addLog('SYSTEM', `Logger ${newState ? 'STARTET' : 'STOPPET'}`);
                          }}>
                          {isLoggingUI ? '⏹ Stop Log' : '▶️ Start Log'}
                        </button>
                        <button style={btnStyle('#475569')} onClick={() => { if (window.confirm('Ryd log?')) setGameLogs([]); }}>🗑️ Ryd</button>
                        <button style={btnStyle('#2563eb')} onClick={() => {
                          navigator.clipboard.writeText(gameLogs.map(l => `[${l.time}] [${l.category}] ${l.message}`).join('\n'));
                          showAdminMsg('✅ Log kopieret!');
                        }}>📋 Kopier</button>
                        <button style={btnStyle('#7c3aed')} onClick={() => {
                          const text = gameLogs.map(l => `[${l.time}] [${l.category}] ${l.message}`).join('\n');
                          const blob = new Blob([text], { type: 'text/plain' });
                          const url = URL.createObjectURL(blob);
                          const a = document.createElement('a');
                          a.href = url; a.download = `regnefisken_log_${new Date().toISOString().slice(0,10)}.txt`;
                          a.click(); URL.revokeObjectURL(url);
                          showAdminMsg('✅ Log gemt!');
                        }}>💾 Gem .txt</button>
                      </div>

                      <select value={logFilter} onChange={e => setLogFilter(e.target.value)}
                        style={{width:'100%', padding:'0.5rem', marginBottom:'0.75rem', borderRadius:'0.5rem', background:'#1e2937', color:'white', border:'1px solid #334155'}}>
                        <option value="ALL">Alle kategorier</option>
                        <option value="FANGST">🐟 Fangst</option>
                        <option value="ØKONOMI">💰 Økonomi</option>
                        <option value="PROGRESSION">⭐ Progression</option>
                        <option value="LOKATION">🗺️ Lokation</option>
                        <option value="VEJR">🌦️ Vejr</option>
                        <option value="SYSTEM">⚙️ System</option>
                      </select>

                      <div ref={logContainerRef} style={{background:'#0f172a', border:'1px solid #334155', padding:'0.75rem', borderRadius:'0.5rem', height:'380px', overflowY:'auto', fontFamily:'monospace', fontSize:'0.78rem', color:'#4ade80', whiteSpace:'pre-wrap', lineHeight:1.35}}>
                        {gameLogs.length === 0 ? (
                          <span style={{color:'#64748b', fontStyle:'italic'}}>Tryk "Start Log" og spil – så kommer logs her...</span>
                        ) : (
                          gameLogs.filter(log => logFilter === 'ALL' || log.category === logFilter).map((log, i) => (
                            <div key={i} style={{marginBottom:'4px'}}>
                              <span style={{color:'#64748b'}}>[{log.time}]</span>{' '}
                              <span style={{color: LOG_CATEGORIES[log.category] || '#94a3b8'}}>[{log.category}]</span>{' '}
                              {log.message}
                            </div>
                          ))
                        )}
                      </div>
                    </div>
                  </div>
                )}

              </div>

              {/* Admin Message Toast (bunden af modal) */}
              {adminMessage && (
                <div style={{ padding: '0.75rem 1.75rem', borderTop: `1px solid ${BORDER}`, background: 'rgba(139,92,246,0.12)', flexShrink: 0 }}>
                  <div style={{ color: '#e9d5ff', fontWeight: 700, fontSize: '0.85rem', display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                    {adminMessage}
                  </div>
                </div>
              )}
            </div>
          </div>

                          <div className="text-left">
                            <div className="font-black text-white text-sm">🎯 100'er-venner</div>
                            <div className="text-xs font-bold mt-0.5" style={{ color: isOn ? '#6ee7b7' : '#64748b' }}>90 + ? = 100 — hele tiere</div>
                          </div>
                          <div className={`w-6 h-6 rounded-full border-2 flex items-center justify-center text-xs font-black transition-all ${isOn ? 'bg-green-500 border-green-400 text-white' : 'bg-slate-800 border-slate-600 text-slate-600'}`}>
                            {isOn ? '✓' : ''}
                          </div>
                        </button>
                      );
                    })()}

                    {/* Skæve 100'er-venner – kun 4.-6.kl */}
                    {FARVANDE[selectedFarvand].allowedOps.includes('skaeve100friends') && (() => {
                      const isOn = activeOps.includes('skaeve100friends');
                      const toggle = () => {
                        play('ui');
                        setActiveOps(prev => {
                          if (isOn && prev.length === 1) return prev;
                          return isOn ? prev.filter(o => o !== 'skaeve100friends') : [...prev, 'skaeve100friends'];
                        });
                      };
                      return (
                        <button onClick={toggle}
                          className="w-full flex items-center justify-between px-4 py-3 rounded-2xl border-2 transition-all hover:scale-[1.02] active:scale-95 mb-2"
                          style={{ background: isOn ? 'rgba(217,119,6,0.15)' : 'rgba(30,41,59,0.5)', borderColor: isOn ? '#d97706' : 'rgba(51,65,85,0.6)' }}>
                          <div className="text-left">
                            <div className="font-black text-white text-sm">🎯 Skæve 100'er-venner</div>
                            <div className="text-xs font-bold mt-0.5" style={{ color: isOn ? '#fcd34d' : '#64748b' }}>37 + ? = 100 — alle tal 1-99</div>
                          </div>
                          <div className={`w-6 h-6 rounded-full border-2 flex items-center justify-center text-xs font-black transition-all ${isOn ? 'bg-orange-500 border-orange-400 text-white' : 'bg-slate-800 border-slate-600 text-slate-600'}`}>
                            {isOn ? '✓' : ''}
                          </div>
                        </button>
                      );
                    })()}


                    {/* Ekspert-kategorier – kun synlig når farvandet har flere kategorier end basic */}
                    {FARVANDE[selectedFarvand].allowedCategories.length > 1 && (
                    <div className="rounded-2xl border overflow-hidden" style={{ borderColor: 'rgba(99,102,241,0.25)', background: 'rgba(99,102,241,0.05)' }}>
                      <div className="space-y-0">
                        {/* ── NY FARVAND-LOGIK ── Brøker fjernet, filtreret efter farvand */}
                        {[
                          { id: 'basic',      label: 'Ingen (standard regnearter)', icon: '🔢', desc: 'Brug kun de valgte regnearter ovenfor' },
                          { id: 'multi-term', label: 'Flere led',                   icon: '📐', desc: '3 led: a + b − c' },
                          { id: 'equations',  label: 'Ligninger',                   icon: '🔤', desc: 'Find x: a + x = c' },
                          { id: 'decimals',   label: 'Decimaler',                   icon: '🔬', desc: 'Regn med decimaltal' },
                          { id: 'regnehistorier', label: 'Regnehistorier',          icon: '📖', desc: 'Tekstopgaver med hajer & fisk (+20 XP)' },
                        ].filter(({ id }) => FARVANDE[selectedFarvand].allowedCategories.includes(id)).map(({ id, label, icon, desc }, idx) => (
                          <button key={id} onClick={() => { play('ui'); setMathCategory(id); }}
                            className="w-full flex items-center gap-3 px-4 py-2.5 transition-all hover:bg-white/5 active:scale-[0.98]"
                            style={{
                              background: mathCategory === id ? 'rgba(99,102,241,0.18)' : 'transparent',
                              borderTop: idx > 0 ? '1px solid rgba(99,102,241,0.12)' : 'none',
                            }}>
                            <span className="text-base">{icon}</span>
                            <div className="text-left flex-1 min-w-0">
                              <div className="font-bold text-white text-sm truncate">{label}</div>
                              <div className="text-[11px] text-slate-500 truncate">{desc}</div>
                            </div>
                            <div className={`w-5 h-5 rounded-full border-2 flex items-center justify-center text-[10px] font-black shrink-0 transition-all ${mathCategory === id ? 'bg-indigo-500 border-indigo-400 text-white' : 'bg-slate-800 border-slate-600'}`}>
                              {mathCategory === id ? '●' : ''}
                            </div>
                          </button>
                        ))}
                      </div>
                    </div>
                    )}
                  </div>

                  <div className="mt-3 px-3 py-2 rounded-xl text-xs font-bold text-slate-400" style={{ background: 'rgba(15,23,42,0.6)', border: '1px solid rgba(51,65,85,0.4)' }}>
                    {mathCategory === 'regnehistorier'
                      ? '🌟 Regnehistorier giver +20 XP og bedre chance for sjældne fisk!'
                      : mathCategory !== 'basic'
                      ? '🌟 Specialmadding giver +15 XP ekstra per løst opgave!'
                      : FARVANDE[selectedFarvand].allowedCategories.length > 1
                        ? '💡 Tip: Vælg en specialkategori herover for ekstra XP og sværere opgaver.'
                        : '💡 Tip: Slå 10\'er-venner til for at øve talforståelse. Du kan kombinere med + og −.'}
                  </div>
                </div>
              )}

              {/* FANE 2: Sværhedsgrad – 3 niveauer */}
              {mathSettingsTab === 'level' && (
                <div>
                  <h3 className="text-sm font-black uppercase tracking-widest text-slate-400 mb-3">📊 Vælg sværhedsgrad</h3>
                  <div className="space-y-2">
                    {[
                      { id: 'beginner',     label: 'Begynder',  desc: 'Encifrede tal og simple tabeller (1–10)',     icon: '🟢', color: '#22c55e', bg: 'rgba(34,197,94,0.15)',   radio: 'bg-green-500 border-green-400' },
                      { id: 'intermediate', label: 'Øvet',      desc: 'To- og trecifrede tal, den lille tabel',       icon: '🟡', color: '#eab308', bg: 'rgba(234,179,8,0.15)',  radio: 'bg-yellow-400 border-yellow-300' },
                      { id: 'expert',       label: 'Ekspert',   desc: 'Store tal, gange med tocifret × encifret',     icon: '🟣', color: '#6366f1', bg: 'rgba(99,102,241,0.15)', radio: 'bg-indigo-500 border-indigo-400' },
                    ].map(({ id, label, desc, icon, color, bg, radio }) => (
                      <button key={id} onClick={() => { play('ui'); setMathDifficulty(id); }}
                        className="w-full flex items-center justify-between px-4 py-3 rounded-2xl border-2 transition-all hover:scale-[1.02] active:scale-95"
                        style={{ background: mathDifficulty === id ? bg : 'rgba(30,41,59,0.5)', borderColor: mathDifficulty === id ? color : 'rgba(51,65,85,0.6)' }}>
                        <div className="flex items-center gap-3">
                          <span className="text-xl">{icon}</span>
                          <div className="text-left">
                            <div className="font-black text-white text-sm">{label}</div>
                            <div className="text-xs text-slate-400 mt-0.5">{desc}</div>
                          </div>
                        </div>
                        <div className={`w-6 h-6 rounded-full border-2 flex items-center justify-center text-xs font-black transition-all ${mathDifficulty === id ? `${radio} text-white` : 'bg-slate-800 border-slate-600'}`}>
                          {mathDifficulty === id ? '●' : ''}
                        </div>
                      </button>
                    ))}
                  </div>
                  <div className="mt-3 px-3 py-2 rounded-xl text-xs font-bold text-slate-400" style={{ background: 'rgba(15,23,42,0.6)', border: '1px solid rgba(51,65,85,0.4)' }}>
                    💡 Begynder passer til Kysten (0.–3. kl.), Øvet til Åbent Hav (4.–6. kl.), Ekspert til Dybet (7.–9. kl.).
                  </div>
                </div>
              )}

              {/* FANE 3: Tid */}
              {mathSettingsTab === 'time' && (
                <div>
                  <h3 className="text-sm font-black uppercase tracking-widest text-slate-400 mb-3">🕐 Tid på regnestykker</h3>
                  <div className="flex gap-2">
                    {/* ZEN MODE: Til/fra-knapper – børnevenlige, taktile, med aria-pressed */}
                    <button
                      onClick={() => { play('ui'); setZenMode(false); }}
                      aria-pressed={!zenMode}
                      className="flex-1 flex flex-col items-center gap-1 px-4 py-4 rounded-2xl border-2 transition-all hover:scale-[1.02] active:scale-95 font-black"
                      style={{
                        background: !zenMode ? 'rgba(16,185,129,0.18)' : 'rgba(30,41,59,0.5)',
                        borderColor: !zenMode ? '#10b981' : 'rgba(51,65,85,0.6)',
                      }}
                    >
                      <span className="text-3xl">🕐</span>
                      <span className="text-sm font-black text-white">Med tid</span>
                      <div className={`w-5 h-5 rounded-full border-2 flex items-center justify-center text-xs font-black mt-1 transition-all ${!zenMode ? 'bg-green-500 border-green-400 text-white' : 'bg-slate-800 border-slate-600'}`}>
                        {!zenMode ? '●' : ''}
                      </div>
                    </button>
                    <button
                      onClick={() => { play('ui'); setZenMode(true); }}
                      aria-pressed={zenMode}
                      className="flex-1 flex flex-col items-center gap-1 px-4 py-4 rounded-2xl border-2 transition-all hover:scale-[1.02] active:scale-95 font-black"
                      style={{
                        background: zenMode ? 'rgba(14,165,233,0.18)' : 'rgba(30,41,59,0.5)',
                        borderColor: zenMode ? '#0ea5e9' : 'rgba(51,65,85,0.6)',
                      }}
                    >
                      <span className="text-3xl">♾️</span>
                      <span className="text-sm font-black text-white">Uden tid</span>
                      <div className={`w-5 h-5 rounded-full border-2 flex items-center justify-center text-xs font-black mt-1 transition-all ${zenMode ? 'bg-sky-500 border-sky-400 text-white' : 'bg-slate-800 border-slate-600'}`}>
                        {zenMode ? '●' : ''}
                      </div>
                    </button>
                  </div>
                  <div className="mt-3 px-3 py-2 rounded-xl text-xs font-bold text-slate-400" style={{ background: 'rgba(15,23,42,0.6)', border: '1px solid rgba(51,65,85,0.4)' }}>
                    💡 Info: Spil i dit eget tempo. Bemærk: Combo-bonus (⚡) er slået fra, når tiden er stoppet.
                  </div>

                  {/* SEKTION 4: Klip linen – kun synlig i zenMode */}
                  {zenMode && (
                    <div className="mt-6 pt-5 border-t border-slate-700/50">
                      <h3 className="text-sm font-black uppercase tracking-widest text-slate-400 mb-2">✂️ Klip linen-knap</h3>
                      <p className="text-xs text-slate-400 mb-3">Hvis et regnestykke føles for svært, dukker en venlig "Klip linen" op efter valgt tid. Barnet ser svaret og lærer uden at sidde fast.</p>
                      <div className="flex gap-2">
                        {[
                          { val: 10, label: '10 sek' },
                          { val: 15, label: '15 sek' },
                          { val: 0,  label: 'Aldrig' },
                        ].map(({ val, label }) => (
                          <button key={val} onClick={() => { play('ui'); setZenSkipDelay(val); }}
                            className="flex-1 py-3 rounded-2xl border-2 font-black text-sm transition-all hover:scale-[1.02] active:scale-95"
                            style={{
                              background: zenSkipDelay === val ? 'rgba(14,165,233,0.18)' : 'rgba(30,41,59,0.5)',
                              borderColor: zenSkipDelay === val ? '#0ea5e9' : 'rgba(51,65,85,0.6)',
                              color: zenSkipDelay === val ? '#7dd3fc' : '#64748b',
                            }}>
                            {label}
                          </button>
                        ))}
                      </div>
                      <div className="mt-3 px-3 py-2 rounded-xl text-xs font-bold text-slate-400" style={{ background: 'rgba(15,23,42,0.6)', border: '1px solid rgba(51,65,85,0.4)' }}>
                        💡 Kun aktiv i Uendelig tid. Barnet får tid til at tænke – og ser svaret når det giver op.
                      </div>
                    </div>
                  )}
                </div>
              )}

              {/* FANE 4: Avanceret – Kun indtastningsmetode */}
              {mathSettingsTab === 'more' && (
                <div className="flex flex-col">
                  <div className="pt-2">
                    <h3 className="text-sm font-black uppercase tracking-widest text-slate-400 mb-4">⌨️ Indtastningsmetode</h3>
                    <div className="bg-slate-800/70 rounded-3xl p-5 border border-slate-700 flex items-center justify-between">
                      <div className="flex items-center gap-4">
                        <div className="w-12 h-12 rounded-2xl bg-gradient-to-br from-emerald-400 to-cyan-400 flex items-center justify-center text-3xl">🔢</div>
                        <div>
                          <div className="font-bold text-white text-lg">Touch-numpad</div>
                          <div className="text-slate-400 text-sm">Store knapper i kamp-skærmen. Standard på mobil.</div>
                        </div>
                      </div>
                      <button onClick={() => { play('ui'); setShowNumberPad(!showNumberPad); }} className={`relative w-16 h-9 rounded-full transition-all ${showNumberPad ? 'bg-emerald-500' : 'bg-slate-600'}`}>
                        <div className={`absolute top-0.5 left-0.5 w-8 h-8 bg-white rounded-full shadow-md transition-all flex items-center justify-center text-xs font-black ${showNumberPad ? 'translate-x-7' : ''}`}>{showNumberPad ? 'ON' : 'OFF'}</div>
                      </button>
                    </div>
                    <div className="mt-3 px-3 py-2 rounded-xl text-xs font-bold text-slate-400" style={{ background: 'rgba(15,23,42,0.6)', border: '1px solid rgba(51,65,85,0.4)' }}>
                      💡 Numpad inkluderer C, − og . knapper. Minus og komma er kun synlige i Dybet-farvandet.
                    </div>
                  </div>
                </div>
              )}



            </div>
          </div>
        </div>
      )}

      {/* ── STARTSKÆRM OVERLAY ── */}
      {!hasStarted && (
        <div
          className={`absolute inset-0 z-50 flex flex-col items-center justify-center overflow-hidden transition-opacity duration-600 ${isFadingOut ? 'opacity-0 pointer-events-none' : 'opacity-100'}`}
          style={{ transition: 'opacity 0.6s ease' }}
        >
          {/* Baggrund: himmel → hav → sand gradient */}
          <div className="absolute inset-0" style={{ background: 'linear-gradient(to bottom, #38bdf8 0%, #0ea5e9 35%, #0369a1 60%, #075985 72%, #c2a46e 80%, #e2c97e 88%, #f0d9a0 100%)' }} />

          {/* Sky/clouds */}
          <div className="cloud1 absolute top-[6%] left-0" style={{ pointerEvents: 'none', zIndex: 2 }}>
            <div style={{ width: 180, height: 55, background: 'rgba(255,255,255,0.88)', borderRadius: 40, position: 'relative' }}>
              <div style={{ width: 80, height: 50, background: 'rgba(255,255,255,0.88)', borderRadius: 40, position: 'absolute', top: -22, left: 30 }} />
              <div style={{ width: 60, height: 40, background: 'rgba(255,255,255,0.88)', borderRadius: 40, position: 'absolute', top: -16, left: 80 }} />
            </div>
          </div>
          <div className="cloud2 absolute top-[13%] left-0" style={{ pointerEvents: 'none', zIndex: 2 }}>
            <div style={{ width: 140, height: 42, background: 'rgba(255,255,255,0.75)', borderRadius: 40, position: 'relative' }}>
              <div style={{ width: 70, height: 45, background: 'rgba(255,255,255,0.75)', borderRadius: 40, position: 'absolute', top: -20, left: 20 }} />
            </div>
          </div>
          <div className="cloud3 absolute top-[4%] left-0" style={{ pointerEvents: 'none', marginLeft: '40vw', zIndex: 2 }}>
            <div style={{ width: 110, height: 35, background: 'rgba(255,255,255,0.65)', borderRadius: 40, position: 'relative' }}>
              <div style={{ width: 55, height: 38, background: 'rgba(255,255,255,0.65)', borderRadius: 40, position: 'absolute', top: -16, left: 18 }} />
            </div>
          </div>

          {/* Solskive */}
          <div className="absolute" style={{ top: '7%', right: '12%', width: 70, height: 70, borderRadius: '50%', background: 'radial-gradient(circle, #fef08a 30%, #fde047 70%, #facc15 100%)', boxShadow: '0 0 40px 12px rgba(253,224,71,0.5)', zIndex: 1 }} />

          {/* Havbølger - dekorative SVG bølger */}
          <div className="wave-anim absolute" style={{ bottom: '18%', left: 0, right: 0, height: 60, overflow: 'hidden' }}>
            <svg viewBox="0 0 1440 60" preserveAspectRatio="none" style={{ width: '100%', height: '100%' }}>
              <path d="M0,30 C200,5 400,55 600,30 C800,5 1000,55 1200,30 C1300,17 1380,38 1440,30 L1440,60 L0,60 Z" fill="rgba(255,255,255,0.18)" />
              <path d="M0,40 C180,15 360,60 540,40 C720,15 900,60 1080,40 C1260,20 1360,50 1440,40 L1440,60 L0,60 Z" fill="rgba(255,255,255,0.12)" />
            </svg>
          </div>

          {/* Springende fisk */}
          <div className="fish-jump absolute" style={{ bottom: '20%', left: '15%', fontSize: 40 }}>🐟</div>
          <div className="fish-jump absolute" style={{ bottom: '22%', right: '18%', fontSize: 30, animationDelay: '3.5s' }}>🐠</div>

          {/* Sandstrand detaljer */}
          <div className="absolute bottom-0 left-0 right-0" style={{ height: '18%', background: 'linear-gradient(to bottom, #e2c97e, #d4b483)' }}>
            <div className="absolute" style={{ bottom: '30%', left: '8%', fontSize: 28 }}>🐚</div>
            <div className="absolute" style={{ bottom: '20%', left: '22%', fontSize: 22 }}>🦀</div>
            <div className="absolute" style={{ bottom: '35%', right: '15%', fontSize: 24 }}>⭐</div>
            <div className="absolute" style={{ bottom: '25%', right: '30%', fontSize: 20 }}>🐚</div>
          </div>

          {/* Titel */}
          <div className="relative z-10 flex flex-col items-center" style={{ marginTop: '-8vh' }}>
            <h1
              className="start-title"
              style={{
                fontSize: 'clamp(2.0rem, 6.5vw, 6rem)',
                fontWeight: 900,
                color: 'white',
                textTransform: 'uppercase',
                letterSpacing: '0.03em',
                textShadow: 'none',
                lineHeight: 1.1,
                fontFamily: 'Georgia, "Times New Roman", serif',
                display: 'inline-block',
                willChange: 'transform',
                whiteSpace: 'nowrap',
                maxWidth: '95vw',
                overflow: 'hidden',
              }}
            >
              🎣 Regnefisken
            </h1>

            {/* Undertekst */}
            <p className="start-btn" style={{ color: 'rgba(255,255,255,0.85)', fontSize: 'clamp(0.9rem, 2.5vw, 1.3rem)', fontWeight: 600, letterSpacing: '0.15em', textTransform: 'uppercase', marginTop: '0.5rem', textShadow: '0 1px 4px rgba(0,0,0,0.4)', animationDelay: '0.7s' }}>
              Fisk, regnestykker & eventyr
            </p>

            {/* Start-knap */}
            <button
              onClick={handleStartGame}
              className="start-btn"
              style={{
                marginTop: '2.5rem',
                background: 'linear-gradient(to bottom, #4ade80, #16a34a)',
                color: 'white',
                fontSize: 'clamp(1.4rem, 4vw, 2rem)',
                fontWeight: 800,
                padding: '1rem 4rem',
                borderRadius: '2rem',
                border: 'none',
                cursor: 'pointer',
                letterSpacing: '0.12em',
                textTransform: 'uppercase',
                boxShadow: '0 8px 0 #14532d, 0 16px 30px rgba(0,0,0,0.35)',
                transform: 'translateY(0)',
                transition: 'transform 0.1s, box-shadow 0.1s',
                animationDelay: '0.9s',
              }}
              onMouseEnter={e => { e.currentTarget.style.transform = 'translateY(-3px)'; e.currentTarget.style.boxShadow = '0 11px 0 #14532d, 0 20px 35px rgba(0,0,0,0.4)'; }}
              onMouseLeave={e => { e.currentTarget.style.transform = 'translateY(0)'; e.currentTarget.style.boxShadow = '0 8px 0 #14532d, 0 16px 30px rgba(0,0,0,0.35)'; }}
              onMouseDown={e => { e.currentTarget.style.transform = 'translateY(5px)'; e.currentTarget.style.boxShadow = '0 3px 0 #14532d, 0 8px 15px rgba(0,0,0,0.3)'; }}
              onMouseUp={e => { e.currentTarget.style.transform = 'translateY(0)'; e.currentTarget.style.boxShadow = '0 8px 0 #14532d, 0 16px 30px rgba(0,0,0,0.35)'; }}
            >
              🎮 Start
            </button>
          </div>

          {/* ── COPYRIGHT + KONTAKT (nederst midt – virker perfekt på mobil) ── */}
          <div className="absolute bottom-6 left-1/2 -translate-x-1/2 flex flex-col items-center gap-3 z-10 pointer-events-auto">
            <div className="text-white/70 text-[11px] md:text-xs font-medium tracking-wide text-center leading-tight">
              © 2026 Anders E. D. Larsen<br />
              Alle rettigheder forbeholdt • <span className="text-emerald-300">Gratis nu</span>
            </div>
            <button
              onClick={() => { play('ui'); setShowContactModal(true); }}
              className="btn-glass px-6 py-2.5 text-xs md:text-sm font-bold tracking-widest hover:bg-white/10 active:scale-95 transition-all flex items-center gap-2 shadow-md"
            >
              ✉️ Kontakt udvikleren
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<FishingGame />);
setTimeout(() => {
  window.parent.postMessage({ type: 'REGNEFISKEN_READY' }, '*');
}, 950);
</script>
</body>
</html>
