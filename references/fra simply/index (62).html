// Palmer til Tropisk Ø
const _trunkMat = createCompanionPBR(0x6B4A31, { roughness: 0.9, flatShading: false, pbrEnabled: false });
const _leafMat  = createCompanionPBR(0x2E8B57, { roughness: 0.8, flatShading: false });
const _brightLeafMat = createCompanionPBR(0x3CB371, { roughness: 0.8, flatShading: false });
const _nutMat   = createCompanionPBR(0x3E2723, { roughness: 1.0, flatShading: false, pbrEnabled: false });

function _createPalmLeaf(mat, sx, sy, sz) {
  const leaf = new THREE.Mesh(new THREE.SphereGeometry(1, 10, 6), mat);
  leaf.scale.set(sx, sy, sz); return leaf;
}

function buildPalm1() {
  const group = new THREE.Group();
  let yPos = 0, radius = 0.42;
  for (let i = 0; i < 12; i++) {
    const seg = new THREE.Mesh(new THREE.CylinderGeometry(radius * 0.9, radius, 0.33, 8), _trunkMat);
    seg.position.set(Math.sin(i * 0.12) * 0.28, yPos, Math.cos(i * 0.12) * 0.14);
    seg.rotation.z = Math.sin(i * 0.12) * 0.08;
    group.add(seg); yPos += 0.29; radius *= 0.96;
  }
  const crown = new THREE.Group();
  crown.position.set(Math.sin(11 * 0.12) * 0.28, yPos, Math.cos(11 * 0.12) * 0.14);
  for (let i = 0; i < 7; i++) {
    const leaf = _createPalmLeaf(_leafMat, 2.2, 0.14, 0.55);
    const pivot = new THREE.Group(); leaf.position.set(1.4, 0, 0); pivot.add(leaf);
    pivot.rotation.y = (i / 7) * Math.PI * 2; pivot.rotation.z = 0.38 + Math.random() * 0.28;
    crown.add(pivot);
  }
  for (let i = 0; i < 3; i++) {
    const nut = new THREE.Mesh(new THREE.DodecahedronGeometry(0.25, 1), _nutMat);
    nut.position.set(Math.cos(i * 2.1) * 0.28, -0.18, Math.sin(i * 2.1) * 0.28); crown.add(nut);
  }
  group.add(crown);
  return group;
}

function buildPalm4() {
  const group = new THREE.Group();
  const fullCrown = new THREE.Group();
  function createBranch(rotAngle, heightMod) {
    const branch = new THREE.Group(); let yPos = 0, xPos = 0, radius = 0.38;
    for (let i = 0; i < 10; i++) {
      const seg = new THREE.Mesh(new THREE.CylinderGeometry(radius * 0.9, radius, 0.38, 7), _trunkMat);
      seg.position.set(xPos, yPos, 0); seg.rotation.z = rotAngle * (i / 10); branch.add(seg);
      yPos += 0.32 * heightMod; xPos += rotAngle * 0.13; radius *= 0.95;
    }
    const crown = new THREE.Group(); crown.position.set(xPos, yPos, 0);
    for (let i = 0; i < 6; i++) {
      const leaf = _createPalmLeaf(_brightLeafMat, 1.9, 0.12, 0.48);
      const pivot = new THREE.Group(); leaf.position.set(1.1, 0, 0); pivot.add(leaf);
      pivot.rotation.y = (i / 6) * Math.PI * 2; pivot.rotation.z = 0.3 + Math.random() * 0.28;
      crown.add(pivot);
    }
    for (let i = 0; i < 2; i++) {
      const nut = new THREE.Mesh(new THREE.DodecahedronGeometry(0.22, 1), _nutMat);
      nut.position.set(Math.cos(i * 3.14) * 0.22, -0.18, Math.sin(i * 3.14) * 0.22); crown.add(nut);
    }
    fullCrown.add(crown); group.add(branch);
  }
  createBranch(0.5, 1.0); createBranch(-0.7, 0.88);
  group.add(fullCrown);
  return group;
}

function buildCave(refs) {
  clearLocationObjects(refs);
  if (refs.water) {
    refs.water.visible = true;
    refs.water.material.color.setHex(0x020408);
    refs.water.material.specular = new THREE.Color(0x001133);
  }

  // Grotte-vægge: grove klippestykker rundt om spilleren
  const rockMat = createCompanionPBR(0x111111, { roughness: 1.0, metalness: 0.1, flatShading: true, pbrEnabled: false });
  const rockPositions = [
    [0, 2, -18], [-12, 0, -14], [12, 0, -14],
    [-18, -2, -4], [18, -2, -4],
    [-16, 1, 8], [16, 1, 8],
    [-8, 4, -20], [8, 4, -20],
    [0, 8, -22],
  ];
  rockPositions.forEach(([x, y, z], i) => {
    const size = 6 + Math.random() * 8;
    const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(size, 0), rockMat);
    rock.position.set(x, y - 4, z);
    rock.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
    addLocationObject(refs, rock);
  });

  // Drypsten fra loftet
  const stalMat = createCompanionPBR(0x1a1a1a, { roughness: 0.9, flatShading: true, pbrEnabled: false });
  for (let i = 0; i < 8; i++) {
    const h = 1.5 + Math.random() * 3;
    const stal = new THREE.Mesh(new THREE.ConeGeometry(0.15 + Math.random() * 0.2, h, 5), stalMat);
    stal.position.set(-8 + i * 2.3 + (Math.random() - 0.5), 10 - h / 2, -8 + Math.random() * 6);
    stal.rotation.z = Math.PI;
    addLocationObject(refs, stal);
  }

  // Krystal-gløde punkter på vægge (selvlysende grønne krystaller)
  const crystalColors = [0x00ff88, 0x00ffcc, 0x44ff44, 0x88ffcc];
  for (let i = 0; i < 6; i++) {
    const crystalMat = createCompanionPBR(crystalColors[i % crystalColors.length], {
      emissive: new THREE.Color(crystalColors[i % crystalColors.length]),
      emissiveIntensity: 0.8,
      roughness: 0.1,
      flatShading: true,
    });
    const crystal = new THREE.Mesh(new THREE.OctahedronGeometry(0.3 + Math.random() * 0.2, 0), crystalMat);
    crystal.position.set(
      -10 + i * 4 + (Math.random() - 0.5) * 2,
      -0.5 + Math.random() * 2,
      -10 + Math.random() * 4
    );
    addLocationObject(refs, crystal);
    refs._crystals = refs._crystals || [];
    refs._crystals.push({ mesh: crystal, baseIntensity: 0.8, phase: Math.random() * Math.PI * 2 });
  }

  // Glødende spore-partikler (bioluminescens)
  const sporeCount = 400;
  const sporeGeo = new THREE.BufferGeometry();
  const sporePos = new Float32Array(sporeCount * 3);
  const sporeAlpha = new Float32Array(sporeCount);
  for (let i = 0; i < sporeCount; i++) {
    sporePos[i * 3]     = (Math.random() - 0.5) * 50;
    sporePos[i * 3 + 1] = -2 + Math.random() * 22;
    sporePos[i * 3 + 2] = (Math.random() - 0.5) * 50;
    sporeAlpha[i] = Math.random();
  }
  sporeGeo.setAttribute('position', new THREE.BufferAttribute(sporePos, 3));
  const sporeMat = new THREE.PointsMaterial({
    color: 0x4ade80,
    size: 0.22,
    transparent: true,
    opacity: 0.85,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  });
  const sporeMesh = new THREE.Points(sporeGeo, sporeMat);
  addLocationObject(refs, sporeMesh);
  refs._caveSpores = { mesh: sporeMesh, pos: sporePos, count: sporeCount, alpha: sporeAlpha };

  // Svagt grønt ambient lys fra sporerne
  const sporeAmbient = new THREE.PointLight(0x00ff88, 0.4, 30);
  sporeAmbient.position.set(0, 3, -5);
  addLocationObject(refs, sporeAmbient);
  refs._sporeAmbientLight = sporeAmbient;
}

function buildHarborRat(locationId) {

  snout.position.set(0.33, 0.0, 0);
  const earL = new THREE.Mesh(new THREE.SphereGeometry(0.06, hrSegs - 1, hrSegs - 2), createCompanionPBR(0x9A8A7A, { roughness: 0.45, pbrEnabled: false, flatShading: false }));

  const eyeWM = new THREE.MeshBasicMaterial({ color: 0xFFFFFF });
  const pupilM = new THREE.MeshBasicMaterial({ color: 0x000000 });
  const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.02, hrSegs, hrSegs), eyeWM);
  eyeL.position.set(0.32, 0.06, 0.06);
  const pL = new THREE.Mesh(new THREE.SphereGeometry(0.008, 4, 4), pupilM);
  pL.position.set(0.016, 0, 0.005); eyeL.add(pL);
  const eyeR = new THREE.Mesh(new THREE.SphereGeometry(0.02, hrSegs, hrSegs), eyeWM);
  eyeR.position.set(0.32, 0.06, -0.06);
  const pR = new THREE.Mesh(new THREE.SphereGeometry(0.008, 4, 4), pupilM);
  pR.position.set(0.016, 0, -0.005); eyeR.add(pR);
  g.add(body, head, snout, earL, earR, tail, eyeL, eyeR);
  g.userData.isHarborRat = true;

  var sx, ex, gy, baseZ, startZ;

      // Løb ind: fra bag kameraet (startZ høj) frem mod vandet (baseZ lav)
      var raw = t / 5;
      var prog = raw - Math.sin(raw * Math.PI * 4) * 0.04;
      this.position.x = p.sx + Math.sin(t * 2.5) * 0.08;
      this.position.z = p.startZ + (p.baseZ - p.startZ) * prog;
      this.position.y = p.gy + Math.abs(Math.sin(t * 15)) * 0.06;
      // Snude langs X-akse → drej -90° for at pege mod negativ Z (fremad)
      this.rotation.y = Math.PI / 2 + Math.sin(t * 10) * 0.12;
    } else if (t < 9) {
      // Snuser rundt ude på molen
      this.position.x = p.sx + Math.sin(t * 1.2) * 0.3;
      this.position.y = p.gy;
      this.position.z = p.baseZ + Math.sin(t * 1.5) * 0.4;
      this.rotation.y = Math.PI / 2 + Math.sin(t * 3) * 0.6 + Math.sin(t * 12) * 0.1;
    } else if (t < 14) {
      // Løb tilbage: fra molen (baseZ lav) bagud (startZ høj)
      var raw2 = (t - 9) / 5;
      var prog2 = raw2 - Math.sin(raw2 * Math.PI * 4) * 0.04;
      this.position.x = p.sx + Math.sin(t * 2.5) * 0.08;
      this.position.z = p.baseZ + (p.startZ - p.baseZ) * prog2;
      this.position.y = p.gy + Math.abs(Math.sin(t * 15)) * 0.06;
      // Peger mod positiv Z (bagud mod kameraet)
      this.rotation.y = -Math.PI / 2 + Math.sin(t * 10) * 0.12;
    } else {
      // Pause bag kameraet
      this.position.set(p.sx, p.gy, p.startZ);
      this.rotation.y = -Math.PI / 2;
    }
  };
  return g;
}

function createParrotCompanion() {
  const g = new THREE.Group();
  const paCfg = GRAPHICS_CONFIG[currentGraphicsQuality || 'medium'] || GRAPHICS_CONFIG.medium;
  const paSegs = Math.max(8, paCfg.segments >> 1);
  const mat = (color, opts = {}) => createCompanionPBR(color, { roughness: 0.35, flatShading: false, ...opts });
  function addEye(group, x, y, z, scale) {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(scale, paSegs, paSegs), mat(0x111111, { roughness: 0.1, metalness: 0.3 }));
    eye.position.set(x, y, z);
    const pupil = new THREE.Mesh(new THREE.SphereGeometry(scale * 0.35, Math.max(6, paSegs >> 1), Math.max(6, paSegs >> 1)), new THREE.MeshBasicMaterial({ color: 0xffffff }));
    pupil.position.set(x > 0 ? scale * 0.4 : -scale * 0.4, scale * 0.2, scale * 0.8);
    eye.add(pupil);
    group.add(eye);
  }
  const palette = { body: 0xE11D48, wing: 0x059669, tail: 0x2563EB, beak: 0xFBBF24, pole: 0x5C4033 };
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.4, paSegs, paSegs), mat(palette.body, { useScales: true }));
  body.scale.set(0.8, 1.5, 0.8);
  const beak = new THREE.Mesh(new THREE.ConeGeometry(0.15, 0.4, paSegs), mat(palette.beak, { roughness: 0.3 }));
  beak.rotation.x = -Math.PI / 2.5;
  beak.position.set(0, 0.4, 0.35);
  const wingOffset = -0.15;
  const wingL = new THREE.Mesh(new THREE.SphereGeometry(0.3, paSegs, paSegs), mat(palette.wing, { useScales: true }));
  wingL.scale.set(0.2, 1, 0.6);
  wingL.position.set(-0.35, 0, 0);
  wingL.rotation.x = -0.2 + wingOffset;
  const wingR = wingL.clone();
  wingR.position.set(0.35, 0, 0);
  const tail = new THREE.Mesh(new THREE.ConeGeometry(0.15, 1, paSegs), mat(palette.tail, { useScales: true }));
  tail.position.set(0, -0.6, -0.3);
  tail.rotation.x = -0.5;

  // Pind: en vandret perch-stang fastgjort til molebrædder med en enkelt lodret støtte
  // Vandret pind — fuglens siddeflade
  const perch = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.1, paSegs), mat(palette.pole, { roughness: 0.7 }));
  perch.rotation.z = Math.PI / 2;

  // Lodret støtte ned til molen
  const support = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.045, 1.8, paSegs), mat(palette.pole, { roughness: 0.7 }));
  support.position.set(0, -1.45, 0);

  g.add(body, beak, wingL, wingR, tail, perch, support);
  addEye(g, -0.15, 0.5, 0.22, 0.06);
  addEye(g, 0.15, 0.5, 0.22, 0.06);
  g.scale.setScalar(0.95);
  g.userData = { type: 'parrotCompanion', clickable: true, wingL, wingR };
  return g;
}

function animateFishToBucket(refs, catchData, location) {
  const { scene, bucketGroup } = refs; if (!bucketGroup) return;
  const fishModel = createCatchModel(catchData, location); const scale = fishModel.scale.x; fishModel.scale.setScalar(scale * 0.4);
  fishModel.userData._catchData = catchData; // v9.0: store for quality rebuild
  fishModel.userData._location = location;   // v9.0: store for quality rebuild
  fishModel.position.set(0, 2, -2); scene.add(fishModel);
  const dest = bucketGroup.position.clone().add(new THREE.Vector3(0, 0.6, 0));
  let t = 0; const start = fishModel.position.clone(); const mid = new THREE.Vector3((start.x + dest.x) / 2, Math.max(start.y, dest.y) + 3.5, (start.z + dest.z) / 2);
  const id = setInterval(() => {
    t += 0.035;
    if (t >= 1) {
      clearInterval(id);
      let shakeT = 0; const shakeId = setInterval(() => { shakeT += 0.3; bucketGroup.rotation.z = Math.sin(shakeT) * 0.08 * (1 - shakeT / (Math.PI * 2)); if (shakeT > Math.PI * 2) { bucketGroup.rotation.z = 0; clearInterval(shakeId); } }, 16);
      // Tilfældig placering for et organisk look (fisken lander hulter til bulter)
      const angle = Math.random() * Math.PI * 2;
      const r = Math.random() * 0.2 + 0.1;
      fishModel.position.set(dest.x + Math.cos(angle) * r, dest.y - 0.1, dest.z + Math.sin(angle) * r);
      fishModel.rotation.set(Math.PI / 2 + (Math.random()-0.5)*0.5, angle, (Math.random()-0.5)*0.5);
      fishModel.userData.targetScale = scale * 0.4;
      refs.bucketFishModels.push(fishModel);
      // Max 3 fisk i 3D-scenen — ældste synker animeret væk
      if (refs.bucketFishModels.length > 3) {
        const oldFish = refs.bucketFishModels.shift();
        let shrinkT = 1.0;
        const shrinkId = setInterval(() => {
          shrinkT -= 0.15;
          if (shrinkT <= 0) {
            clearInterval(shrinkId);
            scene.remove(oldFish);
          } else {
            const ts = oldFish.userData.targetScale || scale * 0.4;
            oldFish.scale.setScalar(ts * shrinkT);
            oldFish.position.y -= 0.02;
          }
        }, 16);
      }
      return;
    }
    const u = 1 - t; fishModel.position.x = u * u * start.x + 2 * u * t * mid.x + t * t * dest.x; fishModel.position.y = u * u * start.y + 2 * u * t * mid.y + t * t * dest.y; fishModel.position.z = u * u * start.z + 2 * u * t * mid.z + t * t * dest.z; fishModel.rotation.y += 0.15;
  }, 16);
  return id;
}
function clearBucketFishModels(refs) {
  if (!refs.bucketFishModels) return; refs.bucketFishModels.forEach(m => refs.scene.remove(m)); refs.bucketFishModels = [];
}

/* v9.0: Rebuild all visible bucket fish with current graphics quality */
function rebuildBucketFishModels(refs) {
  if (!refs || !refs.bucketFishModels || !refs.scene || !refs.bucketGroup) return;
  const oldModels = [...refs.bucketFishModels];
  // Collect stored catch data from existing models
  const fishData = oldModels.map(m => ({
    catchData: m.userData._catchData,
    location: m.userData._location,
    position: m.position.clone(),
    rotation: m.rotation.clone(),
    targetScale: m.userData.targetScale || m.scale.x,
  })).filter(d => d.catchData); // only rebuild fish with stored data

  // Remove old models
  oldModels.forEach(m => refs.scene.remove(m));
  refs.bucketFishModels = [];

  // Rebuild each fish with current quality
  fishData.forEach(d => {
    try {
      const newModel = createCatchModel(d.catchData, d.location || 'pier');
      newModel.scale.setScalar(d.targetScale);
      newModel.position.copy(d.position);
      newModel.rotation.copy(d.rotation);
      newModel.userData._catchData = d.catchData;
      newModel.userData._location = d.location;
      newModel.userData.targetScale = d.targetScale;
      refs.scene.add(newModel);
      refs.bucketFishModels.push(newModel);
    } catch (e) { /* skip failed rebuilds */ }
  });
}

/* v9.0: Live-update exposure on renderer + envMapIntensity on fish materials */
function updateEnvironmentMap(refs) {
  if (!refs) return;
  const exposure = window.pmremExposure ?? 0.65;
  // Primary effect: tone mapping exposure on the renderer (always visible)
  if (refs.renderer) {
    refs.renderer.toneMappingExposure = exposure;
  }
  // Secondary effect: update envMapIntensity on fish PhysicalMaterials
  if (refs.scene) {
    refs.scene.traverse(obj => {
      if (obj.isMesh && obj.material && obj.material.isMeshPhysicalMaterial && obj.material.envMap) {
        obj.material.envMapIntensity = exposure;
      }
    });
  }
}

// ── RAIN PARTICLE SYSTEM ───────────────────────────────────────
function createRainSystem(count = 2000) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    pos[i * 3] = (Math.random() - 0.5) * 60; // x spread
    pos[i * 3 + 1] = Math.random() * 40;     // y spread
    pos[i * 3 + 2] = (Math.random() - 0.5) * 60; // z spread
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({
    color: 0xaaaaaa,
    size: 0.15,
    transparent: true,
    opacity: 0.6
  });
  const system = new THREE.Points(geo, mat);
  system.visible = false;
  return { mesh: system, positions: pos, count };
}

function updateFishingLine(refs, time, gameState) {
  const { fishingLine, bobber, rodTipPoint } = refs;
  if (!fishingLine || !bobber) return;
  const tipWorld = new THREE.Vector3();
  if (rodTipPoint) rodTipPoint.getWorldPosition(tipWorld);
  const lineEnd = new THREE.Vector3();
  if (bobber.userData.lineAttachment) bobber.userData.lineAttachment.getWorldPosition(lineEnd);
  else lineEnd.set(bobber.position.x, bobber.position.y + 0.3, bobber.position.z);
  const lp = fishingLine.geometry.attributes.position.array;
  const N = 5;
  const casting = gameState === 'casting';
  const inWater = gameState === 'waiting' || gameState === 'biting' || gameState === 'fighting';
  const sag = casting ? 0.7 : 0.25;
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    let x = tipWorld.x + (lineEnd.x - tipWorld.x) * t;
    let y = tipWorld.y + (lineEnd.y - tipWorld.y) * t;
    let z = tipWorld.z + (lineEnd.z - tipWorld.z) * t;
    const droop = 4 * sag * t * (1 - t);
    y -= droop;
    if (inWater && i > 0 && i < N) y += Math.sin(time * 1.5 + i * 1.2) * 0.06;
    lp[i * 3] = x; lp[i * 3 + 1] = y; lp[i * 3 + 2] = z;
  }

  fishingLine.visible = bobber.position.y > -2;
}

  const onArcticSea = refs.currentLocation === 'arctic_sea';

  }

  // Partikler
  for (let i = particles.length - 1; i >= 0; i--) { const p = particles[i]; p.life -= p.decay; p.mesh.position.add(p.velocity); p.velocity.y -= 0.02; p.mesh.scale.setScalar(p.life * (p.mesh.geometry.type === 'BoxGeometry' ? 0.2 : 0.5)); p.mesh.rotation.x += 0.1; p.mesh.rotation.y += 0.1; if (p.life <= 0 || p.mesh.position.y < -2) { scene.remove(p.mesh); particles.splice(i, 1); } }

  // Day/Night & Weather Lighting Mix
  if (refs.sunLight && refs.dayNightStart) {

    }
  }

  // Rod Animation
  if (refs.rodGroup) {
    const rod = refs.rodGroup;
    if (gameState === 'casting') { const t = Math.min(1, (performance.now() - (refs.castStartTime || performance.now())) / 650); rod.rotation.z = -0.18 + Math.sin(t * Math.PI) * 1.1; }
    else if (gameState === 'fighting') { rod.rotation.z = -0.5 + Math.sin(time * 4) * 0.08; }
    else { rod.rotation.z = THREE.MathUtils.lerp(rod.rotation.z, -0.18 + Math.sin(time * 0.5) * 0.03, 0.05); }
  }

  // ── NYE LOKATION-ANIMATIONER (FASE 2) ────────────────────────
  // Ørken støv drift
  if (refs._desertDust) {
    const pos = refs._desertDust.pos;
    for (let i = 0; i < 300; i++) {
      pos[i*3] += 0.02; pos[i*3+1] = 0.3 + Math.abs(Math.sin(time * 0.5 + i * 0.1)) * 1.5;
      if (pos[i*3] > 30) pos[i*3] = -30;
    }
    refs._desertDust.mesh.geometry.attributes.position.needsUpdate = true;
  }
  // Arktisk sne fald
  if (refs._arcticSnow) {
    const pos = refs._arcticSnow.pos;
    for (let i = 0; i < 500; i++) {
      pos[i*3+1] -= 0.06 + Math.sin(i) * 0.02;
      pos[i*3] += Math.sin(time * 0.3 + i * 0.05) * 0.01;
      if (pos[i*3+1] < -1) pos[i*3+1] = 30;
    }
    refs._arcticSnow.mesh.geometry.attributes.position.needsUpdate = true;
  }
  // Pejs-ild animation (fiskehytten)
  if (refs.fireParticles && refs.currentLocation === 'fishing_cabin') {
    const MANTEL_Y = 2.05; // lidt under mantelpladens underkant (~2.24) — ild forsvinder her
    refs.fireParticles.forEach((f, i) => {
      f.position.y += 0.02 + Math.sin(time * f.userData.speed + f.userData.offset) * 0.01;
      // Skalér og fade ud jo tættere partiklen er på mantlen
      const distToMantel = Math.max(0, MANTEL_Y - f.position.y);
      const fadeT = Math.min(1, distToMantel / 0.55); // 1 = fuld størrelse, 0 = usynlig
      const baseScale = (0.6 + Math.sin(time * 1.8 + f.userData.offset) * 0.35) * fadeT;
      f.scale.setScalar(Math.max(0, baseScale));
      f.rotation.z = Math.sin(time * 1.2 + i) * 0.2;
      // Reset når partiklen passerer mantlen eller er skaleret til nær 0
      if (f.position.y >= MANTEL_Y || fadeT < 0.05) f.position.y = f.userData.baseY;
    });
    if (refs.fireLight) {
      refs.fireLight.intensity = 1.6 + Math.sin(time * 4.5) * 0.4 + Math.sin(time * 7.1) * 0.2;
    }
  }
  // Grotte: glødende sporer svæver opad + farveskift + krystaller pulserer
  if (refs._caveSpores && refs.currentLocation === 'cave') {
    const pos = refs._caveSpores.pos;
    for (let i = 0; i < refs._caveSpores.count; i++) {
      pos[i*3+1] += 0.012 + Math.sin(time * 0.7 + i * 0.3) * 0.006;
      pos[i*3]   += Math.sin(time * 0.4 + i * 0.5) * 0.008;
      pos[i*3+2] += Math.cos(time * 0.3 + i * 0.4) * 0.005;
      if (pos[i*3+1] > 18) { pos[i*3+1] = -2; pos[i*3] = (Math.random() - 0.5) * 50; pos[i*3+2] = (Math.random() - 0.5) * 50; }
    }
    refs._caveSpores.mesh.geometry.attributes.position.needsUpdate = true;

    // ── Farveskift: Grøn → Blå → Lilla → Grøn (langsom drøm-cyklus ~20 sek) ──
    const wave1 = (Math.sin(time * 0.32) + 1) / 2;        // grøn <-> blå   (~20 sek)
    const wave2 = (Math.sin(time * 0.32 + Math.PI) + 1) / 2; // lilla (modsat fase)
    const colorGreen  = new THREE.Color(0x4ade80);
    const colorBlue   = new THREE.Color(0x0ea5e9);
    const colorPurple = new THREE.Color(0xc084fc);
    // Bland: grøn→blå i første halvdel, blå→lilla i anden halvdel
    const blendAB = new THREE.Color().lerpColors(colorGreen, colorBlue, wave1);
    const finalColor = new THREE.Color().lerpColors(blendAB, colorPurple, wave2 * 0.45);
    refs._caveSpores.mesh.material.color.copy(finalColor);

    // Størrelsen pulserer svagt i takt med farven (sporerne "ånder")
    refs._caveSpores.mesh.material.size = 0.22 + Math.sin(time * 0.32) * 0.06;

    // Synkroniser ambient-lyset med spore-farven
    if (refs._sporeAmbientLight) {
      refs._sporeAmbientLight.color.copy(finalColor);
      refs._sporeAmbientLight.intensity = 0.3 + Math.sin(time * 0.32) * 0.15;
    }
  }
  if (refs._crystals && refs.currentLocation === 'cave') {
    refs._crystals.forEach((c, ci) => {
      const pulse = 0.5 + 0.5 * Math.sin(time * 1.5 + c.phase);
      c.mesh.material.emissiveIntensity = c.baseIntensity * (0.6 + pulse * 0.8);
      c.mesh.rotation.y += 0.008;
      // Krystalfarven følger spore-farven med en lille forsinkelse (ci = indeks-offset)
      const cWave = (Math.sin(time * 0.32 + ci * 0.4) + 1) / 2;
      const cGreen = new THREE.Color(0x00ff88); const cBlue = new THREE.Color(0x38bdf8);
      c.mesh.material.color.lerpColors(cGreen, cBlue, cWave);
      c.mesh.material.emissive.lerpColors(cGreen, cBlue, cWave);
    });
  }
  // Skildpaddeæg svag gløden (pulserende scale)
  if (refs.turtleEggMesh) {
    const pulse = 1 + Math.sin(time * 2) * 0.03;
    refs.turtleEggMesh.scale.set(pulse, 1.3 * pulse, pulse);
  }
  // Nøgle i vandet — svag rotation og gyngen
  if (refs.keyMesh) {
    refs.keyMesh.rotation.z = Math.PI / 4 + Math.sin(time * 0.8) * 0.15;
    refs.keyMesh.position.y = -0.4 + Math.sin(time * 1.2) * 0.06;
  }
  // Skildpadde i hytten — idle animation (fast position, flytbar i møbel-mode)
  if (refs.turtleMesh && !refs._furnitureModeRef?.current) {
    const ct = refs.turtleMesh;
    // Ingen vandring — hold position stabil (brug gemt position fra furniture)
    // Subtil åndedrætsbevægelse
    const baseY = ct.userData._savedY || ct.position.y;
    if (!ct.userData._savedY) ct.userData._savedY = ct.position.y;
    ct.position.y = baseY + Math.sin(Date.now() / 500) * 0.008;
    // Kig mod kamera
    if (refs.camera) {
      const camDir = new THREE.Vector3(refs.camera.position.x - ct.position.x, 0, refs.camera.position.z - ct.position.z);
      const targetAngle = Math.atan2(camDir.x, camDir.z);
      let diff = targetAngle - ct.rotation.y;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      ct.rotation.y += diff * 0.015;
    }
    const cHead = ct.getObjectByName('turtleHead');
    if (cHead) {
      cHead.rotation.x = Math.sin(time * 0.35) * 0.1 - 0.03; // nikke
      cHead.rotation.y = Math.sin(time * 0.2) * 0.12;         // kig side til side
      cHead.rotation.z = Math.sin(time * 0.15) * 0.03;
    }
  }
  // Vild skildpadde på tropisk ø — fast position, kigger mod kameraet ved broen
  if (refs.wildTurtleMesh) {
    const wt = refs.wildTurtleMesh;
    // Hold fast position, hævet så ben lige stikker under overfladen
    wt.position.set(4.2, 0.52 + Math.sin(Date.now() / 600) * 0.015, 4.8);
    // Fast rotation mod kameraet/broen (hovedet er lokal +X)
    wt.rotation.y = -2.1;
    // Hoved-animation: nik og kig
    const wHead = wt.getObjectByName('turtleHead');
    if (wHead) {
      wHead.rotation.x = Math.sin(time * 0.4) * 0.12 - 0.05;  // nikke
      wHead.rotation.y = Math.sin(time * 0.25) * 0.08;         // let side-til-side
      wHead.rotation.z = Math.sin(time * 0.18) * 0.04;         // lille tilt
    }
  }
  // Havne-rotte patrol
  if (refs.harborRat && refs.harborRat.userData.update) {
    refs.harborRat.userData.update.call(refs.harborRat, time);
  }
  // Kaptajn Rotteskæg NPC — idle animation
  if (refs.pirateMesh?.userData) {
    const d = refs.pirateMesh.userData;
    const t = time + d.timeOffset;
    // Åndedræt: krop og hoved hæves/sænkes subtilt
    d.torso.position.y    = 2.2  + Math.sin(t * 1.8)  * 0.028;
    d.headGroup.position.y = 3.4 + Math.sin(t * 1.8)  * 0.022;
    // Let hoveddrejning — ser sig for
    d.headGroup.rotation.y = Math.sin(t * 0.55) * 0.15;
    // Hat-bob (meget subtilt)
    d.hatGroup.position.y  = 0.85 + Math.sin(t * 2.6) * 0.006;
    // Arm-sway — matcher reference-dokumentets start-rotationer
    d.armR.rotation.x = -0.7 + Math.sin(t * 1.5) * 0.04;
    d.armL.rotation.x = -0.2 + Math.sin(t * 1.5 + 1.0) * 0.04;
    // Hover: glid mod target-scale
    const targetScale = d.isHovered ? d.hoverScale : d.originalScale;
    refs.pirateMesh.scale.setScalar(
      THREE.MathUtils.lerp(refs.pirateMesh.scale.x, targetScale, 0.12)
    );
  }
  // Samleobjekter — svæv op/ned
  if (refs.collectibles) {
    Object.values(refs.collectibles).forEach((obj, i) => {
      if (obj && obj.parent) obj.position.y = (obj.userData._baseY ?? obj.position.y) + Math.sin(time * 1.5 + i) * 0.06;
    });
  }
  // Nuttede fisk i spanden — wiggle og svøm
  animateCuteFishQueue(refs.bucketFishModels, time);
    // 3 hajfinner patruljerer rundt om Tropisk Ø
  if (refs.sharkFins && refs.sharkFins.length > 0) {
    const t = Date.now() * 0.001;   // tid til bølge-gyng

    refs.sharkFins.forEach(fin => {
      // Opdater vinkel med individuel hastighed
      fin.userData.angle += fin.userData.patrolSpeed;

      const cx = 0;      // ø-centrum X
      const cz = 11.5;   // ø-centrum Z
      const r = fin.userData.radius;

      // Ny position i cirkel
      fin.position.x = cx + Math.cos(fin.userData.angle) * r;
      fin.position.z = cz + Math.sin(fin.userData.angle) * r;

      // Peg i svømmeretningen (modsat haj får anden rotation)
      fin.rotation.y = fin.userData.patrolSpeed > 0
        ? -fin.userData.angle + Math.PI
        : -fin.userData.angle;

      // Lille bølge-gyng + rotation (forskudt per haj)
      fin.position.y = 0.9 + Math.sin(t * 2.2 + fin.userData.angle) * 0.06;
      fin.rotation.z = Math.sin(t * 1.8 + fin.userData.angle * 1.5) * 0.1;
    });
  }
  // Papegøje companion — kun vinge-flap (ingen op/ned gynge)
  if (refs.parrotMesh && refs.parrotMesh.parent) {
    const ud = refs.parrotMesh.userData;
    if (ud.wingL) ud.wingL.rotation.z = Math.sin(Date.now() / 220) * 0.12;
    if (ud.wingR) ud.wingR.rotation.z = -Math.sin(Date.now() / 220) * 0.12;
  }
} // ── slut på tickScene ──────────────────────────────────────────

function applyLocation(refs, locationId, hasTurtle = false, foundCollectibles = [], questItems = []) {
  refs.currentLocation = locationId;
  // Hold mågefarver konsistente pr. lokation uden per-frame recolor
  if (refs.seagulls && refs.scene) {
    refs.seagulls.forEach(sg => refs.scene.remove(sg.mesh));
    refs.seagulls.length = 0;
  }
  const area = getLocation(locationId);
  refs.scene.background.setHex(area.bgColor);
  refs.scene.fog.color.setHex(area.fogColor);
  if (refs.water) {
    refs.water.position.set(0, 0, 0);
    refs.water.scale.set(1, 1, 1);
    refs.water.material.color.setHex(area.waterColor);
    refs.water.material.specular = new THREE.Color(0x111111); // nulstil til standard (cave sætter dette til mørkeblåt)
    refs.water.material.needsUpdate = true;
  }

  // ── Byg lokations-specifik scene (FASE 2) ──────────────────────
  if (locationId === 'desert_lake') buildDesertLake(refs);
  else if (locationId === 'arctic_sea') buildArcticSea(refs);
  else if (locationId === 'fishing_cabin') buildFishingCabin(refs, hasTurtle, questItems, refs._movableObjectsRef || { current: [] });
  else if (locationId === 'tropical_island') buildTropicalIsland(refs);
  else if (locationId === 'cave') buildCave(refs);
  else buildPierScene(refs);

  // ── Bro: placér korrekt bro for denne lokation ─────────────────
  buildBridgeForLocation(refs, locationId);

  // ── Kaptajn Rotteskæg 3D NPC + klippe (Den Forbudte Ø) ────────
  if (refs.pirateMesh) {
    refs.scene.remove(refs.pirateMesh);
    refs.pirateMesh.traverse(child => {
      if (child.geometry) child.geometry.dispose();
      if (child.material) child.material.dispose();
    });
    refs.pirateMesh = null;
  }
  if (refs.pirateRock) {
    refs.scene.remove(refs.pirateRock);
    refs.pirateRock.traverse(child => {
      if (child.geometry) child.geometry.dispose();
      if (child.material) child.material.dispose();
    });
    refs.pirateRock = null;
  }
  if (locationId === 'forbidden') {
    // Klippe (~1500 polygoner via DodecahedronGeometry subdiv-3 + vertex noise)
    const rockGeo = new THREE.DodecahedronGeometry(2.5, 3);
    const rpos = rockGeo.attributes.position;
    const seed = 42;
    for (let i = 0; i < rpos.count; i++) {
      // Deterministisk pseudo-noise baseret på position
      const px = rpos.getX(i), py = rpos.getY(i), pz = rpos.getZ(i);
      const n = Math.sin(px * 3.1 + seed) * Math.cos(py * 2.7) * Math.sin(pz * 4.3 + seed * 0.5);
      const noise = 1 + n * 0.18;
      rpos.setXYZ(i, px * noise, py * noise, pz * noise);
    }
    rockGeo.computeVertexNormals();
    const rockMat = createCompanionPBR(0x4a4a5a, { roughness: 0.95, flatShading: true, pbrEnabled: false });
    const rock = new THREE.Mesh(rockGeo, rockMat);
    rock.scale.set(1.1, 0.65, 1.0);
    rock.position.set(5.2, -0.15, 3.5);
    // Mosgrønne highlight-patches (2 ekstra meshes i lidt lysere sten-farve)
    const mossMat = createCompanionPBR(0x3d5c3a, { roughness: 1.0, flatShading: true, pbrEnabled: false });
    const mossGeo = new THREE.DodecahedronGeometry(2.52, 2);
    const mossPos = mossGeo.attributes.position;
    // Skjul de fleste faces ved at trække dem ind — kun øverste del rager frem
    for (let i = 0; i < mossPos.count; i++) {
      const py = mossPos.getY(i);
      const scale = py > 0.5 ? (1 + (Math.sin(i * 1.7) * 0.04)) : 0.3;
      mossPos.setXYZ(i, mossPos.getX(i) * scale, mossPos.getY(i) * scale, mossPos.getZ(i) * scale);
    }
    mossGeo.computeVertexNormals();
    const moss = new THREE.Mesh(mossGeo, mossMat);
    moss.scale.copy(rock.scale);
    moss.position.set(5.2, -0.15, 3.5);
    const rockGroup = new THREE.Group();
    rockGroup.add(rock, moss);
    refs.scene.add(rockGroup);
    refs.pirateRock = rockGroup;

    // Piraten oven på klippen — til højre for fiskestangen (stang: x=2.5, z=8.5)
    // Klippe-top er ca. y = 0.65 * 2.5 * 0.9 ≈ 1.46 over center (y=-0.15) → pirat-fod ved ~1.31
    const pm = buildPirateMesh();
    pm.position.set(5.2, 1.35, 3.5);   // Længere ind i scenen (lavere z), til højre
    pm.rotation.y = -0.15;              // Næsten direkte mod kamera, let drejet indad
    refs.scene.add(pm);
    refs.pirateMesh = pm;
  }

  // ── Samleobjekter for alle lokationer (FASE 5) ─────────────────
  if (!refs.collectibles) refs.collectibles = {};
  const allCollectibles = [...WORLD_COLLECTIBLES.cheeses, ...WORLD_COLLECTIBLES.feathers];
  allCollectibles.filter(c => c.location === locationId && c.location !== 'pier').forEach(c => {
    if (foundCollectibles.includes(c.id)) return; // allerede fundet
    const mesh = c.id.startsWith('cheese') ? buildCheeseMesh() : buildFeatherMesh();
    mesh.position.set(...c.pos);
    mesh.userData.collectibleId = c.id;
    mesh.userData._baseY = c.pos[1];
    addLocationObject(refs, mesh);
    refs.collectibles[c.id] = mesh;
  });
  // Skjul allerede fundne pier-objekter
  if (refs.collectibles.cheese_pier) refs.collectibles.cheese_pier.visible = !foundCollectibles.includes('cheese_pier');
  if (refs.collectibles.feather_pier) refs.collectibles.feather_pier.visible = !foundCollectibles.includes('feather_pier');

  // Juster kamera og tåge pr. lokation (data-drevet)
  refs.scene.fog.near = area.fogNear ?? 20;
  refs.scene.fog.far = area.fogFar ?? 60;
  if (area.bgOverride) refs.scene.background.setHex(area.bgOverride);
  if (area.fogOverride) refs.scene.fog.color.setHex(area.fogOverride);
}

function spawnParticles(refs, type, origin, count) {
  let geo, baseMat, velocityScale, decayRate, gravity;
  switch (type) {
    case 'water': geo = new THREE.TetrahedronGeometry(0.15); baseMat = new THREE.MeshBasicMaterial({ color: 0x87CEEB }); velocityScale = { x: 0.3, y: 0.5, z: 0.3 }; decayRate = 0.025; gravity = 0.02; break;
    case 'confetti': geo = new THREE.BoxGeometry(0.1, 0.1, 0.1); baseMat = new THREE.MeshBasicMaterial({ color: 0xffffff }); velocityScale = { x: 0.3, y: 0.5, z: 0.3 }; decayRate = 0.012; gravity = 0.02; break;
    case 'levelup': geo = new THREE.TetrahedronGeometry(0.2); baseMat = new THREE.MeshBasicMaterial({ color: 0xFFD700 }); velocityScale = { x: 0.5, y: 0.8, z: 0.5 }; decayRate = 0.008; gravity = 0.015; break;
    case 'xp': geo = new THREE.TetrahedronGeometry(0.08); baseMat = new THREE.MeshBasicMaterial({ color: 0x4ade80 }); velocityScale = { x: 0.15, y: 0.35, z: 0.15 }; decayRate = 0.035; gravity = 0.025; break;
    default: geo = new THREE.TetrahedronGeometry(0.15); baseMat = new THREE.MeshBasicMaterial({ color: 0xffffff }); velocityScale = { x: 0.3, y: 0.5, z: 0.3 }; decayRate = 0.02; gravity = 0.02;
  }
  for (let i = 0; i < count; i++) {
    const mat = baseMat.clone();
    if (type === 'confetti') mat.color.setHex(Math.random() * 0xffffff);
    else if (type === 'levelup') mat.color.setHex([0xFFD700, 0xFFA500, 0xFFFFFF, 0xFFF176][Math.floor(Math.random() * 4)]);
    const mesh = new THREE.Mesh(geo, mat); mesh.position.copy(origin); mesh.position.x += (Math.random() - 0.5) * 0.5; mesh.position.z += (Math.random() - 0.5) * 0.5;
    const vel = new THREE.Vector3((Math.random() - 0.5) * velocityScale.x, Math.random() * velocityScale.y + 0.1, (Math.random() - 0.5) * velocityScale.z);
    refs.scene.add(mesh); refs.particles.push({ mesh, velocity: vel, life: 1.0, decay: decayRate + Math.random() * 0.01, gravity });
  }
}

   DEL 5 / 7 — KOMPONENTER (OPDATERET MED VEJR-WIDGET)

function CoinIcon({ size = 20, className = '' }) {
  return <svg width={size} height={size} viewBox="0 0 20 20" className={className} style={{ display: 'inline-block', verticalAlign: 'middle', flexShrink: 0 }}><circle cx="10" cy="10" r="9" fill="#F59E0B" stroke="#92400E" strokeWidth="1.2"/><circle cx="10" cy="10" r="7" fill="#FBBF24"/><circle cx="10" cy="10" r="5.5" fill="#FCD34D" stroke="#F59E0B" strokeWidth="0.8"/><text x="10" y="14" textAnchor="middle" fontSize="7" fontWeight="bold" fill="#92400E" fontFamily="serif">$</text></svg>;
}
function XPBar({ level, xp }) {
  const needed = xpNeededForLevel(level); const pct = Math.min((xp / needed) * 100, 100);
  const barColor = pct > 85 ? 'linear-gradient(to right, #f59e0b, #fbbf24)' : 'linear-gradient(to right, #3b82f6, #8b5cf6)';
  return <div className="panel-hud px-3 py-2 rounded-2xl border border-slate-700 shadow-xl w-full" style={{ minWidth: 0 }}><div className="flex justify-between items-center mb-1.5"><span className="text-xs font-black text-yellow-300 uppercase tracking-widest flex items-center gap-1">⭐ <span>LVL {level}</span></span><span className="text-xs font-mono text-slate-400">{xp}<span className="text-slate-600">/{needed}</span></span></div><div className="h-2 rounded-full bg-slate-800 overflow-hidden border border-slate-700/50"><div style={{ width: `${pct}%`, background: barColor, height: '100%', borderRadius: '9999px', transition: 'width 0.7s cubic-bezier(0.4, 0, 0.2, 1)', boxShadow: pct > 85 ? '0 0 8px rgba(251,191,36,0.7)' : '0 0 6px rgba(139,92,246,0.5)' }} /></div></div>;
}
function GoalNotification({ goal, onDone }) {
  useEffect(() => { const id = setTimeout(onDone, 3500); return () => clearTimeout(id); }, [onDone]);
  return <div className="pointer-events-none mt-2 transition-all"><div className="flex items-center gap-3 px-4 py-3 rounded-2xl shadow-2xl border border-yellow-500/40" style={{ background: 'rgba(120,80,0,0.95)', backdropFilter: 'blur(16px)', animation: 'slideInRight 0.3s ease-out forwards' }}><span className="text-2xl">{goal.icon}</span><div><div className="text-yellow-300 font-black text-xs uppercase tracking-widest">Mål gennemført!</div><div className="text-white font-bold text-sm">{goal.title}</div><div className="flex gap-2 mt-0.5">{goal.reward.xp > 0 && <span className="text-purple-300 text-xs font-bold">+{goal.reward.xp} XP</span>}{goal.reward.coins > 0 && <span className="text-yellow-300 text-xs font-bold flex items-center gap-1">+{goal.reward.coins} <CoinIcon size={12}/></span>}</div></div><span className="text-yellow-400 text-xl">⭐</span></div></div>;
}
function LevelUpOverlay({ level, onDone }) {
  useEffect(() => { const id = setTimeout(onDone, 1400); return () => clearTimeout(id); }, [onDone]);
  const milestone = level === 5 ? '🗺 Smaragdsøen er nu tilgængelig!' : level === 10 ? '➗ Division låst op i kamp!' : level === 15 ? '🌊 Dybet venter på dig...' : null;

function GoalsScreen({ completedGoals, stats, onClose }) {
  const [activeCategory, setActiveCategory] = useState('alle');
  const categories = ['alle', 'fangst', 'økonomi', 'progression', 'udfordring', 'samling'];
  const filtered = GOALS.filter(g => activeCategory === 'alle' || g.category === activeCategory);
  function getProgress(goal) {
    const s = stats;
    switch (goal.id) {
      case 'catch_10': return { cur: Math.min(s.totalCatches, 10), max: 10 };
      case 'catch_50': return { cur: Math.min(s.totalCatches, 50), max: 50 };
      case 'earn_500': return { cur: Math.min(s.totalEarned, 500), max: 500 };
      case 'earn_5000': return { cur: Math.min(s.totalEarned, 5000), max: 5000 };
      case 'boss_slayer': return { cur: Math.min(s.bossWins, 5), max: 5 };
      case 'no_junk': return { cur: Math.min(s.bestJunkStreak, 10), max: 10 };
      case 'reach_5': return { cur: Math.min(s.maxLevel, 5), max: 5 };
      case 'reach_10': return { cur: Math.min(s.maxLevel, 10), max: 10 };
      case 'reach_20': return { cur: Math.min(s.maxLevel, 20), max: 20 };
      case 'fossil_30': return { cur: Math.min(s.fossilCount ?? 0, 30), max: 30 };
      case 'globetrotter': { const locCount = Object.keys(LOCATIONS).length; return { cur: Math.min((s.areasVisited ?? []).length, locCount), max: locCount }; }
      case 'scavenger': return { cur: Math.min(s.collectiblesFound ?? 0, 6), max: 6 };
      case 'conch_king': return { cur: Math.min(s.conchCount ?? 0, 10), max: 10 };
      case 'combo_master': return { cur: Math.min(s.maxCombo ?? 0, 10), max: 10 };
      case 'cave_axolotl': return { cur: s.axolotlCaught ? 1 : 0, max: 1 };
      case 'cave_crystal': return { cur: s.crystalFound ? 1 : 0, max: 1 };
      case 'cave_gorm': return { cur: s.gormDefeated ? 1 : 0, max: 1 };
      case 'cave_complete': return { cur: (s.axolotlCaught ? 1 : 0) + (s.crystalFound ? 1 : 0) + (s.gormDefeated ? 1 : 0), max: 3 };
      case 'companion_master': return { cur: Math.min(s.companionsUnlocked ?? 0, 5), max: 5 };
      case 'wish_master': return { cur: Math.min(s.wishesUsed ?? 0, 3), max: 3 };
      default: return null;
    }
  }
  const done = GOALS.filter(g => completedGoals.includes(g.id)).length;
  const total = GOALS.length;
  return (
    <div className="panel-shop w-full max-w-3xl rounded-3xl shadow-2xl border border-slate-700 p-8 pointer-events-auto flex flex-col anim-zoom-in" style={{ height: '80dvh' }}>
      <div className="flex justify-between items-start mb-6 shrink-0">
        <div>
          <h2 className="text-4xl font-black flex items-center gap-3 text-yellow-300">🏆 Mål</h2>
          <p className="text-slate-400 text-sm mt-1"><span className="text-white font-bold">{done}</span><span className="text-slate-500">/{total} gennemført</span></p>
          <div className="mt-2 h-2 w-48 rounded-full bg-slate-800 overflow-hidden">
            <div className="h-full rounded-full transition-all duration-700" style={{ width: `${(done / total) * 100}%`, background: 'linear-gradient(to right, #f59e0b, #fbbf24)' }} />
          </div>
        </div>
        <button onClick={onClose} className="text-slate-400 hover:text-white flex items-center gap-2 bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-xl transition-colors font-bold">← Luk</button>
      </div>
      <div className="flex gap-2 mb-5 flex-wrap shrink-0">
        {categories.map(cat => (
          <button key={cat} onClick={() => setActiveCategory(cat)} className={`px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider transition-all ${activeCategory === cat ? 'bg-yellow-500 text-black' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'}`}>{cat}</button>
        ))}
      </div>
      <div className="flex-1 flex flex-col gap-3 overflow-y-auto scrollbar-hide">
        {filtered.map(goal => {
          const isDone = completedGoals.includes(goal.id);
          const isSecret = goal.secret && !isDone;
          const progress = !isDone ? getProgress(goal) : null;
          const pct = progress ? (progress.cur / progress.max) * 100 : 0;
          return (
            <div key={goal.id} className={`flex items-center gap-4 p-4 rounded-2xl border transition-all ${isDone ? 'border-yellow-900/50 bg-yellow-900/10' : 'border-slate-700/50 bg-slate-800/40'}`}>
              <div className={`text-3xl w-12 h-12 flex items-center justify-center rounded-xl flex-shrink-0 ${isDone ? 'bg-yellow-500/20' : isSecret ? 'bg-slate-800' : 'bg-slate-700/50'}`}>
                {isSecret ? '❓' : goal.icon}
              </div>
              <div className="flex-1 min-w-0">
                <div className="flex items-center gap-2 mb-0.5">
                  <span className={`font-bold text-sm ${isDone ? 'text-yellow-300' : 'text-white'}`}>{isSecret ? '???' : goal.title}</span>
                  {isDone && <span className="text-xs bg-yellow-500/20 text-yellow-400 px-2 py-0.5 rounded-full font-bold">✓ Klaret</span>}
                </div>
                <p className="text-xs text-slate-400 leading-snug">{isSecret ? 'Skjult mål — fortsæt med at fiske!' : goal.description}</p>
                {progress && !isDone && !isSecret && (
                  <div className="mt-2">
                    <div className="h-1.5 w-full rounded-full bg-slate-700 overflow-hidden">
                      <div className="h-full rounded-full transition-all duration-500" style={{ width: `${pct}%`, background: 'linear-gradient(to right, #3b82f6, #8b5cf6)' }} />
                    </div>
                    <span className="text-xs text-slate-500 mt-0.5 block">{progress.cur} / {progress.max}</span>
                  </div>
                )}
              </div>
              {!isDone && !isSecret && (
                <div className="flex flex-col items-end gap-1 flex-shrink-0 text-xs">
                  {goal.reward.xp > 0 && <span className="text-purple-400 font-bold">+{goal.reward.xp} XP</span>}
                  {goal.reward.coins > 0 && <span className="text-yellow-400 font-bold flex items-center gap-1">+{goal.reward.coins} <CoinIcon size={14}/></span>}
                </div>
              )}
              {isDone && <div className="text-yellow-500 text-2xl flex-shrink-0">⭐</div>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// Hjælpefunktion: auto-skaler og centrer 3D-model i fremviseren
function fitModelToViewer(model, desiredSize = 2.2) {
  const box = new THREE.Box3().setFromObject(model);
  const size = new THREE.Vector3();
  box.getSize(size);
  const maxDim = Math.max(size.x, size.y, size.z);
  if (maxDim === 0) return model;
  const scale = desiredSize / maxDim;
  model.scale.set(scale, scale, scale);
  box.setFromObject(model);
  const center = new THREE.Vector3();
  box.getCenter(center);
  model.position.x = -center.x;
  model.position.y = -center.y;
  model.position.z = -center.z;
  return model;
}

      fc.pitch -= e.movementY * s;

      refs.camera.rotation.y = fc.yaw;

  function checkAnswer(e) {

        let final = hookedFish;

        if(weatherType === 'storm' && final.value > 0) {
            final = { ...final, value: Math.ceil(final.value * 1.25) };

        if (!final.rarity.includes('Legendarisk') && final.itemType !== 'treasure' && initialTime > 0 && (timeLeft / initialTime) < 0.3 && Math.random() < 0.4) final = createJunkItem();

        const baseXP = calcXpForCatch(final); const expertBonus = mathCategory === 'regnehistorier' ? 20 : (mathCategory !== 'basic') ? 15 : 0; const multiplier = upgrades.includes('luxury_boat') ? 2 : upgrades.includes('golden_hook') ? 1.4 : 1; const xpGained = Math.floor((baseXP + expertBonus) * multiplier); setProgression(prev => { const result = applyXP(prev.level, prev.xp, xpGained); if (result.levelUps.length > 0) Promise.resolve().then(() => setPendingLevelUps(q => [...q, ...result.levelUps])); return { level: result.level, xp: result.xp }; }); play('xp'); setXpToast(`+${xpGained} XP${expertBonus ? ' 🌟' : ''}`); if (sceneRefsRef.current) spawnParticles(sceneRefsRef.current, 'xp', new THREE.Vector3(0, 3, 6), 12);

      } else { setFightStages(prev => ({ ...prev, current: next })); const allowDivision = progression.level >= 10; setProblem(generateMathProblem(3, allowDivision, activeOps.length > 0 ? activeOps : null, mathDifficulty, mathCategory)); setTimeLeft(prev => prev + 2); play('boss_hit'); }

    play('win');
    setConchCount(prev => prev - amount);
    setPenguinConches(prev => {
      const newTotal = prev + amount;
      return newTotal;
    });
    setShowPenguinModal(false);
    setToastMessage('🐧 "Gakgak!" — Pingvinen basker glad med vingerne!');
    if (sceneRefsRef.current && sceneRefsRef.current.penguinMesh) {
      const pMesh = sceneRefsRef.current.penguinMesh;
      const startY = pMesh.position.y;
      const hopStart = performance.now();
      const hopDuration = 500;
      let cancelled = false;
      const animHop = (now) => {
        if (cancelled) return;
        const t = Math.min(1, (now - hopStart) / hopDuration);
        pMesh.position.y = startY + Math.sin(t * Math.PI) * 0.5;
        if (t < 1) { requestAnimationFrame(animHop); }
        else { pMesh.position.y = startY; }
      };
      requestAnimationFrame(animHop);
      const pos = pMesh.position.clone(); pos.y += 1;
      spawnParticles(sceneRefsRef.current, 'levelup', pos, 30);
    }
  }

      setStats(prev => {

      {/* ── FISKETASKE OVERLAY (Mobil) ── */}
      {isBagOpen && uiMode === 'mobile' && (

          <div onClick={e => e.stopPropagation()} style={{ position: 'absolute', bottom: 0, left: 0, right: 0, background: 'rgba(10,15,30,0.98)', border: '1px solid rgba(56,189,248,0.2)', borderRadius: '1.5rem 1.5rem 0 0', height: '72dvh', display: 'flex', flexDirection: 'column' }}>

            <div style={{ padding: '1.25rem 1.25rem 0', flexShrink: 0 }}>
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '0.875rem' }}>
                <h3 style={{ color: 'white', fontWeight: 900, fontSize: '1.2rem' }}>🎒 Fisketaske</h3>
                <button onClick={() => setIsBagOpen(false)} style={{ background: 'none', border: 'none', color: '#94a3b8', fontSize: '1.5rem', cursor: 'pointer', lineHeight: 1 }}>✕</button>
              </div>
              {/* Faner — fast, ingen scroll */}
              <div style={{ display: 'flex', gap: '0.4rem', marginBottom: '0.875rem', overflowX: 'auto' }}>
                {[
                  { id: 'menu',  label: '📋 Menu' },
                  { id: 'spand', label: `${bucketTier.icon ?? '🪣'} Spand` },
                  { id: 'kiste', label: '🗃️ Kiste' },
                  { id: 'maal', label: '🏆 Mål' },
                ].map(tab => (
                  <button key={tab.id} onClick={() => setBagTab(tab.id)} style={{ flexShrink: 0, padding: '0.5rem 0.9rem', borderRadius: '0.75rem', border: bagTab === tab.id ? '2px solid #38bdf8' : '1px solid rgba(255,255,255,0.1)', background: bagTab === tab.id ? 'rgba(56,189,248,0.15)' : 'rgba(255,255,255,0.04)', color: bagTab === tab.id ? '#38bdf8' : '#94a3b8', fontWeight: 700, fontSize: '0.8rem', cursor: 'pointer', transition: 'all 0.15s', whiteSpace: 'nowrap' }}>{tab.label}</button>

            </div>

            {/* Scroll-område — fylder resten */}
            <div style={{ flex: 1, overflowY: 'auto', padding: '0 1.25rem 1.25rem' }}>

              {/* ── MENU ── */}
              {bagTab === 'menu' && (
                <div style={{ display: 'flex', flexDirection: 'column', gap: '0.75rem' }}>
                  {gameState === 'idle' && <button onClick={() => { play('ui'); setIsBagOpen(false); setGameState('shop'); }} style={{ display: 'flex', alignItems: 'center', gap: '1rem', padding: '1rem', borderRadius: '1rem', background: 'rgba(22,163,74,0.15)', border: '1px solid rgba(22,163,74,0.5)', color: '#86efac', fontWeight: 700, fontSize: '1rem', cursor: 'pointer' }}>🛒 <span>Fiskegrej</span></button>}
                  {gameState === 'idle' && <button onClick={() => { play('ui'); setIsBagOpen(false); setShowMathSettings(true); }} style={{ display: 'flex', alignItems: 'center', gap: '1rem', padding: '1rem', borderRadius: '1rem', background: 'rgba(79,70,229,0.15)', border: '1px solid rgba(79,70,229,0.5)', color: '#c4b5fd', fontWeight: 700, fontSize: '1rem', cursor: 'pointer' }}>🧮 <span>Matematik</span></button>}
                  <button onClick={() => { play('ui'); setIsBagOpen(false); setShowScreenSettings(true); }} style={{ display: 'flex', alignItems: 'center', gap: '1rem', padding: '1rem', borderRadius: '1rem', background: 'rgba(51,65,85,0.4)', border: '1px solid rgba(100,116,139,0.4)', color: '#cbd5e1', fontWeight: 700, fontSize: '1rem', cursor: 'pointer' }}>⚙️ <span>Skærmindstillinger</span></button>

                    {kisteTab === 'udstyr' && (() => {
                      const currentRod = getRodTier(upgrades);

                            </div>
                          )}
                          {desertItems.length > 0 && <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.4rem' }}>{desertItems.map(i => <div key={i.id} style={{ padding: '0.4rem 0.6rem', borderRadius: '0.6rem', background: 'rgba(120,53,15,0.2)', border: '1px solid rgba(180,83,9,0.4)', color: '#fde68a', fontSize: '0.8rem' }}>{i.icon} {i.name}</div>)}</div>}

                          {udstyrItems.length === 0 && desertItems.length === 0 && arcticItems.length === 0 && <p style={{ color: '#64748b', fontStyle: 'italic', textAlign: 'center', padding: '1.5rem 0', fontSize: '0.85rem' }}>Ingen udstyr-opgraderinger endnu</p>}
                        </div>
                      );
                    })()}

                    {/* ── Madding ── */}
                    {/* FASE 3.1 – brug af renderMaddingTab() (mobil) */}
                    {kisteTab === 'madding' && renderMaddingTab({ activeBait, baitExpiry, conchBaitExpiry, fossilBaitExpiry, questItems, eggCountdown, setActiveBait, setBaitExpiry, setConchBaitExpiry, setFossilBaitExpiry, onGoToShop: () => { setIsBagOpen(false); setShopInitialTab('madding'); setGameState('shop'); }, play })}

                    {/* === KÆLEDYR-SYSTEM V1.0 – Kæledyr-fane (mobil) === */}
                    {kisteTab === 'companions' && (() => {
                      const cf = WORLD_COLLECTIBLES.cheeses.filter(c => foundCollectibles.includes(c.id)).length;
                      const ff = WORLD_COLLECTIBLES.feathers.filter(c => foundCollectibles.includes(c.id)).length;
                      return (
                        <div style={{ display: 'flex', flexDirection: 'column', gap: '0.6rem' }}>
                          <div style={{ color: '#64748b', fontSize: '0.68rem', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.1em', marginBottom: '0.15rem' }}>🐾 Dine kæledyr ({unlockedCompanions.length}/{COMPANIONS_DATABASE.length})</div>

                                  border: `2px solid ${isUnlocked ? comp.color : 'rgba(51,65,85,0.5)'}`,
                                  opacity: isUnlocked ? 1 : 0.6,

                                  <span style={{ fontSize: '2rem', filter: isUnlocked ? 'none' : 'grayscale(1)' }} className={comp.id === 'turtle' ? 'turtle-companion' : ''}>{comp.emoji}</span>

                                  <span style={{ color: isUnlocked ? '#94a3b8' : '#475569', fontSize: '0.68rem', textAlign: 'center', lineHeight: 1.3 }}>
                                    {isUnlocked ? comp.description : hint}

                            <p style={{ color: '#475569', fontStyle: 'italic', textAlign: 'center', fontSize: '0.78rem', marginTop: '0.5rem' }}>Find oste, fjer og klæk æg for at få kæledyr!</p>

                        </div>

                    {/* === SLUT KÆLEDYR-SYSTEM V1.0 === */}

                    {/* ── Skatte ── */}
                    {kisteTab === 'skatte' && (() => {
                      const skatteItems = kisteSkatteItems;
                      const cf = WORLD_COLLECTIBLES.cheeses.filter(c => foundCollectibles.includes(c.id)).length;
                      const ff = WORLD_COLLECTIBLES.feathers.filter(c => foundCollectibles.includes(c.id)).length;
                      const fossilsFound = stats.fossilCount ?? 0;
                      const hasAnything = skatteItems.length > 0 || conchCount > 0 || pearlCount > 0 || hasMapLeft || hasMapRight || questItems.includes('cabin_key') || cf > 0 || ff > 0 || fossilsFound > 0 || questItems.includes('turtle_hatched') || wildTurtleSpawned;
                      if (!hasAnything) return <p style={{ color: '#64748b', fontStyle: 'italic', textAlign: 'center', padding: '1.5rem 0', fontSize: '0.85rem' }}>Ingen skatte endnu — udforsk verden!</p>;
                      return (
                        <div style={{ display: 'flex', flexDirection: 'column', gap: '0.75rem' }}>
                          {(conchCount > 0 || pearlCount > 0 || fossilsFound > 0) && (
                            <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.4rem' }}>
                              {conchCount > 0 && <div style={{ display: 'flex', alignItems: 'center', gap: '0.45rem', padding: '0.55rem 0.7rem', borderRadius: '0.75rem', background: 'rgba(80,50,20,0.85)', border: '1px solid rgba(244,164,96,0.5)' }}><span>🐚</span><span style={{ color: '#f59e0b', fontWeight: 700 }}>{conchCount}</span></div>}
                              {pearlCount > 0 && <div style={{ display: 'flex', alignItems: 'center', gap: '0.45rem', padding: '0.55rem 0.7rem', borderRadius: '0.75rem', background: 'rgba(60,65,85,0.85)', border: '1px solid rgba(248,248,255,0.3)' }}><span>💎</span><span style={{ color: '#e2e8f0', fontWeight: 700 }}>{pearlCount}</span></div>}
                              {fossilsFound > 0 && <div style={{ display: 'flex', alignItems: 'center', gap: '0.45rem', padding: '0.55rem 0.7rem', borderRadius: '0.75rem', background: 'rgba(80,60,30,0.85)', border: '1px solid rgba(168,130,80,0.4)' }}><span>🦴</span><span style={{ color: '#d97706', fontWeight: 700 }}>{fossilsFound}</span></div>}
                              {cf > 0 && <div style={{ display: 'flex', alignItems: 'center', gap: '0.45rem', padding: '0.55rem 0.7rem', borderRadius: '0.75rem', background: 'rgba(20,15,5,0.85)', border: '1px solid rgba(200,160,60,0.4)' }}><span>🧀</span><span style={{ color: '#fbbf24', fontWeight: 700 }}>{cf}/3</span></div>}
                              {ff > 0 && <div style={{ display: 'flex', alignItems: 'center', gap: '0.45rem', padding: '0.55rem 0.7rem', borderRadius: '0.75rem', background: 'rgba(10,15,25,0.85)', border: '1px solid rgba(148,163,184,0.4)' }}><span>🪶</span><span style={{ color: '#94a3b8', fontWeight: 700 }}>{ff}/3</span></div>}
                            </div>
                          )}
                          {(hasMapLeft || hasMapRight) && (
                            <div style={{ display: 'flex', alignItems: 'center', gap: '0.7rem', padding: '0.65rem', borderRadius: '0.875rem', background: hasFullMap ? 'rgba(120,50,0,0.85)' : 'rgba(30,20,50,0.85)', border: `1px solid ${hasFullMap ? '#f59e0b' : '#6d28d9'}` }}>
                              <span style={{ fontSize: '1.2rem' }}>🗺</span>
                              <div><div style={{ color: hasFullMap ? '#fbbf24' : '#a78bfa', fontWeight: 700, fontSize: '0.85rem' }}>{hasFullMap ? 'Komplet Skattekort' : 'Halvt Skattekort'}</div></div>
                            </div>
                          )}
                          {questItems.includes('cabin_key') && <div style={{ display: 'flex', alignItems: 'center', gap: '0.7rem', padding: '0.65rem', borderRadius: '0.875rem', background: 'rgba(30,25,5,0.85)', border: '1px solid rgba(251,191,36,0.4)' }}><span style={{ fontSize: '1.2rem' }}>🗝️</span><span style={{ color: '#fbbf24', fontWeight: 700, fontSize: '0.85rem' }}>Fiskehyttens Nøgle</span></div>}
                          {questItems.includes('turtle_hatched') && <div style={{ display: 'flex', alignItems: 'center', gap: '0.7rem', padding: '0.65rem', borderRadius: '0.875rem', background: 'rgba(10,40,20,0.85)', border: '1px solid rgba(34,197,94,0.4)' }}><span style={{ fontSize: '1.2rem' }} className="turtle-emoji">🐢</span><span style={{ color: '#86efac', fontWeight: 700, fontSize: '0.85rem' }}>Skildpadden i Fiskehytten</span></div>}

                          {skatteItems.length > 0 && (
                            <div>
